<!doctype html>
<html lang="es">
<head>

<title>Contra el azar · Libro Vivo</title>
<style>
:root{--paper:#fffdf8;--ink:#201b15;--muted:#746b60;--green:#087b4d;--line:#d8cebd;--bg:#efe7d7}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}body{min-height:100vh;overflow:hidden}.reader{height:100dvh;display:flex;flex-direction:column}.top{min-height:calc(56px + env(safe-area-inset-top));display:flex;align-items:flex-end;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:#fffaf0f2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px);font-family:system-ui;z-index:40}.top button{border:0;background:none;color:var(--green);font-weight:900;font-size:12px;padding:10px;cursor:pointer}.exit{background:var(--green)!important;color:#fff!important;border-radius:12px!important;min-width:120px}.title{font-size:11px;font-weight:900;color:#51483e}.viewport{flex:1;overflow:hidden;position:relative}.book{height:100%;display:flex;transition:transform .28s ease}.page{min-width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 18px 92px}.sheet{max-width:760px;min-height:calc(100% - 4px);margin:0 auto;background:var(--paper);border:1px solid var(--line);box-shadow:0 14px 40px #5b49331b;border-radius:10px;padding:28px 24px}.cover{display:flex;min-height:70vh;flex-direction:column;justify-content:center;text-align:center}.k{font:900 9px system-ui;letter-spacing:.18em;color:var(--green)}h1{font-size:48px;line-height:.96;margin:14px 0}h2{font-size:30px;line-height:1.05;margin:8px 0 18px}p{font-size:17px;line-height:1.78;margin:0 0 16px}.sub{font-size:19px;line-height:1.55;color:#655c51}.plain,.tech,.figure{margin:18px 0;padding:17px;font:13px/1.65 system-ui;border-radius:12px}.plain{background:#eaf6ef}.tech{background:#eef1f4}.figure{background:#f0ece3;border-left:4px solid var(--green);border-radius:0 12px 12px 0}.plain b,.tech b,.figure b{display:block;margin-bottom:6px}.note{font:11px/1.6 system-ui;color:var(--muted)}.progress{height:8px;background:#ddd5c8;border-radius:9px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:var(--green)}.bottom{position:fixed;left:0;right:0;bottom:0;height:68px;background:#fffaf0f2;border-top:1px solid var(--line);display:grid;grid-template-columns:90px 1fr 90px;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));font-family:system-ui;z-index:30}.bottom button{border:0;border-radius:12px;background:#1f1b16;color:#fff;font-weight:900;padding:10px 8px}.bottom button:disabled{opacity:.22}.counter{text-align:center;font-size:11px;font-weight:900;color:#655c51}.dots{font-size:9px;color:#9a8e80;margin-top:3px}.toc{position:fixed;inset:calc(56px + env(safe-area-inset-top)) 0 68px;background:#f5f1e8f7;z-index:35;overflow:auto;padding:18px;display:none}.toc.on{display:block}.toc-inner{max-width:720px;margin:auto}.toc h3{font:950 22px system-ui}.toc button{width:100%;text-align:left;border:1px solid var(--line);background:white;border-radius:12px;padding:13px;margin:5px 0;font:800 13px system-ui;color:#312b24}.status{font:800 11px/1.5 system-ui;color:var(--muted);margin-top:10px}.print-only{display:none}@media(max-width:520px){.sheet{border-radius:0;min-height:100%;padding:25px 20px}.page{padding:0 0 78px}h1{font-size:44px}h2{font-size:28px}.title{display:none}.exit{min-width:126px}}@media print{body{overflow:visible;background:white}.reader{height:auto}.top,.bottom,.toc{display:none!important}.viewport{overflow:visible}.book{display:block!important;transform:none!important}.page{display:block!important;height:auto;min-width:0;padding:0;page-break-after:always}.sheet{box-shadow:none;border:0;border-radius:0;max-width:none;min-height:0;padding:18mm 17mm}.print-only{display:block}.cover{min-height:240mm}@page{size:A5;margin:0}}
</style>
</head>
<body>
<div class="reader">
<header class="top"><button class="exit" id="back" type="button">← Volver a la app</button><div class="title">CONTRA EL AZAR · LIBRO VIVO</div><button id="tocBtn" type="button">Índice</button></header>
<div class="viewport" id="viewport"><div class="book" id="book"></div></div>
<aside class="toc" id="toc"><div class="toc-inner"><h3>Índice</h3><div id="tocList"></div></div></aside>
<footer class="bottom"><button id="prev">← Anterior</button><div class="counter"><div id="counter">1 / 1</div><div class="dots" id="pageTitle">Cargando…</div></div><button id="next">Siguiente →</button></footer>
</div>
<script>
(()=>{
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const book=document.getElementById('book'),counter=document.getElementById('counter'),pageTitle=document.getElementById('pageTitle'),prev=document.getElementById('prev'),next=document.getElementById('next'),toc=document.getElementById('toc'),tocBtn=document.getElementById('tocBtn'),viewport=document.getElementById('viewport');
const fixed=[
{title:'Portada',html:`<article class="sheet cover"><div class="k">LIBRO VIVO · EDICIÓN EN CONSTRUCCIÓN</div><h1>Contra el azar</h1><div class="sub">La historia de una universidad artificial que decidió someter una pregunta popular a una investigación extraordinariamente rigurosa.</div><p class="note" style="margin-top:22px">Primero se explica para cualquiera. Después, quien quiera profundizar encuentra la capa técnica. Hechos, hipótesis y resultados permanecen separados.</p><div class="print-only"><p>Autor: Álvaro Gavilán</p><p>Edición de trabajo. No destinada todavía a distribución comercial.</p></div></article>`},
{title:'Avance editorial',html:`<article class="sheet"><div class="k">AVANCE EDITORIAL</div><h2>Un libro que se escribe mientras ocurre</h2><div class="progress"><i id="editorialProgress" style="width:0"></i></div><p>No esperaremos al desenlace para reconstruir la historia. Cada método, error, falsación y hallazgo deja ahora su registro. Así evitamos que el recuerdo convierta después una casualidad en una profecía.</p><div class="plain"><b>En palabras normales</b>Es como escribir el diario de una expedición mientras se cruza la montaña, no años después desde el sofá.</div><div class="figure"><b>Sincronización automática</b>Los capítulos editoriales se cargan directamente desde el manuscrito versionado. Si el manuscrito crece, el ebook crece con él.</div><div class="status" id="loadStatus">Cargando manuscrito editorial…</div></article>`},
{title:'Prólogo',html:`<article class="sheet"><div class="k">PRÓLOGO</div><h2>La pregunta de los seis números</h2><p>La palabra «azar» suele cerrar conversaciones. Aquí fue el punto de partida. La pregunta no era si podíamos prometer un premio; eso habría sido fácil de decir e imposible de demostrar. La pregunta era más interesante: ¿qué ocurre si sometemos décadas de sorteos a una maquinaria capaz de imaginar miles de ideas y obligamos a cada una a demostrar que no está simplemente recordando el pasado?</p><div class="plain"><b>La regla que cambió el proyecto</b>Una fórmula que sólo funciona después de conocer el resultado no predice: recuerda. La Universidad exige que la idea exista antes del dato que pretende acertar.</div></article>`},
{title:'Capítulo I',html:`<article class="sheet"><div class="k">CAPÍTULO I</div><h2>Construir memoria antes de buscar milagros</h2><p>Bonoloto, Primitiva, Euromillones y El Gordo se convirtieron en archivos históricos consultables. En cada simulación, el algoritmo debía vivir en el pasado. No podía leer una página del calendario que todavía no hubiera ocurrido.</p><div class="plain"><b>¿Qué significa «freeze»?</b>Preparar una receta y entregarla en un sobre cerrado antes de probar el plato del jurado. Desde ese momento no se cambia nada para favorecer el resultado.</div><div class="tech"><b>Capa técnica</b>Selección, validación y replicación se mantienen separadas temporalmente para reducir sobreajuste retrospectivo.</div></article>`},
{title:'Capítulo II',html:`<article class="sheet"><div class="k">CAPÍTULO II</div><h2>Fracasar bien también es descubrir</h2><p>Una señal que desaparece al cruzar la frontera temporal se archiva. Los resultados negativos forman parte de la memoria científica porque impiden volver a recorrer caminos ya falsados.</p><div class="plain"><b>¿Por qué guardar un fracaso?</b>Porque una puerta que ya sabemos que conduce a una pared no debe volver a parecernos misteriosa seis meses después.</div></article>`},
{title:'Capítulo III',html:`<article class="sheet"><div class="k">CAPÍTULO III</div><h2>4.096 científicos y una sola obligación: dudar</h2><p>MegaLab permitió explorar familias distintas en paralelo. El mejor científico no es quien más aciertos anuncia, sino quien ayuda a distinguir una señal reproducible de una coincidencia.</p><div class="plain"><b>La paradoja del laboratorio</b>Cuantas más hipótesis probamos, más rigurosos deben ser los controles contra falsos descubrimientos.</div></article>`},
{title:'Capítulo IV',html:`<article class="sheet"><div class="k">CAPÍTULO IV · ABIERTO</div><h2>Inventar lo que todavía no tiene nombre</h2><p>Los agentes pueden proponer nuevas representaciones, variables y procedimientos, pero cada propuesta conserva genealogía, momento de formulación, código y resultado de las pruebas.</p><div class="plain"><b>Precaución</b>No encontrar una técnica en nuestra búsqueda no demuestra que nadie la haya pensado antes. La novedad se investiga; nunca se proclama por entusiasmo.</div></article>`}
];
function chapterPage(c){const paragraphs=(c.narrative||[]).map(x=>`<p>${esc(x)}</p>`).join('');return {title:`Capítulo ${esc(c.number||'')}`,html:`<article class="sheet"><div class="k">CAPÍTULO ${esc(c.number||'')}</div><h2>${esc(c.title)}</h2>${c.hook?`<p><em>${esc(c.hook)}</em></p>`:''}${paragraphs}${c.plainLanguage?`<div class="plain"><b>En palabras normales</b>${esc(c.plainLanguage)}</div>`:''}${c.technicalLayer?`<div class="tech"><b>Para quien quiera profundizar</b>${esc(c.technicalLayer)}</div>`:''}${c.visual?`<div class="figure"><b>Propuesta visual</b>${esc(c.visual)}</div>`:''}<div class="status">Evidencia: ${(c.evidence||[]).map(esc).join(' · ')||'pendiente de enlazar'}</div></article>`};}
const epilogue={title:'Epílogo abierto',html:`<article class="sheet"><div class="k">EPÍLOGO · ABIERTO</div><h2>El resultado decidirá el final</h2><p>Puede terminar con un pleno prospectivo sometido a una auditoría extraordinaria. Puede terminar demostrando que una infraestructura gigantesca no encontró una ventaja reproducible. Ambos finales merecen ser contados si la investigación que los precede es auténtica.</p><div class="figure"><b>Estado editorial</b>El manuscrito sigue abierto y cada avance deberá entrar con trazabilidad, explicación llana y evidencia.</div></article>`};
let pages=[],i=0,startX=null;
function rebuild(extra=[]){const saved=Number(sessionStorage.getItem('lotai_book_page')||0);pages=[...fixed,...extra,epilogue];book.innerHTML=pages.map(p=>`<section class="page" data-title="${esc(p.title)}">${p.html}</section>`).join('');i=Math.max(0,Math.min(pages.length-1,saved));document.getElementById('tocList').innerHTML=pages.map((p,n)=>`<button data-p="${n}">${n+1}. ${esc(p.title)}</button>`).join('');document.querySelectorAll('#tocList button').forEach(b=>b.onclick=()=>{toc.classList.remove('on');show(Number(b.dataset.p));});const progress=document.getElementById('editorialProgress');if(progress)progress.style.width=`${Math.min(95,Math.round((pages.length-1)/16*100))}%`;show(i);}
function show(n){i=Math.max(0,Math.min(pages.length-1,n));book.style.transform=`translateX(-${i*100}%)`;counter.textContent=`${i+1} / ${pages.length}`;pageTitle.textContent=pages[i]?.title||'';prev.disabled=i===0;next.disabled=i===pages.length-1;const el=book.children[i];if(el)el.scrollTop=0;sessionStorage.setItem('lotai_book_page',String(i));}
prev.onclick=()=>show(i-1);next.onclick=()=>show(i+1);tocBtn.onclick=()=>toc.classList.toggle('on');document.getElementById('back').onclick=()=>{sessionStorage.setItem('lotai_book_exit','1');location.href='/loterias-ai/universidad/';};viewport.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX},{passive:true});viewport.addEventListener('touchend',e=>{if(startX==null)return;const dx=e.changedTouches[0].clientX-startX;startX=null;if(Math.abs(dx)>55)show(i+(dx<0?1:-1));},{passive:true});
rebuild([]);
fetch('./chapters-v3.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}).then(data=>{const extra=(data.chapters||[]).map(chapterPage);rebuild(extra);const status=document.getElementById('loadStatus');if(status)status.textContent=`Manuscrito sincronizado · ${extra.length} capítulos editoriales adicionales cargados.`;}).catch(err=>{const status=document.getElementById('loadStatus');if(status)status.textContent=`El lector funciona con el núcleo local. No se pudo cargar el suplemento editorial: ${err.message}`;});
})();
</script>
</body>
</html>
