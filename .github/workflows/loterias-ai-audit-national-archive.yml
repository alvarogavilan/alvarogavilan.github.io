name: Loterias AI - Archive quality gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/data/archive/**'
      - 'loterias-ai/scripts/audit-national-archive.mjs'
      - '.github/workflows/loterias-ai-audit-national-archive.yml'
  schedule:
    - cron: '41 4 * * *'

permissions:
  contents: read

concurrency:
  group: loterias-ai-archive-quality-gate
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit archive fail-closed
        run: node loterias-ai/scripts/audit-national-archive.mjs
      - name: Assert machine-readable quality gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='loterias-ai/data/archive/_meta/archive-audit.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          if(j?.schemaVersion < 3) throw new Error(`unexpected schemaVersion=${j?.schemaVersion}`);
          if(j?.qualityGate?.pass !== true) throw new Error(`archive gate failed: ${JSON.stringify(j?.qualityGate)}`);
          if((j?.totals?.parseErrors||0)!==0) throw new Error(`parseErrors=${j.totals.parseErrors}`);
          if((j?.totals?.openOfficialConflicts||0)!==0) throw new Error(`openOfficialConflicts=${j.totals.openOfficialConflicts}`);
          console.log(JSON.stringify({qualityGate:j.qualityGate,totals:j.totals},null,2));
          NODE
