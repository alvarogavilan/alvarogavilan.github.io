# Cost control: archive quality is checked when archive/code changes; no daily duplicate audit.
name: Loterias AI - Archive quality gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/data/archive/**'
      - 'loterias-ai/scripts/audit-national-archive.mjs'
      - 'loterias-ai/scripts/build-national-archive-index.mjs'
      - '.github/workflows/loterias-ai-audit-national-archive.yml'

permissions:
  contents: read

concurrency:
  group: loterias-ai-archive-quality-gate
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild manifest fail-closed
        run: node loterias-ai/scripts/build-national-archive-index.mjs
      - name: Audit archive fail-closed
        run: node loterias-ai/scripts/audit-national-archive.mjs
      - name: Assert machine-readable quality gates
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest=JSON.parse(fs.readFileSync('loterias-ai/data/archive/manifest.json','utf8'));
          if(manifest?.schemaVersion < 4) throw new Error(`unexpected manifest schemaVersion=${manifest?.schemaVersion}`);
          if(!String(manifest?.validationSemantics||'').includes('INVALID/PENDING/UNVERIFIED/CONFLICT')) throw new Error('fail-closed validation semantics missing');
          if(!Number.isInteger(manifest?.totals?.records) || manifest.totals.records < 1) throw new Error(`invalid archive record total=${manifest?.totals?.records}`);
          if((manifest?.totals?.validatedRecords||0) > manifest.totals.records) throw new Error('validated records exceed total records');
          const j=JSON.parse(fs.readFileSync('loterias-ai/data/archive/_meta/archive-audit.json','utf8'));
          if(j?.schemaVersion < 3) throw new Error(`unexpected audit schemaVersion=${j?.schemaVersion}`);
          if(j?.qualityGate?.pass !== true) throw new Error(`archive gate failed: ${JSON.stringify(j?.qualityGate)}`);
          if((j?.totals?.parseErrors||0)!==0) throw new Error(`parseErrors=${j.totals.parseErrors}`);
          if((j?.totals?.openOfficialConflicts||0)!==0) throw new Error(`openOfficialConflicts=${j.totals.openOfficialConflicts}`);
          NODE
