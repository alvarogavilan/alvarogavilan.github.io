name: Loterias AI Botemania Wayback Structured History V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/botemania-universe/botemania-wayback-snapshot-extractor-v1.mjs'
      - 'loterias-ai/casino/botemania-universe/evidence/botemania-wayback-index-v1.json'
      - '.github/workflows/loterias-ai-botemania-wayback-structured-history-v1.yml'

permissions:
  contents: write

concurrency:
  group: loterias-ai-botemania-wayback-structured-history-v1
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Extract next structured historical snapshot batch
        run: node loterias-ai/casino/botemania-universe/botemania-wayback-snapshot-extractor-v1.mjs
      - name: Persist structured history and cursor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/casino/botemania-universe/evidence/botemania-wayback-structured-history-v1.json loterias-ai/casino/botemania-universe/evidence/botemania-wayback-extractor-state-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(casino): expand structured Botemania historical database'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
