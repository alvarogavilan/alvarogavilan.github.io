name: Loterias AI MetaPleno v213 Bonoloto Boolean Rules
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v213-bonoloto-sat-boolean-rules]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v213-bonoloto-sat-boolean-rules.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v213-bonoloto-sat-boolean-rules.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/metapleno-v213-bonoloto-sat-boolean-rules}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node loterias-ai/scripts/meta-pleno-v213-bonoloto-sat-boolean-rules.mjs
      - name: Validate gates
        run: node -e "const x=require('./loterias-ai/data/research/meta-pleno-v213-bonoloto-sat-boolean-rules.json');if(x.realMoneyPass!==false||x.budget.realStakeEUR!==0)process.exit(1)"
      - name: Persist v213
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v213-bonoloto-sat-boolean-rules.json
          git diff --cached --quiet || git commit -m 'research(loterias-ai): persist v213 boolean rule discovery'
          git push