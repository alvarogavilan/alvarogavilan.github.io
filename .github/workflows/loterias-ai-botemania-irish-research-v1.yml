name: Loterias AI Botemania Irish Riches Research V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/botemania-irish-metadata-probe-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-irish-public-bundle-context-v1.mjs'
      - 'loterias-ai/casino/jackpots/blueprint-botemania-irish-help-probe-v1.mjs'
      - 'loterias-ai/casino/jackpots/blueprint-botemania-irish-filetype-probe-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-irish-riches-jpk-current-screen-v1.mjs'
      - '.github/workflows/loterias-ai-botemania-irish-research-v1.yml'
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: loterias-ai-botemania-irish-research-v1
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node loterias-ai/casino/jackpots/botemania-irish-metadata-probe-v1.mjs
      - run: node loterias-ai/casino/jackpots/botemania-irish-public-bundle-context-v1.mjs
      - run: node loterias-ai/casino/jackpots/blueprint-botemania-irish-help-probe-v1.mjs
      - run: node loterias-ai/casino/jackpots/blueprint-botemania-irish-filetype-probe-v1.mjs
      - run: node loterias-ai/casino/jackpots/botemania-irish-riches-jpk-current-screen-v1.mjs
      - name: Persist evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            loterias-ai/casino/jackpots/evidence/botemania-irish-metadata-probe-v1.json \
            loterias-ai/casino/jackpots/evidence/botemania-irish-public-bundle-context-v1.json \
            loterias-ai/casino/jackpots/evidence/blueprint-botemania-irish-help-probe-v1.json \
            loterias-ai/casino/jackpots/evidence/blueprint-botemania-irish-filetype-probe-v1.json \
            loterias-ai/casino/jackpots/evidence/botemania-irish-riches-jpk-current-screen-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(casino): refresh Irish Riches Botemania research'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
