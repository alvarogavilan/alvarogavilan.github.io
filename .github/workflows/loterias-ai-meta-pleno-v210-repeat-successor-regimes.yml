name: Loterias AI MetaPleno v210 Repeat Successor Regimes
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v210-repeat-successor-regimes]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v210-repeat-successor-regimes.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v210-repeat-successor-regimes.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/metapleno-v210-repeat-successor-regimes}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node loterias-ai/scripts/meta-pleno-v210-repeat-successor-regimes.mjs
      - name: Validate gates
        run: node -e "const x=require('./loterias-ai/data/research/meta-pleno-v210-repeat-successor-regimes.json');if(x.realMoneyPass!==false||x.realStakeEUR!==0)process.exit(1)"
      - name: Persist v210
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v210-repeat-successor-regimes.json
          git diff --cached --quiet || git commit -m 'research(loterias-ai): persist v210 repeat successor regimes'
          git push