name: Loterias AI MetaPleno v132 C12 Structural Budget8
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v132-c12-structural-budget8]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v132-c12-structural-budget8.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v132-c12-structural-budget8.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node loterias-ai/scripts/meta-pleno-v132-c12-structural-budget8.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v132-c12-structural-budget8.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist v132 c12 structural Budget8'
          git push
