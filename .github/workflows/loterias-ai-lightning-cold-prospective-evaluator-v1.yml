name: Loterias AI Lightning Cold Prospective Evaluator v1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/lightning/data/casinoorg-lightningroulette.jsonl'
      - 'loterias-ai/casino/lightning/evidence/cold-prospective-freeze-v1.json'
      - 'loterias-ai/casino/lightning/research/cold-prospective-evaluator-v1.mjs'
permissions:
  contents: write
concurrency:
  group: loterias-ai-lightning-cold-prospective-evaluator-v1
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Evaluate frozen prospective protocol
        run: node loterias-ai/casino/lightning/research/cold-prospective-evaluator-v1.mjs
      - name: Persist evaluation safely under concurrent corpus commits
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE='loterias-ai/casino/lightning/evidence/cold-prospective-evaluation-v1.json'
          cp "$EVIDENCE" /tmp/cold-prospective-evaluation-v1.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/cold-prospective-evaluation-v1.json "$EVIDENCE"
            git add "$EVIDENCE"
            if git diff --cached --quiet; then
              echo 'Prospective evaluation already current.'
              exit 0
            fi
            git commit -m 'research(casino): refresh Lightning cold prospective evaluation'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt*3))
          done
          exit 1
