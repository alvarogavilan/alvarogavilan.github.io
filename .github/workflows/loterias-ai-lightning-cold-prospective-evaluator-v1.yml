name: Loterias AI Lightning Cold Prospective Evaluator v1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/lightning/data/casinoorg-lightningroulette.jsonl'
      - 'loterias-ai/casino/lightning/evidence/cold-prospective-freeze-v1.json'
      - 'loterias-ai/casino/lightning/research/cold-prospective-evaluator-v1.mjs'
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node loterias-ai/casino/lightning/research/cold-prospective-evaluator-v1.mjs
      - name: Persist evaluation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/casino/lightning/evidence/cold-prospective-evaluation-v1.json
          git commit -m 'research(casino): refresh Lightning cold prospective evaluation' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
