name: Loterias AI MetaPleno v181 Primitiva Cost Compression
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v181-primitiva-cost-compression]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v181-primitiva-cost-compression.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v181-primitiva-cost-compression.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v181-primitiva-cost-compression.mjs
      - name: Persist v181
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v181-primitiva-cost-compression.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist v181 Primitiva cost compression'
          git push
