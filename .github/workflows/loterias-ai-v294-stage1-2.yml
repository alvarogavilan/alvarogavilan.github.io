name: Loterias AI v294 Stage1-2 Set-State Screen
on:
  push:
    branches:
      - research/metapleno-v294-set-state-dynamics
    paths:
      - 'loterias-ai/research/megalab/v294-stage1-2-set-state-screen.mjs'
      - '.github/workflows/loterias-ai-v294-stage1-2.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: loterias-ai-v294-stage12-${{ github.ref }}
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run v294 population and set-state screening
        run: node loterias-ai/research/megalab/v294-stage1-2-set-state-screen.mjs
      - name: Verify OOS isolation and money gates
        run: node -e "const x=require('./loterias-ai/data/research/metapleno-v294-stage1-2-selection.json');if(x.validationTouched||x.postFreezeTouched||x.retuningPerformed||!x.wholeSetPrediction||x.realMoneyPass||x.realStakeEUR!==0||x.theoreticalBudgetMaxEUR>15)process.exit(1)"
      - name: Persist v294 stage1-2 evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/metapleno-v294-stage1-2-selection.json
          git commit -m 'data(loterias-ai): persist v294 set-state stage1-2' || exit 0
          git pull --rebase origin research/metapleno-v294-set-state-dynamics
          git push
