name: Loterias AI Portfolio Artifact Recovery
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/aggregate-mass-portfolio-strategies-fixed.mjs'
      - '.github/workflows/loterias-ai-portfolio-artifact-recovery.yml'
permissions:
  actions: read
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: portfolios-*
          path: /tmp/portfolios
          merge-multiple: true
          run-id: 31870232797
          github-token: ${{ github.token }}
      - name: Aggregate frozen champions and open holdout
        run: node loterias-ai/scripts/aggregate-mass-portfolio-strategies-fixed.mjs
      - name: Persist evidence safely
        run: |
          cp loterias-ai/data/research/mass-portfolio-strategy-search.json /tmp/mass-portfolio-strategy-search.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p loterias-ai/data/research
          cp /tmp/mass-portfolio-strategy-search.json loterias-ai/data/research/mass-portfolio-strategy-search.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/research/mass-portfolio-strategy-search.json
          git commit -m 'data(loterias-ai): persist recovered million portfolio search' || exit 0
          git push origin HEAD:main
