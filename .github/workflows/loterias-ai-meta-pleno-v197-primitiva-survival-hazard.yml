name: Loterias AI MetaPleno v197 Primitiva Survival Hazard
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v197-primitiva-survival-hazard]
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v197-primitiva-survival-hazard.mjs
      - name: Persist v197
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v197-primitiva-survival-hazard.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(loterias-ai): persist v197 Primitiva survival hazard'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
