name: Loterias AI MetaPleno v169 Selective Draw Gate
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v169-selective-draw-gate]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v169-selective-draw-gate.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v169-selective-draw-gate.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v169-selective-draw-gate.mjs
      - name: Persist v169
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v169-selective-draw-gate.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist v169 selective draw gate'
          git push
