name: Loterias AI MetaPleno v129 Global Evidence Registry
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v129-global-evidence-registry]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v129-global-evidence-registry.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v129-global-evidence-registry.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node loterias-ai/scripts/meta-pleno-v129-global-evidence-registry.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v129-global-evidence-registry.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist v129 global evidence registry'
          git push
