name: Loterias AI MetaPleno v61 Bonoloto Spectral Budget8
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v61-bonoloto-spectral-budget8.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v61-spectral-budget8.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v61-bonoloto-spectral-budget8.mjs
      - name: Persist result safely
        run: |
          cp loterias-ai/data/research/meta-pleno-v61-bonoloto-spectral-budget8.json /tmp/v61.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v61.json loterias-ai/data/research/meta-pleno-v61-bonoloto-spectral-budget8.json
            git add loterias-ai/data/research/meta-pleno-v61-bonoloto-spectral-budget8.json
            git diff --cached --quiet && exit 0
            git commit -m 'data(loterias-ai): persist MetaPleno v61 spectral result'
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
