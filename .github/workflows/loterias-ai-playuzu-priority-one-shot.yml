name: Loterias AI PlayUZU Priority One Shot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/playuzu/build-economic-specialist-priority-v2.mjs'
      - '.github/workflows/loterias-ai-playuzu-priority-one-shot.yml'
permissions:
  contents: write
jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node loterias-ai/casino/playuzu/build-economic-specialist-priority-v2.mjs
      - run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add loterias-ai/casino/playuzu/evidence/economic-specialist-priority-v2.json
          git diff --cached --quiet && exit 0
          git commit -m 'research(playuzu): persist economic specialist priority v2'
          git pull --rebase origin main
          git push origin HEAD:main
