name: Loterias AI Daily Cycle

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/build-daily-state.mjs'
      - 'loterias-ai/scripts/probe-selae.mjs'
      - 'loterias-ai/scripts/settle-prospective-shadows.mjs'
      - 'loterias-ai/tests/core.test.mjs'
      - 'loterias-ai/tests/evidence.test.mjs'
      - 'loterias-ai/tests/schedule.test.mjs'
      - 'loterias-ai/data/draw-schedule.json'
      - '.github/workflows/loterias-ai-daily.yml'

permissions:
  contents: write

concurrency:
  group: loterias-ai-daily
  cancel-in-progress: true

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recompute and persist daily evidence on latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "loterias-ai-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Daily cycle attempt ${attempt}/5"
            git fetch origin main
            git reset --hard origin/main

            node loterias-ai/scripts/probe-selae.mjs
            node loterias-ai/scripts/build-daily-state.mjs
            node loterias-ai/scripts/settle-prospective-shadows.mjs

            node loterias-ai/tests/core.test.mjs
            node loterias-ai/tests/evidence.test.mjs
            node loterias-ai/tests/schedule.test.mjs

            # Restore JSON outputs whose only changes are volatile root timestamps.
            mapfile -t changed_json < <(git diff --name-only -- \
              loterias-ai/data/source-probe-latest.json \
              loterias-ai/data/daily/latest.json \
              loterias-ai/data/system-status.json \
              'loterias-ai/data/research/prospective/*.settlement.json')

            for path in "${changed_json[@]}"; do
              before="$(mktemp)"
              if git show "HEAD:${path}" > "${before}" 2>/dev/null; then
                if node - "${before}" "${path}" <<'NODE'
const fs = require('fs');
const [beforePath, afterPath] = process.argv.slice(2);
const before = JSON.parse(fs.readFileSync(beforePath, 'utf8'));
const after = JSON.parse(fs.readFileSync(afterPath, 'utf8'));
for (const obj of [before, after]) {
  if (obj && typeof obj === 'object' && !Array.isArray(obj)) {
    delete obj.generatedAt;
    delete obj.checkedAt;
    delete obj.auditGeneratedAt;
  }
}
const stable = (value) => JSON.stringify(value, Object.keys(value || {}).sort());
process.exit(stable(before) === stable(after) ? 0 : 1);
NODE
                then
                  git checkout HEAD -- "${path}"
                  echo "Restored timestamp-only change: ${path}"
                fi
              fi
              rm -f "${before}"
            done

            git add loterias-ai/data/source-probe-latest.json \
                    loterias-ai/data/daily/latest.json \
                    loterias-ai/data/system-status.json \
                    loterias-ai/data/research/prospective/*.settlement.json || true

            if git diff --cached --quiet; then
              echo "No semantic daily evidence changes"
              exit 0
            fi

            git commit -m "chore(loterias-ai): refresh daily state and settle shadows"

            # Push only if main has not moved since this attempt was computed.
            if git push origin HEAD:main; then
              echo "Daily evidence persisted safely"
              exit 0
            fi

            echo "main moved during daily cycle; discarding stale computation and retrying"
          done

          echo "Unable to persist daily evidence after 5 fresh recomputations" >&2
          exit 1
