name: Loterias AI Lightning Cross-table Lag1 Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/loterias-ai-lightning-cross-table-lag1-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Audit lag1 on independent Lightning legacy history
        run: node loterias-ai/casino/lightning/research/audit-cross-table-lag1-historical.mjs
      - name: Persist result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/casino/lightning/research/cross-table-lag1-historical-audit.json
          git commit -m 'data(lightning): persist cross-table lag1 historical audit' || exit 0
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt*2))
          done
          exit 1
