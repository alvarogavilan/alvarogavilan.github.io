name: Loterias AI - Lightning permutation walk-forward

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/lightning/research/lightning-permutation-walkforward-v2.mjs'
      - 'loterias-ai/casino/lightning/research/lightning-prospective-frozen-lag8.mjs'
      - '.github/workflows/loterias-ai-lightning-permutation-walkforward.yml'

permissions:
  contents: write
concurrency:
  group: loterias-ai-lightning-permutation-walkforward
  cancel-in-progress: true
jobs:
  validate-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: node loterias-ai/casino/lightning/research/lightning-permutation-walkforward-v2.mjs
      - name: Fail closed on invalid walk-forward evidence
        run: node -e "const j=require('./loterias-ai/casino/lightning/evidence/permutation-walkforward-v2.json');const ns=[j?.walkForward?.train?.n,j?.walkForward?.validation?.n,j?.walkForward?.test?.n];if(!Number.isInteger(j.rounds)||j.rounds<100||ns.some(n=>!Number.isInteger(n)||n<0)||j?.guards?.realMoney!==false||j?.guards?.claimAllowed!==false||j?.guards?.noNegativeSampleSizes!==true)process.exit(1)"
      - run: node loterias-ai/casino/lightning/research/lightning-prospective-frozen-lag8.mjs
      - name: Fail closed on prospective evidence
        run: node -e "const f=require('./loterias-ai/casino/lightning/evidence/prospective-lag8-freeze.json'),j=require('./loterias-ai/casino/lightning/evidence/prospective-lag8.json');if(f.lag!==8||f.immutable!==true||f.realMoney!==false||f.claimAllowed!==false||j?.freeze?.lag!==8||j?.freeze?.cutoffTimestamp!==f.cutoffTimestamp||j?.guards?.realMoney!==false||j?.guards?.authorizedStakeEUR!==0||j?.guards?.claimAllowed!==false)process.exit(1)"
      - name: Persist scientific evidence when changed
        shell: bash
        run: |
          set -euo pipefail
          PATHS='loterias-ai/casino/lightning/evidence/permutation-walkforward-v2.json loterias-ai/casino/lightning/evidence/prospective-lag8-freeze.json loterias-ai/casino/lightning/evidence/prospective-lag8.json'
          git diff --quiet -- $PATHS && exit 0
          git config user.name 'loterias-ai-bot';git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4 5;do git fetch origin main;git reset --hard origin/main;node loterias-ai/casino/lightning/research/lightning-permutation-walkforward-v2.mjs;node loterias-ai/casino/lightning/research/lightning-prospective-frozen-lag8.mjs;git add $PATHS;git diff --cached --quiet&&exit 0;git commit -m 'data(casino): persist Lightning confirmatory evidence';git push origin HEAD:main&&exit 0;done
          exit 1
