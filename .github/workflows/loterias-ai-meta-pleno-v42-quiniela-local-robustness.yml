name: Loterias AI MetaPleno v42 Quiniela Local Robustness
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v42-quiniela-local-robustness.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v42-quiniela-local-robustness.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-meta-pleno-v42-quiniela-local-robustness
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Run local cross-era robustness audit
        run: CANDIDATES=3000 node loterias-ai/scripts/meta-pleno-v42-quiniela-local-robustness.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/research/meta-pleno-v42-quiniela-local-robustness.json /tmp/v42.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v42.json loterias-ai/data/research/meta-pleno-v42-quiniela-local-robustness.json
            git add loterias-ai/data/research/meta-pleno-v42-quiniela-local-robustness.json
            git commit -m 'data(loterias-ai): persist MetaPleno v42 Quiniela robustness' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
