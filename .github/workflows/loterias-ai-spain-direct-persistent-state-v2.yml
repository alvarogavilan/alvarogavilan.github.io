name: Loterias AI Spain Direct Persistent State V2

on:
  pull_request:
    branches: [main]
    paths:
      - 'loterias-ai/edge-live/evidence/spain-direct-persistent-state-v2.json'
      - 'loterias-ai/edge-live/research-breakthroughs-v1.mjs'
      - 'loterias-ai/tests/spain-direct-persistent-state-v2.test.mjs'
      - 'loterias-ai/tests/edge-live-research-breakthroughs-v1.test.mjs'
      - '.github/workflows/loterias-ai-spain-direct-persistent-state-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: node --check loterias-ai/edge-live/research-breakthroughs-v1.mjs
      - name: Direct persistence evidence guards
        run: node loterias-ai/tests/spain-direct-persistent-state-v2.test.mjs
      - name: EDGE P0 rendering guards
        run: node loterias-ai/tests/edge-live-research-breakthroughs-v1.test.mjs
