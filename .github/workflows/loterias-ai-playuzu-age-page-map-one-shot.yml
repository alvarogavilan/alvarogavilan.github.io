name: Loterias AI PlayUZU Age Page Map One Shot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/playuzu/map-age-of-gods-pages-v1.mjs'
      - '.github/workflows/loterias-ai-playuzu-age-page-map-one-shot.yml'
permissions:
  contents: write
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node loterias-ai/casino/playuzu/map-age-of-gods-pages-v1.mjs
      - run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add loterias-ai/casino/playuzu/evidence/age-of-gods-page-map-v1.json
          git diff --cached --quiet && exit 0
          git commit -m 'research(playuzu): persist Age of Gods page map'
          git pull --rebase origin main
          git push origin HEAD:main
