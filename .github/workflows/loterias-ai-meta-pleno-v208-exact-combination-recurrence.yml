name: Loterias AI MetaPleno v208 Exact Combination Recurrence
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v207-bonoloto-continuous-recurrence]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v208-exact-combination-recurrence.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v208-exact-combination-recurrence.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run exact-combination recurrence audit
        run: node loterias-ai/scripts/meta-pleno-v208-exact-combination-recurrence.mjs
      - name: Validate audit
        run: |
          node - <<'NODE'
          const fs=require('fs'); const p='loterias-ai/data/research/meta-pleno-v208-exact-combination-recurrence.json'; const d=JSON.parse(fs.readFileSync(p,'utf8'));
          if(d.version!=='v208'||d.realMoneyPass!==false) throw new Error('v208 safety/version gate');
          if(!d.summary||d.summary.totalDraws<1) throw new Error('v208 empty audit');
          if(!Array.isArray(d.results)||!d.results.length) throw new Error('v208 missing games');
          console.log(JSON.stringify(d.summary));
          NODE
      - name: Persist v208
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v208-exact-combination-recurrence.json
          if ! git diff --cached --quiet; then
            git commit -m "data(loterias-ai): persist v208 exact-combination recurrence audit"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi