name: MetaPleno v311 Stage4 Blind OOS 2023-2024

on:
  push:
    branches:
      - research/metapleno-v311-hawkes-rebased
    paths:
      - 'loterias-ai/research/megalab/v311-stage4-hawkes-blind-oos.mjs'
      - 'loterias-ai/data/research/metapleno-v311-stage3-freeze.json'
      - '.github/workflows/metapleno-v311-stage4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/metapleno-v311-hawkes-rebased
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Replay frozen Hawkes candidates on blind OOS
        run: node loterias-ai/research/megalab/v311-stage4-hawkes-blind-oos.mjs
      - name: Verify lineage, isolation and economics
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const f=JSON.parse(fs.readFileSync('loterias-ai/data/research/metapleno-v311-stage3-freeze.json','utf8'));
          const j=JSON.parse(fs.readFileSync('loterias-ai/data/research/metapleno-v311-stage4-oos.json','utf8'));
          if(j.freezeSealSHA256!==f.freezeSealSHA256) process.exit(1);
          if(j.realMoneyPass!==false||j.realStakeEUR!==0||j.theoreticalBudgetEURMax>15) process.exit(1);
          if(j.retuningPerformed!==false||j.postFreezeTouched!==false||j.validationTouched!==true) process.exit(1);
          if(j.blindOosStart!=='2023-01-01'||j.blindOosEndExclusive!=='2025-01-01'||j.postFreezeStart!=='2025-01-01') process.exit(1);
          if(j.frozenCandidateCount!==32||j.games.length!==4||j.games.some(g=>g.frozenCandidates!==8)) process.exit(1);
          if(j.auditRequired!==(j.repeat5Plus||j.fullHit||j.nearFull)) process.exit(1);
          NODE
      - name: Persist blind OOS evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/research/metapleno-v311-stage4-oos.json
          git diff --cached --quiet && exit 0
          git commit -m 'research(v311): persist blind OOS evidence'
          git pull --rebase origin research/metapleno-v311-hawkes-rebased
          git push origin HEAD:research/metapleno-v311-hawkes-rebased
