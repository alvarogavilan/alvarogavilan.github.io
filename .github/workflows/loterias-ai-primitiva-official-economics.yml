name: Loterias AI Primitiva Official Economics
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/enrich-primitiva-official-economics.mjs'
      - '.github/workflows/loterias-ai-primitiva-official-economics.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-primitiva-official-economics
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enrich multiple bounded batches
        shell: bash
        run: |
          for i in 1 2 3 4; do
            BATCH_LIMIT=120 node loterias-ai/scripts/enrich-primitiva-official-economics.mjs || exit 1
          done
      - name: Persist safely
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/archive/primitiva loterias-ai/data/archive/_meta/primitiva-official-economics.json
          git commit -m 'data(loterias-ai): enrich Primitiva official economics' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
