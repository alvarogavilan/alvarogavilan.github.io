name: Loterias AI Age of Gods Layout Diagnostic One Shot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/diagnose-age-of-gods-listing-v1.mjs'
      - '.github/workflows/loterias-ai-age-of-gods-layout-diagnostic-one-shot.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node loterias-ai/casino/jackpots/diagnose-age-of-gods-listing-v1.mjs
      - run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add loterias-ai/casino/jackpots/evidence/age-of-gods-listing-diagnostic-v1.json
          git diff --cached --quiet && exit 0
          git commit -m 'research(jackpots): persist Age of Gods listing diagnostic'
          git pull --rebase origin main
          git push origin HEAD:main
