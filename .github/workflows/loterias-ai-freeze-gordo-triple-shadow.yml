name: Loterias AI Freeze Gordo Triple Shadow
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/freeze-gordo-triple-shadow.mjs'
      - '.github/workflows/loterias-ai-freeze-gordo-triple-shadow.yml'
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node loterias-ai/scripts/freeze-gordo-triple-shadow.mjs
      - name: Persist immutable shadow pick
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/prospective/gordo-triple-shadow-2026-08-16.json
          git diff --cached --quiet && exit 0
          git commit -m 'data(loterias-ai): freeze Gordo shadow pick for 2026-08-16'
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((i*3))
          done
          exit 1
