name: Loterias AI Backfill 2026
on:
  push:
    paths:
      - 'loterias-ai/scripts/backfill-core-2026.mjs'
      - '.github/workflows/loterias-ai-backfill-2026.yml'
  workflow_dispatch:
jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backfill official 2026 core draws
        run: node loterias-ai/scripts/backfill-core-2026.mjs
      - name: Validate generated archives
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('loterias-ai/data/archive/backfill-2026-summary.json','utf8'));
          for(const [g,x] of Object.entries(s.games)){if(!x.validatedDraws) throw new Error(g+' produced zero draws');}
          console.log(s.games);
          NODE
      - name: Persist archive partitions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/archive
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(loterias-ai): backfill official 2026 core draws'
          git pull --rebase origin main
          git push origin HEAD:main
