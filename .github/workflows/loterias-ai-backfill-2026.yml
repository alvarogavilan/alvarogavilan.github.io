name: Loterias AI Backfill 2026
on:
  push:
    paths:
      - 'loterias-ai/scripts/backfill-core-2026.mjs'
      - '.github/workflows/loterias-ai-backfill-2026.yml'
  workflow_dispatch:
    inputs:
      game:
        description: 'Optional gameId to refresh (blank = all core games)'
        required: false
        default: ''
      start_date:
        description: 'Optional YYYY-MM-DD start date (blank = 2026-01-01)'
        required: false
        default: ''
      end_date:
        description: 'Optional YYYY-MM-DD end date (blank = today)'
        required: false
        default: ''
concurrency:
  group: loterias-ai-backfill-2026-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LOTERIAS_BACKFILL_GAME: ${{ github.event_name == 'workflow_dispatch' && inputs.game || (github.event_name == 'push' && 'bonoloto') || '' }}
      LOTERIAS_BACKFILL_START: ${{ github.event_name == 'workflow_dispatch' && inputs.start_date || (github.event_name == 'push' && '2026-08-14') || '' }}
      LOTERIAS_BACKFILL_END: ${{ github.event_name == 'workflow_dispatch' && inputs.end_date || '' }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Sync current branch before generating data
        run: git pull --rebase origin "${GITHUB_REF_NAME}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backfill official 2026 core draws
        run: node loterias-ai/scripts/backfill-core-2026.mjs
      - name: Validate generated archives
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('loterias-ai/data/archive/backfill-2026-summary.json','utf8'));
          for(const [g,x] of Object.entries(s.games)){if(!x.validatedDraws) throw new Error(g+' produced zero preserved/fetched draws');}
          console.log(s.games);
          NODE
      - name: Persist archive partitions on current branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/archive
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(loterias-ai): backfill official 2026 core draws'
          git push origin HEAD:"${GITHUB_REF_NAME}"
