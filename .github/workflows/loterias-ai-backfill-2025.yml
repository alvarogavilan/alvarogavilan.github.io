name: Loterias AI Backfill 2025

on:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/scripts/backfill-core-year.mjs'
      - '.github/workflows/loterias-ai-backfill-2025.yml'
  workflow_dispatch:

concurrency:
  group: loterias-ai-backfill-2025
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      YEAR: '2025'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recompute and persist official 2025 backfill on latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            echo "attempt=$attempt"
            git fetch origin main
            base="$(git rev-parse origin/main)"
            git reset --hard "$base"

            node loterias-ai/scripts/backfill-core-year.mjs

            node - <<'NODE'
          const s=require('./loterias-ai/data/archive/backfill-2025-summary.json');
          for(const [g,x] of Object.entries(s.games)) {
            if(!x.validatedDraws) throw new Error(g+' produced zero draws');
          }
          console.log(s.games);
          NODE

            git add loterias-ai/data/archive
            if git diff --cached --quiet; then
              echo 'NO_SEMANTIC_CHANGE'
              exit 0
            fi

            git commit -m 'data(loterias-ai): backfill official 2025 core draws'
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$base" ]; then
              echo 'main moved; recomputing on latest canonical state'
              continue
            fi

            if git push origin HEAD:main; then
              exit 0
            fi
            echo 'push raced; recomputing'
          done

          echo 'Unable to persist a current-state backfill after 5 attempts' >&2
          exit 1
