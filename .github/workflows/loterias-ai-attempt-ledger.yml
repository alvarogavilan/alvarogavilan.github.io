name: Loterias AI Attempt Ledger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/data/shadow/**/*evaluation.json'
      - 'loterias-ai/scripts/build-public-attempt-ledger.mjs'
      - '.github/workflows/loterias-ai-attempt-ledger.yml'

permissions:
  contents: write

concurrency:
  group: loterias-ai-attempt-ledger
  cancel-in-progress: true

jobs:
  build-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build normalized public attempt ledger
        run: node loterias-ai/scripts/build-public-attempt-ledger.mjs
      - name: Commit ledger if changed
        shell: bash
        run: |
          set -euo pipefail
          TARGET='loterias-ai/data/shadow/public-attempts-v1.json'
          if [ -z "$(git status --porcelain -- "$TARGET")" ]; then
            echo 'Attempt ledger unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m 'data(results): refresh normalized attempt ledger'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main || { git rebase --abort || true; sleep $((attempt*2)); continue; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          echo 'Unable to publish ledger after retries.' >&2
          exit 1
