name: Loterias AI PokerStars Catalog Structure One Shot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/specialists/probe-pokerstars-catalog-structure-v1.mjs'
      - '.github/workflows/loterias-ai-pokerstars-catalog-structure-one-shot.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node loterias-ai/casino/specialists/probe-pokerstars-catalog-structure-v1.mjs
      - run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add loterias-ai/casino/specialists/evidence/pokerstars-catalog-structure-probe-v1.json
          git diff --cached --quiet && exit 0
          git commit -m 'data(casino): persist PokerStars catalog structure probe'
          git pull --rebase origin main
          git push origin HEAD:main
