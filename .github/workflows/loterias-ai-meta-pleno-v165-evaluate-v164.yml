name: Loterias AI MetaPleno v165 Evaluate v164 Freeze
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v163-v164-audit-freeze]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v165-evaluate-v164-freeze.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v165-evaluate-v164.yml'
jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v165-evaluate-v164-freeze.mjs
      - name: Persist v165 evaluation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/prospective/bonoloto-v165-v164-evaluation.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist v165 prospective evaluation'
          git push
