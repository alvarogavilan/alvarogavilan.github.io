name: Loterias AI MetaPleno v236 Johnson Combination Geometry

on:
  workflow_dispatch:
  push:
    branches:
      - research/metapleno-v236-johnson-combination-geometry
    paths:
      - 'loterias-ai/research/metapleno-v236-johnson-combination-geometry.mjs'
      - '.github/workflows/loterias-ai-metapleno-v236-johnson-combination-geometry.yml'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run v236J
        run: node loterias-ai/research/metapleno-v236-johnson-combination-geometry.mjs
      - name: Validate fail-closed
        run: node -e "const r=require('./loterias-ai/data/research/metapleno-v236-johnson-combination-geometry.json'); if(r.realMoneyPass!==false||r.realStakeEUR!==0||r.candidatePool.theoreticalCostEUR>15) process.exit(1)"
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/metapleno-v236-johnson-combination-geometry.json
          git diff --cached --quiet || git commit -m 'research(loterias-ai): persist v236 Johnson combination geometry'
          git push
