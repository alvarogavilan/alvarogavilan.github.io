name: Loterias AI MetaPleno v142 Near-Pleno Atlas
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v142-nearpleno-atlas]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v142-global-nearpleno-atlas.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v142-nearpleno-atlas.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v142-global-nearpleno-atlas.mjs
      - name: Persist v142
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v142-global-nearpleno-atlas.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist v142 near-pleno atlas'
          git push
