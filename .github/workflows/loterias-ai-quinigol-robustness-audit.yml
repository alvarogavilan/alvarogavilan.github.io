name: Loterias AI Quinigol Holdout Robustness Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/scripts/quinigol-holdout-robustness-audit.mjs'
      - '.github/workflows/loterias-ai-quinigol-robustness-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run fixed-holdout descriptive robustness audit
        run: node loterias-ai/scripts/quinigol-holdout-robustness-audit.mjs
      - name: Persist audit only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/backtests/quinigol-holdout-robustness-audit.json
          git commit -m 'data(quinigol): persist fixed-holdout robustness audit' || exit 0
          git push
