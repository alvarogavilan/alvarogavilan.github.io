name: Loterias AI Unseen Combination Exclusion Audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/unseen-combination-exclusion-audit.mjs'
      - '.github/workflows/loterias-ai-unseen-combination-exclusion-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run exact unseen-combination audit
        run: node loterias-ai/scripts/unseen-combination-exclusion-audit.mjs
      - name: Persist evidence safely
        run: |
          cp loterias-ai/data/research/unseen-combination-exclusion-audit.json /tmp/unseen.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p loterias-ai/data/research
          cp /tmp/unseen.json loterias-ai/data/research/unseen-combination-exclusion-audit.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/research/unseen-combination-exclusion-audit.json
          git commit -m 'data(loterias-ai): persist unseen combination exclusion audit' || exit 0
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break || sleep 2; done