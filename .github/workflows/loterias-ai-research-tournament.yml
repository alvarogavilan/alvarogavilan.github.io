name: Loterias AI Research Tournament
on:
  push:
    paths:
      - 'loterias-ai/data/archive/**/2026.json'
      - 'loterias-ai/scripts/run-research-tournament-2026.mjs'
      - 'loterias-ai/js/mega-numeric-engine.js'
      - 'loterias-ai/js/walk-forward-tournament.js'
      - '.github/workflows/loterias-ai-research-tournament.yml'
  workflow_dispatch:
jobs:
  tournament:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run research-only walk-forward tournament
        run: node loterias-ai/scripts/run-research-tournament-2026.mjs
      - name: Persist tournament result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/backtests/research-tournament-2026.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(loterias-ai): refresh 2026 walk-forward tournament'
          git pull --rebase origin main
          git push origin HEAD:main
