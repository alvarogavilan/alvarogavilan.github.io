name: Loterias AI Lototurf Official Financial Tournament
on:
  push:
    paths:
      - 'loterias-ai/scripts/lototurf-official-financial-tournament.mjs'
      - 'loterias-ai/data/archive/lototurf/**'
      - '.github/workflows/loterias-ai-lototurf-official-financial-tournament.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: loterias-ai-lototurf-financial-tournament
  cancel-in-progress: true
jobs:
  tournament:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/lototurf-official-financial-tournament.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/backtests/lototurf-official-financial-tournament.json /tmp/lototurf-backtest.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p loterias-ai/data/backtests
          cp /tmp/lototurf-backtest.json loterias-ai/data/backtests/lototurf-official-financial-tournament.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/backtests/lototurf-official-financial-tournament.json
          git commit -m 'data(loterias-ai): persist Lototurf official financial tournament' || exit 0
          git push origin HEAD:main
