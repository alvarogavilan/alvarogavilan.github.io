name: Loterias AI Lightning Exact Page Boundary v1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/lightning/research/exact-page-boundary-v1.mjs'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node loterias-ai/casino/lightning/research/exact-page-boundary-v1.mjs
      - name: Persist evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/casino/lightning/evidence/exact-page-boundary-v1.json
          git commit -m 'research(casino): persist exact Lightning public history boundary' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
