name: Loterias AI Gordo v14 Matched Cost Baseline
on:
  push:
    paths:
      - 'loterias-ai/scripts/gordo-v14-matched-cost-baseline.mjs'
      - '.github/workflows/loterias-ai-gordo-v14-matched-cost-baseline.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/gordo-v14-matched-cost-baseline.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/research/gordo-v14-matched-cost-baseline.json /tmp/gordo-v14-matched-cost-baseline.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/gordo-v14-matched-cost-baseline.json loterias-ai/data/research/gordo-v14-matched-cost-baseline.json
          git add loterias-ai/data/research/gordo-v14-matched-cost-baseline.json
          git commit -m 'data(loterias-ai): persist Gordo v14 matched-cost baseline' || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*3)); done
          exit 1
