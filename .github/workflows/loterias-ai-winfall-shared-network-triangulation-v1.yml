name: Loterias AI Winfall Shared Network Triangulation V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'loterias-ai/casino/jackpots/winfall-shared-network-triangulation-v1.mjs'
      - '.github/workflows/loterias-ai-winfall-shared-network-triangulation-v1.yml'
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/winfall-shared-network-triangulation-v1.mjs'
      - '.github/workflows/loterias-ai-winfall-shared-network-triangulation-v1.yml'
  schedule:
    - cron: '37 */2 * * *'

permissions:
  contents: write

concurrency:
  group: loterias-ai-winfall-shared-network-triangulation-v1
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run passive Winfall shared-network triangulation
        run: node loterias-ai/casino/jackpots/winfall-shared-network-triangulation-v1.mjs
      - name: Validate fail-closed evidence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='loterias-ai/casino/jackpots/evidence/winfall-shared-network-triangulation-v1.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          if(x?.decision?.exactLiveIdVerified!==false) throw new Error('discovery run must never verify exact identity');
          if(x?.decision?.economicPromotionAllowed!==false||x?.decision?.realMoneyAllowed!==false) throw new Error('economic/real-money promotion must stay false');
          if(x?.coverage?.complete!==true) throw new Error('incomplete browser coverage');
          if(x?.guards?.allThreeOfficiallyLinkedPagesRequired!==true||x?.guards?.twoUnrelatedControlsRequired!==true) throw new Error('triangulation controls missing');
          console.log(JSON.stringify({coverage:x.coverage,candidates:x.comparison?.discoveryCandidates||[],decision:x.decision},null,2));
          NODE
      - name: Persist evidence on main only
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          FILE=loterias-ai/casino/jackpots/evidence/winfall-shared-network-triangulation-v1.json
          cp "$FILE" /tmp/winfall-shared-network-triangulation-v1.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p "$(dirname "$FILE")"
          cp /tmp/winfall-shared-network-triangulation-v1.json "$FILE"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(casino): refresh Winfall shared-network triangulation'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
