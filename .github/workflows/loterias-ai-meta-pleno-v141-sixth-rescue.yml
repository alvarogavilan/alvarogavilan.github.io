name: Loterias AI MetaPleno v141 Sixth Rescue
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v141-sixth-rescue]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v141-sixth-rescue.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v141-sixth-rescue.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v141-sixth-rescue.mjs
      - name: Persist v141 result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v141-sixth-rescue.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist v141 sixth-rescue result'
          git push
