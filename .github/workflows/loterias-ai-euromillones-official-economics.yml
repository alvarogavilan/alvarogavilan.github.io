name: Loterias AI Euromillones Official Economics
on:
  push:
    paths:
      - 'loterias-ai/scripts/enrich-euromillones-official-economics.mjs'
      - '.github/workflows/loterias-ai-euromillones-official-economics.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enrich sixteen bounded official batches
        run: |
          for i in $(seq 1 16); do BATCH_LIMIT=120 node loterias-ai/scripts/enrich-euromillones-official-economics.mjs || exit 1; done
      - name: Persist safely
        run: |
          cp -R loterias-ai/data/archive/euromillones /tmp/euromillones
          cp loterias-ai/data/archive/_meta/euromillones-official-economics.json /tmp/euromillones-official-economics.json
          git fetch origin main
          git reset --hard origin/main
          rm -rf loterias-ai/data/archive/euromillones
          cp -R /tmp/euromillones loterias-ai/data/archive/euromillones
          cp /tmp/euromillones-official-economics.json loterias-ai/data/archive/_meta/euromillones-official-economics.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/archive/euromillones loterias-ai/data/archive/_meta/euromillones-official-economics.json
          git commit -m 'data(loterias-ai): expand Euromillones official economics' || exit 0
          git push origin HEAD:main
