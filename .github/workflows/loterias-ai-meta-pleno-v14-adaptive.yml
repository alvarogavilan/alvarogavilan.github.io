name: Loterias AI MetaPleno v14 Adaptive
on:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v14-adaptive-shard.mjs'
      - 'loterias-ai/scripts/meta-pleno-v14-aggregate.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v14-adaptive.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        game: [bonoloto, primitiva, euromillones, eurodreams, gordo-primitiva]
        shard: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Search adaptive shard
        run: GAME=${{ matrix.game }} SHARD=${{ matrix.shard }} CANDIDATES=25000 node loterias-ai/scripts/meta-pleno-v14-adaptive-shard.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: meta-pleno-v14-${{ matrix.game }}-${{ matrix.shard }}
          path: loterias-ai/data/research/meta-pleno-v14-shards/${{ matrix.game }}-${{ matrix.shard }}.json
  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/download-artifact@v4
        with:
          pattern: meta-pleno-v14-*
          path: loterias-ai/data/research/meta-pleno-v14-shards
          merge-multiple: true
      - run: node loterias-ai/scripts/meta-pleno-v14-aggregate.mjs
      - name: Persist result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/research/meta-pleno-v14-adaptive-ranker.json
          git diff --cached --quiet && exit 0
          git commit -m 'data(loterias-ai): persist MetaPleno v14 adaptive result'
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*3)); done
          exit 1
