# Cost control: one daily archive maintenance pass is sufficient; prospective settlement remains separate.
name: Loterias AI Daily Archive Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'
  push:
    paths:
      - '.github/workflows/loterias-ai-daily-archive-maintenance.yml'
      - 'loterias-ai/scripts/import-bonoloto-full-history.mjs'
      - 'loterias-ai/scripts/import-core-full-history.mjs'
      - 'loterias-ai/scripts/import-nacional-year.mjs'
      - 'loterias-ai/scripts/enrich-national-archive-economics.mjs'
      - 'loterias-ai/scripts/enrich-eurodreams-full-economics.mjs'
      - 'loterias-ai/scripts/preserve-archive-evidence.mjs'
      - 'loterias-ai/scripts/build-special-draw-indexes.mjs'
      - 'loterias-ai/scripts/build-national-archive-index.mjs'
      - 'loterias-ai/scripts/build-completeness-index.mjs'
      - 'loterias-ai/scripts/audit-national-archive.mjs'

permissions:
  contents: write

concurrency:
  group: loterias-ai-archive-maintenance
  cancel-in-progress: true

jobs:
  maintain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recompute archive from latest main and persist safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf /tmp/loterias-ai-archive-before
            cp -a loterias-ai/data/archive /tmp/loterias-ai-archive-before

            node loterias-ai/scripts/import-bonoloto-full-history.mjs
            node loterias-ai/scripts/import-core-full-history.mjs
            YEAR="$(date -u +%Y)" DETAIL_LIMIT=3 node loterias-ai/scripts/import-nacional-year.mjs
            node loterias-ai/scripts/enrich-national-archive-economics.mjs
            BATCH_LIMIT=10 node loterias-ai/scripts/enrich-eurodreams-full-economics.mjs || echo 'EuroDreams source temporarily incomplete; preserving prior verified evidence'

            ARCHIVE_BEFORE=/tmp/loterias-ai-archive-before node loterias-ai/scripts/preserve-archive-evidence.mjs

            node loterias-ai/scripts/build-special-draw-indexes.mjs
            node loterias-ai/scripts/build-national-archive-index.mjs
            node loterias-ai/scripts/build-completeness-index.mjs
            node loterias-ai/scripts/audit-national-archive.mjs

            git add loterias-ai/data/archive
            if git diff --cached --quiet; then
              echo 'No semantic archive changes'
              exit 0
            fi

            git commit -m 'data(loterias-ai): daily national archive refresh'
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "main moved during archive maintenance; recomputing from latest main (attempt ${attempt}/5)"
            sleep $((attempt * 3))
          done

          echo 'Could not persist archive safely after 5 recomputations' >&2
          exit 1
