name: Loterias AI Bonoloto 2024 Matched Null
on:
  push:
    paths:
      - 'loterias-ai/scripts/bonoloto-2024-matched-null.mjs'
      - '.github/workflows/loterias-ai-bonoloto-2024-matched-null.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: loterias-ai-bonoloto-2024-matched-null
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Run 1000 matched random portfolios
        run: RUNS=1000 node loterias-ai/scripts/bonoloto-2024-matched-null.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/research/bonoloto-2024-matched-null.json /tmp/null.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/null.json loterias-ai/data/research/bonoloto-2024-matched-null.json
            git add loterias-ai/data/research/bonoloto-2024-matched-null.json
            git commit -m 'data(loterias-ai): persist Bonoloto 2024 matched null' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
