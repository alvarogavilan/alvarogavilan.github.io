name: Loterias AI PlayUZU Validated Catalog One Shot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/playuzu/build-validated-catalog-and-specialists-v1.mjs'
      - '.github/workflows/loterias-ai-playuzu-catalog-specialists-one-shot.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node loterias-ai/casino/playuzu/build-validated-catalog-and-specialists-v1.mjs
      - run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add loterias-ai/casino/playuzu/evidence/validated-game-catalog-v1.json loterias-ai/casino/playuzu/evidence/validated-game-specialists-v1.json
          git diff --cached --quiet && exit 0
          git commit -m 'research(playuzu): persist validated catalog and per-game specialists'
          git pull --rebase origin main
          git push origin HEAD:main
