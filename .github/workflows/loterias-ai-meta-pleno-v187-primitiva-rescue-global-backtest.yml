name: Loterias AI MetaPleno v187 Primitiva Rescue Global Backtest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v187-primitiva-rescue-global-backtest.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v187-primitiva-rescue-global-backtest.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run v187
        run: node loterias-ai/scripts/meta-pleno-v187-primitiva-rescue-global-backtest.mjs
      - name: Persist v187
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v187-primitiva-rescue-global-backtest.json
          git diff --cached --quiet || git commit -m "research(loterias-ai): persist v187 Primitiva rescue global backtest"
          git pull --rebase origin main
          git push
