name: Loterias AI Quinigol Prospective Shadow
on:
  workflow_dispatch:
  schedule:
    - cron: '15 7,20 * * *'
  push:
    paths:
      - 'loterias-ai/scripts/quinigol-prospective-shadow.mjs'
      - 'loterias-ai/data/archive/quinigol/**'
      - 'loterias-ai/data/policies/quinigol-shadow-policy.json'
permissions:
  contents: write
concurrency:
  group: loterias-ai-quinigol-shadow
  cancel-in-progress: false
jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/quinigol-prospective-shadow.mjs
      - name: Persist ledger safely
        run: |
          cp loterias-ai/data/shadow/quinigol-ledger.json /tmp/quinigol-ledger.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p loterias-ai/data/shadow
          cp /tmp/quinigol-ledger.json loterias-ai/data/shadow/quinigol-ledger.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/shadow/quinigol-ledger.json
          git commit -m 'data(loterias-ai): update Quinigol prospective shadow ledger' || exit 0
          git push origin HEAD:main
