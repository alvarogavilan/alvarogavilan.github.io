# Cost control: Quinigol shadow advances when the official archive changes; no timer required.
# One-time hash-migration validation trigger; no recurring schedule added.
name: Loterias AI Quinigol Prospective Shadow
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/quinigol-prospective-shadow.mjs'
      - 'loterias-ai/scripts/quinigol-prospective-finalize-30.mjs'
      - 'loterias-ai/data/archive/quinigol/**'
      - 'loterias-ai/data/policies/quinigol-shadow-policy.json'
      - '.github/workflows/loterias-ai-quinigol-shadow.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-quinigol-shadow
  cancel-in-progress: true
jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/quinigol-prospective-shadow.mjs
      - run: node loterias-ai/scripts/quinigol-prospective-finalize-30.mjs
      - run: node loterias-ai/casino/lightning/research/economic-readiness-ledger-v1.mjs
      - run: node loterias-ai/casino/lightning/research/economic-promotion-gate-v1.mjs
      - name: Validate blinded/final safety
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const l=JSON.parse(fs.readFileSync('loterias-ai/data/shadow/quinigol-ledger.json','utf8'));
          if(l.guards?.first30Only!==true||l.guards?.noOptionalStopping!==true||l.guards?.post30CannotRescue!==true||l.guards?.realMoneyAllowed!==false)throw new Error('Quinigol ledger guard regression');
          if((l.summary?.observedJornadas||0)<30&&(l.summary?.simulatedROI!==null||l.summary?.profitableJornadas!==null||l.disclosure?.interimROIHidden!==true))throw new Error('Quinigol interim blindness regression');
          const p='loterias-ai/data/shadow/quinigol-prospective-final-30.json';
          if(fs.existsSync(p)){const f=JSON.parse(fs.readFileSync(p,'utf8'));if(f.fixedBoundary?.jornadas!==30||f.fixedBoundary?.post30CanRescue!==false||f.guards?.noRetuning!==true||f.guards?.noOptionalStopping!==true||f.guards?.realMoneyAllowed!==false||f.gates?.realMoneyPass!==false)throw new Error('Quinigol final guard regression')}
          const r=JSON.parse(fs.readFileSync('loterias-ai/casino/lightning/evidence/economic-readiness-ledger-v1.json','utf8'));if(r.realMoneyAllowed!==false||r.promotionPolicy?.hiddenPerformanceMustRemainHidden!==true)throw new Error('economic readiness guard regression');
          const g=JSON.parse(fs.readFileSync('loterias-ai/casino/lightning/evidence/economic-promotion-gate-v1.json','utf8'));if(g.policy?.onlyFixedBoundaryFinalsMayPromote!==true||g.policy?.hiddenInterimPerformanceNeverRead!==true||g.policy?.realMoneyAllowed!==false)throw new Error('economic promotion gate regression');
          NODE
      - name: Persist blinded ledger, fixed final and economic radar safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/quinigol-shadow
          cp loterias-ai/data/shadow/quinigol-ledger.json /tmp/quinigol-shadow/quinigol-ledger.json
          cp loterias-ai/casino/lightning/evidence/economic-readiness-ledger-v1.json /tmp/quinigol-shadow/economic-readiness-ledger-v1.json
          cp loterias-ai/casino/lightning/evidence/economic-promotion-gate-v1.json /tmp/quinigol-shadow/economic-promotion-gate-v1.json
          if [ -f loterias-ai/data/shadow/quinigol-prospective-final-30.json ]; then cp loterias-ai/data/shadow/quinigol-prospective-final-30.json /tmp/quinigol-shadow/quinigol-prospective-final-30.json; fi
          git fetch origin main
          git reset --hard origin/main
          mkdir -p loterias-ai/data/shadow loterias-ai/casino/lightning/evidence
          cp /tmp/quinigol-shadow/quinigol-ledger.json loterias-ai/data/shadow/quinigol-ledger.json
          cp /tmp/quinigol-shadow/economic-readiness-ledger-v1.json loterias-ai/casino/lightning/evidence/economic-readiness-ledger-v1.json
          cp /tmp/quinigol-shadow/economic-promotion-gate-v1.json loterias-ai/casino/lightning/evidence/economic-promotion-gate-v1.json
          if [ -f /tmp/quinigol-shadow/quinigol-prospective-final-30.json ]; then cp /tmp/quinigol-shadow/quinigol-prospective-final-30.json loterias-ai/data/shadow/quinigol-prospective-final-30.json; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/shadow/quinigol-ledger.json loterias-ai/data/shadow/quinigol-prospective-final-30.json loterias-ai/casino/lightning/evidence/economic-readiness-ledger-v1.json loterias-ai/casino/lightning/evidence/economic-promotion-gate-v1.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'data(loterias-ai): advance blinded Quinigol and economic radar'
          git push origin HEAD:main
