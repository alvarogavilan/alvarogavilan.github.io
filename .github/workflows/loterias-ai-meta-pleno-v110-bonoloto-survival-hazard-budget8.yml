name: Loterias AI MetaPleno v110 Bonoloto Survival Hazard Budget8
on:
  push:
    branches:
      - research/metapleno-v110-bonoloto-survival-hazard
    paths:
      - 'loterias-ai/scripts/meta-pleno-v110-bonoloto-survival-hazard-budget8.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v110-bonoloto-survival-hazard-budget8.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node loterias-ai/scripts/meta-pleno-v110-bonoloto-survival-hazard-budget8.mjs
      - name: Assert research safety gates
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='loterias-ai/data/research/meta-pleno-v110-bonoloto-survival-hazard-budget8.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          if(x.realMoneyPass!==false) throw new Error('realMoneyPass must remain false');
          if(x.budget?.maxEURPerGameDraw!==15 || x.budget?.realStakeEUR!==0) throw new Error('budget gate changed');
          if(x.searchAccounting?.candidatePool!==8) throw new Error('candidate pool must remain Budget8');
          if(x.searchAccounting?.mathematicallyEffectiveConfigurations>x.searchAccounting?.nominalConfigurations) throw new Error('effective config count invalid');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: v110-bonoloto-survival-hazard-budget8
          path: loterias-ai/data/research/meta-pleno-v110-bonoloto-survival-hazard-budget8.json
