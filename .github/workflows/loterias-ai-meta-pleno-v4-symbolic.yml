name: Loterias AI MetaPleno v4 Symbolic
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v4-symbolic.mjs'
      - 'loterias-ai/scripts/meta-pleno-v4-aggregate.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v4-symbolic.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-meta-pleno-v4-symbolic
  cancel-in-progress: false
jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        game: [primitiva, bonoloto, euromillones, eurodreams, gordo-primitiva]
        shard: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Search 50k symbolic programs
        env:
          GAME: ${{ matrix.game }}
          SHARD: ${{ matrix.shard }}
          CANDIDATES: 50000
        run: node loterias-ai/scripts/meta-pleno-v4-symbolic.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: meta-pleno-v4-${{ matrix.game }}-${{ matrix.shard }}
          path: loterias-ai/data/research/meta-pleno-v4-shards/${{ matrix.game }}-${{ matrix.shard }}.json
  aggregate:
    needs: search
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/download-artifact@v4
        with:
          pattern: meta-pleno-v4-*
          path: /tmp/meta-v4
      - name: Collect shards
        run: |
          mkdir -p loterias-ai/data/research/meta-pleno-v4-shards
          find /tmp/meta-v4 -name '*.json' -exec cp {} loterias-ai/data/research/meta-pleno-v4-shards/ \;
          test "$(find loterias-ai/data/research/meta-pleno-v4-shards -name '*.json' | wc -l)" -eq 20
      - name: Open frozen holdout
        run: node loterias-ai/scripts/meta-pleno-v4-aggregate.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/research/meta-pleno-v4-symbolic.json /tmp/meta-v4.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/meta-v4.json loterias-ai/data/research/meta-pleno-v4-symbolic.json
            git add loterias-ai/data/research/meta-pleno-v4-symbolic.json
            git commit -m 'data(loterias-ai): persist MetaPleno v4 symbolic evidence' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
