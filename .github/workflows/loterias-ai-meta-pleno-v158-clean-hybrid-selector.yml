name: Loterias AI MetaPleno v158 Clean Hybrid Selector
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v158-clean-hybrid-selector]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v158-clean-hybrid-selector.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v158-clean-hybrid-selector.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v158-clean-hybrid-selector.mjs
      - name: Persist v158
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v158-clean-hybrid-selector.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist v158 clean hybrid selector'
          git push
