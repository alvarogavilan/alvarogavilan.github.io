name: Loterias AI Pool1 Passive CDP Network V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/botemania-pool1-passive-cdp-network-v1.mjs'
      - '.github/workflows/loterias-ai-pool1-passive-cdp-network-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check loterias-ai/casino/jackpots/botemania-pool1-passive-cdp-network-v1.mjs
      - name: Show browser
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true
          (google-chrome --version || google-chrome-stable --version || chromium --version || chromium-browser --version || true) 2>/dev/null
      - name: Capture passive page-load network on ten bounded public pages
        run: node loterias-ai/casino/jackpots/botemania-pool1-passive-cdp-network-v1.mjs
      - name: Enforce passive fail-closed semantics
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const x=JSON.parse(fs.readFileSync('loterias-ai/casino/jackpots/evidence/botemania-pool1-passive-cdp-network-v1.json','utf8'));
          if(x.guards?.publicPageLoadOnly!==true || x.guards?.noLogin!==true || x.guards?.noClick!==true || x.guards?.noRuntimeEvaluate!==true || x.guards?.noRequestInterception!==true || x.guards?.noGameLaunch!==true || x.guards?.noBetting!==true) throw new Error('passive/no-interaction guards missing');
          if(x.guards?.noHeadersPersisted!==true || x.guards?.secretLikeUrlAndVariableValuesRedacted!==true || x.guards?.responseBodiesNotPersisted!==true) throw new Error('privacy/redaction guards missing');
          if(x.guards?.globalLoadJackpotsNeverMapsGameIdentity!==true || x.guards?.separateResponsesNeverCombinedIntoIdentityProof!==true || x.guards?.singleCaptureNeverVerifiesIdentity!==true) throw new Error('identity anti-contamination guards missing');
          if(x.decision?.exactGameIdentityRecovered!==false || x.decision?.passiveNetworkGameMappingVerified!==false || x.decision?.economicPromotionAllowed!==false || x.decision?.realMoneyAllowed!==false) throw new Error('CDP discovery auto-promoted identity/economics');
          if((x.coverage?.targetCount||0)!==10) throw new Error('target scope drifted');
          if(x.decision?.networkLayerExhausted===true && x.coverage?.complete!==true) throw new Error('partial CDP coverage claimed negative exhaustion');
          console.log(JSON.stringify({browser:x.browser,coverage:x.coverage,comparison:{commonSignatureCount:(x.comparison?.commonSignatures||[]).length,classifiedPoolResponses:x.comparison?.classifiedPoolResponses||[],globalLoadJackpotsCount:x.comparison?.globalLoadJackpotsCount,pageSpecificCandidates:x.comparison?.pageSpecificCandidates||[]},decision:x.decision,pages:(x.pages||[]).map(p=>({slug:p.slug,success:p.success,loadEventFired:p.loadEventFired,relevantRequestCount:p.relevantRequestCount,poolResponseCount:(p.poolResponses||[]).length,error:p.error||null}))},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: pool1-passive-cdp-network-v1
          path: loterias-ai/casino/jackpots/evidence/botemania-pool1-passive-cdp-network-v1.json
          retention-days: 7
