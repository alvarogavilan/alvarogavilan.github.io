name: Loterias AI MetaPleno v215 Bonoloto DP Mixture
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v215-bonoloto-dp-mixture]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v215-bonoloto-dp-mixture.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v215-bonoloto-dp-mixture.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/metapleno-v215-bonoloto-dp-mixture}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node loterias-ai/scripts/meta-pleno-v215-bonoloto-dp-mixture.mjs
      - name: Validate gates
        run: node -e "const x=require('./loterias-ai/data/research/meta-pleno-v215-bonoloto-dp-mixture.json');if(x.realMoneyPass!==false||x.budget.realStakeEUR!==0)process.exit(1)"
      - name: Persist v215
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v215-bonoloto-dp-mixture.json
          git diff --cached --quiet || git commit -m 'research(loterias-ai): persist v215 DP state mixture'
          git push