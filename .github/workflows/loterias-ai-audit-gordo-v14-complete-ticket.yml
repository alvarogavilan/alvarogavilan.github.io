name: Loterias AI Audit Gordo v14 Complete Ticket
on:
  push:
    paths:
      - 'loterias-ai/scripts/audit-gordo-v14-complete-ticket.mjs'
      - '.github/workflows/loterias-ai-audit-gordo-v14-complete-ticket.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31882072830
          pattern: meta-pleno-v14-gordo-primitiva-*
          path: loterias-ai/data/research/meta-pleno-v14-shards
          merge-multiple: true
      - run: node loterias-ai/scripts/audit-gordo-v14-complete-ticket.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/research/gordo-v14-complete-ticket-audit.json /tmp/gordo-v14-complete-ticket-audit.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/gordo-v14-complete-ticket-audit.json loterias-ai/data/research/gordo-v14-complete-ticket-audit.json
          git add loterias-ai/data/research/gordo-v14-complete-ticket-audit.json
          git commit -m 'data(loterias-ai): persist Gordo v14 complete-ticket audit' || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*3)); done
          exit 1
