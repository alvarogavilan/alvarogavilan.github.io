name: Loterias AI Inspect Quinigol Detail
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/inspect-quinigol-detail-structure.mjs'
      - '.github/workflows/loterias-ai-inspect-quinigol-detail.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node loterias-ai/scripts/inspect-quinigol-detail-structure.mjs
      - name: Persist
        shell: bash
        run: |
          cp loterias-ai/data/probes/quinigol-detail-structure.json /tmp/qdetail.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p loterias-ai/data/probes
          cp /tmp/qdetail.json loterias-ai/data/probes/quinigol-detail-structure.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/probes/quinigol-detail-structure.json
          git commit -m 'data(loterias-ai): persist Quinigol detail structure' || exit 0
          git push origin HEAD:main
