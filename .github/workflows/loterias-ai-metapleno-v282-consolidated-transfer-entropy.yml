name: Loterias AI MetaPleno v282 Consolidated Transfer Entropy
on:
  push:
    branches: [research/metapleno-v282-consolidated-transfer-entropy]
    paths:
      - 'loterias-ai/research/metapleno-v282-consolidated-transfer-entropy.mjs'
      - '.github/workflows/loterias-ai-metapleno-v282-consolidated-transfer-entropy.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Run consolidated transfer-entropy batch
        run: node loterias-ai/research/metapleno-v282-consolidated-transfer-entropy.mjs
      - name: Verify fail-closed and budgets
        run: node -e "const x=require('./loterias-ai/data/research/metapleno-v282-consolidated-transfer-entropy.json');if(x.realMoneyPass||x.realStakeEUR!==0||x.games.some(g=>g.budget.theoreticalEUR>4))process.exit(1)"
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/metapleno-v282-consolidated-transfer-entropy.json
          git commit -m 'data(loterias-ai): persist v282 transfer-entropy result' || exit 0
          git push