name: Loterias AI Botemania Headless Jackpots Probe V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/botemania-headless-jackpots-public-probe-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-generic-jackpot-id-map-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-headless-jackpot-param-extractor-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-headless-config-public-probe-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-headless-global-bundle-config-scan-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-cms-component-query-extractor-v1.mjs'
      - 'loterias-ai/casino/archive/evidence/botemania-progressive-network-map-v1.json'
      - '.github/workflows/loterias-ai-botemania-headless-jackpots-probe-v1.yml'
  schedule:
    - cron: '11 */2 * * *'

permissions:
  contents: write

concurrency:
  group: loterias-ai-botemania-headless-jackpots-probe-v1
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read live public jackpot feeds
        run: node loterias-ai/casino/jackpots/botemania-headless-jackpots-public-probe-v1.mjs
      - name: Extract public jackpot parameter contract
        run: node loterias-ai/casino/jackpots/botemania-headless-jackpot-param-extractor-v1.mjs
      - name: Recover Botemania public HeadlessJackpots config
        run: node loterias-ai/casino/jackpots/botemania-headless-config-public-probe-v1.mjs
      - name: Scan all public Botemania bundles for Headless config
        run: node loterias-ai/casino/jackpots/botemania-headless-global-bundle-config-scan-v1.mjs
      - name: Extract public CMS component queries
        run: node loterias-ai/casino/jackpots/botemania-cms-component-query-extractor-v1.mjs
      - name: Map live generic jackpot IDs to public game pages
        run: node loterias-ai/casino/jackpots/botemania-generic-jackpot-id-map-v1.mjs
      - name: Persist evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            loterias-ai/casino/jackpots/evidence/botemania-headless-jackpots-public-probe-v1.json \
            loterias-ai/casino/jackpots/evidence/botemania-headless-jackpot-param-extractor-v1.json \
            loterias-ai/casino/jackpots/evidence/botemania-headless-config-public-probe-v1.json \
            loterias-ai/casino/jackpots/evidence/botemania-headless-global-bundle-config-scan-v1.json \
            loterias-ai/casino/jackpots/evidence/botemania-cms-component-query-extractor-v1.json \
            loterias-ai/casino/jackpots/evidence/botemania-generic-jackpot-id-map-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(casino): refresh Botemania public jackpot config research'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
