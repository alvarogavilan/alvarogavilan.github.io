name: Loterias AI Bonoloto Financial Tournament V3 One Shot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/scripts/bonoloto-financial-tournament-official-v3.mjs'
      - '.github/workflows/loterias-ai-bonoloto-financial-v3-one-shot.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node loterias-ai/scripts/bonoloto-financial-tournament-official-v3.mjs
      - run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add loterias-ai/data/backtests/bonoloto-financial-tournament-official-v3.json
          git diff --cached --quiet && exit 0
          git commit -m 'research(bonoloto): persist SELAE-only financial tournament v3'
          git pull --rebase origin main
          git push origin HEAD:main
