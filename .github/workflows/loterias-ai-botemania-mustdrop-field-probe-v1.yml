name: Loterias AI Botemania MustDrop Field Probe V1

on:
  workflow_dispatch:
  push:
    branches: [main, feat-edge-intrinsic-vp-mustdrop-v31]
    paths:
      - 'loterias-ai/casino/jackpots/botemania-double-jackpots-mustdrop-field-probe-v1.mjs'
      - 'loterias-ai/casino/jackpots/roxor-progressive-vp-lineage-screen-v1.mjs'
      - 'loterias-ai/tests/edge-intrinsic-progressive-vp-v31.test.mjs'
      - '.github/workflows/loterias-ai-botemania-mustdrop-field-probe-v1.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: loterias-ai-botemania-mustdrop-field-probe-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate intrinsic progressive VP math
        run: node loterias-ai/tests/edge-intrinsic-progressive-vp-v31.test.mjs
      - name: Probe known public field safely
        run: node loterias-ai/casino/jackpots/botemania-double-jackpots-mustdrop-field-probe-v1.mjs
      - name: Upload branch probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: botemania-mustdrop-field-probe-v1
          path: loterias-ai/casino/jackpots/evidence/botemania-double-jackpots-mustdrop-field-probe-v1.json
          if-no-files-found: error
      - name: Persist evidence on main only
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/casino/jackpots/evidence/botemania-double-jackpots-mustdrop-field-probe-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(casino): refresh Botemania mustDropWithin field probe'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
