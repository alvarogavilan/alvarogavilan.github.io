name: Loterias AI MetaPleno v153 Add Drop Decomposed
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v153-add-drop-decomposed]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v153-add-drop-decomposed.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v153-add-drop-decomposed.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v153-add-drop-decomposed.mjs
      - name: Persist v153
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v153-add-drop-decomposed.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist v153 decomposed add-drop policy'
          git push
