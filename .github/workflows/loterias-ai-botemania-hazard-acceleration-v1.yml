name: Loterias AI Botemania Hazard Acceleration V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/botemania-jpk-shape-free-bound-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-jpk-reserve-envelope-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-jpk-high-rtp-reconciliation-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-jpk-current-all-games-ev-screen-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-mega-bars-jpk-priority-screen-v1.mjs'
      - '.github/workflows/loterias-ai-botemania-hazard-acceleration-v1.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: loterias-ai-botemania-hazard-acceleration-v1
  cancel-in-progress: true

jobs:
  accelerate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run independent hazard acceleration lanes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            node loterias-ai/casino/jackpots/botemania-jpk-shape-free-bound-v1.mjs
            node loterias-ai/casino/jackpots/botemania-jpk-reserve-envelope-v1.mjs
            node loterias-ai/casino/jackpots/botemania-jpk-high-rtp-reconciliation-v1.mjs
            node loterias-ai/casino/jackpots/botemania-jpk-current-all-games-ev-screen-v1.mjs
            node loterias-ai/casino/jackpots/botemania-mega-bars-jpk-priority-screen-v1.mjs
            git add \
              loterias-ai/casino/jackpots/evidence/botemania-jpk-shape-free-bound-v1.json \
              loterias-ai/casino/jackpots/evidence/botemania-jpk-reserve-envelope-v1.json \
              loterias-ai/casino/jackpots/evidence/botemania-jpk-high-rtp-reconciliation-v1.json \
              loterias-ai/casino/jackpots/evidence/botemania-jpk-current-all-games-ev-screen-v1.json \
              loterias-ai/casino/jackpots/evidence/botemania-mega-bars-jpk-priority-screen-v1.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(casino): refresh Botemania hazard acceleration lanes'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
