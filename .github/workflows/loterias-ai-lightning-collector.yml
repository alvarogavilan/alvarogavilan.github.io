name: Loterias AI Lightning Collector

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Collect latest finalized Lightning rounds
        env:
          TRACKERSINO_API_KEY: ${{ secrets.TRACKERSINO_API_KEY }}
          LIGHTNING_FETCH_LIMIT: 1000
        run: node loterias-ai/casino/lightning/collect-trackersino.mjs
      - name: Persist only if data changed
        run: |
          if [ -n "$(git status --porcelain -- loterias-ai/casino/lightning/data/raw)" ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add loterias-ai/casino/lightning/data/raw
            git commit -m "data(casino): ingest Lightning rounds"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          else
            echo "No new validated Lightning rounds"
          fi
