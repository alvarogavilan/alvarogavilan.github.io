name: Loterias AI MetaPleno v239 Lagged Tensor CP
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v239-lagged-tensor-cp]
    paths:
      - 'loterias-ai/research/metapleno-v239-lagged-tensor-cp.mjs'
      - '.github/workflows/loterias-ai-metapleno-v239-lagged-tensor-cp.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run v239
        run: node loterias-ai/research/metapleno-v239-lagged-tensor-cp.mjs
      - name: Validate fail-closed
        run: node -e "const r=require('./loterias-ai/data/research/metapleno-v239-lagged-tensor-cp.json'); if(r.realMoneyPass!==false||r.realStakeEUR!==0||r.candidatePool.theoreticalCostEUR>15) process.exit(1)"
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/metapleno-v239-lagged-tensor-cp.json
          git diff --cached --quiet || git commit -m 'research(loterias-ai): persist v239 lagged tensor CP result'
          git push