name: Loterias AI MetaPleno v85 Bonoloto Set Kernel Matched Null
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v85-bonoloto-set-kernel-matched-null.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v85-bonoloto-set-kernel-matched-null.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v85-bonoloto-set-kernel-matched-null.mjs
      - name: Persist result safely
        run: |
          cp loterias-ai/data/research/meta-pleno-v85-bonoloto-set-kernel-matched-null.json /tmp/v85.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p loterias-ai/data/research
            cp /tmp/v85.json loterias-ai/data/research/meta-pleno-v85-bonoloto-set-kernel-matched-null.json
            git add loterias-ai/data/research/meta-pleno-v85-bonoloto-set-kernel-matched-null.json
            git diff --cached --quiet && exit 0
            git commit -m 'data(loterias-ai): persist MetaPleno v85 matched-null'
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
