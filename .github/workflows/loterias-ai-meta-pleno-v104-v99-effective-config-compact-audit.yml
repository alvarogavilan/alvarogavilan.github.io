name: Loterias AI MetaPleno v104 v99 Effective Config Compact Audit
on:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v104-v99-effective-config-compact-audit.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v104-v99-effective-config-compact-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node loterias-ai/scripts/meta-pleno-v104-v99-effective-config-compact-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v104-v99-effective-config-compact-audit
          path: loterias-ai/data/research/meta-pleno-v104-v99-effective-config-compact-audit.json
