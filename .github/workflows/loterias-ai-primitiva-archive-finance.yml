name: Loterias AI Primitiva Archive Finance
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/primitiva-financial-from-archive.mjs'
      - '.github/workflows/loterias-ai-primitiva-archive-finance.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node loterias-ai/scripts/primitiva-financial-from-archive.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/backtests/primitiva-archive-economics-status.json /tmp/primitiva-archive-economics-status.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/primitiva-archive-economics-status.json loterias-ai/data/backtests/primitiva-archive-economics-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/backtests/primitiva-archive-economics-status.json
          git commit -m 'data(loterias-ai): verify Primitiva archive economics' || exit 0
          git push origin HEAD:main