name: Loterias AI Standard Roulette Source Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/standard-roulette/probe-public-sources.mjs'
      - '.github/workflows/loterias-ai-standard-roulette-source-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe public standard roulette routes once
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          node loterias-ai/casino/standard-roulette/probe-public-sources.mjs
          git add loterias-ai/casino/standard-roulette/evidence/public-source-probe.json
          git commit -m 'data(roulette): persist one-shot public source probe' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
