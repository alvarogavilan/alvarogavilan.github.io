name: Loterias AI Euromillones Official Financial Tournament
# refreshed after 480-draw SELAE economics backfill
on:
  push:
    paths:
      - 'loterias-ai/scripts/euromillones-official-financial-tournament.mjs'
      - 'loterias-ai/data/archive/euromillones/**'
      - '.github/workflows/loterias-ai-euromillones-official-financial-tournament.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tournament:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node loterias-ai/scripts/euromillones-official-financial-tournament.mjs
      - name: Persist result safely
        run: |
          cp loterias-ai/data/backtests/euromillones-official-financial-tournament.json /tmp/result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/result.json loterias-ai/data/backtests/euromillones-official-financial-tournament.json
            git add loterias-ai/data/backtests/euromillones-official-financial-tournament.json
            git commit -m 'data(loterias-ai): persist Euromillones official financial tournament' || exit 0
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
