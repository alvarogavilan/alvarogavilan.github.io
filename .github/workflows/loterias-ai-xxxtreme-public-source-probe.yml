name: Loterias AI XXXtreme Public Source Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/xxxtreme/probe-public-source.mjs'
      - '.github/workflows/loterias-ai-xxxtreme-public-source-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe public candidates only
        run: node loterias-ai/casino/xxxtreme/probe-public-source.mjs
      - name: Persist discovery result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/casino/xxxtreme/public-source-probe.json
          git commit -m 'data(xxxtreme): persist public source probe' || exit 0
          git push
