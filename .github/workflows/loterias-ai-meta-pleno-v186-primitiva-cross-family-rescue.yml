name: Loterias AI MetaPleno v186 Primitiva Cross Family Rescue
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v186-primitiva-cross-family-rescue]
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run v186 self-contained cross-family audit
        run: node loterias-ai/scripts/meta-pleno-v186-primitiva-cross-family-rescue.mjs
      - name: Persist v186 safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v186-primitiva-cross-family-rescue.json
          if ! git diff --cached --quiet; then
            git commit -m "research(loterias-ai): persist v186 Primitiva cross-family rescue"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
