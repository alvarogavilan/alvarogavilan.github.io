name: Loterias AI Bonoloto Merge Official Payouts One Shot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/scripts/merge-bonoloto-official-payout-certification-v1.mjs'
      - '.github/workflows/loterias-ai-bonoloto-merge-official-payouts-one-shot.yml'
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node loterias-ai/scripts/merge-bonoloto-official-payout-certification-v1.mjs
      - run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add loterias-ai/data/archive/bonoloto
          git diff --cached --quiet && exit 0
          git commit -m 'data(bonoloto): merge certified SELAE payouts into archive'
          git pull --rebase origin main
          git push origin HEAD:main
