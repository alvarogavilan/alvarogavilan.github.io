name: Loterias AI Botemania Lazy Chunk Feed Probe V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/botemania-jpk-lazy-chunk-feed-probe-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-jpk-lazy-chunk-feed-summary-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-get-winners-query-extractor-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-get-winners-public-probe-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-get-winners-venture-probe-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-double-jackpots-query-extractor-v1.mjs'
      - '.github/workflows/loterias-ai-botemania-lazy-chunk-feed-probe-v1.yml'
  schedule:
    - cron: '11 */3 * * *'

permissions:
  contents: write

concurrency:
  group: loterias-ai-botemania-lazy-chunk-feed-probe-v1
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe public Winners and Jackpot feeds
        run: |
          node loterias-ai/casino/jackpots/botemania-jpk-lazy-chunk-feed-probe-v1.mjs
          node loterias-ai/casino/jackpots/botemania-jpk-lazy-chunk-feed-summary-v1.mjs
          node loterias-ai/casino/jackpots/botemania-get-winners-query-extractor-v1.mjs
          node loterias-ai/casino/jackpots/botemania-get-winners-public-probe-v1.mjs
          node loterias-ai/casino/jackpots/botemania-get-winners-venture-probe-v1.mjs
          node loterias-ai/casino/jackpots/botemania-double-jackpots-query-extractor-v1.mjs
      - name: Persist evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            loterias-ai/casino/jackpots/evidence/botemania-jpk-lazy-chunk-feed-probe-v1.json \
            loterias-ai/casino/jackpots/evidence/botemania-jpk-lazy-chunk-feed-summary-v1.json \
            loterias-ai/casino/jackpots/evidence/botemania-get-winners-query-extractor-v1.json \
            loterias-ai/casino/jackpots/evidence/botemania-get-winners-public-probe-v1.json \
            loterias-ai/casino/jackpots/evidence/botemania-get-winners-venture-probe-v1.json \
            loterias-ai/casino/jackpots/evidence/botemania-double-jackpots-query-extractor-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(casino): refresh Botemania lazy-chunk feed evidence'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
