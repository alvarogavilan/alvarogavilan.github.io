name: Loterias AI MetaPleno v136 Global Evidence Registry
on:
  push:
    branches:
      - research/metapleno-v136-global-registry-refresh
    paths:
      - 'loterias-ai/scripts/meta-pleno-v136-global-evidence-registry.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v136-global-evidence-registry.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node loterias-ai/scripts/meta-pleno-v136-global-evidence-registry.mjs
      - name: Persist registry
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v136-global-evidence-registry.json
          git diff --cached --quiet || git commit -m "data(loterias-ai): persist v136 global evidence registry"
          git push
