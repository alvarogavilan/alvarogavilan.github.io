name: loterias-ai meta-pleno v225 hypergraph motifs
on:
  push:
    branches:
      - research/metapleno-v225-hypergraph-motifs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/metapleno-v225-hypergraph-motifs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run v225
        run: node loterias-ai/scripts/meta-pleno-v225-bonoloto-hypergraph-motifs.mjs
      - name: Persist result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/research/meta-pleno-v225-bonoloto-hypergraph-motifs.json
          git diff --cached --quiet || git commit -m 'research(loterias-ai): persist v225 hypergraph motif result'
          git push
