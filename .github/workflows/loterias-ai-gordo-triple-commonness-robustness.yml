name: Loterias AI Gordo Triple Commonness Robustness
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/gordo-triple-commonness-robustness.mjs'
      - '.github/workflows/loterias-ai-gordo-triple-commonness-robustness.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node loterias-ai/scripts/gordo-triple-commonness-robustness.mjs
      - name: Persist evidence safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/gordo-triple-commonness-robustness.json
          git diff --cached --quiet && exit 0
          git commit -m 'data(loterias-ai): persist Gordo triple-commonness robustness'
          git fetch origin main
          git rebase origin/main || { git rebase --abort; git pull --rebase origin main; }
          git push origin HEAD:main
