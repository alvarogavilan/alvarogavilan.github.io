# Cost-control policy: clean authoritative segment v2 owns scheduled continuity.
# This watchdog no longer runs on a timer or on every captured data commit.
name: Loterias AI Lightning Source Staleness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/lightning/research/source-staleness-watchdog.mjs'
      - 'loterias-ai/casino/lightning/research/probe-casinoorg-source-head.mjs'
      - '.github/workflows/loterias-ai-lightning-source-staleness.yml'

permissions:
  contents: write

concurrency:
  group: loterias-ai-lightning-source-staleness
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run diagnostic-only source check
        shell: bash
        run: |
          set -euo pipefail
          node loterias-ai/casino/lightning/research/probe-casinoorg-source-head.mjs
          node loterias-ai/casino/lightning/research/source-staleness-watchdog.mjs
          node -e "const fs=require('fs');const w=JSON.parse(fs.readFileSync('loterias-ai/casino/lightning/evidence/source-staleness-watchdog.json','utf8'));if(w.policy?.aggregateObserverMayReplaceRoundCorpus!==false||w.policy?.automaticSourcePromotion!==false||w.guards?.trainingDataMutation!==false||w.guards?.prospectiveOutcomeMutation!==false||w.guards?.realMoneyAllowed!==false)throw Error('watchdog safety drift')"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/casino/lightning/evidence/source-staleness-watchdog.json loterias-ai/casino/lightning/evidence/casinoorg-source-head-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ops(lightning): refresh manual source diagnostic'
          git push origin HEAD:main
