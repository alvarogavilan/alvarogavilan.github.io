name: Loterias AI Lightning Source Staleness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/lightning/evidence/casinoorg-api-collector.json'
      - 'loterias-ai/casino/lightning/evidence/casinoorg-source-head-probe.json'
      - 'loterias-ai/casino/lightning/evidence/public-observer.json'
      - 'loterias-ai/casino/lightning/data/casinoorg-lightningroulette.jsonl'
      - 'loterias-ai/casino/lightning/research/source-staleness-watchdog.mjs'
      - '.github/workflows/loterias-ai-lightning-source-staleness.yml'
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
concurrency:
  group: loterias-ai-lightning-source-staleness
  cancel-in-progress: false
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Evaluate independent source freshness
        run: node loterias-ai/casino/lightning/research/source-staleness-watchdog.mjs
      - name: Verify scientific isolation
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='loterias-ai/casino/lightning/evidence/source-staleness-watchdog.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          if(j.policy?.aggregateObserverMayReplaceRoundCorpus!==false) throw new Error('aggregate observer promotion regression');
          if(j.policy?.automaticSourcePromotion!==false) throw new Error('automatic source promotion regression');
          if(j.policy?.requiresRoundLevelLuckyMultiplierData!==true) throw new Error('round-level multiplier requirement drift');
          if(j.guards?.trainingDataMutation!==false||j.guards?.prospectiveOutcomeMutation!==false) throw new Error('watchdog mutated scientific data');
          if(j.guards?.realMoneyAllowed!==false) throw new Error('real-money safety regression');
          NODE
      - name: Persist semantic state only when changed
        shell: bash
        run: |
          set -euo pipefail
          TARGET='loterias-ai/casino/lightning/evidence/source-staleness-watchdog.json'
          if [ -z "$(git status --porcelain -- "$TARGET")" ]; then
            echo 'Watchdog semantic state unchanged.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$TARGET"
          git commit -m 'ops(lightning): persist source staleness state'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; sleep $((attempt*2)); continue; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
