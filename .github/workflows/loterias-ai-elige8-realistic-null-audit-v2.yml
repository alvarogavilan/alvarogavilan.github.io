name: Loterias AI Elige8 Realistic Null Audit V2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/scripts/elige8-realistic-null-audit-v2.mjs'
      - '.github/workflows/loterias-ai-elige8-realistic-null-audit-v2.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-elige8-realistic-null-audit-v2
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Run realistic Elige8 null audit
        run: node loterias-ai/scripts/elige8-realistic-null-audit-v2.mjs
      - name: Persist realistic null audit
        shell: bash
        run: |
          set -euo pipefail
          cp loterias-ai/data/research/elige8-realistic-null-audit-v2.json /tmp/audit.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/audit.json loterias-ai/data/research/elige8-realistic-null-audit-v2.json
            git add loterias-ai/data/research/elige8-realistic-null-audit-v2.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(elige8): persist realistic outcome null audit v2'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
