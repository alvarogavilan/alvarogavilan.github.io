name: Loterias AI Lightning TrackerSino Backfill v1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/lightning/research/trackersino-historical-backfill-v1.mjs'
      - '.github/workflows/loterias-ai-lightning-trackersino-backfill-v1.yml'
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Backfill documented TrackerSino history
        env:
          TRACKERSINO_API_KEY: ${{ secrets.TRACKERSINO_API_KEY }}
          TRACKERSINO_MAX_PAGES: '20'
        run: node loterias-ai/casino/lightning/research/trackersino-historical-backfill-v1.mjs
      - name: Persist evidence and data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/casino/lightning/data/trackersino-lightningroulette.jsonl loterias-ai/casino/lightning/evidence/trackersino-backfill-checkpoint-v1.json loterias-ai/casino/lightning/evidence/trackersino-backfill-report-v1.json 2>/dev/null || true
          git commit -m 'research(casino): persist TrackerSino Lightning historical backfill' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
