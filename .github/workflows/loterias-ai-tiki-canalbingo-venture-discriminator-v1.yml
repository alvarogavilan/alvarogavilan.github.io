name: Loterias AI Tiki CanalBingo Venture Discriminator V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'loterias-ai/casino/jackpots/tiki-canalbingo-venture-discriminator-v1.mjs'
      - 'loterias-ai/tests/tiki-canalbingo-venture-discriminator-v1.test.mjs'
      - '.github/workflows/loterias-ai-tiki-canalbingo-venture-discriminator-v1.yml'
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/tiki-canalbingo-venture-discriminator-v1.mjs'
      - '.github/workflows/loterias-ai-tiki-canalbingo-venture-discriminator-v1.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deterministic guards
        run: node loterias-ai/tests/tiki-canalbingo-venture-discriminator-v1.test.mjs
      - name: Probe bounded public venture aliases
        run: node loterias-ai/casino/jackpots/tiki-canalbingo-venture-discriminator-v1.mjs
      - name: Verify no identity or economic promotion
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='loterias-ai/casino/jackpots/evidence/tiki-canalbingo-venture-discriminator-v1.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          if(x?.decision?.exactGameBindingRecovered!==false) throw new Error('game binding overclaim');
          if(x?.decision?.identityPromotionAllowed!==false) throw new Error('identity promotion opened');
          if(x?.decision?.economicPromotionAllowed!==false||x?.decision?.realMoneyAllowed!==false) throw new Error('economic gate opened');
          if(x?.guards?.http200NeverEqualsVentureRecognition!==true||x?.guards?.globalFeedNeverEqualsGameBinding!==true) throw new Error('required fail-closed guard missing');
          console.log(JSON.stringify({decision:x.decision,interpretation:x.interpretation,attempts:x.attempts,comparisons:x.comparisons},null,2));
          NODE
      - name: Persist evidence on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          P=loterias-ai/casino/jackpots/evidence/tiki-canalbingo-venture-discriminator-v1.json
          cp "$P" /tmp/tiki-canalbingo-venture-discriminator-v1.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$(dirname "$P")"
            cp /tmp/tiki-canalbingo-venture-discriminator-v1.json "$P"
            git add "$P"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(casino): persist Canal Bingo venture discrimination'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
