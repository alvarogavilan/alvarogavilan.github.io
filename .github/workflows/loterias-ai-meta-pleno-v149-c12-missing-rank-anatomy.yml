name: Loterias AI MetaPleno v149 C12 Near-Pleno Anatomy
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v149-c12-missing-rank-anatomy]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v149-c12-missing-rank-anatomy.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v149-c12-missing-rank-anatomy.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v149-c12-missing-rank-anatomy.mjs
      - name: Persist v149
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v149-c12-missing-rank-anatomy.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist v149 c12 anatomy'
          git push
