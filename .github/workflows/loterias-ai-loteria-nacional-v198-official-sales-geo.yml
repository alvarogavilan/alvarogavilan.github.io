name: Loterias AI Loteria Nacional v198 Official Sales Geo
on:
  workflow_dispatch:
  push:
    branches: [research/loteria-nacional-v198-official-sales-geo]
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/loteria-nacional-v198-official-sales-geo.mjs
      - name: Persist v198
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/loteria-nacional-v198-official-sales-geo.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(loterias-ai): persist v198 official sales geography'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
