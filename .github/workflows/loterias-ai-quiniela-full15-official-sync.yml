name: Loterias AI Quiniela Full15 Official Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: write
concurrency:
  group: loterias-ai-quiniela-full15-official-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Sync official upcoming jornada and freeze Full15 if possible
        run: node loterias-ai/scripts/quiniela-prospective-full15-official-sync.mjs
      - name: Persist official evidence safely
        run: |
          mkdir -p /tmp/loterias-full15/loterias-ai/data/official /tmp/loterias-full15/loterias-ai/data/shadow
          cp -f loterias-ai/data/official/quiniela-upcoming-sync.json /tmp/loterias-full15/loterias-ai/data/official/ || true
          cp -f loterias-ai/data/official/quiniela-upcoming.json /tmp/loterias-full15/loterias-ai/data/official/ || true
          cp -f loterias-ai/data/shadow/quiniela-meta-pleno-ledger.json /tmp/loterias-full15/loterias-ai/data/shadow/ || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p loterias-ai/data/official loterias-ai/data/shadow
            cp -f /tmp/loterias-full15/loterias-ai/data/official/* loterias-ai/data/official/ 2>/dev/null || true
            cp -f /tmp/loterias-full15/loterias-ai/data/shadow/* loterias-ai/data/shadow/ 2>/dev/null || true
            git add loterias-ai/data/official loterias-ai/data/shadow/quiniela-meta-pleno-ledger.json
            git commit -m 'data(loterias-ai): sync official Quiniela prospective Full15' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
