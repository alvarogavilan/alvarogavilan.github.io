name: Loterias AI MetaPleno v150 All Position Structural Rescue
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v150-all-position-structural-rescue]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v150-all-position-structural-rescue.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v150-all-position-structural-rescue.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v150-all-position-structural-rescue.mjs
      - name: Persist v150
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v150-bonoloto-all-position-structural-rescue.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist v150 all-position structural rescue'
          git push
