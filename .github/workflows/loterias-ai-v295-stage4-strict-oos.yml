name: Loterias AI v295 Stage4 Strict Blind OOS
on:
  push:
    branches:
      - research/metapleno-v295-mdl-ctw
    paths:
      - 'loterias-ai/research/megalab/v295-stage4-strict-oos.mjs'
      - '.github/workflows/loterias-ai-v295-stage4-strict-oos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/metapleno-v295-mdl-ctw
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run strict blind OOS
        run: node loterias-ai/research/megalab/v295-stage4-strict-oos.mjs
      - name: Verify lineage and gates
        run: |
          node - <<'NODE'
          const f=require('./loterias-ai/data/research/metapleno-v295-stage3-freeze.json');
          const j=require('./loterias-ai/data/research/metapleno-v295-stage4-strict-oos.json');
          if(j.manifestHash!==f.manifestHash)process.exit(1);
          if(j.realMoneyPass!==false||j.realStakeEUR!==0||j.theoreticalBudgetMaxEUR>15)process.exit(1);
          if(j.postFreezeTouched||j.retuningPerformed)process.exit(1);
          console.log({decision:j.decision,near:j.oosNearFullEventsTotal,full:j.oosFullMainEventsTotal,realMoneyPass:j.realMoneyPass});
          NODE
      - name: Persist OOS evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/research/metapleno-v295-stage4-strict-oos.json
          git diff --cached --quiet && exit 0
          git commit -m 'data(loterias-ai): persist v295 strict blind OOS'
          git push origin HEAD:research/metapleno-v295-mdl-ctw