name: Loterias AI MetaPleno v171 v162 Native Ticket Ranker
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v170-v162-ticket-compression]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v171-v162-native-ticket-ranker.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v171-v162-native-ticket-ranker.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v171-v162-native-ticket-ranker.mjs
      - name: Persist v171
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v171-v162-native-ticket-ranker.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist v171 native ticket ranker'
          git push
