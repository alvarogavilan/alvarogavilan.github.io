name: Loterias AI v295 Stage1-2 Fast Screen
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: loterias-ai-v295-fast-${{ github.ref }}
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run equivalent optimized v295 screen
        run: node loterias-ai/research/megalab/v295-stage1-2-mdl-screen-fast.mjs
      - name: Verify OOS isolation and money gates
        run: node -e "const x=require('./loterias-ai/data/research/metapleno-v295-stage1-2-selection.json');if(x.validationTouched||x.postFreezeTouched||x.retuningPerformed||x.realMoneyPass||x.realStakeEUR!==0||x.theoreticalBudgetMaxEUR>15)process.exit(1)"
      - name: Persist v295 selection evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/metapleno-v295-stage1-2-selection.json
          git commit -m 'data(loterias-ai): persist v295 MDL stage1-2 fast' || exit 0
          git pull --rebase origin research/metapleno-v295-mdl-ctw
          git push