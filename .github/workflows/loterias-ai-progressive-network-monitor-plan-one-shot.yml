name: Loterias AI Progressive Network Monitor Plan One Shot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/playuzu/build-progressive-network-monitor-plan-v1.mjs'
      - '.github/workflows/loterias-ai-progressive-network-monitor-plan-one-shot.yml'
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node loterias-ai/casino/playuzu/build-progressive-network-monitor-plan-v1.mjs
      - name: Persist minimum-page plan
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/casino/playuzu/evidence/progressive-network-monitor-plan-v1.json
          git diff --cached --quiet && exit 0
          git commit -m 'research(jackpots): persist minimum-page progressive monitor plan'
          git pull --rebase origin main
          git push origin HEAD:main
