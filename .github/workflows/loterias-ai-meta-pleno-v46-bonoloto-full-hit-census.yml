name: Loterias AI MetaPleno v46 Bonoloto Full Hit Census
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v46-bonoloto-full-hit-census.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v46-bonoloto-full-hit-census.yml'
permissions:
  contents: write
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Audit all known Bonoloto full-hit candidate families
        run: node loterias-ai/scripts/meta-pleno-v46-bonoloto-full-hit-census.mjs
      - name: Persist census safely
        run: |
          cp loterias-ai/data/research/meta-pleno-v46-bonoloto-full-hit-census.json /tmp/v46.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v46.json loterias-ai/data/research/meta-pleno-v46-bonoloto-full-hit-census.json
            git add loterias-ai/data/research/meta-pleno-v46-bonoloto-full-hit-census.json
            git commit -m 'data(loterias-ai): persist MetaPleno v46 Bonoloto full-hit census' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
