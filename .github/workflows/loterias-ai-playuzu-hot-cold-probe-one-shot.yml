name: Loterias AI PlayUZU Hot Cold Probe One Shot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/playuzu/probe-hot-or-cold-state-v1.mjs'
      - '.github/workflows/loterias-ai-playuzu-hot-cold-probe-one-shot.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node loterias-ai/casino/playuzu/probe-hot-or-cold-state-v1.mjs
      - run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add loterias-ai/casino/playuzu/evidence/hot-or-cold-state-probe-v1.json
          git diff --cached --quiet && exit 0
          git commit -m 'data(playuzu): persist official Hot or Cold state probe'
          git pull --rebase origin main
          git push origin HEAD:main
