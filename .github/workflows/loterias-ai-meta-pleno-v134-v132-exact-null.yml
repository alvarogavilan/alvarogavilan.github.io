name: Loterias AI MetaPleno v134 V132 Exact Null
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v134-v132-correlated-null]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v134-v132-exact-null.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v134-v132-exact-null.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node loterias-ai/scripts/meta-pleno-v134-v132-exact-null.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v134-v132-exact-null.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist v134 v132 exact null'
          git push
