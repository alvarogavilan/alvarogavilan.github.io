name: Loterias AI MetaPleno v6 Complete Ticket
on:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v6-complete-ticket.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v6-complete-ticket.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: loterias-ai-meta-pleno-v6-complete-ticket
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Run complete-ticket auxiliary audit
        run: node loterias-ai/scripts/meta-pleno-v6-complete-ticket.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/research/meta-pleno-v6-complete-ticket.json /tmp/v6.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v6.json loterias-ai/data/research/meta-pleno-v6-complete-ticket.json
            git add loterias-ai/data/research/meta-pleno-v6-complete-ticket.json
            git commit -m 'data(loterias-ai): persist MetaPleno v6 complete-ticket audit' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
