name: Loterias AI MetaPleno v33 Forward Set Capture

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Loterias AI MetaPleno v15 Set Capture']
    types: [completed]
  push:
    paths:
      - '.github/workflows/loterias-ai-meta-pleno-v33-forward-set-capture.yml'
      - 'loterias-ai/scripts/meta-pleno-v33-forward-set-capture.mjs'

permissions:
  contents: write

concurrency:
  group: loterias-ai-metapleno-v33
  cancel-in-progress: true

jobs:
  evaluate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run forward set-capture split
        run: node loterias-ai/scripts/meta-pleno-v33-forward-set-capture.mjs
      - name: Persist safely
        shell: bash
        run: |
          cp loterias-ai/data/research/meta-pleno-v33-forward-set-capture.json /tmp/v33.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v33.json loterias-ai/data/research/meta-pleno-v33-forward-set-capture.json
            git add loterias-ai/data/research/meta-pleno-v33-forward-set-capture.json
            git commit -m 'data(loterias-ai): persist MetaPleno v33 forward set-capture' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
