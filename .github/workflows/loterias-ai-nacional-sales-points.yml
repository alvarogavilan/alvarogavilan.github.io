name: Loterias AI Nacional Sales Points
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/enrich-nacional-prize-sales-points.mjs'
      - '.github/workflows/loterias-ai-nacional-sales-points.yml'
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Expand official sales-point evidence through 2026
        env:
          YEAR: 2026
          LIMIT: 100
        run: node loterias-ai/scripts/enrich-nacional-prize-sales-points.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/archive/_meta/loteria-nacional-sales-points-2026.json /tmp/nacional-sales.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/nacional-sales.json loterias-ai/data/archive/_meta/loteria-nacional-sales-points-2026.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/archive/_meta/loteria-nacional-sales-points-2026.json
          git commit -m 'data(loterias-ai): expand Nacional prize sales points' || exit 0
          git push origin HEAD:main
