name: Loterias AI MetaPleno v193 Primitiva Contextual Completion
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v193-primitiva-contextual-completion]
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node loterias-ai/scripts/meta-pleno-v193-primitiva-contextual-completion.mjs
      - name: Persist v193
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v193-primitiva-contextual-completion.json
          if ! git diff --cached --quiet; then
            git commit -m "research(loterias-ai): persist v193 contextual completion"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
