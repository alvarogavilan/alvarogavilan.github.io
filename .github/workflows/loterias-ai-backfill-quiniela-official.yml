name: Loterias AI Backfill Quiniela Official
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/backfill-quiniela-official-year.mjs'
      - '.github/workflows/loterias-ai-backfill-quiniela-official.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-backfill-quiniela-official
  cancel-in-progress: false
jobs:
  year:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2018,2019,2020,2021,2022,2023,2024,2025,2026]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Backfill official Quiniela year
        env:
          YEAR: ${{ matrix.year }}
        run: node loterias-ai/scripts/backfill-quiniela-official-year.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: quiniela-official-${{ matrix.year }}
          path: |
            loterias-ai/data/archive/quiniela/${{ matrix.year }}.json
            loterias-ai/data/archive/_meta/quiniela-backfill-${{ matrix.year }}.json
  persist:
    needs: year
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: quiniela-official-*
          path: /tmp/quiniela-official
      - name: Collect and persist safely
        run: |
          mkdir -p /tmp/final/quiniela /tmp/final/meta
          find /tmp/quiniela-official -path '*/quiniela/*.json' -exec cp {} /tmp/final/quiniela/ \;
          find /tmp/quiniela-official -path '*/_meta/*.json' -exec cp {} /tmp/final/meta/ \;
          test "$(find /tmp/final/quiniela -name '*.json' | wc -l)" -eq 9
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p loterias-ai/data/archive/quiniela loterias-ai/data/archive/_meta
            cp /tmp/final/quiniela/*.json loterias-ai/data/archive/quiniela/
            cp /tmp/final/meta/*.json loterias-ai/data/archive/_meta/
            git add loterias-ai/data/archive/quiniela loterias-ai/data/archive/_meta/quiniela-backfill-*.json
            git commit -m 'data(loterias-ai): backfill Quiniela 2018-2026 from SELAE' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
