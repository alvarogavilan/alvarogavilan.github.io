name: Loterias AI MetaPleno v98 Bonoloto Set Transport Cached Budget8
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v98-bonoloto-set-transport-cached-budget8.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v98-bonoloto-set-transport-cached-budget8.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v98-bonoloto-set-transport-cached-budget8.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v98-bonoloto-set-transport-cached-budget8
          path: loterias-ai/data/research/meta-pleno-v98-bonoloto-set-transport-cached-budget8.json
