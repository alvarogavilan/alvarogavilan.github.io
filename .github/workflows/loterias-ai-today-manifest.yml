name: Loterias AI Today Manifest
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main, fix/loterias-hoy-live-dedupe, fix/loterias-hoy-euromillones-5plus2, fix/loterias-hoy-bonoloto-pool8-cost]
    paths:
      - 'loterias-ai/data/shadow/**'
      - 'loterias-ai/data/prospective/**'
      - 'loterias-ai/scripts/build-today-manifest.mjs'
      - '.github/workflows/loterias-ai-today-manifest.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Euromillones complete ticket fixture
        run: |
          TODAY_OVERRIDE=2026-08-18 node loterias-ai/scripts/build-today-manifest.mjs
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('loterias-ai/data/ui/today-manifest.json','utf8'));
          const g=d.games.find(x=>x.gameId==='euromillones');
          if(!g) throw new Error('Missing Euromillones in 2026-08-18 fixture');
          const entries=[g.primary,...(g.alternatives||[])];
          const v199=entries.find(x=>String(x.version).toLowerCase()==='v199');
          if(!v199) throw new Error('Missing v199 Euromillones entry');
          const line=v199.lines?.[0];
          if(!line?.copy?.includes('Estrellas 2 5')) throw new Error('Stars missing from copy payload: '+JSON.stringify(line));
          if(!line?.display?.includes('⭐ 2 · 5')) throw new Error('Stars missing from display payload: '+JSON.stringify(line));
          if(v199.unitCostEUR!==2.5) throw new Error('Unexpected Euromillones unit cost: '+v199.unitCostEUR);
          console.log(JSON.stringify({copy:line.copy,display:line.display,unitCostEUR:v199.unitCostEUR}));
          NODE
      - name: Validate Bonoloto pool8 inferred cost fixture
        run: |
          TODAY_OVERRIDE=2026-08-16 node loterias-ai/scripts/build-today-manifest.mjs
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('loterias-ai/data/ui/today-manifest.json','utf8'));
          const g=d.games.find(x=>x.gameId==='bonoloto');
          if(!g) throw new Error('Missing Bonoloto fixture');
          const entries=[g.primary,...(g.alternatives||[])];
          const poolOnly=entries.filter(x=>x.pool?.length===8&&x.lines?.length===0);
          if(!poolOnly.length) throw new Error('No pool-only Budget8 entries found');
          for(const e of poolOnly){if(e.theoreticalCostEUR!==14||e.unitCostEUR!==.5)throw new Error('Bad Budget8 cost '+JSON.stringify({v:e.version,c:e.theoreticalCostEUR,u:e.unitCostEUR}))}
          console.log(JSON.stringify(poolOnly.map(x=>({version:x.version,cost:x.theoreticalCostEUR,unit:x.unitCostEUR}))));
          NODE
      - name: Build Madrid-local Today manifest
        run: node loterias-ai/scripts/build-today-manifest.mjs
      - name: Validate strict Today invariants
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='loterias-ai/data/ui/today-manifest.json';
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          if(!d.strictToday||d.staleFallbackAllowed) throw new Error('Today stale policy regression');
          const seen=new Set();
          for(const g of d.games){
            if(g.targetDate!==d.today) throw new Error('Non-today game leaked: '+g.gameId);
            if(seen.has(g.gameId)) throw new Error('Duplicate visible game: '+g.gameId);
            seen.add(g.gameId);
            if(g.primary.targetDate!==d.today) throw new Error('Stale primary: '+g.gameId);
            if(g.primary.realMoneyPass) throw new Error('Unexpected real-money pass in Today');
          }
          console.log(JSON.stringify({today:d.today,games:[...seen]}));
          NODE
      - name: Persist manifest
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/ui/today-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "data(loterias-ai): refresh Today manifest"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi