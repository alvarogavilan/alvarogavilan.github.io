name: Loterias AI MetaPleno Current Highlights
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-current-highlights.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-current-highlights.yml'
permissions:
  contents: write
jobs:
  highlights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-current-highlights.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/research/meta-pleno-current-highlights.json /tmp/highlights.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/highlights.json loterias-ai/data/research/meta-pleno-current-highlights.json
            git add loterias-ai/data/research/meta-pleno-current-highlights.json
            git commit -m 'data(loterias-ai): persist compact MetaPleno highlights' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
