name: Loterias AI Gordo Triple Commonness Significance
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/gordo-triple-commonness-significance.mjs'
      - '.github/workflows/loterias-ai-gordo-triple-commonness-significance.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-gordo-triple-commonness-significance
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node loterias-ai/scripts/gordo-triple-commonness-significance.mjs
      - name: Persist evidence safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/gordo-triple-commonness-significance.json
          git diff --cached --quiet && exit 0
          git commit -m 'data(loterias-ai): persist Gordo triple commonness significance'
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*3)); done
          exit 1
