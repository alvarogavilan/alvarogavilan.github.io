name: Loterias AI Gordo Frozen Common Triple Portfolio
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/gordo-frozen-common-triple-portfolio.mjs'
      - '.github/workflows/loterias-ai-gordo-frozen-common-triple-portfolio.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node loterias-ai/scripts/gordo-frozen-common-triple-portfolio.mjs
      - name: Persist evidence safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/gordo-frozen-common-triple-portfolio.json
          git diff --cached --quiet && exit 0
          git commit -m 'data(loterias-ai): persist frozen Gordo common-triple portfolio'
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((i*3))
          done
          exit 1
