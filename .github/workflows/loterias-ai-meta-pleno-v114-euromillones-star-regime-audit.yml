name: Loterias AI MetaPleno v114 Euromillones Star Regime Audit
on:
  push:
    branches:
      - research/metapleno-v114-euromillones-star-regimes
    paths:
      - 'loterias-ai/scripts/meta-pleno-v114-euromillones-star-regime-audit.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v114-euromillones-star-regime-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node loterias-ai/scripts/meta-pleno-v114-euromillones-star-regime-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v114-euromillones-star-regime-audit
          path: loterias-ai/data/research/meta-pleno-v114-euromillones-star-regime-audit.json
