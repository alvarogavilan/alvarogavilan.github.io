name: Loterias AI Botemania Roxor Launch Producer V3

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'loterias-ai/casino/jackpots/botemania-roxor-launch-producer-probe-v3.mjs'
      - '.github/workflows/loterias-ai-botemania-roxor-launch-producer-v3.yml'

permissions:
  contents: read

concurrency:
  group: loterias-ai-roxor-launch-producer-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: node --check loterias-ai/casino/jackpots/botemania-roxor-launch-producer-probe-v3.mjs
      - name: Detector self-test
        run: node loterias-ai/casino/jackpots/botemania-roxor-launch-producer-probe-v3.mjs --self-test
      - name: Trace public player-game launch producer
        run: node loterias-ai/casino/jackpots/botemania-roxor-launch-producer-probe-v3.mjs
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: botemania-roxor-launch-producer-v3
          path: loterias-ai/casino/jackpots/evidence/botemania-roxor-launch-producer-probe-v3.json
          if-no-files-found: error
          retention-days: 7
