name: Loterias AI Primitiva Financial Tournament
on:
  push:
    paths:
      - 'loterias-ai/scripts/primitiva-financial-tournament.mjs'
      - '.github/workflows/loterias-ai-primitiva-financial-tournament.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tournament:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node loterias-ai/scripts/primitiva-financial-tournament.mjs
      - name: Persist result safely
        run: |
          cp loterias-ai/data/backtests/primitiva-financial-tournament.json /tmp/primitiva-financial-tournament.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/primitiva-financial-tournament.json loterias-ai/data/backtests/primitiva-financial-tournament.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/backtests/primitiva-financial-tournament.json
          git commit -m 'data(loterias-ai): refresh Primitiva financial tournament' || exit 0
          git push origin HEAD:main