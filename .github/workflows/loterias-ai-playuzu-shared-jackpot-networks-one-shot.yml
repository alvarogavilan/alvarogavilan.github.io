name: Loterias AI PlayUZU Shared Jackpot Networks One Shot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/playuzu/discover-shared-jackpot-networks-v1.mjs'
      - '.github/workflows/loterias-ai-playuzu-shared-jackpot-networks-one-shot.yml'
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node loterias-ai/casino/playuzu/discover-shared-jackpot-networks-v1.mjs
      - name: Persist discovery evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/casino/playuzu/evidence/shared-jackpot-networks-v1.json
          git diff --cached --quiet && exit 0
          git commit -m 'research(playuzu): persist shared jackpot network discovery'
          git pull --rebase origin main
          git push origin HEAD:main
