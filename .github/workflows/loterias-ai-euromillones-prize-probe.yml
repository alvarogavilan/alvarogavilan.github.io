name: Loterias AI Euromillones Prize Probe
on:
  push:
    paths:
      - 'loterias-ai/scripts/probe-euromillones-prize-source.mjs'
      - '.github/workflows/loterias-ai-euromillones-prize-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node loterias-ai/scripts/probe-euromillones-prize-source.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/probes/euromillones-prize-source.json /tmp/euromillones-prize-source.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/euromillones-prize-source.json loterias-ai/data/probes/euromillones-prize-source.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/probes/euromillones-prize-source.json
          git commit -m 'data(loterias-ai): refresh Euromillones prize probe' || exit 0
          git push origin HEAD:main