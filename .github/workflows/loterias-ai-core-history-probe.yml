name: Loterias AI Core History Probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/probe-core-history-csv.mjs'
      - '.github/workflows/loterias-ai-core-history-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe full-history sources
        run: node loterias-ai/scripts/probe-core-history-csv.mjs
      - name: Persist probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/probes/core-history-csv.json
          git commit -m 'data(loterias-ai): refresh core history CSV probe' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main