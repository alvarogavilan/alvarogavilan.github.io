name: Loterias AI MetaPleno v106 Bonoloto Kalman Order Budget8
on:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v106-bonoloto-kalman-order-budget8.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v106-bonoloto-kalman-order-budget8.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node loterias-ai/scripts/meta-pleno-v106-bonoloto-kalman-order-budget8.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v106-bonoloto-kalman-order-budget8
          path: loterias-ai/data/research/meta-pleno-v106-bonoloto-kalman-order-budget8.json
