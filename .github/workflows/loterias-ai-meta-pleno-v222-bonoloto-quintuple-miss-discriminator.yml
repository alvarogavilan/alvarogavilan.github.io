name: loterias-ai meta-pleno v222 quintuple miss discriminator
on:
  push:
    branches: [research/metapleno-v222-quintuple-miss-discriminator]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v222-bonoloto-quintuple-miss-discriminator.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v222-bonoloto-quintuple-miss-discriminator.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/metapleno-v222-quintuple-miss-discriminator
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run v222
        run: node loterias-ai/scripts/meta-pleno-v222-bonoloto-quintuple-miss-discriminator.mjs
      - name: Persist result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/research/meta-pleno-v222-bonoloto-quintuple-miss-discriminator.json
          git diff --cached --quiet || git commit -m 'research(loterias-ai): persist v222 quintuple miss result'
          git push
