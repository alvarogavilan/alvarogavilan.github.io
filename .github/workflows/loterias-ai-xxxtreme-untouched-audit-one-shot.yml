name: Loterias AI XXXtreme Untouched Audit One Shot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/loterias-ai-xxxtreme-untouched-audit-one-shot.yml'

permissions:
  contents: write

concurrency:
  group: loterias-ai-xxxtreme-untouched-audit-one-shot
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run untouched post-selection audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          node loterias-ai/casino/xxxtreme/discovery/selected-family-untouched-audit-v1.mjs
          git add loterias-ai/casino/xxxtreme/discovery/selected-family-untouched-audit-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(xxxtreme): persist untouched selected-family audit'
          git push origin HEAD:main
