name: Loterias AI Probe Nacional Premio Decimo
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/probe-nacional-premio-decimo.mjs'
      - '.github/workflows/loterias-ai-probe-nacional-premio-decimo.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/probe-nacional-premio-decimo.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/probes/nacional-premio-decimo.json /tmp/nacional-premio-decimo.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p loterias-ai/data/probes
          cp /tmp/nacional-premio-decimo.json loterias-ai/data/probes/nacional-premio-decimo.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/probes/nacional-premio-decimo.json
          git commit -m 'data(loterias-ai): persist Nacional decimo payout probe' || exit 0
          git push origin HEAD:main
