name: Loterias AI Bonoloto Holdout
on:
  push:
    paths:
      - 'loterias-ai/scripts/bonoloto-holdout-evidence.mjs'
      - '.github/workflows/loterias-ai-bonoloto-holdout.yml'
  workflow_dispatch:
jobs:
  holdout:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node loterias-ai/scripts/bonoloto-holdout-evidence.mjs
      - name: Persist holdout evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/backtests/bonoloto-holdout.json
          git commit -m 'data(loterias-ai): add locked Bonoloto holdout evidence' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
