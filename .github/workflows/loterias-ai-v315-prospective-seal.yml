name: Loterias AI MetaPleno v315 Prospective Seal
on:
  workflow_dispatch:
    inputs:
      target_draw_date:
        description: 'Optional Primitiva target YYYY-MM-DD; blank resolves next scheduled draw'
        required: false
        type: string
  schedule:
    - cron: '15 6 * * 1,4,6'
  push:
    branches: [main]
    paths:
      - 'loterias-ai/data/research/metapleno-v315-preregister.json'
      - 'loterias-ai/data/research/metapleno-v315-execution-protocol-v1.json'
      - 'loterias-ai/data/research/meta-pleno-v138-bonoloto-graph-topology.json'
      - 'loterias-ai/research/megalab/v315-seal-next-prospective.mjs'
      - 'loterias-ai/research/megalab/v315-seal-guarded.mjs'
      - 'loterias-ai/research/megalab/v315-administrative-status.mjs'
      - 'loterias-ai/data/research/primitiva-frequency4-prospective-freeze-v1.json'
      - 'loterias-ai/research/megalab/primitiva-frequency4-seal-next.mjs'
      - 'loterias-ai/research/megalab/primitiva-frequency4-status.mjs'
      - 'loterias-ai/data/draw-schedule.json'
      - '.github/workflows/loterias-ai-v315-prospective-seal.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-v315-prospective-seal
  cancel-in-progress: false
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Seal next eligible Primitiva v315 target before result
        env:
          TARGET_DRAW_DATE: ${{ inputs.target_draw_date }}
        run: node loterias-ai/research/megalab/v315-seal-guarded.mjs
      - name: Seal frozen frequency4 economic target on same cadence
        env:
          TARGET_DRAW_DATE: ${{ inputs.target_draw_date }}
        run: node loterias-ai/research/megalab/primitiva-frequency4-seal-next.mjs
      - name: Validate persisted seal safety
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const vdir='loterias-ai/data/research/v315-prospective-seals',vf=fs.existsSync(vdir)?fs.readdirSync(vdir).filter(x=>x.endsWith('.json')).sort():[];if(!vf.length)throw new Error('No v315 seal produced or already present');for(const f of vf){const d=JSON.parse(fs.readFileSync(`${vdir}/${f}`,'utf8'));if(d.lines?.length!==12||d.guards?.targetResultPresentAtSeal!==false||d.guards?.targetOutcomeUsedForSelection!==false||d.guards?.retuningPerformed!==false||d.guards?.realMoneyPass!==false||Number(d.guards?.realStakeEUR)!==0||d.executionProtocol?.fixedDecisionBoundary!==200||!/^[0-9a-f]{64}$/.test(d.sealHash||''))throw new Error('v315 seal safety regression '+f)}
          const fdir='loterias-ai/data/research/primitiva-frequency4-prospective-seals',ff=fs.existsSync(fdir)?fs.readdirSync(fdir).filter(x=>x.endsWith('.json')).sort():[];if(!ff.length)throw new Error('No frequency4 seal produced or already present');for(const f of ff){const d=JSON.parse(fs.readFileSync(`${fdir}/${f}`,'utf8'));if(d.strategy?.id!=='frequency'||d.strategy?.ticketsPerDraw!==4||d.tickets?.length!==4||d.guards?.targetResultPresentAtSeal!==false||d.guards?.targetOutcomeUsedForSelection!==false||d.guards?.retuningPerformed!==false||d.guards?.realMoneyAllowed!==false||Number(d.guards?.realStakeEUR)!==0||!/^[0-9a-f]{64}$/.test(d.sealHash||''))throw new Error('frequency4 seal safety regression '+f)}
          NODE
      - run: node loterias-ai/research/megalab/v315-administrative-status.mjs
      - run: node loterias-ai/research/megalab/primitiva-frequency4-status.mjs
      - name: Persist seals and blinded status against moving main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          owned=(loterias-ai/data/research/v315-prospective-seals loterias-ai/data/research/metapleno-v315-prospective-status.json loterias-ai/data/research/primitiva-frequency4-prospective-seals loterias-ai/data/research/primitiva-frequency4-prospective-status.json);tmp="$(mktemp -d)";trap 'rm -rf "$tmp"' EXIT
          for p in "${owned[@]}";do if [ -e "$p" ];then mkdir -p "$tmp/$(dirname "$p")";cp -a "$p" "$tmp/$p";fi;done
          for attempt in 1 2 3 4 5;do git fetch origin main;git reset --hard origin/main;for p in "${owned[@]}";do if [ -e "$tmp/$p" ];then mkdir -p "$(dirname "$p")";rm -rf "$p";cp -a "$tmp/$p" "$p";fi;done;git add "${owned[@]}" 2>/dev/null||true;git diff --cached --quiet&&exit 0;git commit -m 'research(loterias-ai): advance blinded Primitiva prospective state';git push origin HEAD:main&&exit 0;sleep $((attempt*2));done
          exit 1
