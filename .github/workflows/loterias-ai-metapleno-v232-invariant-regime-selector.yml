name: Loterias AI MetaPleno v232 Invariant Regime Selector
on:
  push:
    branches: [research/metapleno-v232-invariant-regime-selector]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run v232
        run: node loterias-ai/scripts/meta-pleno-v232-invariant-regime-selector.mjs
      - name: Validate fail-closed
        run: node -e "const x=require('./loterias-ai/data/research/meta-pleno-v232-invariant-regime-selector.json'); if(x.realMoneyPass!==false||x.realStakeEUR!==0) process.exit(1);"
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v232-invariant-regime-selector.json
          git diff --cached --quiet || git commit -m "research(loterias-ai): persist v232 invariant regime selector result"
          git push
