name: Loterias AI v293 Stage4 Strict OOS

on:
  workflow_dispatch:
  push:
    branches:
      - research/metapleno-v293-representation-synthesis
    paths:
      - 'loterias-ai/research/megalab/v293-stage4-strict-oos.mjs'
      - '.github/workflows/loterias-ai-v293-stage4-strict-oos.yml'

permissions:
  contents: write

concurrency:
  group: loterias-ai-v293-stage4-strict-oos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run strict blind OOS 2023-2024
        run: node loterias-ai/research/megalab/v293-stage4-strict-oos.mjs
      - name: Verify frozen manifest and post-freeze isolation
        run: node -e "const r=require('./loterias-ai/data/research/metapleno-v293-stage4-oos-2023-2024.json');const m=require('./loterias-ai/data/research/metapleno-v293-frozen-manifest.json');if(r.sourceManifestHash!==m.manifestHash||r.hyperparametersRetuned||r.manifestMutated||r.postFreeze2025Read||r.realMoneyPass||r.realStakeEUR!==0)process.exit(1)"
      - name: Persist Stage4 evidence only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/metapleno-v293-stage4-oos-2023-2024.json
          git commit -m 'data(loterias-ai): persist v293 strict OOS 2023-2024' || exit 0
          git pull --rebase origin research/metapleno-v293-representation-synthesis
          git push
