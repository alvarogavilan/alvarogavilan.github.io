name: Loterias AI Tiki Pair Reset Confirm V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'loterias-ai/casino/jackpots/tiki-pair-reset-confirm-v1.mjs'
      - 'loterias-ai/tests/tiki-pair-reset-confirm-v1.test.mjs'
      - '.github/workflows/loterias-ai-tiki-pair-reset-confirm-v1.yml'

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deterministic guards
        run: node loterias-ai/tests/tiki-pair-reset-confirm-v1.test.mjs
      - name: Confirm reset with two fresh public samples
        run: node loterias-ai/casino/jackpots/tiki-pair-reset-confirm-v1.mjs
      - name: Verify fail-closed scientific result
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync('loterias-ai/casino/jackpots/evidence/tiki-pair-reset-confirm-v1.json','utf8'));
          if(x?.pairSignature?.bothConfirmed!==true) throw new Error('both stable-ID resets not independently confirmed');
          if(x?.pairSignature?.classification!=='SYNCHRONIZED_SHARED_RESET_SIGNATURE') throw new Error('shared reset signature not confirmed');
          if(x?.inference?.exactAliasProven!==false||x?.inference?.exactGameIdentityProven!==false) throw new Error('identity overclaim');
          if(x?.inference?.tikiTropicoIdentityProven!==false||x?.inference?.tikiTemploIdentityProven!==false) throw new Error('game binding overclaim');
          if(x?.inference?.seedPointEstimateEUR!==null) throw new Error('post-reset amount cannot be exact seed');
          if(x?.inference?.economicPromotionAllowed!==false||x?.inference?.realMoneyAllowed!==false) throw new Error('economic gate opened unexpectedly');
          console.log(JSON.stringify({pairSignature:x.pairSignature,inference:x.inference,targets:x.targetEvidence},null,2));
          NODE
