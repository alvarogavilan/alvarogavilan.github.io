name: Loterias AI MetaPleno v115 Bonoloto Independent Meta Stacker
on:
  push:
    branches:
      - research/metapleno-v115-bonoloto-independent-meta-stacker
    paths:
      - 'loterias-ai/scripts/meta-pleno-v115-bonoloto-independent-meta-stacker-budget8.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v115-bonoloto-independent-meta-stacker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node loterias-ai/scripts/meta-pleno-v115-bonoloto-independent-meta-stacker-budget8.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v115-bonoloto-independent-meta-stacker
          path: loterias-ai/data/research/meta-pleno-v115-bonoloto-independent-meta-stacker-budget8.json
