name: Loterias AI MetaPleno v200 Bonoloto Haar Multiscale
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v200-bonoloto-haar-multiscale]
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node loterias-ai/scripts/meta-pleno-v200-bonoloto-haar-multiscale.mjs
      - name: Validate gates
        run: |
          node - <<'NODE'
          const fs=require('fs');const p='loterias-ai/data/research/meta-pleno-v200-bonoloto-haar-multiscale.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));
          if(d.realMoneyPass!==false||d.budget?.realStakeEUR!==0)throw new Error('real-money gate regression');
          if(d.budget?.theoreticalCostEUR!==14||d.budget?.tickets!==28)throw new Error('Budget8 mismatch');
          if(d.summary?.frozen!==20)throw new Error('freeze count mismatch');
          console.log(JSON.stringify(d.summary));
          NODE
      - name: Persist v200
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v200-bonoloto-haar-multiscale.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(loterias-ai): persist v200 Bonoloto Haar multiscale'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
