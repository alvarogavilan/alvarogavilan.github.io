name: Loterias AI MetaPleno v155 Frontier Graph ADD
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v155-frontier-graph-add]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v155-frontier-graph-add.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v155-frontier-graph-add.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v155-frontier-graph-add.mjs
      - name: Persist v155
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v155-frontier-graph-add.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist v155 frontier graph add'
          git push
