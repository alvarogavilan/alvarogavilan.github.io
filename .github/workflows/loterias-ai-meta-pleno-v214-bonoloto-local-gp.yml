name: Loterias AI MetaPleno v214 Bonoloto Local GP
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v214-bonoloto-gp-kernel]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v214-bonoloto-local-gp.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v214-bonoloto-local-gp.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/metapleno-v214-bonoloto-gp-kernel}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node loterias-ai/scripts/meta-pleno-v214-bonoloto-local-gp.mjs
      - name: Validate gates
        run: node -e "const x=require('./loterias-ai/data/research/meta-pleno-v214-bonoloto-local-gp.json');if(x.realMoneyPass!==false||x.budget.realStakeEUR!==0)process.exit(1)"
      - name: Persist v214
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v214-bonoloto-local-gp.json
          git diff --cached --quiet || git commit -m 'research(loterias-ai): persist v214 exact local GP'
          git push