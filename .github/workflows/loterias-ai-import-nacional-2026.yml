name: Loterias AI Import Nacional 2026
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/import-nacional-year.mjs'
      - '.github/workflows/loterias-ai-import-nacional-2026.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    env:
      YEAR: '2026'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node loterias-ai/scripts/import-nacional-year.mjs
      - run: node loterias-ai/scripts/build-national-archive-index.mjs
      - run: node loterias-ai/scripts/audit-national-archive.mjs
      - name: Persist safely
        run: |
          mkdir -p /tmp/nacional
          cp -r loterias-ai/data/archive/loteria-nacional /tmp/nacional/
          cp loterias-ai/data/archive/manifest.json /tmp/manifest.json
          cp loterias-ai/data/archive/_meta/archive-audit.json /tmp/archive-audit.json
          git fetch origin main
          git reset --hard origin/main
          rm -rf loterias-ai/data/archive/loteria-nacional
          cp -r /tmp/nacional/loteria-nacional loterias-ai/data/archive/
          cp /tmp/manifest.json loterias-ai/data/archive/manifest.json
          cp /tmp/archive-audit.json loterias-ai/data/archive/_meta/archive-audit.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/archive
          git commit -m 'data(loterias-ai): import Nacional 2026 complete archive' || exit 0
          git push origin HEAD:main
