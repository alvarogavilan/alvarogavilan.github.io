name: Loterias AI Quiniela Frozen Replication
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/quiniela-frozen-2018-2026-replication.mjs'
      - '.github/workflows/loterias-ai-quiniela-frozen-replication.yml'
permissions:
  contents: write
jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Replicate untouched pre-2018 frozen rule
        run: node loterias-ai/scripts/quiniela-frozen-2018-2026-replication.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/research/quiniela-frozen-2018-2026-replication.json /tmp/q-rep.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/q-rep.json loterias-ai/data/research/quiniela-frozen-2018-2026-replication.json
            git add loterias-ai/data/research/quiniela-frozen-2018-2026-replication.json
            git commit -m 'data(loterias-ai): persist Quiniela frozen replication evidence' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
