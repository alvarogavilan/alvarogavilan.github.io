name: Loterias AI MetaPleno v44 Nacional Cross Era
on:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v44-nacional-cross-era-first-prize.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v44-nacional-cross-era.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Run cross-era full-number audit
        run: node loterias-ai/scripts/meta-pleno-v44-nacional-cross-era-first-prize.mjs
      - name: Persist result safely
        run: |
          cp loterias-ai/data/research/meta-pleno-v44-nacional-cross-era-first-prize.json /tmp/v44.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p loterias-ai/data/research
            cp /tmp/v44.json loterias-ai/data/research/meta-pleno-v44-nacional-cross-era-first-prize.json
            git add loterias-ai/data/research/meta-pleno-v44-nacional-cross-era-first-prize.json
            git commit -m 'data(loterias-ai): persist Nacional v44 cross-era audit' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
