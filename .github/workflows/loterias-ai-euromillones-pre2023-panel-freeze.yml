name: Loterias AI Euromillones Pre-2023 Panel Freeze
on:
  push:
    paths:
      - 'loterias-ai/scripts/euromillones-pre2023-panel-freeze.mjs'
      - '.github/workflows/loterias-ai-euromillones-pre2023-panel-freeze.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: loterias-ai-euromillones-pre2023-panel-freeze
  cancel-in-progress: true
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/download-artifact@v4
        with:
          pattern: meta-pleno-v5-*
          path: /tmp/meta-v5
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 31878379467
      - name: Restore v5 shards
        run: |
          rm -rf loterias-ai/data/research/meta-pleno-v5-shards
          mkdir -p loterias-ai/data/research/meta-pleno-v5-shards
          find /tmp/meta-v5 -name '*.json' -exec cp {} loterias-ai/data/research/meta-pleno-v5-shards/ \;
      - name: Freeze from 2019-2022 and open 2023-2026
        run: node loterias-ai/scripts/euromillones-pre2023-panel-freeze.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/research/euromillones-pre2023-panel-freeze.json /tmp/result.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/result.json loterias-ai/data/research/euromillones-pre2023-panel-freeze.json
            git add loterias-ai/data/research/euromillones-pre2023-panel-freeze.json
            git commit -m 'data(loterias-ai): persist Euromillones pre-2023 panel freeze' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
