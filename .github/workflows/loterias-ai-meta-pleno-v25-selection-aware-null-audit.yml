name: Loterias AI MetaPleno v25 Selection-Aware Null Audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v25-selection-aware-null-audit.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v25-selection-aware-null-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Run selection-aware null audit
        run: node loterias-ai/scripts/meta-pleno-v25-selection-aware-null-audit.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/research/meta-pleno-v25-selection-aware-null-audit.json /tmp/v25.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v25.json loterias-ai/data/research/meta-pleno-v25-selection-aware-null-audit.json
            git add loterias-ai/data/research/meta-pleno-v25-selection-aware-null-audit.json
            git commit -m 'data(loterias-ai): persist MetaPleno v25 selection-aware null audit' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
