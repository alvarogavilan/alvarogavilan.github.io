name: Loterias AI MetaPleno v234 Combinadic Rank Dynamics
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v234-combinadic-rank-dynamics]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v234-combinadic-rank-dynamics.mjs'
      - '.github/workflows/loterias-ai-metapleno-v234-combinadic-rank-dynamics.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run v234
        run: node loterias-ai/scripts/meta-pleno-v234-combinadic-rank-dynamics.mjs
      - name: Validate fail-closed
        run: node -e "const r=require('./loterias-ai/data/research/meta-pleno-v234-combinadic-rank-dynamics.json'); if(r.realMoneyPass!==false||r.realStakeEUR!==0) process.exit(1)"
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v234-combinadic-rank-dynamics.json
          git diff --cached --quiet || git commit -m 'research(loterias-ai): persist v234 combinadic rank dynamics'
          git push