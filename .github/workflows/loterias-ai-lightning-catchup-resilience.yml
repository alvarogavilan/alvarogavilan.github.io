name: Loterias AI Lightning Catchup Resilience
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/lightning/evidence/casinoorg-source-head-probe.json'
      - 'loterias-ai/casino/lightning/collect-casinoorg-api.mjs'
      - 'loterias-ai/casino/lightning/research/recover-casinoorg-pagination-gap-v1.mjs'
      - '.github/workflows/loterias-ai-lightning-catchup-resilience.yml'
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: loterias-ai-lightning-catchup-resilience
  cancel-in-progress: false
jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Catch up only when source head is ahead
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            rm -f /tmp/gap-recovered
            git fetch origin main
            git reset --hard origin/main
            node loterias-ai/casino/lightning/research/probe-casinoorg-source-head.mjs
            node --input-type=module <<'NODE' > /tmp/source-ahead
            import fs from 'node:fs';
            const p=JSON.parse(fs.readFileSync('loterias-ai/casino/lightning/evidence/casinoorg-source-head-probe.json','utf8'));
            process.stdout.write(p.sourceAheadOfCorpus?'yes':'no');
            NODE
            if [ "$(cat /tmp/source-ahead)" != yes ]; then
              echo 'Source head is not ahead of corpus; no catchup required.'
              exit 0
            fi

            node loterias-ai/casino/lightning/collect-casinoorg-api.mjs
            node --input-type=module <<'NODE' > /tmp/bridge-safe
            import fs from 'node:fs';
            const c=JSON.parse(fs.readFileSync('loterias-ai/casino/lightning/evidence/casinoorg-api-collector.json','utf8'));
            process.stdout.write(c.continuityBridgeSafe===true?'yes':'no');
            NODE

            if [ "$(cat /tmp/bridge-safe)" != yes ]; then
              echo 'Fresh source window is non-contiguous; attempting overlap-verified authoritative pagination recovery.'
              if ! node loterias-ai/casino/lightning/research/recover-casinoorg-pagination-gap-v1.mjs; then
                echo 'Gap recovery failed closed: persist quarantine only; no prospective advances.'
                git add \
                  loterias-ai/casino/lightning/evidence/casinoorg-api-collector.json \
                  loterias-ai/casino/lightning/evidence/casinoorg-catchup-quarantine.json 2>/dev/null || true
                if git diff --cached --quiet; then exit 0; fi
                git commit -m 'ops(lightning): quarantine non-contiguous authoritative window'
                if git push origin HEAD:main; then exit 0; fi
                echo 'main moved while persisting quarantine; discard this attempt and recompute from the latest main.'
                sleep $((attempt*2))
                continue
              fi
              echo yes > /tmp/gap-recovered
            fi

            if git diff --quiet -- loterias-ai/casino/lightning/data/casinoorg-lightningroulette.jsonl; then
              echo 'ERROR: source is ahead but no contiguous or overlap-verified authoritative corpus rows were persisted.' >&2
              exit 1
            fi

            node loterias-ai/casino/lightning/corpus-readiness.mjs
            git restore loterias-ai/casino/lightning/evidence/corpus-readiness.json || true
            git restore loterias-ai/casino/lightning/evidence/corpus-audit.json || true
            node loterias-ai/casino/lightning/research/verify-economic-prospective-freeze-v1.mjs
            node loterias-ai/casino/lightning/research/verify-economic-number-prospective-freeze-v1.mjs
            node loterias-ai/casino/lightning/research/economic-multiplier-prospective-v1.mjs
            node loterias-ai/casino/lightning/research/economic-number-selection-prospective-v1.mjs
            node loterias-ai/casino/lightning/research/prospective-capture-continuity-v1.mjs
            node loterias-ai/casino/lightning/research/lightning-prospective-frozen-lag8.mjs
            node loterias-ai/casino/lightning/research/physical-rng-prospective-idempotent-v1.mjs
            node loterias-ai/casino/lightning/research/timing-replication-v2.mjs

            node --input-type=module <<'NODE'
            import fs from 'node:fs';
            const c=JSON.parse(fs.readFileSync('loterias-ai/casino/lightning/evidence/casinoorg-api-collector.json','utf8'));
            let acquisitionOk=c.cachePolicy==='NO_CACHE_NO_STORE'&&c.sourceLatest?.timestamp&&Number(c.persistedRows)>0&&c.continuityBridgeSafe===true;
            if(fs.existsSync('/tmp/gap-recovered')){
              const r=JSON.parse(fs.readFileSync('loterias-ai/casino/lightning/evidence/casinoorg-gap-recovery-v1.json','utf8'));
              acquisitionOk=r.status==='RECOVERED_CONTIGUOUS_AUTHORITATIVE_GAP'&&r.exactRoundIdOverlapVerified===true&&r.continuityUnionVerified===true&&Number(r.canonicalDuplicateConflicts)===0&&Number(r.recoveredRows)>0&&Number(r.firstBridgeSeconds)<=120&&Number(r.maxInterRoundSeconds)<=120&&Number(r.tailBridgeSeconds)<=120&&r.quarantineClearedAfterRecovery===true&&r.guards?.realMoneyAllowed===false;
            }
            if(!acquisitionOk) throw new Error('catchup did not prove safe authoritative persistence');
            const pf=JSON.parse(fs.readFileSync('loterias-ai/casino/lightning/evidence/physical-rng-prospective-freeze-v1.json','utf8'));
            const ps=JSON.parse(fs.readFileSync('loterias-ai/casino/lightning/evidence/physical-rng-prospective-status-v1.json','utf8'));
            if(ps.freezeVersion!==pf.version||ps.guards?.realMoneyAllowed!==false) throw new Error('physical prospective drift');
            const rf=JSON.parse(fs.readFileSync('loterias-ai/casino/lightning/evidence/timing-replication-v2-freeze.json','utf8'));
            const rs=JSON.parse(fs.readFileSync('loterias-ai/casino/lightning/evidence/timing-replication-v2-status.json','utf8'));
            if(rs.freezeVersion!==rf.version||rs.guards?.realMoneyAllowed!==false) throw new Error('timing v2 drift');
            NODE

            git add \
              loterias-ai/casino/lightning/data/casinoorg-lightningroulette.jsonl \
              loterias-ai/casino/lightning/evidence/casinoorg-api-collector.json \
              loterias-ai/casino/lightning/evidence/casinoorg-catchup-quarantine.json \
              loterias-ai/casino/lightning/evidence/casinoorg-gap-recovery-v1.json \
              loterias-ai/casino/lightning/evidence/economic-multiplier-window-prospective-status-v1.json \
              loterias-ai/casino/lightning/evidence/economic-number-selection-prospective-status-v1.json \
              loterias-ai/casino/lightning/evidence/prospective-capture-continuity-v1.json \
              loterias-ai/casino/lightning/evidence/prospective-lag8.json \
              loterias-ai/casino/lightning/evidence/physical-rng-prospective-status-v1.json \
              loterias-ai/casino/lightning/evidence/timing-replication-v2-status.json 2>/dev/null || true
            git commit -m 'research(casino): catch up overlap-verified authoritative Lightning rounds'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
