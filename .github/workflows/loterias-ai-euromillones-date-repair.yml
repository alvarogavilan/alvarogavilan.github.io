name: Loterias AI Euromillones Date Repair
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/repair-euromillones-2012-07-30-date.mjs'
      - '.github/workflows/loterias-ai-euromillones-date-repair.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-euromillones-date-repair
  cancel-in-progress: true
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Guarded official date repair on latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node loterias-ai/scripts/repair-euromillones-2012-07-30-date.mjs
            BATCH_LIMIT=5 node loterias-ai/scripts/enrich-euromillones-official-economics.mjs
            BATCH_LIMIT=5 node loterias-ai/scripts/crosscheck-euromillones-official-results.mjs
            node loterias-ai/scripts/build-national-archive-index.mjs
            node loterias-ai/scripts/build-archive-coverage-priorities.mjs
            git add loterias-ai/data/archive/euromillones/2012.json \
                    loterias-ai/data/archive/_meta/euromillones-official-economics.json \
                    loterias-ai/data/archive/_meta/euromillones-official-result-crosscheck.json \
                    loterias-ai/data/archive/_meta/euromillones-official-result-conflicts.json \
                    loterias-ai/data/archive/manifest.json \
                    loterias-ai/data/archive/_meta/archive-coverage-priorities.json
            if git diff --cached --quiet; then echo 'No Euromillones date-repair changes'; exit 0; fi
            git commit -m 'data(euromillones): persist guarded official 2012 date repair'
            if git push origin HEAD:main; then exit 0; fi
            echo "main moved during Euromillones date repair; recomputing from latest main (attempt ${attempt}/5)"
            sleep $((attempt * 3))
          done
          echo 'Could not persist Euromillones date repair safely after 5 recomputations' >&2
          exit 1
