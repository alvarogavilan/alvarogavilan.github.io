name: Loterias AI Quiniela Historical SELAE Cross-check

on:
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'
  push:
    paths:
      - 'loterias-ai/scripts/crosscheck-quiniela-historical-selae.mjs'
      - '.github/workflows/loterias-ai-quiniela-historical-selae.yml'

permissions:
  contents: write

concurrency:
  group: loterias-ai-quiniela-historical-selae
  cancel-in-progress: false

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recompute historical official cross-check on latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Code/config changes need a small durable smoke checkpoint so a bad
          # runtime or API assumption becomes visible quickly. Scheduled runs keep
          # the larger production batch once the path is known to persist safely.
          if [ "${{ github.event_name }}" = 'schedule' ]; then
            batch_limit=40
          else
            batch_limit=8
          fi
          echo "Quiniela historical SELAE batch_limit=${batch_limit} event=${{ github.event_name }}"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            # Phase 1: compute and persist the canonical Quiniela evidence first.
            # Scheduled checkpoints stay bounded at 40; push/manual smoke runs use
            # only 8 rows to prove the canonical evidence path can complete.
            BATCH_LIMIT="$batch_limit" FETCH_CONCURRENCY=4 node loterias-ai/scripts/crosscheck-quiniela-historical-selae.mjs

            git add \
              loterias-ai/data/archive/quiniela \
              loterias-ai/data/archive/_meta/quiniela-historical-selae-crosscheck.json

            if ! git diff --cached --quiet; then
              git commit -m 'data(quiniela): persist historical SELAE cross-check evidence'
              if ! git push origin HEAD:main; then
                echo "main moved during Quiniela evidence checkpoint attempt ${attempt}; recomputing"
                sleep $((attempt * 2))
                continue
              fi
            else
              echo 'No semantic Quiniela canonical evidence change.'
            fi

            # Phase 2: rebuild derived QA from the exact main that contains the
            # canonical checkpoint. If another workflow moves main, recompute.
            git fetch origin main
            git reset --hard origin/main
            node loterias-ai/scripts/build-national-archive-index.mjs
            node loterias-ai/scripts/build-completeness-index.mjs

            set +e
            node loterias-ai/scripts/audit-national-archive.mjs
            audit_rc=$?
            node loterias-ai/scripts/build-archive-coverage-priorities.mjs
            priorities_rc=$?
            set -e

            qa_rc=0
            node --input-type=module <<'NODE' || qa_rc=$?
            import fs from 'node:fs';
            const p='loterias-ai/data/archive/_meta/quiniela-historical-selae-crosscheck.json';
            const r=JSON.parse(fs.readFileSync(p,'utf8'));
            const mismatches=(r.failures||[]).filter(x=>x.reason==='OFFICIAL_RESULT_MISMATCH_QUARANTINED');
            if(mismatches.length) {
              console.error(`Official Quiniela mismatches quarantined: ${mismatches.length}. Canonical evidence is already persisted; failing closed after QA.`);
            }
            const priorities=JSON.parse(fs.readFileSync('loterias-ai/data/archive/_meta/archive-coverage-priorities.json','utf8'));
            if(mismatches.length || priorities.auditQualityPass!==true) process.exit(1);
            NODE

            git add \
              loterias-ai/data/archive/_meta/archive-audit.json \
              loterias-ai/data/archive/_meta/archive-coverage-priorities.json \
              loterias-ai/data/archive/manifest.json \
              loterias-ai/data/archive/completeness-index.json

            if git diff --cached --quiet; then
              echo 'No semantic derived archive QA change.'
              if [ "$audit_rc" -ne 0 ] || [ "$priorities_rc" -ne 0 ] || [ "$qa_rc" -ne 0 ]; then
                echo 'Quiniela historical cross-check remains fail-closed; canonical evidence is persisted.' >&2
                exit 1
              fi
              exit 0
            fi

            git commit -m 'qa(archive): sync derived state after Quiniela historical cross-check'
            if git push origin HEAD:main; then
              if [ "$audit_rc" -ne 0 ] || [ "$priorities_rc" -ne 0 ] || [ "$qa_rc" -ne 0 ]; then
                echo 'Persisted derived Quiniela QA diagnostics; failing closed after evidence was saved.' >&2
                exit 1
              fi
              exit 0
            fi

            echo "main moved during Quiniela derived QA attempt ${attempt}; recomputing"
            sleep $((attempt * 2))
          done

          echo 'Unable to persist Quiniela historical cross-check after five recomputations.' >&2
          exit 1
