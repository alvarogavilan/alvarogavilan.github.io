name: Loterias AI Quiniela Historical SELAE Cross-check

on:
  workflow_dispatch:
  schedule:
    - cron: '8 */3 * * *'
  push:
    paths:
      - 'loterias-ai/scripts/crosscheck-quiniela-historical-selae.mjs'
      - '.github/workflows/loterias-ai-quiniela-historical-selae.yml'

permissions:
  contents: write

concurrency:
  # v2 deliberately breaks away from the legacy scheduled queue. Older workflow
  # revisions used much larger/longer batches with cancel-in-progress:false; any
  # queued schedule runs there must not strand the current eight-row micro-batches.
  # Trigger classes remain isolated and each v2 class stays serialized.
  group: loterias-ai-quiniela-historical-selae-v2-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recompute historical official cross-check on latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # The first durable checkpoint proved that a four-row strict batch can
          # complete and persist. Use small eight-row production checkpoints so
          # SELAE/network latency cannot strand a large batch. Historical evidence
          # is recoverable, therefore the schedule follows the repository-wide
          # eight-runs/day maintenance budget; manual/code-change triggers remain.
          batch_limit=8
          echo "Quiniela historical SELAE batch_limit=${batch_limit} event=${{ github.event_name }}"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            # Always leave a minimal durable diagnostic if the historical script
            # itself fails before it can write its normal report. This marker is
            # created only when the report does not exist, so repeated failures do
            # not churn main. A successful script replaces it with the full report.
            BATCH_LIMIT="$batch_limit" node --input-type=module <<'NODE'
            import fs from 'node:fs';
            const qdir='loterias-ai/data/archive/quiniela';
            const meta='loterias-ai/data/archive/_meta';
            const report=`${meta}/quiniela-historical-selae-crosscheck.json`;
            if(!fs.existsSync(report)) {
              let datedPre2020=0;
              let eligible=0;
              for(const file of fs.readdirSync(qdir).filter(x=>/^\d{4}\.json$/.test(x))){
                const doc=JSON.parse(fs.readFileSync(`${qdir}/${file}`,'utf8'));
                for(const row of doc.records||[]){
                  if(!row.drawDate || row.drawDate>='2020-01-01') continue;
                  datedPre2020++;
                  const v=row.verification||{};
                  const c=v.officialCrossCheck||{};
                  const terminal=(c.provider==='SELAE'&&c.complete===true)
                    || (v.status==='OFFICIAL_SELAE_NOT_FOUND'&&c.provider==='SELAE'&&c.status==='NOT_FOUND')
                    || (v.status==='OFFICIAL_SELAE_PARTIAL'&&c.provider==='SELAE'&&c.status==='PARTIAL')
                    || v.status==='OFFICIAL_CONFLICT_QUARANTINED';
                  if(!terminal) eligible++;
                }
              }
              fs.mkdirSync(meta,{recursive:true});
              fs.writeFileSync(report,JSON.stringify({
                gameId:'quiniela',
                scope:'dated-canonical-pre-2020',
                status:'PREFLIGHT_PENDING_SCRIPT',
                datedPre2020,
                eligibleTargets:eligible,
                requestedBatchLimit:Number(process.env.BATCH_LIMIT||0),
                guards:{noInference:true,realMoney:false}
              },null,2)+'\n');
            }
            NODE

            # Phase 1: compute canonical Quiniela evidence. Capture the script
            # status instead of letting set -e erase the only useful diagnostic.
            set +e
            BATCH_LIMIT="$batch_limit" FETCH_CONCURRENCY=4 node loterias-ai/scripts/crosscheck-quiniela-historical-selae.mjs
            crosscheck_rc=$?
            set -e

            git add \
              loterias-ai/data/archive/quiniela \
              loterias-ai/data/archive/_meta/quiniela-historical-selae-crosscheck.json

            if ! git diff --cached --quiet; then
              git commit -m 'data(quiniela): persist historical SELAE cross-check evidence'
              if ! git push origin HEAD:main; then
                echo "main moved during Quiniela evidence checkpoint attempt ${attempt}; recomputing"
                sleep $((attempt * 2))
                continue
              fi
            else
              echo 'No semantic Quiniela canonical evidence change.'
            fi

            if [ "$crosscheck_rc" -ne 0 ]; then
              echo "Historical Quiniela SELAE cross-check failed with rc=${crosscheck_rc}; diagnostic checkpoint is persisted." >&2
              exit "$crosscheck_rc"
            fi

            # Phase 2: rebuild derived QA from the exact main that contains the
            # canonical checkpoint. If another workflow moves main, recompute.
            git fetch origin main
            git reset --hard origin/main
            node loterias-ai/scripts/build-national-archive-index.mjs
            node loterias-ai/scripts/build-completeness-index.mjs

            set +e
            node loterias-ai/scripts/audit-national-archive.mjs
            audit_rc=$?
            node loterias-ai/scripts/build-archive-coverage-priorities.mjs
            priorities_rc=$?
            set -e

            qa_rc=0
            node --input-type=module <<'NODE' || qa_rc=$?
            import fs from 'node:fs';
            const p='loterias-ai/data/archive/_meta/quiniela-historical-selae-crosscheck.json';
            const r=JSON.parse(fs.readFileSync(p,'utf8'));
            const mismatches=(r.failures||[]).filter(x=>x.reason==='OFFICIAL_RESULT_MISMATCH_QUARANTINED');
            if(mismatches.length) {
              console.error(`Official Quiniela mismatches quarantined: ${mismatches.length}. Canonical evidence is already persisted; failing closed after QA.`);
            }
            const priorities=JSON.parse(fs.readFileSync('loterias-ai/data/archive/_meta/archive-coverage-priorities.json','utf8'));
            if(mismatches.length || priorities.auditQualityPass!==true) process.exit(1);
            NODE

            git add \
              loterias-ai/data/archive/_meta/archive-audit.json \
              loterias-ai/data/archive/_meta/archive-coverage-priorities.json \
              loterias-ai/data/archive/manifest.json \
              loterias-ai/data/archive/completeness-index.json

            if git diff --cached --quiet; then
              echo 'No semantic derived archive QA change.'
              if [ "$audit_rc" -ne 0 ] || [ "$priorities_rc" -ne 0 ] || [ "$qa_rc" -ne 0 ]; then
                echo 'Quiniela historical cross-check remains fail-closed; canonical evidence is persisted.' >&2
                exit 1
              fi
              exit 0
            fi

            git commit -m 'qa(archive): sync derived state after Quiniela historical cross-check'
            if git push origin HEAD:main; then
              if [ "$audit_rc" -ne 0 ] || [ "$priorities_rc" -ne 0 ] || [ "$qa_rc" -ne 0 ]; then
                echo 'Persisted derived Quiniela QA diagnostics; failing closed after evidence was saved.' >&2
                exit 1
              fi
              exit 0
            fi

            echo "main moved during Quiniela derived QA attempt ${attempt}; recomputing"
            sleep $((attempt * 2))
          done

          echo 'Unable to persist Quiniela historical cross-check after five recomputations.' >&2
          exit 1
