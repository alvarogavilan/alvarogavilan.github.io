name: Loterias AI Botemania JPK Wayback Pot History V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/botemania-universe/botemania-jpk-wayback-pot-history-v1.mjs'
      - '.github/workflows/loterias-ai-botemania-jpk-wayback-pot-history-v1.yml'
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

concurrency:
  group: loterias-ai-botemania-jpk-wayback-pot-history-v1
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconstruct historical Jackpot King pot candidates from Wayback
        run: node loterias-ai/casino/botemania-universe/botemania-jpk-wayback-pot-history-v1.mjs
      - name: Persist discovery evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/casino/botemania-universe/evidence/botemania-jpk-wayback-pot-history-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(casino): reconstruct historical Jackpot King pot candidates'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
