name: Loterias AI MetaPleno v62 Bonoloto Family Scorecard
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v62-bonoloto-family-scorecard.mjs'
      - 'loterias-ai/data/research/meta-pleno-v5*-bonoloto-*.json'
      - 'loterias-ai/data/research/meta-pleno-v6*-bonoloto-*.json'
      - '.github/workflows/loterias-ai-meta-pleno-v62-family-scorecard.yml'
permissions:
  contents: write
jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v62-bonoloto-family-scorecard.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/research/meta-pleno-v62-bonoloto-family-scorecard.json /tmp/v62.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v62.json loterias-ai/data/research/meta-pleno-v62-bonoloto-family-scorecard.json
            git add loterias-ai/data/research/meta-pleno-v62-bonoloto-family-scorecard.json
            git diff --cached --quiet && exit 0
            git commit -m 'data(loterias-ai): update Bonoloto family scorecard'
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
