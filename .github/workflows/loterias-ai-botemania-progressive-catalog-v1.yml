name: Loterias AI Botemania Progressive Catalog V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/botemania-progressive-catalog-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-progressive-catalog-summary-v1.mjs'
      - '.github/workflows/loterias-ai-botemania-progressive-catalog-v1.yml'
  schedule:
    - cron: '23 */12 * * *'

permissions:
  contents: write

concurrency:
  group: loterias-ai-botemania-progressive-catalog-v1
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Scan bounded Botemania slot catalog for progressive/state-dependent mechanisms
        run: |
          node loterias-ai/casino/jackpots/botemania-progressive-catalog-v1.mjs
          node loterias-ai/casino/jackpots/botemania-progressive-catalog-summary-v1.mjs
      - name: Persist catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            loterias-ai/casino/jackpots/evidence/botemania-progressive-catalog-v1.json \
            loterias-ai/casino/jackpots/evidence/botemania-progressive-catalog-summary-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(casino): refresh Botemania progressive catalog'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
