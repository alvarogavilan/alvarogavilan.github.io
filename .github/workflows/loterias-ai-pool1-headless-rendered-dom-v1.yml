name: Loterias AI Pool1 Headless Rendered DOM V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/botemania-pool1-headless-rendered-dom-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-pool1-headless-rendered-dom-recover-v1.mjs'
      - '.github/workflows/loterias-ai-pool1-headless-rendered-dom-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: |
          node --check loterias-ai/casino/jackpots/botemania-pool1-headless-rendered-dom-v1.mjs
          node --check loterias-ai/casino/jackpots/botemania-pool1-headless-rendered-dom-recover-v1.mjs
      - name: Show available headless browser
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true
          (google-chrome --version || google-chrome-stable --version || chromium --version || chromium-browser --version || true) 2>/dev/null
      - name: Render only the ten bounded public pages
        run: node loterias-ai/casino/jackpots/botemania-pool1-headless-rendered-dom-v1.mjs
      - name: Retry only failed renders with bounded longer timeout
        run: node loterias-ai/casino/jackpots/botemania-pool1-headless-rendered-dom-recover-v1.mjs
      - name: Enforce fail-closed rendered evidence semantics
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const p='loterias-ai/casino/jackpots/evidence/botemania-pool1-headless-rendered-dom-v1.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          if(x.guards?.publicPagesOnly!==true || x.guards?.noLogin!==true || x.guards?.noClick!==true || x.guards?.noGameLaunch!==true || x.guards?.noBetting!==true) throw new Error('public/no-interaction guards missing');
          if(x.guards?.singleRenderNeverVerifiesGameIdentity!==true || x.guards?.globalWidgetNeverGameIdentity!==true || x.guards?.sameCentIntervalMatchDiscoveryOnly!==true) throw new Error('rendered discovery promotion guards missing');
          if(x.guards?.retryOnlyFailedPages!==true) throw new Error('failed-render recovery guard missing');
          if(x.decision?.exactGameIdentityRecovered!==false || x.decision?.gameContainsPool1MeterVerified!==false || x.decision?.economicPromotionAllowed!==false || x.decision?.realMoneyAllowed!==false) throw new Error('headless probe promoted identity/economics');
          if((x.coverage?.targetCount||0)!==10) throw new Error('target scope drifted from ten pages');
          if(x.coverage?.complete===true && x.coverage?.successfulRenders!==10) throw new Error('complete flag inconsistent');
          if(x.summary?.renderedLayerExhausted===true && x.coverage?.complete!==true) throw new Error('partial browser coverage claimed negative exhaustion');
          if(x.coverage?.complete!==true) throw new Error(`headless coverage remains incomplete: ${x.coverage?.successfulRenders}/10`);
          console.log(JSON.stringify({browser:x.browser,coverage:x.coverage,recovery:x.recovery,summary:x.summary,rows:x.results.map(r=>({slug:r.slug,feed:r.feed,rendered:{success:r.rendered.success,durationMs:r.rendered.durationMs,recoveredByRetry:r.rendered.recoveredByRetry===true,clientOnlyPool1Literal:r.rendered.clientOnlyPool1Literal,clientOnlyPoolIntervalMoneyMentions:r.rendered.clientOnlyPoolIntervalMoneyMentions},discovery:r.discovery})),decision:x.decision},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: pool1-headless-rendered-dom-v1
          path: loterias-ai/casino/jackpots/evidence/botemania-pool1-headless-rendered-dom-v1.json
          retention-days: 7
