# verification trigger 2026-08-21
name: Loterias AI Edge Live Fast Watch V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/edge-live/botemania-fast-meter-sample-v1.mjs'
      - 'loterias-ai/edge-live/botemania-all-network-fast-meter-sample-v1.mjs'
      - 'loterias-ai/edge-live/meter-stasis-core-v1.mjs'
      - 'loterias-ai/edge-live/meter-stasis-tracker-v1.mjs'
      - 'loterias-ai/edge-live/progressive-score-research-v1.mjs'
      - 'loterias-ai/edge-live/edge-live-multi-execution-plan-v1.mjs'
      - 'loterias-ai/edge-live/opportunity-registry-v1.json'
      - 'loterias-ai/edge-live/telegram-edge-alert-v1.mjs'
      - 'loterias-ai/edge-live/edge-live-execution-plan-v1.mjs'
      - 'loterias-ai/casino/jackpots/jpk-live-source-core-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-jpk-near-cap-ev-scenarios-v1.mjs'
      - 'loterias-ai/casino/jackpots/jpk-near-cap-current-refresh-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-jpk-live-gate-v1.mjs'
      - 'loterias-ai/casino/five-euro-real-pilot-gate-v1.mjs'
      - 'loterias-ai/casino/jackpots/generic-jackpot-identity-v2.mjs'
      - 'loterias-ai/casino/jackpots/botemania-generic-fast-reset-ledger-v1.mjs'
      - 'loterias-ai/casino/jackpots/diamond-bonanza-reset-core-v1.mjs'
      - 'loterias-ai/casino/jackpots/diamond-bonanza-prospective-reset-ledger-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-jpk-reset-reconstructor-v1.mjs'
      - 'loterias-ai/casino/jackpots/jackpot-king-mbwb-inference-v1.mjs'
      - 'loterias-ai/casino/botemania-global-economic-gate-v1.mjs'
      - '.github/workflows/loterias-ai-edge-live-fast-watch-v1.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: loterias-ai-edge-live-fast-watch-v1
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Watch live casino economic lanes every 15 seconds
        env:
          EDGE_LIVE_TELEGRAM_BOT_TOKEN: ${{ secrets.EDGE_LIVE_TELEGRAM_BOT_TOKEN }}
          EDGE_LIVE_TELEGRAM_CHAT_ID: ${{ secrets.EDGE_LIVE_TELEGRAM_CHAT_ID }}
          EDGE_LIVE_URL: https://alvarogavilan.github.io/loterias-ai/edge-live/
        shell: bash
        run: |
          set -u
          successful=0
          for i in $(seq 1 12); do
            echo "EDGE LIVE casino sample $i/12 at $(date -u +%FT%TZ)"
            if node loterias-ai/edge-live/botemania-all-network-fast-meter-sample-v1.mjs; then
              successful=$((successful+1))
              node loterias-ai/casino/jackpots/botemania-generic-fast-reset-ledger-v1.mjs || echo 'WARN: generic stable-ID ledger refresh failed closed'
              node loterias-ai/edge-live/meter-stasis-tracker-v1.mjs || echo 'WARN: meter stasis refresh failed closed'
              node loterias-ai/casino/jackpots/diamond-bonanza-prospective-reset-ledger-v1.mjs || echo 'WARN: Diamond prospective reset ledger failed closed'
              node loterias-ai/edge-live/botemania-fast-meter-sample-v1.mjs || echo 'WARN: JPK auxiliary meter failed; all-network state retained'
              node loterias-ai/casino/jackpots/botemania-jpk-reset-reconstructor-v1.mjs || echo 'WARN: JPK reset reconstructor failed; no hazard inference promotion'
              node loterias-ai/casino/jackpots/jackpot-king-mbwb-inference-v1.mjs || echo 'WARN: JPK MBWB inference failed; retaining prior fail-closed state'
              node loterias-ai/casino/jackpots/botemania-jpk-near-cap-ev-scenarios-v1.mjs && node loterias-ai/casino/jackpots/jpk-near-cap-current-refresh-v1.mjs || echo 'WARN: JPK current sensitivity rebuild/refresh failed closed'
              node loterias-ai/casino/jackpots/botemania-jpk-live-gate-v1.mjs || echo 'WARN: JPK lightweight live gate refresh failed closed'
              node loterias-ai/casino/five-euro-real-pilot-gate-v1.mjs || echo 'WARN: JPK pilot gate refresh failed closed'
              node loterias-ai/edge-live/edge-live-execution-plan-v1.mjs || echo 'WARN: JPK single-plan refresh failed closed'
              node loterias-ai/edge-live/progressive-score-research-v1.mjs || echo 'WARN: SCORE refresh failed; retaining last valid output'
              node loterias-ai/edge-live/edge-live-multi-execution-plan-v1.mjs || echo 'WARN: multi-plan refresh failed closed'
              node loterias-ai/casino/botemania-global-economic-gate-v1.mjs || echo 'WARN: global gate refresh failed closed'
              node loterias-ai/edge-live/telegram-edge-alert-v1.mjs || echo 'WARN: Telegram delivery failed; monitoring continues'
            else
              echo 'WARN: transient all-network sample failure; continuing to next sample'
            fi
            if [ "$i" -lt 12 ]; then sleep 15; fi
          done
          echo "Successful live samples: $successful/12"
          if [ "$successful" -eq 0 ]; then
            echo 'ERROR: no valid live sample in this burst'
            exit 1
          fi

      - name: Persist last valid casino live state immediately
        shell: bash
        run: |
          set -euo pipefail
          STATE=loterias-ai/edge-live/telegram-alert-state.json
          DIAG=loterias-ai/edge-live/telegram-alert-diagnostic.json
          JPK_LEDGER=loterias-ai/casino/jackpots/evidence/botemania-jpk-fast-reset-ledger-v1.json
          JPK_RECON=loterias-ai/casino/jackpots/evidence/botemania-jpk-reset-reconstructor-v1.json
          JPK_INFERENCE=loterias-ai/casino/jackpots/evidence/jackpot-king-mbwb-inference-v1.json
          JPK_EV=loterias-ai/casino/jackpots/evidence/botemania-jpk-near-cap-ev-scenarios-v1.json
          JPK_LIVE=loterias-ai/casino/jackpots/evidence/botemania-jpk-live-gate-v1.json
          PILOT_GATE=loterias-ai/casino/evidence/five-euro-real-pilot-gate-v1.json
          GENERIC_LEDGER=loterias-ai/casino/jackpots/evidence/botemania-generic-fast-reset-ledger-v1.json
          DIAMOND_LEDGER=loterias-ai/casino/jackpots/evidence/diamond-bonanza-prospective-reset-ledger-v1.json
          ALL_NETWORK=loterias-ai/edge-live/evidence/botemania-all-network-live-state-v1.json
          STASIS=loterias-ai/edge-live/evidence/meter-stasis-ledger-v1.json
          SCORE=loterias-ai/edge-live/evidence/progressive-score-research-v1.json
          PLAN=loterias-ai/edge-live/evidence/edge-live-execution-plan-v1.json
          MULTI_PLAN=loterias-ai/edge-live/evidence/edge-live-multi-execution-plan-v1.json
          GLOBAL_GATE=loterias-ai/casino/evidence/botemania-global-economic-gate-v1.json
          mkdir -p /tmp/edge-live-fast
          copied=0
          for f in "$STATE" "$DIAG" "$JPK_LEDGER" "$JPK_RECON" "$JPK_INFERENCE" "$JPK_EV" "$JPK_LIVE" "$PILOT_GATE" "$GENERIC_LEDGER" "$DIAMOND_LEDGER" "$ALL_NETWORK" "$STASIS" "$SCORE" "$PLAN" "$MULTI_PLAN" "$GLOBAL_GATE"; do
            if [ -f "$f" ]; then cp "$f" "/tmp/edge-live-fast/$(basename "$f")"; copied=1; fi
          done
          if [ "$copied" -eq 0 ]; then exit 1; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p loterias-ai/edge-live/evidence loterias-ai/casino/evidence loterias-ai/casino/jackpots/evidence
          [ ! -f /tmp/edge-live-fast/telegram-alert-state.json ] || cp /tmp/edge-live-fast/telegram-alert-state.json "$STATE"
          [ ! -f /tmp/edge-live-fast/telegram-alert-diagnostic.json ] || cp /tmp/edge-live-fast/telegram-alert-diagnostic.json "$DIAG"
          [ ! -f /tmp/edge-live-fast/botemania-jpk-fast-reset-ledger-v1.json ] || cp /tmp/edge-live-fast/botemania-jpk-fast-reset-ledger-v1.json "$JPK_LEDGER"
          [ ! -f /tmp/edge-live-fast/botemania-jpk-reset-reconstructor-v1.json ] || cp /tmp/edge-live-fast/botemania-jpk-reset-reconstructor-v1.json "$JPK_RECON"
          [ ! -f /tmp/edge-live-fast/jackpot-king-mbwb-inference-v1.json ] || cp /tmp/edge-live-fast/jackpot-king-mbwb-inference-v1.json "$JPK_INFERENCE"
          [ ! -f /tmp/edge-live-fast/botemania-jpk-near-cap-ev-scenarios-v1.json ] || cp /tmp/edge-live-fast/botemania-jpk-near-cap-ev-scenarios-v1.json "$JPK_EV"
          [ ! -f /tmp/edge-live-fast/botemania-jpk-live-gate-v1.json ] || cp /tmp/edge-live-fast/botemania-jpk-live-gate-v1.json "$JPK_LIVE"
          [ ! -f /tmp/edge-live-fast/five-euro-real-pilot-gate-v1.json ] || cp /tmp/edge-live-fast/five-euro-real-pilot-gate-v1.json "$PILOT_GATE"
          [ ! -f /tmp/edge-live-fast/botemania-generic-fast-reset-ledger-v1.json ] || cp /tmp/edge-live-fast/botemania-generic-fast-reset-ledger-v1.json "$GENERIC_LEDGER"
          [ ! -f /tmp/edge-live-fast/diamond-bonanza-prospective-reset-ledger-v1.json ] || cp /tmp/edge-live-fast/diamond-bonanza-prospective-reset-ledger-v1.json "$DIAMOND_LEDGER"
          [ ! -f /tmp/edge-live-fast/botemania-all-network-live-state-v1.json ] || cp /tmp/edge-live-fast/botemania-all-network-live-state-v1.json "$ALL_NETWORK"
          [ ! -f /tmp/edge-live-fast/meter-stasis-ledger-v1.json ] || cp /tmp/edge-live-fast/meter-stasis-ledger-v1.json "$STASIS"
          [ ! -f /tmp/edge-live-fast/progressive-score-research-v1.json ] || cp /tmp/edge-live-fast/progressive-score-research-v1.json "$SCORE"
          [ ! -f /tmp/edge-live-fast/edge-live-execution-plan-v1.json ] || cp /tmp/edge-live-fast/edge-live-execution-plan-v1.json "$PLAN"
          [ ! -f /tmp/edge-live-fast/edge-live-multi-execution-plan-v1.json ] || cp /tmp/edge-live-fast/edge-live-multi-execution-plan-v1.json "$MULTI_PLAN"
          [ ! -f /tmp/edge-live-fast/botemania-global-economic-gate-v1.json ] || cp /tmp/edge-live-fast/botemania-global-economic-gate-v1.json "$GLOBAL_GATE"
          git add -- "$STATE" "$DIAG" "$JPK_LEDGER" "$JPK_RECON" "$JPK_INFERENCE" "$JPK_EV" "$JPK_LIVE" "$PILOT_GATE" "$GENERIC_LEDGER" "$DIAMOND_LEDGER" "$ALL_NETWORK" "$STASIS" "$SCORE" "$PLAN" "$MULTI_PLAN" "$GLOBAL_GATE" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No state change to persist'
            exit 0
          fi
          git commit -m 'data(edge-live): persist resilient casino all-network SCORE state'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
