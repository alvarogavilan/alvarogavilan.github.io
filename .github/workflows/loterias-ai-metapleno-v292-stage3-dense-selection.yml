name: Loterias AI MetaPleno v292 Stage3 Dense Selection
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v292-million-scientist-funnel]
    paths:
      - loterias-ai/research/megalab/v292-stage3-dense-selection-screen.mjs
permissions:
  contents: write
concurrency:
  group: loterias-ai-v292-stage3
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Run dense selection screen
        run: node loterias-ai/research/megalab/v292-stage3-dense-selection-screen.mjs
      - name: Verify OOS untouched and economics fail closed
        run: node -e "const x=require('./loterias-ai/data/research/metapleno-v292-stage3-dense-selection-screen.json');if(x.validationTouched||x.postFreezeTouched||!x.selectionOnly||x.survivors>1024||x.realMoneyPass||x.realStakeEUR!==0)process.exit(1)"
      - name: Persist stage3 evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/metapleno-v292-stage3-dense-selection-screen.json
          git commit -m 'data(loterias-ai): persist v292 stage3 dense selection' || exit 0
          git push