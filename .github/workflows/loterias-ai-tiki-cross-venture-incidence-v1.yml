name: Loterias AI Tiki Cross Venture Incidence V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'loterias-ai/casino/jackpots/tiki-cross-venture-incidence-v1.mjs'
      - 'loterias-ai/tests/tiki-cross-venture-incidence-v1.test.mjs'
      - '.github/workflows/loterias-ai-tiki-cross-venture-incidence-v1.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deterministic guards
        run: node loterias-ai/tests/tiki-cross-venture-incidence-v1.test.mjs
      - name: Compare public Spanish venture incidence
        run: node loterias-ai/casino/jackpots/tiki-cross-venture-incidence-v1.mjs
      - name: Verify fail-closed result
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync('loterias-ai/casino/jackpots/evidence/tiki-cross-venture-incidence-v1.json','utf8'));
          if(x?.coverage?.publicFeedCoverageComplete!==true) throw new Error('both public feeds were not recovered');
          if(x?.coverage?.pageCoverageComplete!==true) throw new Error('candidate page coverage incomplete');
          if(x?.decision?.exactGameBindingRecovered!==false) throw new Error('incidence probe must never self-bind a game');
          if(x?.decision?.identityPromotionAllowed!==false||x?.decision?.economicPromotionAllowed!==false||x?.decision?.realMoneyAllowed!==false) throw new Error('promotion opened unexpectedly');
          console.log(JSON.stringify({coverage:x.coverage,availability:x.availability,comparison:x.comparison,decision:x.decision,interpretation:x.interpretation},null,2));
          NODE
