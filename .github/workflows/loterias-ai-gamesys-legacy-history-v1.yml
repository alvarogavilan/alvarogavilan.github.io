name: Loterias AI Gamesys Legacy History V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/gamesys-legacy-history-probe-v1.mjs'
      - 'loterias-ai/tests/gamesys-legacy-history-probe-v1.test.mjs'
      - 'loterias-ai/casino/jackpots/evidence/botemania-legacy-feed-bindings-v1.json'
      - '.github/workflows/loterias-ai-gamesys-legacy-history-v1.yml'

permissions:
  contents: write

concurrency:
  group: loterias-ai-gamesys-legacy-history-v1
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate and refresh legacy jackpot history
        shell: bash
        run: |
          set -euo pipefail
          node loterias-ai/tests/gamesys-legacy-history-probe-v1.test.mjs
          node loterias-ai/casino/jackpots/gamesys-legacy-history-probe-v1.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/casino/jackpots/evidence/gamesys-legacy-history-probe-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(edge): refresh Gamesys legacy jackpot history'
          git pull --rebase origin main
          git push origin HEAD:main
