name: Loterias AI Freeze Bonoloto MetaPleno v10 Compact 2026-08-15
on:
  push:
    paths:
      - 'loterias-ai/scripts/freeze-bonoloto-metapleno-v10-compact-2026-08-15.mjs'
      - '.github/workflows/loterias-ai-freeze-bonoloto-metapleno-v10-compact-2026-08-15.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/download-artifact@v4
        with:
          pattern: meta-pleno-v5-*
          path: /tmp/meta-v5
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: 31878379467
      - name: Restore v5 shards
        run: |
          mkdir -p loterias-ai/data/research/meta-pleno-v5-shards
          find /tmp/meta-v5 -name '*.json' -exec cp {} loterias-ai/data/research/meta-pleno-v5-shards/ \;
      - name: Freeze compact panel
        run: node loterias-ai/scripts/freeze-bonoloto-metapleno-v10-compact-2026-08-15.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/shadow/bonoloto-2026-08-15-metapleno-v10-compact.json /tmp/shadow.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/shadow.json loterias-ai/data/shadow/bonoloto-2026-08-15-metapleno-v10-compact.json
            git add loterias-ai/data/shadow/bonoloto-2026-08-15-metapleno-v10-compact.json
            git commit -m 'data(loterias-ai): freeze compact Bonoloto MetaPleno shadow' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
