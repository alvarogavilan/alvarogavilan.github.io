name: Loterias AI MetaPleno v90 Bonoloto Family Multiplicity Audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v90-bonoloto-family-multiplicity-audit.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v90-bonoloto-family-multiplicity-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v90-bonoloto-family-multiplicity-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v90-bonoloto-family-multiplicity
          path: loterias-ai/data/research/meta-pleno-v90-bonoloto-family-multiplicity-audit.json
