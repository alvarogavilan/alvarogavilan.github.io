name: Loterias AI Top EGT Jackpot Economics One Shot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/playuzu/audit-top-egt-jackpot-economics-v1.mjs'
      - '.github/workflows/loterias-ai-top-egt-jackpot-economics-one-shot.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node loterias-ai/casino/playuzu/audit-top-egt-jackpot-economics-v1.mjs
      - run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add loterias-ai/casino/playuzu/evidence/top-egt-jackpot-economics-v1.json
          git diff --cached --quiet && exit 0
          git commit -m 'research(playuzu): persist top EGT jackpot economics audit'
          git pull --rebase origin main
          git push origin HEAD:main
