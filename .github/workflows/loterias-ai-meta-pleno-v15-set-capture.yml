name: Loterias AI MetaPleno v15 Set Capture
on:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v15-set-capture-shard.mjs'
      - 'loterias-ai/scripts/meta-pleno-v15-set-capture-aggregate.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v15-set-capture.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: loterias-ai-meta-pleno-v15-set-capture
  cancel-in-progress: true
jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        game: [bonoloto, primitiva, euromillones, gordo-primitiva]
        shard: [0,1,2,3,4]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: GAME=${{ matrix.game }} SHARD=${{ matrix.shard }} CANDIDATES=12500 node loterias-ai/scripts/meta-pleno-v15-set-capture-shard.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v15-${{ matrix.game }}-${{ matrix.shard }}
          path: loterias-ai/data/research/meta-pleno-v15-shards/${{ matrix.game }}-${{ matrix.shard }}.json
  aggregate:
    needs: search
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: v15-*
          path: loterias-ai/data/research/meta-pleno-v15-shards
          merge-multiple: true
      - run: node loterias-ai/scripts/meta-pleno-v15-set-capture-aggregate.mjs
      - name: Persist aggregate and reusable candidate population safely
        shell: bash
        run: |
          rm -rf /tmp/meta-pleno-v15-shards
          cp -R loterias-ai/data/research/meta-pleno-v15-shards /tmp/meta-pleno-v15-shards
          cp loterias-ai/data/research/meta-pleno-v15-set-capture.json /tmp/meta-pleno-v15-set-capture.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf loterias-ai/data/research/meta-pleno-v15-shards
            cp -R /tmp/meta-pleno-v15-shards loterias-ai/data/research/meta-pleno-v15-shards
            cp /tmp/meta-pleno-v15-set-capture.json loterias-ai/data/research/meta-pleno-v15-set-capture.json
            git add loterias-ai/data/research/meta-pleno-v15-shards loterias-ai/data/research/meta-pleno-v15-set-capture.json
            git commit -m 'data(loterias-ai): persist v15 set-capture population' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
