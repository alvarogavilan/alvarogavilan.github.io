name: Loterias AI v297 Stage4 Strict OOS
on:
  workflow_dispatch:
  push:
    branches:
      - research/metapleno-v297-reservoir-computing
    paths:
      - '.github/workflows/loterias-ai-v297-stage4.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-v297-stage4-${{ github.ref }}
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run strict blind OOS 2023-2024
        run: node loterias-ai/research/megalab/v297-stage4-strict-oos.mjs
      - name: Verify frozen hash and OOS gates
        run: node -e "const x=require('./loterias-ai/data/research/metapleno-v297-stage4-strict-oos.json');const m=require('./loterias-ai/data/research/metapleno-v297-frozen-manifest.json');if(x.manifestHash!==m.manifestHash||x.retuningPerformed||x.postFreezeTouched||x.read2025Plus||x.realMoneyPass||x.realStakeEUR!==0)process.exit(1)"
      - name: Persist OOS evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/metapleno-v297-stage4-strict-oos.json
          git commit -m 'data(loterias-ai): persist v297 strict OOS' || exit 0
          git pull --rebase origin research/metapleno-v297-reservoir-computing
          git push
