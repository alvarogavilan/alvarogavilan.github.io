name: Loterias AI MetaPleno v318 Stage1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/data/research/metapleno-v318-preregister.json'
      - 'loterias-ai/data/research/metapleno-v318-preexecution-amendment.json'
      - 'loterias-ai/research/megalab/v318-stage1-development.mjs'
      - '.github/workflows/loterias-ai-metapleno-v318-stage1.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-metapleno-v318-stage1
  cancel-in-progress: false
jobs:
  stage1:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Run development-only hierarchical screen
        run: node loterias-ai/research/megalab/v318-stage1-development.mjs
      - name: Verify temporal and money gates
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='loterias-ai/data/research/metapleno-v318-stage1-development.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          if(j.temporalIsolation?.validationTouched!==false||j.temporalIsolation?.blindOosTouched!==false||j.temporalIsolation?.postFreezeTouched!==false) throw new Error('temporal isolation failed');
          for(const files of Object.values(j.temporalIsolation?.openedFiles||{})) for(const f of files) if(Number(String(f).slice(0,4))>2018) throw new Error('future archive file opened');
          if(j.guards?.retuningPerformed!==false||j.guards?.realMoneyPass!==false||Number(j.guards?.realStakeEUR)!==0) throw new Error('safety gate failed');
          if(Number(j.guards?.maximumTheoreticalCostEURPerGameDraw)>14) throw new Error('budget gate failed');
          if(!['DEVELOPMENT_SIGNAL_CANDIDATES_FROZEN_FOR_VALIDATION','CLOSED_NO_DEVELOPMENT_SIGNAL'].includes(j.status)) throw new Error('unexpected status');
          NODE
      - name: Persist stage1 result race-safe
        shell: bash
        run: |
          set -euo pipefail
          TARGET='loterias-ai/data/research/metapleno-v318-stage1-development.json'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$TARGET"
          git diff --cached --quiet && exit 0
          git commit -m 'data(loterias-ai): persist v318 development screen'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; sleep $((attempt*2)); continue; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
