name: Loterias AI Probe SELAE Dated Endpoints
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/probe-selae-date-endpoints.mjs'
      - '.github/workflows/loterias-ai-probe-selae-date-endpoints.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node loterias-ai/scripts/probe-selae-date-endpoints.mjs
      - name: Persist
        shell: bash
        run: |
          cp loterias-ai/data/probes/selae-date-endpoints.json /tmp/selae-date-endpoints.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p loterias-ai/data/probes
          cp /tmp/selae-date-endpoints.json loterias-ai/data/probes/selae-date-endpoints.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/probes/selae-date-endpoints.json
          git commit -m 'data(loterias-ai): persist SELAE endpoint probe' || exit 0
          git push origin HEAD:main
