name: Loterias AI Bonoloto Official Repair
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/repair-bonoloto-2022-06-24-official.mjs'
      - '.github/workflows/loterias-ai-bonoloto-repair.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-bonoloto-official-repair
  cancel-in-progress: true
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Recompute dual-route repair on latest main and persist safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            node loterias-ai/scripts/repair-bonoloto-2022-06-24-official.mjs
            GAME=bonoloto BATCH_LIMIT=5 node loterias-ai/scripts/enrich-core-number-game-official-economics.mjs
            BATCH_LIMIT=120 node loterias-ai/scripts/crosscheck-bonoloto-official-results.mjs
            node loterias-ai/scripts/quarantine-bonoloto-official-conflicts.mjs
            node loterias-ai/scripts/build-national-archive-index.mjs
            node loterias-ai/scripts/build-completeness-index.mjs

            git add \
              loterias-ai/data/archive/bonoloto/2022.json \
              loterias-ai/data/archive/_meta/bonoloto-official-economics.json \
              loterias-ai/data/archive/_meta/bonoloto-official-conflicts.json \
              loterias-ai/data/audits/bonoloto-2022-06-24-conflict.json \
              loterias-ai/data/archive

            if git diff --cached --quiet; then
              echo 'No semantic repair changes to persist.'
              exit 0
            fi

            git commit -m 'data(bonoloto): resolve 2022-06-24 with dual SELAE evidence'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
