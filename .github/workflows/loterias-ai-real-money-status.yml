name: Loterias AI Real Money Status
on:
  push:
    paths:
      - 'loterias-ai/data/backtests/**'
      - 'loterias-ai/scripts/build-real-money-status.mjs'
      - '.github/workflows/loterias-ai-real-money-status.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node loterias-ai/scripts/build-real-money-status.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/gates/real-money-status.json /tmp/status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/status.json loterias-ai/data/gates/real-money-status.json
            git add loterias-ai/data/gates/real-money-status.json
            git commit -m 'data(loterias-ai): refresh real-money status' || exit 0
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
