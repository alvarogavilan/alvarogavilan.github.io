name: Loterias AI Archive Derived Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/scripts/audit-national-archive.mjs'
      - 'loterias-ai/scripts/build-archive-coverage-priorities.mjs'
      - 'loterias-ai/data/archive/bonoloto/**'
      - 'loterias-ai/data/archive/primitiva/**'
      - 'loterias-ai/data/archive/euromillones/**'
      - 'loterias-ai/data/archive/gordo-primitiva/**'
      - 'loterias-ai/data/archive/eurodreams/**'
      - 'loterias-ai/data/archive/loteria-nacional/**'
      - 'loterias-ai/data/archive/quiniela/**'
      - 'loterias-ai/data/archive/elige8/**'
      - 'loterias-ai/data/archive/quinigol/**'
      - 'loterias-ai/data/archive/lototurf/**'
      - 'loterias-ai/data/archive/quintuple-plus/**'
      - '.github/workflows/loterias-ai-archive-derived-sync.yml'
  schedule:
    - cron: '42 * * * *'

permissions:
  contents: write

concurrency:
  group: loterias-ai-archive-derived-sync
  cancel-in-progress: true

jobs:
  derived-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recompute archive audit and coverage priorities from latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            cp loterias-ai/data/archive/_meta/archive-audit.json /tmp/archive-audit.prev.json 2>/dev/null || true
            cp loterias-ai/data/archive/_meta/archive-coverage-priorities.json /tmp/archive-priorities.prev.json 2>/dev/null || true

            node loterias-ai/scripts/audit-national-archive.mjs
            node loterias-ai/scripts/build-archive-coverage-priorities.mjs

            node <<'NODE'
            const fs=require('fs');
            function semantic(file, previous, volatileKeys){
              if(!fs.existsSync(file)||!fs.existsSync(previous)) return;
              const strip=(value)=>{
                if(Array.isArray(value)) return value.map(strip);
                if(value&&typeof value==='object'){
                  const out={};
                  for(const [k,v] of Object.entries(value)) if(!volatileKeys.has(k)) out[k]=strip(v);
                  return out;
                }
                return value;
              };
              const now=strip(JSON.parse(fs.readFileSync(file,'utf8')));
              const old=strip(JSON.parse(fs.readFileSync(previous,'utf8')));
              if(JSON.stringify(now)===JSON.stringify(old)) fs.copyFileSync(previous,file);
            }
            semantic('loterias-ai/data/archive/_meta/archive-audit.json','/tmp/archive-audit.prev.json',new Set(['generatedAt']));
            semantic('loterias-ai/data/archive/_meta/archive-coverage-priorities.json','/tmp/archive-priorities.prev.json',new Set(['generatedAt','manifestGeneratedAt','auditGeneratedAt']));
            NODE

            node <<'NODE'
            const fs=require('fs');
            const manifest=JSON.parse(fs.readFileSync('loterias-ai/data/archive/manifest.json','utf8'));
            const audit=JSON.parse(fs.readFileSync('loterias-ai/data/archive/_meta/archive-audit.json','utf8'));
            const priorities=JSON.parse(fs.readFileSync('loterias-ai/data/archive/_meta/archive-coverage-priorities.json','utf8'));
            if(audit.qualityGate?.pass!==true) throw Error('archive audit quality gate failed');
            const manifestRecords=Number(manifest.totals?.records)||0;
            const manifestValidated=Number(manifest.totals?.validatedRecords)||0;
            const manifestEconomics=Number(manifest.totals?.economicsRecords)||0;
            if(Number(priorities.totals?.records)!==manifestRecords) throw Error(`archive records mismatch: priorities=${priorities.totals?.records} manifest=${manifestRecords}`);
            if(Number(priorities.totals?.validatedRecords)!==manifestValidated) throw Error(`archive validated mismatch: priorities=${priorities.totals?.validatedRecords} manifest=${manifestValidated}`);
            if(Number(priorities.totals?.economicsRecords)!==manifestEconomics) throw Error(`archive economics mismatch: priorities=${priorities.totals?.economicsRecords} manifest=${manifestEconomics}`);
            if(manifestRecords<=0||manifestValidated<0||manifestValidated>manifestRecords) throw Error('invalid archive manifest totals');
            NODE

            git add \
              loterias-ai/data/archive/_meta/archive-audit.json \
              loterias-ai/data/archive/_meta/archive-coverage-priorities.json

            if git diff --cached --quiet; then
              echo 'Archive derived QA already synchronized.'
              exit 0
            fi

            git commit -m 'qa(archive): synchronize audit and coverage priorities'
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "main moved during archive QA persistence; recomputing attempt $attempt/5"
            sleep $((attempt * 2))
          done

          echo 'Unable to persist archive derived QA after five recomputations.' >&2
          exit 1
