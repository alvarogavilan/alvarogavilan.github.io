name: MetaPleno v311 Stage1-2 Hawkes Screen

on:
  push:
    branches:
      - research/metapleno-v311-hawkes-self-exciting
    paths:
      - 'loterias-ai/research/megalab/v311-stage1-2-hawkes-screen.mjs'
      - 'loterias-ai/data/research/metapleno-v311-preregister.json'
      - '.github/workflows/metapleno-v311-stage1-2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/metapleno-v311-hawkes-self-exciting
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Execute preregistered development screening
        run: node loterias-ai/research/megalab/v311-stage1-2-hawkes-screen.mjs
      - name: Verify fail-closed and temporal isolation
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='loterias-ai/data/research/metapleno-v311-stage1-2.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          if(j.realMoneyPass!==false||j.realStakeEUR!==0||j.theoreticalBudgetEURMax>15) process.exit(1);
          if(j.validationTouched!==false||j.postFreezeTouched!==false||j.retuningPerformed!==false) process.exit(1);
          if(j.developmentEndExclusive!=='2023-01-01'||j.status!=='DEVELOPMENT_SCREEN_ONLY') process.exit(1);
          NODE
      - name: Persist development evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/research/metapleno-v311-stage1-2.json
          git diff --cached --quiet && exit 0
          git commit -m 'research(v311): persist Hawkes development screen'
          git pull --rebase origin research/metapleno-v311-hawkes-self-exciting
          git push origin HEAD:research/metapleno-v311-hawkes-self-exciting
