name: Loterias AI Fechav3 Probe
on:
  push:
    paths:
      - 'loterias-ai/scripts/probe-fechav3.mjs'
      - '.github/workflows/loterias-ai-fechav3-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe official data service
        run: node loterias-ai/scripts/probe-fechav3.mjs
      - name: Persist probe snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/probes/fechav3-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(loterias-ai): refresh SELAE fechav3 probe'
          git pull --rebase origin main
          git push origin HEAD:main
