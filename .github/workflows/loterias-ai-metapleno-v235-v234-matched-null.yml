name: Loterias AI MetaPleno v235 v234 Matched Null
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v235-v234-matched-null]
    paths:
      - 'loterias-ai/research/metapleno-v235-v234-matched-null.mjs'
      - '.github/workflows/loterias-ai-metapleno-v235-v234-matched-null.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run v235
        run: node loterias-ai/research/metapleno-v235-v234-matched-null.mjs
      - name: Validate fail-closed
        run: node -e "const r=require('./loterias-ai/data/research/metapleno-v235-v234-matched-null.json'); if(r.realMoneyPass!==false||r.realStakeEUR!==0) process.exit(1)"
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/metapleno-v235-v234-matched-null.json
          git diff --cached --quiet || git commit -m 'research(loterias-ai): persist v235 v234 matched-null audit'
          git push