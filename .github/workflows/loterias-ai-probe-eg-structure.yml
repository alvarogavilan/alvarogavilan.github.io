name: Loterias AI El Gordo Structure Probe
on:
  push:
    paths:
      - 'loterias-ai/scripts/probe-eg-structure.mjs'
      - '.github/workflows/loterias-ai-probe-eg-structure.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/probe-eg-structure.mjs
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/probes/eg-structure.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(loterias-ai): El Gordo structure probe'
          git pull --rebase origin main
          git push origin HEAD:main