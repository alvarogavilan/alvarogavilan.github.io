name: Loterias AI Bonoloto Official Tournament V3 One Shot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/scripts/bonoloto-financial-tournament-official-v3.mjs'
      - 'loterias-ai/data/archive/_meta/bonoloto-official-payouts-recent-v1.json'
      - '.github/workflows/loterias-ai-bonoloto-official-tournament-v3-one-shot.yml'
permissions:
  contents: write
jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Recompute from corrected SELAE-only evidence
        run: node loterias-ai/scripts/bonoloto-financial-tournament-official-v3.mjs
      - name: Persist immutable result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/backtests/bonoloto-financial-tournament-official-v3.json
          git diff --cached --quiet && exit 0
          git commit -m 'research(bonoloto): persist SELAE-only financial tournament v3'
          git pull --rebase origin main
          git push origin HEAD:main
