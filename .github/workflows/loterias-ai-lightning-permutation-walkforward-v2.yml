name: Loterias AI Lightning Permutation Walkforward v2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/lightning/research/lightning-permutation-walkforward-v2.mjs'
      - '.github/workflows/loterias-ai-lightning-permutation-walkforward-v2.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-lightning-permutation-walkforward-v2
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node loterias-ai/casino/lightning/research/lightning-permutation-walkforward-v2.mjs
      - name: Persist v2 audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/casino/lightning/evidence/permutation-walkforward-v2.json
          git commit -m "research(casino): persist Lightning permutation walk-forward v2" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
