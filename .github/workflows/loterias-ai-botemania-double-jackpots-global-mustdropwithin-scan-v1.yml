name: Loterias AI Botemania Double Jackpots Global MustDropWithin Scan V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/botemania-double-jackpots-global-mustdropwithin-scan-v1.mjs'
      - '.github/workflows/loterias-ai-botemania-double-jackpots-global-mustdropwithin-scan-v1.yml'
  schedule:
    - cron: '14 */4 * * *'

permissions:
  contents: write

concurrency:
  group: loterias-ai-botemania-double-jackpots-global-mustdropwithin-scan-v1
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Scan full Botemania bundle for mustDropWithin references
        run: node loterias-ai/casino/jackpots/botemania-double-jackpots-global-mustdropwithin-scan-v1.mjs
      - name: Persist evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/casino/jackpots/evidence/botemania-double-jackpots-global-mustdropwithin-scan-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(casino): refresh Botemania global mustDropWithin scan'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
