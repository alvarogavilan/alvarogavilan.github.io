name: Loterias AI MetaPleno v319 Stage1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/data/research/metapleno-v319-preregister.json'
      - 'loterias-ai/research/megalab/v319-stage1-development.mjs'
      - '.github/workflows/loterias-ai-metapleno-v319-stage1.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-metapleno-v319-stage1
  cancel-in-progress: false
jobs:
  stage1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Run development-only variable-order context screen
        run: node loterias-ai/research/megalab/v319-stage1-development.mjs
      - name: Verify temporal and safety gates
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('loterias-ai/data/research/metapleno-v319-stage1-development.json','utf8'));
          if(j.temporalIsolation?.validationTouched!==false||j.temporalIsolation?.blindOosTouched!==false||j.temporalIsolation?.postFreezeTouched!==false) throw new Error('temporal isolation failed');
          for(const files of Object.values(j.temporalIsolation?.openedFiles||{})) for(const f of files) if(Number(String(f).slice(0,4))>2018) throw new Error('future archive file opened');
          if(j.guards?.retuningPerformed!==false||j.guards?.realMoneyPass!==false||Number(j.guards?.realStakeEUR)!==0) throw new Error('safety gate failed');
          if(Number(j.guards?.maximumTheoreticalCostEURPerGameDraw)>14) throw new Error('budget gate failed');
          NODE
      - name: Persist result race-safe
        shell: bash
        run: |
          set -euo pipefail
          TARGET='loterias-ai/data/research/metapleno-v319-stage1-development.json'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$TARGET"
          git diff --cached --quiet && exit 0
          git commit -m 'data(loterias-ai): persist v319 context development screen'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; sleep $((attempt*2)); continue; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
