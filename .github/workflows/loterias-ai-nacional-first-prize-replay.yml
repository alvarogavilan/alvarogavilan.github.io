name: Loterias AI Nacional First Prize Replay Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/data/archive/loteria-nacional/*.json'
      - 'loterias-ai/data/models/nacional-rule-era-registry.json'
      - 'loterias-ai/data/validation/nacional-payout-reconstruction.json'
      - 'loterias-ai/scripts/loteria-nacional-first-prize-replay-audit.mjs'
      - '.github/workflows/loterias-ai-nacional-first-prize-replay.yml'

permissions:
  contents: write

concurrency:
  group: loterias-ai-nacional-first-prize-replay
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit unchanged prior first-prize replay with exact SELAE settlement
        run: node loterias-ai/scripts/loteria-nacional-first-prize-replay-audit.mjs
      - name: Persist replay evidence against moving main
        shell: bash
        run: |
          set -euo pipefail
          TARGET='loterias-ai/data/backtests/loteria-nacional-first-prize-replay-audit.json'
          cp "$TARGET" /tmp/nacional-replay.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$(dirname "$TARGET")"
            cp /tmp/nacional-replay.json "$TARGET"
            git add "$TARGET"
            if git diff --cached --quiet; then
              echo 'Replay evidence unchanged.'
              exit 0
            fi
            git commit -m 'data(loterias-ai): refresh Nacional first-prize replay audit'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo 'Unable to persist Nacional replay after retries.' >&2
          exit 1
