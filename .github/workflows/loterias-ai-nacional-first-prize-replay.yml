name: Loterias AI Nacional First Prize Replay Audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/loteria-nacional-first-prize-replay-audit.mjs'
      - '.github/workflows/loterias-ai-nacional-first-prize-replay.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit repeating prior first-prize numbers with exact SELAE settlement
        run: node loterias-ai/scripts/loteria-nacional-first-prize-replay-audit.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/backtests/loteria-nacional-first-prize-replay-audit.json /tmp/nacional-replay.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p loterias-ai/data/backtests
          cp /tmp/nacional-replay.json loterias-ai/data/backtests/loteria-nacional-first-prize-replay-audit.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/backtests/loteria-nacional-first-prize-replay-audit.json
          git commit -m 'data(loterias-ai): persist Nacional first-prize replay audit' || exit 0
          git push origin HEAD:main
