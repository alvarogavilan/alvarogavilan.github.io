name: Loterias AI Tiki Tropico Exact Live Binding V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'loterias-ai/casino/jackpots/tiki-tropico-exact-live-binding-v1.mjs'
      - 'loterias-ai/tests/tiki-tropico-exact-live-binding-v1.test.mjs'
      - '.github/workflows/loterias-ai-tiki-tropico-exact-live-binding-v1.yml'
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/tiki-tropico-exact-live-binding-v1.mjs'
      - '.github/workflows/loterias-ai-tiki-tropico-exact-live-binding-v1.yml'
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: loterias-ai-tiki-tropico-exact-live-binding-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deterministic binding guards
        run: node loterias-ai/tests/tiki-tropico-exact-live-binding-v1.test.mjs
      - name: Run public Tiki Tropico binding probe
        run: node loterias-ai/casino/jackpots/tiki-tropico-exact-live-binding-v1.mjs
      - name: Verify fail-closed evidence contract
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='loterias-ai/casino/jackpots/evidence/tiki-tropico-exact-live-binding-v1.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          if(x?.game?.publishedKnownPct!==95.77) throw new Error('unexpected published-known RTP state');
          if(x?.decision?.identityVerified!==false) throw new Error('first probe must never self-verify identity');
          if(x?.decision?.economicPromotionAllowed!==false||x?.decision?.realMoneyAllowed!==false) throw new Error('economic gate opened unexpectedly');
          if(x?.guards?.secondFrozenReplicationRequired!==true||x?.guards?.globalResponseNeverVerifiesIdentity!==true) throw new Error('binding guards missing');
          if((x.rows||[]).length!==3||(x.rows||[]).some(r=>r?.coverage?.scanComplete!==true)) throw new Error('incomplete target/control coverage');
          console.log(JSON.stringify({summary:x.summary,decision:x.decision,rows:x.rows.map(r=>({slug:r.slug,providerId:r.graphql?.data?.providerId??null,jackpot:r.graphql?.data?.jackpot??null,coverage:r.coverage}))},null,2));
          NODE
      - name: Persist evidence
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          E=loterias-ai/casino/jackpots/evidence/tiki-tropico-exact-live-binding-v1.json
          git add "$E"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(casino): refresh Tiki Tropico exact live binding probe'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
