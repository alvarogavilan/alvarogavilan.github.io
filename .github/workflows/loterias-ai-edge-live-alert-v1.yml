name: Loterias AI Edge Live Alert V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/evidence/five-euro-real-pilot-gate-v1.json'
      - 'loterias-ai/edge-live/telegram-edge-alert-v1.mjs'
      - '.github/workflows/loterias-ai-edge-live-alert-v1.yml'

permissions:
  contents: write

concurrency:
  group: loterias-ai-edge-live-alert-v1
  cancel-in-progress: true

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Send Edge Live Telegram alert only when gate changes
        env:
          EDGE_LIVE_TELEGRAM_BOT_TOKEN: ${{ secrets.EDGE_LIVE_TELEGRAM_BOT_TOKEN }}
          EDGE_LIVE_TELEGRAM_CHAT_ID: ${{ secrets.EDGE_LIVE_TELEGRAM_CHAT_ID }}
        run: node loterias-ai/edge-live/telegram-edge-alert-v1.mjs
      - name: Persist alert state when changed
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f loterias-ai/edge-live/telegram-alert-state.json ]; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/edge-live/telegram-alert-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(edge-live): persist Telegram gate alert state'
          git pull --rebase origin main
          git push origin HEAD:main
