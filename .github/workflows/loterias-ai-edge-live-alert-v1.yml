# verification trigger 2026-08-21 10:06 Europe/Madrid
name: Loterias AI Edge Live Alert V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/edge-live/evidence/edge-live-multi-execution-plan-v1.json'
      - 'loterias-ai/edge-live/evidence/edge-live-execution-plan-v1.json'
      - 'loterias-ai/edge-live/telegram-edge-alert-v1.mjs'
      - '.github/workflows/loterias-ai-edge-live-alert-v1.yml'

permissions:
  contents: write

concurrency:
  group: loterias-ai-edge-live-alert-v1
  cancel-in-progress: true

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Send Edge Live Telegram alert from multi-lane execution plan
        env:
          EDGE_LIVE_TELEGRAM_BOT_TOKEN: ${{ secrets.EDGE_LIVE_TELEGRAM_BOT_TOKEN }}
          EDGE_LIVE_TELEGRAM_CHAT_ID: ${{ secrets.EDGE_LIVE_TELEGRAM_CHAT_ID }}
          EDGE_LIVE_URL: https://alvarogavilan.github.io/loterias-ai/edge-live/
        run: node loterias-ai/edge-live/telegram-edge-alert-v1.mjs
      - name: Persist safe Telegram diagnostic and transition state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DIAG=loterias-ai/edge-live/telegram-alert-diagnostic.json
          STATE=loterias-ai/edge-live/telegram-alert-state.json
          mkdir -p /tmp/edge-live-telegram
          copied=0
          for f in "$DIAG" "$STATE"; do
            if [ -f "$f" ]; then
              cp "$f" "/tmp/edge-live-telegram/$(basename "$f")"
              copied=1
            fi
          done
          if [ "$copied" -eq 0 ]; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p loterias-ai/edge-live
          for f in "$DIAG" "$STATE"; do
            b=$(basename "$f")
            if [ -f "/tmp/edge-live-telegram/$b" ]; then cp "/tmp/edge-live-telegram/$b" "$f"; fi
          done
          git add -- "$DIAG"
          if [ -f "$STATE" ]; then git add -- "$STATE"; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(edge-live): persist Telegram connection diagnostic'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
