name: Loterias AI MetaPleno v37 Quiniela Cross-Era Full Audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v37-quiniela-cross-era-full-audit.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v37-quiniela-cross-era-full-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v37-quiniela-cross-era-full-audit.mjs
      - name: Persist safely
        shell: bash
        run: |
          cp loterias-ai/data/research/meta-pleno-v37-quiniela-cross-era-full-audit.json /tmp/v37.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v37.json loterias-ai/data/research/meta-pleno-v37-quiniela-cross-era-full-audit.json
            git add loterias-ai/data/research/meta-pleno-v37-quiniela-cross-era-full-audit.json
            git commit -m 'data(loterias-ai): persist MetaPleno v37 Quiniela cross-era full audit' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
