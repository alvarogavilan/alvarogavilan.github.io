name: Loterias AI MetaPleno v275 HSIC Lag Dependence
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v275-hsic-lag-dependence]
    paths:
      - 'loterias-ai/research/metapleno-v275-hsic-lag-dependence.mjs'
      - '.github/workflows/loterias-ai-metapleno-v275-hsic-lag-dependence.yml'
permissions: {contents: write}
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node loterias-ai/research/metapleno-v275-hsic-lag-dependence.mjs
      - name: Verify fail-closed
        run: node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('loterias-ai/data/research/metapleno-v275-hsic-lag-dependence.json'));if(j.realMoneyPass!==false||j.realStakeEUR!==0)throw Error('real money must remain blocked');if(j.candidatePool.theoreticalCostEUR>15)throw Error('budget exceeded');console.log(j.decision,j.signal);"
      - name: Persist result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/research/metapleno-v275-hsic-lag-dependence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(loterias-ai): persist v275 HSIC result'
          git push