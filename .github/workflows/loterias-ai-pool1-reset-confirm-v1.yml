name: Loterias AI Pool1 Reset Confirm V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/botemania-pool1-reset-confirm-v1.mjs'
      - '.github/workflows/loterias-ai-pool1-reset-confirm-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check loterias-ai/casino/jackpots/botemania-pool1-reset-confirm-v1.mjs
      - name: Confirm stable pool1 reset
        run: node loterias-ai/casino/jackpots/botemania-pool1-reset-confirm-v1.mjs
      - name: Enforce reset inference guards
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const x=JSON.parse(fs.readFileSync('loterias-ai/casino/jackpots/evidence/botemania-pool1-reset-confirm-v1.json','utf8'));
          if(x.baseline?.identityExact!==true) throw new Error('baseline pool1 identity not exact/stable');
          if((x.confirmationSamples||[]).length!==2) throw new Error('two confirmation samples required');
          if(x.inference?.jackpotWinConfirmed!==false || x.inference?.triggeringGameKnown!==false || x.inference?.triggeringTierKnown!==false) throw new Error('reset over-attributed to hit/game/tier');
          if(x.inference?.seedPointEstimateEUR!==null) throw new Error('post-reset value promoted to exact seed');
          if(x.inference?.economicPromotionAllowed!==false || x.inference?.realMoneyAllowed!==false) throw new Error('reset probe promoted economics/real money');
          if(x.guards?.noResetEqualsJackpotWin!==true || x.guards?.noPostResetEqualsExactSeed!==true || x.guards?.noTriggerAttribution!==true) throw new Error('reset guards missing');
          console.log(JSON.stringify({baseline:x.baseline,confirmationSamples:x.confirmationSamples,transition:x.transition,topologyObservation:x.topologyObservation,inference:x.inference},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: pool1-reset-confirm-v1
          path: loterias-ai/casino/jackpots/evidence/botemania-pool1-reset-confirm-v1.json
          retention-days: 14
