name: Loterias AI Operational Completion
on:
  push:
    paths:
      - 'loterias-ai/scripts/build-operational-completion.mjs'
      - '.github/workflows/loterias-ai-operational-completion.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/build-operational-completion.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/gates/operational-completion.json /tmp/operational-completion.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/operational-completion.json loterias-ai/data/gates/operational-completion.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/gates/operational-completion.json
          git commit -m 'data(loterias-ai): certify operational completion' || exit 0
          git push origin HEAD:main
