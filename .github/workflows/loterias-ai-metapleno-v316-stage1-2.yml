name: Loterias AI MetaPleno v316 Stage1-2
on:
  push:
    branches:
      - research/v316-optimal-transport-regime
    paths:
      - 'loterias-ai/data/research/metapleno-v316-preregister.json'
      - 'loterias-ai/research/megalab/v316-stage1-2-optimal-transport-screen.mjs'
      - '.github/workflows/loterias-ai-metapleno-v316-stage1-2.yml'
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run v316 Stage1-2
        run: node loterias-ai/research/megalab/v316-stage1-2-optimal-transport-screen.mjs
      - name: Verify fail-closed and budget
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='loterias-ai/data/research/metapleno-v316-stage1-2-selection.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          if(j.validationTouched!==false||j.postFreezeTouched!==false||j.retuningPerformed!==false) throw new Error('temporal isolation failed');
          if(j.realMoneyPass!==false||Number(j.realStakeEUR)!==0) throw new Error('real money gate failed');
          if(Number(j.budget?.maximumTheoreticalCostEURPerGameDraw)>15) throw new Error('budget cap failed');
          NODE
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/metapleno-v316-stage1-2-selection.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(loterias-ai): persist v316 Stage1-2 transport screen'
          git push
