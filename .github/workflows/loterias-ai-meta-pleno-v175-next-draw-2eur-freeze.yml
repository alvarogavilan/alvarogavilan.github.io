name: Loterias AI MetaPleno v175 Next Draw 2EUR Freeze
on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 15 8 *'
    - cron: '15 0,6,12,17 16 8 *'
  push:
    branches: [main, research/metapleno-v175-next-draw-2eur-freeze]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v175-bonoloto-next-draw-2eur-freeze.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v175-next-draw-2eur-freeze.yml'
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Refresh official archive
        run: node loterias-ai/scripts/backfill-core-2026.mjs || true
      - name: Build guarded v175 freeze
        id: freeze
        shell: bash
        run: |
          set +e
          node loterias-ai/scripts/meta-pleno-v175-bonoloto-next-draw-2eur-freeze.mjs > /tmp/v175.out 2>&1
          rc=$?
          cat /tmp/v175.out
          if [ $rc -ne 0 ]; then
            if grep -q 'WAITING_OFFICIAL_PREVIOUS_DRAW' /tmp/v175.out; then
              echo 'Previous official result not ingested yet; safe no-op.'
              exit 0
            fi
            exit $rc
          fi
      - name: Validate prospective timing
        if: hashFiles('loterias-ai/data/prospective/bonoloto-v175-v172-compressed-2eur-2026-08-16.json') != ''
        run: node loterias-ai/scripts/validate-prospective-freeze-timing.mjs
      - name: Persist freeze and refreshed archive
        if: hashFiles('loterias-ai/data/prospective/bonoloto-v175-v172-compressed-2eur-2026-08-16.json') != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/archive/bonoloto/2026.json loterias-ai/data/prospective/bonoloto-v175-v172-compressed-2eur-2026-08-16.json loterias-ai/data/research/prospective-freeze-timing-validation.json
          git diff --cached --quiet && exit 0
          git commit -m 'data(loterias-ai): freeze v175 Bonoloto Aug 16 2 EUR shadow'
          for i in 1 2 3 4 5; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0; sleep $((i*3)); done
          exit 1
