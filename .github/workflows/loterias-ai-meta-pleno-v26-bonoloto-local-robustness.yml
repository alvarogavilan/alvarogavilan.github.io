name: Loterias AI MetaPleno v26 Bonoloto Local Robustness
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v26-bonoloto-local-robustness.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v26-bonoloto-local-robustness.yml'
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Run local robustness audit
        env:
          N: 12000
        run: node loterias-ai/scripts/meta-pleno-v26-bonoloto-local-robustness.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/research/meta-pleno-v26-bonoloto-local-robustness.json /tmp/v26.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v26.json loterias-ai/data/research/meta-pleno-v26-bonoloto-local-robustness.json
            git add loterias-ai/data/research/meta-pleno-v26-bonoloto-local-robustness.json
            git commit -m 'data(loterias-ai): persist MetaPleno v26 Bonoloto local robustness' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
