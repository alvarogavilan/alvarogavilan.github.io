name: Loterias AI EuroDreams Full Economics
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/enrich-eurodreams-full-economics.mjs'
      - '.github/workflows/loterias-ai-eurodreams-full-economics.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-eurodreams-economics
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Accumulate several bounded batches
        shell: bash
        run: |
          successes=0
          for pass in 1 2 3 4; do
            echo "EuroDreams economics pass $pass"
            if BATCH_LIMIT=20 node loterias-ai/scripts/enrich-eurodreams-full-economics.mjs; then
              successes=$((successes+1))
            else
              echo "Provider stopped this pass; preserving earlier batches"
              break
            fi
            sleep 3
          done
          test "$successes" -ge 1
      - name: Persist against fresh main and rebuild derived files
        shell: bash
        run: |
          rm -rf /tmp/eurodreams-save
          mkdir -p /tmp/eurodreams-save
          cp -r loterias-ai/data/archive/eurodreams /tmp/eurodreams-save/
          cp loterias-ai/data/archive/_meta/eurodreams-economics-ingestion.json /tmp/eurodreams-save/eurodreams-economics-ingestion.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf loterias-ai/data/archive/eurodreams
            cp -r /tmp/eurodreams-save/eurodreams loterias-ai/data/archive/
            cp /tmp/eurodreams-save/eurodreams-economics-ingestion.json loterias-ai/data/archive/_meta/eurodreams-economics-ingestion.json
            node loterias-ai/scripts/build-national-archive-index.mjs
            node loterias-ai/scripts/audit-national-archive.mjs
            git add loterias-ai/data/archive
            if git diff --cached --quiet; then
              echo 'EuroDreams data already present on main'
              exit 0
            fi
            git commit -m 'data(loterias-ai): persist EuroDreams economics batches'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
