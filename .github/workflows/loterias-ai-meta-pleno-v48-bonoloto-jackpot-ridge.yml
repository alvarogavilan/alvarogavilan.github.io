name: Loterias AI MetaPleno v48 Bonoloto Jackpot Ridge
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v48-bonoloto-jackpot-ridge.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v48-bonoloto-jackpot-ridge.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-meta-pleno-v48-bonoloto-jackpot-ridge
  cancel-in-progress: false
jobs:
  ridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Search 2,000,000 focused jackpot-ridge specs
        env:
          N: 2000000
        run: node loterias-ai/scripts/meta-pleno-v48-bonoloto-jackpot-ridge.mjs
      - name: Persist research evidence safely
        run: |
          cp loterias-ai/data/research/meta-pleno-v48-bonoloto-jackpot-ridge.json /tmp/v48.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v48.json loterias-ai/data/research/meta-pleno-v48-bonoloto-jackpot-ridge.json
            git add loterias-ai/data/research/meta-pleno-v48-bonoloto-jackpot-ridge.json
            git commit -m 'data(loterias-ai): persist MetaPleno v48 Bonoloto jackpot-ridge result' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
