# Cost control: legacy v1 corpus is retired from scheduled capture; this audit is now manual/code-change only.
name: Loterias AI Lightning Stat Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/lightning/research/lightning-stat-audit-v1.mjs'
      - '.github/workflows/loterias-ai-lightning-stat-audit.yml'

permissions:
  contents: write

concurrency:
  group: loterias-ai-lightning-stat-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node loterias-ai/casino/lightning/research/lightning-stat-audit-v1.mjs
      - name: Persist changed statistical evidence
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE='loterias-ai/casino/lightning/evidence/stat-audit-v1.json'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$EVIDENCE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(casino): persist Lightning statistical audit'
          git pull --rebase origin main
          git push origin HEAD:main
