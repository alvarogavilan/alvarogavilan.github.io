name: Loterias AI MetaPleno v12 Multiyear Stability
on:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v12-multiyear-stability.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v12-multiyear-stability.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 31878379467
          pattern: meta-pleno-v5-*
          path: loterias-ai/data/research/meta-pleno-v5-shards
          merge-multiple: true
      - run: node loterias-ai/scripts/meta-pleno-v12-multiyear-stability.mjs
      - name: Persist safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/research/meta-pleno-v12-multiyear-stability.json
          git diff --cached --quiet && exit 0
          git commit -m 'data(loterias-ai): persist MetaPleno v12 multiyear stability'
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*3)); done
          exit 1
