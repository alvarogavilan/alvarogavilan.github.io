name: Loterias AI MetaPleno v152 Pairwise Swap Policy
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v152-pairwise-swap-policy]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v152-pairwise-swap-policy.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v152-pairwise-swap-policy.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v152-pairwise-swap-policy.mjs
      - name: Persist v152
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v152-pairwise-swap-policy.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist v152 pairwise swap policy'
          git push
