name: Loterias AI Gamesys Cross-Market Pool Proof V1

on:
  workflow_dispatch:
  push:
    branches: [feat-edge-gamesys-crossmarket-pool-proof-v1]
    paths:
      - 'loterias-ai/casino/jackpots/botemania-gamesys-crossmarket-pool-proof-v1.mjs'
      - '.github/workflows/loterias-ai-gamesys-crossmarket-pool-proof-v1.yml'

permissions:
  contents: write

concurrency:
  group: loterias-ai-gamesys-crossmarket-pool-proof-v1
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-edge-gamesys-crossmarket-pool-proof-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture same-run Botemania and Gamesys tracker values
        run: node loterias-ai/casino/jackpots/botemania-gamesys-crossmarket-pool-proof-v1.mjs
      - name: Persist evidence on research branch
        shell: bash
        run: |
          set -euo pipefail
          F=loterias-ai/casino/jackpots/evidence/botemania-gamesys-crossmarket-pool-proof-v1.json
          test -s "$F"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$F"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(edge): capture Gamesys cross-market pool evidence'
          git push origin HEAD:feat-edge-gamesys-crossmarket-pool-proof-v1
