name: Loterias AI v310 Frozen Validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/research/megalab/v310-stage4-validation.mjs'
      - '.github/workflows/loterias-ai-v310-validation.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-v310-validation
  cancel-in-progress: false
jobs:
  validate:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node loterias-ai/research/megalab/v310-stage4-validation.mjs
      - name: Persist blind validation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/metapleno-v310-stage4-validation.json
          git commit -m "research(loterias-ai): persist v310 frozen validation" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
