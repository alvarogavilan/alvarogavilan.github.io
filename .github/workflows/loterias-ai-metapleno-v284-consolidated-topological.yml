name: Loterias AI MetaPleno v284 Consolidated Topological
on:
  push:
    branches: [research/metapleno-v284-consolidated-topological]
    paths:
      - 'loterias-ai/research/metapleno-v284-consolidated-topological.mjs'
      - '.github/workflows/loterias-ai-metapleno-v284-consolidated-topological.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node loterias-ai/research/metapleno-v284-consolidated-topological.mjs
      - name: Verify fail-closed
        run: node -e "const x=require('./loterias-ai/data/research/metapleno-v284-consolidated-topological.json');if(x.realMoneyPass||x.realStakeEUR!==0||x.games.some(g=>g.budget.theoreticalEUR>4))process.exit(1)"
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/metapleno-v284-consolidated-topological.json
          git commit -m 'data(loterias-ai): persist v284 topological result' || exit 0
          git push