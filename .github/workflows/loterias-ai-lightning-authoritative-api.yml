name: Loterias AI Lightning Authoritative API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/lightning/collect-casinoorg-api.mjs'
      - '.github/workflows/loterias-ai-lightning-authoritative-api.yml'
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: write
concurrency:
  group: loterias-ai-lightning-authoritative-api
  cancel-in-progress: false
jobs:
  collect:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Collect authoritative public rounds
        run: node loterias-ai/casino/lightning/collect-casinoorg-api.mjs
      - name: Verify readiness locally
        run: node loterias-ai/casino/lightning/corpus-readiness.mjs
      - name: Persist only source-owned files safely
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # corpus-readiness.mjs intentionally recomputes two shared QA files.
          # They belong to the dedicated audit/readiness workflow, so remove
          # those local changes before rebasing this collector's source files.
          git restore loterias-ai/casino/lightning/evidence/corpus-readiness.json || true
          git restore loterias-ai/casino/lightning/evidence/corpus-audit.json || true
          git add loterias-ai/casino/lightning/data/casinoorg-lightningroulette.jsonl loterias-ai/casino/lightning/evidence/casinoorg-api-collector.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(casino): accumulate authoritative Lightning rounds"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
