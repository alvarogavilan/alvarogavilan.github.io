name: Loterias AI Lightning Authoritative API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/lightning/collect-casinoorg-api.mjs'
      - '.github/workflows/loterias-ai-lightning-authoritative-api.yml'
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: write
concurrency:
  group: loterias-ai-lightning-authoritative-api
  cancel-in-progress: false
jobs:
  collect:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Collect, verify and persist against moving main
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            node loterias-ai/casino/lightning/collect-casinoorg-api.mjs
            node loterias-ai/casino/lightning/corpus-readiness.mjs
            # QA/readiness outputs are owned by their dedicated workflow.
            git restore loterias-ai/casino/lightning/evidence/corpus-readiness.json || true
            git restore loterias-ai/casino/lightning/evidence/corpus-audit.json || true
            git add loterias-ai/casino/lightning/data/casinoorg-lightningroulette.jsonl loterias-ai/casino/lightning/evidence/casinoorg-api-collector.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "research(casino): accumulate authoritative Lightning rounds"
            if git push origin HEAD:"$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
