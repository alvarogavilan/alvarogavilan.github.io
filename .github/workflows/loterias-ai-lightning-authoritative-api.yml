name: Loterias AI Lightning Authoritative API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/lightning/collect-casinoorg-api.mjs'
      - 'loterias-ai/casino/lightning/research/economic-multiplier-prospective-v1.mjs'
      - 'loterias-ai/casino/lightning/research/economic-number-selection-prospective-v1.mjs'
      - 'loterias-ai/casino/lightning/research/prospective-capture-continuity-v1.mjs'
      - 'loterias-ai/casino/lightning/research/verify-economic-prospective-freeze-v1.mjs'
      - 'loterias-ai/casino/lightning/research/verify-economic-number-prospective-freeze-v1.mjs'
      - 'loterias-ai/casino/lightning/evidence/economic-multiplier-window-prospective-freeze-v1.json'
      - 'loterias-ai/casino/lightning/evidence/economic-multiplier-prospective-decision-protocol-v1.json'
      - 'loterias-ai/casino/lightning/evidence/economic-number-selection-prospective-freeze-v1.json'
      - 'loterias-ai/casino/lightning/evidence/economic-multiplier-window-freeze-provenance-v1.json'
      - '.github/workflows/loterias-ai-lightning-authoritative-api.yml'
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: loterias-ai-lightning-authoritative-api
  cancel-in-progress: false
jobs:
  collect:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Collect, verify prospectives and persist against moving main
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            node loterias-ai/casino/lightning/collect-casinoorg-api.mjs

            data_changed=true
            if git diff --quiet -- loterias-ai/casino/lightning/data/casinoorg-lightningroulette.jsonl; then
              data_changed=false
              if [ "$GITHUB_EVENT_NAME" != "push" ]; then
                echo "No new authoritative rounds; scheduled/dispatch run has nothing to advance."
                exit 0
              fi
              echo "No new rounds, but this is a scientific push: recomputing prospectives with current frozen data."
            fi

            if [ "$data_changed" = true ]; then
              node loterias-ai/casino/lightning/corpus-readiness.mjs
              # QA/readiness outputs are owned by their dedicated workflow.
              git restore loterias-ai/casino/lightning/evidence/corpus-readiness.json || true
              git restore loterias-ai/casino/lightning/evidence/corpus-audit.json || true
            fi

            # Bot pushes made with GITHUB_TOKEN do not start downstream push workflows.
            # Therefore the authoritative collector itself advances both immutable prospectives.
            # Scientific push events recompute these artifacts even when no fresh round arrived.
            node loterias-ai/casino/lightning/research/verify-economic-prospective-freeze-v1.mjs
            node loterias-ai/casino/lightning/research/verify-economic-number-prospective-freeze-v1.mjs
            node loterias-ai/casino/lightning/research/economic-multiplier-prospective-v1.mjs
            node loterias-ai/casino/lightning/research/economic-number-selection-prospective-v1.mjs
            node loterias-ai/casino/lightning/research/prospective-capture-continuity-v1.mjs

            git add \
              loterias-ai/casino/lightning/data/casinoorg-lightningroulette.jsonl \
              loterias-ai/casino/lightning/evidence/casinoorg-api-collector.json \
              loterias-ai/casino/lightning/evidence/economic-multiplier-window-prospective-status-v1.json \
              loterias-ai/casino/lightning/evidence/economic-number-selection-prospective-status-v1.json \
              loterias-ai/casino/lightning/evidence/prospective-capture-continuity-v1.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "research(casino): advance authoritative Lightning prospectives"
            if git push origin HEAD:"$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
