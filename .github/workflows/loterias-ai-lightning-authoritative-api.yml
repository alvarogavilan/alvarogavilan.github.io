name: Loterias AI Lightning Authoritative API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/lightning/collect-casinoorg-api.mjs'
      - 'loterias-ai/casino/lightning/research/economic-multiplier-prospective-v1.mjs'
      - 'loterias-ai/casino/lightning/research/economic-number-selection-prospective-v1.mjs'
      - 'loterias-ai/casino/lightning/research/prospective-capture-continuity-v1.mjs'
      - 'loterias-ai/casino/lightning/research/lightning-prospective-frozen-lag8.mjs'
      - 'loterias-ai/casino/lightning/research/physical-rng-prospective-v1.mjs'
      - 'loterias-ai/casino/lightning/research/physical-rng-prospective-idempotent-v1.mjs'
      - 'loterias-ai/casino/lightning/research/verify-economic-prospective-freeze-v1.mjs'
      - 'loterias-ai/casino/lightning/research/verify-economic-number-prospective-freeze-v1.mjs'
      - 'loterias-ai/casino/lightning/evidence/economic-multiplier-window-prospective-freeze-v1.json'
      - 'loterias-ai/casino/lightning/evidence/economic-multiplier-prospective-decision-protocol-v1.json'
      - 'loterias-ai/casino/lightning/evidence/economic-number-selection-prospective-freeze-v1.json'
      - 'loterias-ai/casino/lightning/evidence/economic-multiplier-window-freeze-provenance-v1.json'
      - 'loterias-ai/casino/lightning/evidence/prospective-lag8-freeze.json'
      - 'loterias-ai/casino/lightning/evidence/physical-rng-prospective-freeze-v1.json'
      - '.github/workflows/loterias-ai-lightning-authoritative-api.yml'
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: loterias-ai-lightning-authoritative-api
  cancel-in-progress: false
jobs:
  collect:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Collect, verify prospectives and persist against moving main
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            node loterias-ai/casino/lightning/collect-casinoorg-api.mjs

            data_changed=true
            if git diff --quiet -- loterias-ai/casino/lightning/data/casinoorg-lightningroulette.jsonl; then
              data_changed=false
              if [ "$GITHUB_EVENT_NAME" != "push" ]; then
                echo "No new authoritative rounds; refresh only the new idempotent physical prospective state."
                node loterias-ai/casino/lightning/research/physical-rng-prospective-idempotent-v1.mjs
                git add loterias-ai/casino/lightning/evidence/physical-rng-prospective-status-v1.json 2>/dev/null || true
                if git diff --cached --quiet; then exit 0; fi
                git commit -m 'research(casino): initialize physical RNG prospective state'
                if git push origin HEAD:"$GITHUB_REF_NAME"; then exit 0; fi
                sleep $((attempt * 2))
                continue
              fi
              echo "No new rounds, but this is a scientific push: recomputing prospectives with current frozen data."
            fi

            if [ "$data_changed" = true ]; then
              node loterias-ai/casino/lightning/corpus-readiness.mjs
              git restore loterias-ai/casino/lightning/evidence/corpus-readiness.json || true
              git restore loterias-ai/casino/lightning/evidence/corpus-audit.json || true
            fi

            node loterias-ai/casino/lightning/research/verify-economic-prospective-freeze-v1.mjs
            node loterias-ai/casino/lightning/research/verify-economic-number-prospective-freeze-v1.mjs
            node loterias-ai/casino/lightning/research/economic-multiplier-prospective-v1.mjs
            node loterias-ai/casino/lightning/research/economic-number-selection-prospective-v1.mjs
            node loterias-ai/casino/lightning/research/prospective-capture-continuity-v1.mjs
            node loterias-ai/casino/lightning/research/lightning-prospective-frozen-lag8.mjs
            node loterias-ai/casino/lightning/research/physical-rng-prospective-idempotent-v1.mjs

            node --input-type=module <<'NODE'
            import fs from 'node:fs';
            const f=JSON.parse(fs.readFileSync('loterias-ai/casino/lightning/evidence/prospective-lag8-freeze.json','utf8'));
            const j=JSON.parse(fs.readFileSync('loterias-ai/casino/lightning/evidence/prospective-lag8.json','utf8'));
            if (f.lag !== 8 || f.immutable !== true || f.realMoney !== false || f.claimAllowed !== false) throw new Error('invalid immutable lag-8 freeze');
            if (j?.freeze?.lag !== 8 || j?.freeze?.cutoffTimestamp !== f.cutoffTimestamp) throw new Error('lag-8 prospective drifted from frozen hypothesis');
            if (j?.guards?.realMoney !== false || j?.guards?.realMoneyAuthorized !== false || j?.guards?.authorizedStakeEUR !== 0 || j?.guards?.claimAllowed !== false) throw new Error('lag-8 safety guards drifted');
            const pf=JSON.parse(fs.readFileSync('loterias-ai/casino/lightning/evidence/physical-rng-prospective-freeze-v1.json','utf8'));
            const ps=JSON.parse(fs.readFileSync('loterias-ai/casino/lightning/evidence/physical-rng-prospective-status-v1.json','utf8'));
            if (pf.fixedBoundaryRounds !== 5000 || pf.alphaFamilyWise !== 0.01 || pf.permutation?.replicates !== 10000) throw new Error('physical RNG fixed protocol drifted');
            if (ps.freezeVersion !== pf.version || ps.prospectiveStartsAt !== pf.prospectiveStartsAt) throw new Error('physical RNG prospective drifted from freeze');
            if (ps.progress?.roundsUsedForV1 > 5000 || ps.guards?.noOptionalStopping !== true || ps.guards?.realMoneyAllowed !== false) throw new Error('physical RNG prospective safety regression');
            if (ps.progress?.roundsUsedForV1 < 5000 && (ps.final !== null || ps.disclosure?.observedStatisticsHidden !== true || ps.disclosure?.pValuesHidden !== true)) throw new Error('physical RNG pre-boundary blindness regression');
            NODE

            git add \
              loterias-ai/casino/lightning/data/casinoorg-lightningroulette.jsonl \
              loterias-ai/casino/lightning/evidence/casinoorg-api-collector.json \
              loterias-ai/casino/lightning/evidence/economic-multiplier-window-prospective-status-v1.json \
              loterias-ai/casino/lightning/evidence/economic-number-selection-prospective-status-v1.json \
              loterias-ai/casino/lightning/evidence/prospective-capture-continuity-v1.json \
              loterias-ai/casino/lightning/evidence/prospective-lag8.json \
              loterias-ai/casino/lightning/evidence/physical-rng-prospective-status-v1.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "research(casino): advance authoritative Lightning prospectives"
            if git push origin HEAD:"$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
