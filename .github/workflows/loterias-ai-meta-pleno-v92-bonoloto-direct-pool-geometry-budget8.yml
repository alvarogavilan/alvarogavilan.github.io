name: Loterias AI MetaPleno v92 Bonoloto Direct Pool Geometry Budget8
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v92-bonoloto-direct-pool-geometry-budget8.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v92-bonoloto-direct-pool-geometry-budget8.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v92-bonoloto-direct-pool-geometry-budget8.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v92-bonoloto-direct-pool-geometry
          path: loterias-ai/data/research/meta-pleno-v92-bonoloto-direct-pool-geometry-budget8.json
