name: Loterias AI MetaPleno v4 Panel Yearly
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v4-panel-yearly.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v4-panel-yearly.yml'
permissions:
  actions: read
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31877872101
          pattern: meta-pleno-v4-*
          path: /tmp/meta-v4
      - name: Collect authoritative fixed panel
        run: |
          rm -rf loterias-ai/data/research/meta-pleno-v4-shards
          mkdir -p loterias-ai/data/research/meta-pleno-v4-shards
          find /tmp/meta-v4 -name '*.json' -exec cp {} loterias-ai/data/research/meta-pleno-v4-shards/ \;
          test "$(find loterias-ai/data/research/meta-pleno-v4-shards -name '*.json' | wc -l)" -eq 20
      - name: Evaluate every frozen retained formula by year
        run: node loterias-ai/scripts/meta-pleno-v4-panel-yearly.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/research/meta-pleno-v4-panel-yearly.json /tmp/panel.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/panel.json loterias-ai/data/research/meta-pleno-v4-panel-yearly.json
            git add loterias-ai/data/research/meta-pleno-v4-panel-yearly.json
            git commit -m 'data(loterias-ai): persist frozen panel yearly pleno evidence' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
