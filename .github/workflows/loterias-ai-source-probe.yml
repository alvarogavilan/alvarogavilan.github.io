# Cost control: the daily cycle already probes SELAE. Keep this workflow for manual diagnostics and probe-code changes only.
name: Loterias AI SELAE Source Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/probe-selae.mjs'
      - 'loterias-ai/data/selae-feed-endpoints.json'
      - '.github/workflows/loterias-ai-source-probe.yml'

permissions:
  contents: write

concurrency:
  group: loterias-ai-selae-source-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe official SELAE endpoints and persist semantic changes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          node loterias-ai/scripts/probe-selae.mjs
          git add loterias-ai/data/source-probe-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(loterias-ai): refresh SELAE source probe'
          git push origin HEAD:main
