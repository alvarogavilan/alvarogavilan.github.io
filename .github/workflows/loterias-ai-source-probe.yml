name: Loterias AI SELAE Source Probe

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    paths:
      - 'loterias-ai/scripts/probe-selae.mjs'
      - 'loterias-ai/data/selae-feed-endpoints.json'
      - '.github/workflows/loterias-ai-source-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe official SELAE endpoints
        run: node loterias-ai/scripts/probe-selae.mjs
      - name: Commit source health snapshot if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/source-probe-latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore(loterias-ai): refresh SELAE source probe'
          git pull --rebase origin main
          git push origin HEAD:main