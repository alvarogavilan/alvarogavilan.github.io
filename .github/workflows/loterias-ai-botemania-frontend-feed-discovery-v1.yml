name: Loterias AI Botemania Frontend Feed Discovery V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/botemania-jpk-frontend-feed-discovery-v1.mjs'
      - '.github/workflows/loterias-ai-botemania-frontend-feed-discovery-v1.yml'

permissions:
  contents: write

concurrency:
  group: loterias-ai-botemania-frontend-feed-discovery-v1
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Scan public Botemania frontend bundles for jackpot history operations
        run: node loterias-ai/casino/jackpots/botemania-jpk-frontend-feed-discovery-v1.mjs
      - name: Persist discovery evidence
        shell: bash
        run: |
          set -euo pipefail
          FILE=loterias-ai/casino/jackpots/evidence/botemania-jpk-frontend-feed-discovery-v1.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(casino): refresh Botemania frontend jackpot-feed discovery'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
