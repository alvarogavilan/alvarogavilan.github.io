name: Loterias AI Pool1 Runtime Hydration Correlation V2

on:
  pull_request:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/botemania-pool1-runtime-hydration-correlation-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-pool1-runtime-hydration-correlation-v2.mjs'
      - 'loterias-ai/casino/jackpots/evidence/botemania-pool1-reset-confirm-v1.json'
      - 'loterias-ai/casino/jackpots/evidence/botemania-pool1-zero-reset-game-map-v1.json'
      - '.github/workflows/loterias-ai-pool1-runtime-hydration-correlation-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check loterias-ai/casino/jackpots/botemania-pool1-runtime-hydration-correlation-v2.mjs
      - name: Probe public runtime hydration and bounded reset correlation
        run: node loterias-ai/casino/jackpots/botemania-pool1-runtime-hydration-correlation-v2.mjs
      - name: Enforce scientific fail-closed semantics
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const p='loterias-ai/casino/jackpots/evidence/botemania-pool1-runtime-hydration-correlation-v2.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          const r=x.priorEvidence?.resetMeta;
          if(r?.valid!==true || !r?.baselineAt || !r?.confirmedAt) throw new Error('confirmed reset window did not normalize');
          if(!Number.isFinite(r?.baselineEUR) || !Number.isFinite(r?.dropEUR) || r.dropEUR<=0) throw new Error('reset economic-free transition values missing');
          if((r?.confirmationSampleCount||0)<2) throw new Error('reset confirmation sample count regressed');
          if(x.guards?.publicNoAuthOnly!==true || x.guards?.noGameLaunch!==true || x.guards?.noBetting!==true) throw new Error('public/no-launch/no-betting guard missing');
          if(x.guards?.noCmsJackpotQueryRepeat!==true || x.guards?.weakCmsHydrationNeverCountsAsRuntimeCandidate!==true) throw new Error('closed CMS layer/weak hydration guard missing');
          if(x.guards?.coAmountNeverAutoVerifiesIdentity!==true || x.guards?.winnerCorrelationNeverAutoVerifiesIdentity!==true) throw new Error('discovery signal auto-promotion guard missing');
          if(x.guards?.nullNeverCoercedToZero!==true) throw new Error('null safety guard missing');
          if(x.decision?.economicPromotionAllowed!==false || x.decision?.realMoneyAllowed!==false || x.decision?.exactRuntimeGameIdentityRecovered!==false) throw new Error('runtime probe promoted identity or wagering');
          if((x.feedCorrelation?.snapshots||[]).length!==3) throw new Error('expected three bounded public feed snapshots');
          if((x.hydration?.targetCount||0)!==10) throw new Error('expected exactly ten targeted pages');
          if(!x.winnerFeed?.correlationWindow?.start || !x.winnerFeed?.correlationWindow?.end) throw new Error('winner correlation window is incomplete');
          console.log(JSON.stringify({resetMeta:r,feedCorrelation:{snapshots:x.feedCorrelation.snapshots.map(s=>({observedAt:s.observedAt,pool1:s.pool1DistinctAmountsEUR,coAmountIds:s.coAmountIds})),persistentCoAmountAliases:x.feedCorrelation.persistentCoAmountAliases},winnerFeed:x.winnerFeed,hydration:{targetCount:x.hydration.targetCount,commonScriptCount:x.hydration.commonScriptCount,pageSpecificScriptCount:x.hydration.pageSpecificScriptCount,strongInlineSignals:x.hydration.strongInlineSignals,strongExternalSignals:x.hydration.strongExternalSignals,exactPool1InHydration:x.hydration.exactPool1InHydration,allTargetJackpotRefsNullOrEmpty:x.hydration.allTargetJackpotRefsNullOrEmpty,meaningfulRuntimeCandidateCount:x.hydration.meaningfulRuntimeCandidateCount,staticHydrationLayerExhausted:x.hydration.staticHydrationLayerExhausted},decision:x.decision},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: pool1-runtime-hydration-correlation-v2
          path: loterias-ai/casino/jackpots/evidence/botemania-pool1-runtime-hydration-correlation-v2.json
          retention-days: 7
