name: Loterias AI Pool1 Runtime Hydration Correlation V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/botemania-pool1-runtime-hydration-correlation-v1.mjs'
      - 'loterias-ai/casino/jackpots/evidence/botemania-pool1-reset-confirm-v1.json'
      - 'loterias-ai/casino/jackpots/evidence/botemania-pool1-zero-reset-game-map-v1.json'
      - '.github/workflows/loterias-ai-pool1-runtime-hydration-correlation-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check loterias-ai/casino/jackpots/botemania-pool1-runtime-hydration-correlation-v1.mjs
      - name: Probe public runtime hydration and reset correlation
        run: node loterias-ai/casino/jackpots/botemania-pool1-runtime-hydration-correlation-v1.mjs
      - name: Enforce scientific fail-closed semantics
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const p='loterias-ai/casino/jackpots/evidence/botemania-pool1-runtime-hydration-correlation-v1.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          if(x.guards?.publicNoAuthOnly!==true || x.guards?.noGameLaunch!==true || x.guards?.noBetting!==true) throw new Error('public/no-launch/no-betting guard missing');
          if(x.guards?.noCmsJackpotQueryRepeat!==true) throw new Error('closed CMS layer was repeated');
          if(x.guards?.coAmountNeverAutoVerifiesIdentity!==true || x.guards?.winnerCorrelationNeverAutoVerifiesIdentity!==true || x.guards?.configKeywordHitNeverAutoVerifiesIdentity!==true) throw new Error('discovery signal auto-promotion guard missing');
          if(x.guards?.nullNeverCoercedToZero!==true) throw new Error('null safety guard missing');
          if(x.decision?.economicPromotionAllowed!==false || x.decision?.realMoneyAllowed!==false) throw new Error('runtime probe promoted wagering');
          if(x.decision?.exactRuntimeGameIdentityRecovered!==false) throw new Error('keyword/config probe must not auto-verify exact game identity');
          if((x.feedCorrelation?.snapshots||[]).length!==3) throw new Error('expected three bounded public feed snapshots');
          if((x.hydration?.targetCount||0)!==10) throw new Error('expected exactly ten targeted pages');
          console.log(JSON.stringify({feedCorrelation:{snapshots:x.feedCorrelation.snapshots.map(s=>({observedAt:s.observedAt,pool1:s.pool1DistinctAmountsEUR,coAmountIds:s.coAmountIds})),persistentCoAmountAliases:x.feedCorrelation.persistentCoAmountAliases},winnerFeed:x.winnerFeed,hydration:{targetCount:x.hydration.targetCount,commonScriptCount:x.hydration.commonScriptCount,pageSpecificScriptCount:x.hydration.pageSpecificScriptCount,pageSpecificScriptsScanned:x.hydration.pageSpecificScriptsScanned,hydrationCandidates:x.hydration.hydrationCandidates},decision:x.decision},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: pool1-runtime-hydration-correlation-v1
          path: loterias-ai/casino/jackpots/evidence/botemania-pool1-runtime-hydration-correlation-v1.json
          retention-days: 7
