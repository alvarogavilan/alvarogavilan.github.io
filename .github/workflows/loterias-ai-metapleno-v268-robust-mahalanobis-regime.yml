name: Loterias AI MetaPleno v268 Robust Mahalanobis Regime
on:
  workflow_dispatch:
  push:
    branches:
      - research/metapleno-v268-robust-mahalanobis-regime
    paths:
      - 'loterias-ai/research/metapleno-v268-robust-mahalanobis-regime.mjs'
      - '.github/workflows/loterias-ai-metapleno-v268-robust-mahalanobis-regime.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run v268
        run: node loterias-ai/research/metapleno-v268-robust-mahalanobis-regime.mjs
      - name: Verify fail-closed
        run: node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('loterias-ai/data/research/metapleno-v268-robust-mahalanobis-regime.json','utf8'));if(j.realMoneyPass!==false||j.realStakeEUR!==0)throw new Error('real money must remain blocked');if(j.candidatePool?.theoreticalCostEUR>15)throw new Error('budget exceeded');console.log(j.decision,j.signal);"
      - name: Persist result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/research/metapleno-v268-robust-mahalanobis-regime.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(loterias-ai): persist v268 robust Mahalanobis result'
          git push
