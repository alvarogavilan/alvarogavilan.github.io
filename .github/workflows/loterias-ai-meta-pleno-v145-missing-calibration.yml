name: Loterias AI MetaPleno v145 Missing Calibration
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v145-missing-calibration]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v145-bonoloto-missing-calibration.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v145-missing-calibration.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v142-global-nearpleno-atlas.mjs
      - run: node loterias-ai/scripts/meta-pleno-v145-bonoloto-missing-calibration.mjs
      - name: Persist v142 v145
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v142-global-nearpleno-atlas.json loterias-ai/data/research/meta-pleno-v145-bonoloto-missing-calibration.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist v145 missing calibration'
          git push
