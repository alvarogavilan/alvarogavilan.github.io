name: Loterias AI EDGE Mobile CORS Preflight Probe V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'loterias-ai/mobile/edge-live-watch/cors-preflight-probe-v1.mjs'
      - '.github/workflows/loterias-ai-edge-mobile-cors-preflight-probe-v1.yml'
  push:
    branches: [main]
    paths:
      - 'loterias-ai/mobile/edge-live-watch/cors-preflight-probe-v1.mjs'
      - '.github/workflows/loterias-ai-edge-mobile-cors-preflight-probe-v1.yml'
  workflow_dispatch:

concurrency:
  group: loterias-ai-edge-mobile-cors-preflight-probe-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: node --check loterias-ai/mobile/edge-live-watch/cors-preflight-probe-v1.mjs
      - name: Test whether Botemania GraphQL permits a browser cross-origin POST
        run: node loterias-ai/mobile/edge-live-watch/cors-preflight-probe-v1.mjs
      - name: Persist evidence
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cp loterias-ai/mobile/edge-live-watch/evidence/cors-preflight-probe-v1.json /tmp/cors-preflight-probe-v1.json
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p loterias-ai/mobile/edge-live-watch/evidence
            cp /tmp/cors-preflight-probe-v1.json loterias-ai/mobile/edge-live-watch/evidence/cors-preflight-probe-v1.json
            git add loterias-ai/mobile/edge-live-watch/evidence/cors-preflight-probe-v1.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(edge-mobile): refresh CORS preflight probe'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
