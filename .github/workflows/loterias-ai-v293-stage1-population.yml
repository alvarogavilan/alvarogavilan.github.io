name: Loterias AI v293 Stage1 Population
on:
  push:
    branches:
      - research/metapleno-v293-representation-synthesis
    paths:
      - loterias-ai/research/megalab/v293-stage1-population.mjs
      - .github/workflows/loterias-ai-v293-stage1-population.yml
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build representation-first population
        run: node loterias-ai/research/megalab/v293-stage1-population.mjs
      - name: Verify OOS untouched and economics fail closed
        run: node -e "const x=require('./loterias-ai/data/research/metapleno-v293-stage1-population.json');if(x.historicalDataRead||x.selectionTouched||x.validationTouched||x.postFreezeTouched||x.realMoneyPass||x.realStakeEUR!==0||x.logicalScientists!==262144)process.exit(1)"
      - name: Persist v293 stage1 evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/metapleno-v293-stage1-population.json
          git commit -m 'data(loterias-ai): persist v293 stage1 population' || exit 0
          git pull --rebase origin research/metapleno-v293-representation-synthesis
          git push