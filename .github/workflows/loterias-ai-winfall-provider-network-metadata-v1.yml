name: Loterias AI Winfall Provider Network Metadata V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'loterias-ai/casino/jackpots/winfall-provider-network-metadata-v1.mjs'
      - 'loterias-ai/tests/winfall-provider-network-metadata-v1.test.mjs'
      - '.github/workflows/loterias-ai-winfall-provider-network-metadata-v1.yml'
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/winfall-provider-network-metadata-v1.mjs'
      - '.github/workflows/loterias-ai-winfall-provider-network-metadata-v1.yml'

permissions:
  contents: write

concurrency:
  group: loterias-ai-winfall-provider-network-metadata-v1
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit guards
        run: node loterias-ai/tests/winfall-provider-network-metadata-v1.test.mjs
      - name: Run Winfall provider/network metadata probe
        run: node loterias-ai/casino/jackpots/winfall-provider-network-metadata-v1.mjs
      - name: Validate fail-closed result
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync('loterias-ai/casino/jackpots/evidence/winfall-provider-network-metadata-v1.json','utf8'));
          if(x?.scope?.resolvedBotemaniaSlug!=='tiki-templo') throw new Error('wrong Tiki shared target');
          if(x?.scope?.targets?.includes('la-isla-de-tiki')) throw new Error('different La Isla de Tiki game leaked into Winfall targets');
          if(x?.coverage?.allComplete!==true) throw new Error('metadata coverage incomplete');
          if(x?.decision?.sharedNetworkConfigVerified!==false||x?.decision?.exactLiveIdVerified!==false) throw new Error('single metadata run cannot verify network/live identity');
          if(x?.decision?.economicPromotionAllowed!==false||x?.decision?.realMoneyAllowed!==false) throw new Error('promotion must remain false');
          if(x?.guards?.providerIdAloneNeverIdentity!==true||x?.guards?.correctTikiTemploSlugFrozenBeforeRun!==true) throw new Error('identity/target guard missing');
          console.log(JSON.stringify({scope:x.scope,coverage:x.coverage,providerComparison:x.providerComparison,candidates:x.comparison?.sharedStrongTargetOnlySemanticCandidates||[],decision:x.decision},null,2));
          NODE
      - name: Persist evidence on main only
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          FILE=loterias-ai/casino/jackpots/evidence/winfall-provider-network-metadata-v1.json
          cp "$FILE" /tmp/winfall-provider-network-metadata-v1.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p "$(dirname "$FILE")"
          cp /tmp/winfall-provider-network-metadata-v1.json "$FILE"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(casino): refresh corrected Winfall provider network metadata'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
