name: Loterias AI Loteria Nacional v218 Official Sales Geo 2023
on:
  workflow_dispatch:
  push:
    branches: [research/loteria-nacional-v218-official-sales-geo-2023]
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/loteria-nacional-v218-official-sales-geo-2023}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node loterias-ai/scripts/loteria-nacional-v218-official-sales-geo-2023.mjs
      - name: Validate official-only geography
        run: |
          node - <<'NODE'
          const fs=require('fs');const p='loterias-ai/data/research/loteria-nacional-v218-official-sales-geo-2023.json';const d=JSON.parse(fs.readFileSync(p));
          if(d.provider!=='SELAE'||d.scope?.year!==2023) throw new Error('Unexpected provider/year');
          if(d.realMoneyPass!==false) throw new Error('Real-money gate regression');
          console.log(JSON.stringify(d.summary));
          NODE
      - name: Persist v218
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/loteria-nacional-v218-official-sales-geo-2023.json
          if ! git diff --cached --quiet; then git commit -m 'data(loterias-ai): persist v218 Loteria Nacional geo 2023'; git pull --rebase origin "$GITHUB_REF_NAME"; git push origin HEAD:"$GITHUB_REF_NAME"; fi