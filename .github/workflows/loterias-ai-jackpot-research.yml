name: Loterias AI Jackpot Research
on:
  push:
    paths:
      - 'loterias-ai/scripts/jackpot-research-numeric.mjs'
      - '.github/workflows/loterias-ai-jackpot-research.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/jackpot-research-numeric.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/research/jackpot-proximity.json /tmp/jackpot-proximity.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p loterias-ai/data/research
          cp /tmp/jackpot-proximity.json loterias-ai/data/research/jackpot-proximity.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/research/jackpot-proximity.json
          git commit -m 'data(loterias-ai): persist jackpot proximity research' || exit 0
          git push origin HEAD:main
