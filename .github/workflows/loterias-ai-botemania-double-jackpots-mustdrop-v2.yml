name: Loterias AI Botemania Double Jackpots MustDrop Extractor V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/botemania-double-jackpots-mustdrop-extractor-v2.mjs'
      - '.github/workflows/loterias-ai-botemania-double-jackpots-mustdrop-v2.yml'

permissions:
  contents: write

concurrency:
  group: loterias-ai-botemania-double-jackpots-mustdrop-v2
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run widened MustDropWithin settings scan
        run: node loterias-ai/casino/jackpots/botemania-double-jackpots-mustdrop-extractor-v2.mjs
      - name: Persist evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/casino/jackpots/evidence/botemania-double-jackpots-mustdrop-extractor-v2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(casino): refresh Botemania DoubleJackpots MustDropWithin v2 scan'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
