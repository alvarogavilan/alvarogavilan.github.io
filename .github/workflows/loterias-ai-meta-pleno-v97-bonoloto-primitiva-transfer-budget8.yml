name: Loterias AI MetaPleno v97 Bonoloto Primitiva Transfer Budget8
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v97-bonoloto-primitiva-transfer-budget8.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v97-bonoloto-primitiva-transfer-budget8.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v97-bonoloto-primitiva-transfer-budget8.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v97-bonoloto-primitiva-transfer-budget8
          path: loterias-ai/data/research/meta-pleno-v97-bonoloto-primitiva-transfer-budget8.json
