name: Loterias AI MetaPleno v67 Rolling Origin
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v67-rolling-origin-validator.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v67-rolling-origin.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: [bonoloto, primitiva, euromillones]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run rolling-origin validator
        env:
          GAME: ${{ matrix.game }}
        run: node loterias-ai/scripts/meta-pleno-v67-rolling-origin-validator.mjs
      - name: Persist result safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add loterias-ai/data/research/meta-pleno-v67-${{ matrix.game }}-rolling-origin.json
          git diff --cached --quiet && exit 0
          git commit -m "data(loterias-ai): persist v67 ${{ matrix.game }} rolling-origin"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
