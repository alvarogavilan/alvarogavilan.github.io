name: Loterias AI Settle Gordo v14 Shadow
on:
  push:
    paths:
      - 'loterias-ai/data/archive/gordo-primitiva/2026.json'
      - 'loterias-ai/data/shadow/gordo-2026-08-16-metapleno-v14.json'
      - 'loterias-ai/scripts/settle-gordo-v14-shadow.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/settle-gordo-v14-shadow.mjs
      - name: Persist settlement if available
        run: |
          test -f loterias-ai/data/shadow/gordo-2026-08-16-metapleno-v14-settlement.json || exit 0
          cp loterias-ai/data/shadow/gordo-2026-08-16-metapleno-v14-settlement.json /tmp/gordo-settlement.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/gordo-settlement.json loterias-ai/data/shadow/gordo-2026-08-16-metapleno-v14-settlement.json
          git add loterias-ai/data/shadow/gordo-2026-08-16-metapleno-v14-settlement.json
          git commit -m 'data(loterias-ai): settle Gordo v14 prospective shadow' || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*3)); done
          exit 1
