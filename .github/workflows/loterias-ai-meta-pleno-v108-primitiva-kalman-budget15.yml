name: Loterias AI MetaPleno v108 Primitiva Kalman Budget15
on:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v108-primitiva-kalman-budget15.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v108-primitiva-kalman-budget15.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node loterias-ai/scripts/meta-pleno-v108-primitiva-kalman-budget15.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v108-primitiva-kalman-budget15
          path: loterias-ai/data/research/meta-pleno-v108-primitiva-kalman-budget15.json
