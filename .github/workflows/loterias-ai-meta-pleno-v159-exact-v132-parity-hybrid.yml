name: Loterias AI MetaPleno v159 Exact v132 Parity Hybrid
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v159-exact-v132-parity-hybrid]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v159-exact-v132-parity-hybrid.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v159-exact-v132-parity-hybrid.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v159-exact-v132-parity-hybrid.mjs
      - name: Persist v159
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v159-exact-v132-parity-hybrid.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist v159 exact v132 parity hybrid'
          git push
