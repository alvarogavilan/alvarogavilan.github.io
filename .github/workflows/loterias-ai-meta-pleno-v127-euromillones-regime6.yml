name: Loterias AI MetaPleno v127 Euromillones Regime6
on:
  workflow_dispatch:
  push:
    branches: [research/multilane-v127-euromillones-regime]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v127-euromillones-regime6.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v127-euromillones-regime6.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node loterias-ai/scripts/meta-pleno-v127-euromillones-regime6.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v127-euromillones-regime6.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist v127 Euromillones regime6'
          git push
