name: Loterias AI Pleno Signal Registry
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/build-pleno-signal-registry.mjs'
      - 'loterias-ai/data/policies/pleno-first-policy.json'
      - '.github/workflows/loterias-ai-pleno-signal-registry.yml'
permissions:
  contents: write
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/build-pleno-signal-registry.mjs
      - name: Persist registry safely
        run: |
          cp loterias-ai/data/research/pleno-signal-registry.json /tmp/pleno-signal-registry.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/pleno-signal-registry.json loterias-ai/data/research/pleno-signal-registry.json
            git add loterias-ai/data/research/pleno-signal-registry.json
            git commit -m 'data(loterias-ai): persist pleno-first signal registry' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
