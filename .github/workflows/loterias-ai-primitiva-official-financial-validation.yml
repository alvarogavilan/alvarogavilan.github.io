name: Loterias AI Primitiva Official Financial Validation
on:
  push:
    paths:
      - 'loterias-ai/scripts/primitiva-official-financial-validation.mjs'
      - '.github/workflows/loterias-ai-primitiva-official-financial-validation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node loterias-ai/scripts/primitiva-official-financial-validation.mjs
      - name: Persist result safely
        run: |
          cp loterias-ai/data/backtests/primitiva-official-financial-validation.json /tmp/primitiva-official-financial-validation.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/primitiva-official-financial-validation.json loterias-ai/data/backtests/primitiva-official-financial-validation.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/backtests/primitiva-official-financial-validation.json
          git commit -m 'data(loterias-ai): persist Primitiva official financial validation' || exit 0
          git push origin HEAD:main
