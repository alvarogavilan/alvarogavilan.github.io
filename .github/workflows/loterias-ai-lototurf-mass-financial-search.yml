name: Loterias AI Lototurf Mass Financial Search
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/lototurf-mass-financial-search.mjs'
      - '.github/workflows/loterias-ai-lototurf-mass-financial-search.yml'
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Search 250,000 Lototurf portfolio strategies
        env:
          CANDIDATES: 250000
        run: node loterias-ai/scripts/lototurf-mass-financial-search.mjs
      - name: Persist evidence safely
        run: |
          cp loterias-ai/data/backtests/lototurf-mass-financial-search.json /tmp/lototurf-mass-financial-search.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p loterias-ai/data/backtests
          cp /tmp/lototurf-mass-financial-search.json loterias-ai/data/backtests/lototurf-mass-financial-search.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/backtests/lototurf-mass-financial-search.json
          git commit -m 'data(loterias-ai): persist Lototurf mass financial search' || exit 0
          git push origin HEAD:main
