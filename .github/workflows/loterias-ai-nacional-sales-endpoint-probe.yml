name: Loterias AI Nacional Sales Endpoint Probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/probe-nacional-sales-endpoint.mjs'
      - '.github/workflows/loterias-ai-nacional-sales-endpoint-probe.yml'
concurrency:
  group: loterias-ai-nacional-sales-endpoint-probe
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Recompute and persist exact-draw geography probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node loterias-ai/scripts/probe-nacional-sales-endpoint.mjs
            node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('loterias-ai/data/probes/nacional-sales-endpoint.json','utf8'));if(!d.exactOfficialDrawDateRequired||!d.officialOnly||!d.noInference||!d.surfacesKeptSeparate)throw new Error('Nacional geography custody gates drifted');if(d.ventas?.dataAvailable===true&&(!d.ventas?.structured?.provinceCount||!d.ventas?.structured?.communityCount))throw new Error('Ventas marked available without structured geography rows');if(d.consignacion?.dataAvailable===true&&(!d.consignacion?.structured?.provinceCount||!d.consignacion?.structured?.communityCount))throw new Error('Consignacion marked available without structured geography rows');"
            git add loterias-ai/data/probes/nacional-sales-endpoint.json
            if git diff --cached --quiet; then
              echo 'No scientific change in Nacional geography probe.'
              exit 0
            fi
            git commit -m 'data(loterias-ai): persist exact-draw Nacional sales geography probe'
            if git push origin HEAD:main; then exit 0; fi
            echo "main moved during probe persistence; recomputing attempt ${attempt}/5"
            sleep $((attempt * 2))
          done
          echo 'Could not persist Nacional geography probe after recomputations' >&2
          exit 1
