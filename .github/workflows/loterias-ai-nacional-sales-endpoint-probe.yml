name: Loterias AI Nacional Sales Endpoint Probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/probe-nacional-sales-endpoint.mjs'
      - '.github/workflows/loterias-ai-nacional-sales-endpoint-probe.yml'
concurrency:
  group: loterias-ai-nacional-sales-endpoint-probe
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Recompute and persist exact-draw geography probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node loterias-ai/scripts/probe-nacional-sales-endpoint.mjs
            node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('loterias-ai/data/probes/nacional-sales-endpoint.json','utf8'));if(!d.exactOfficialDrawDateRequired||!d.officialOnly||!d.noInference||!d.surfacesKeptSeparate||!d.prizeDistributionIsNotSales||!d.salesAndConsignationNotInterchangeable||!d.provinceCommunityTotalsMustReconcile||!d.malformedRowsMustFailClosed||!d.failClosedWhenSurfaceUnavailable||!d.salesMustNotExceedConsignation||!d.exactTerritoryCoverageRequired)throw new Error('Nacional geography custody gates drifted');for(const [name,s] of [['ventas',d.ventas],['consignacion',d.consignacion]]){if(s?.dataAvailable===true){if(!s?.qualityPass||!s?.structured?.provinceCount||!s?.structured?.communityCount||s?.structured?.allRowsParsed!==true||s?.structured?.reconciliation?.totalsReconciled!==true||(s?.structured?.rejectedRows?.length??0)!==0)throw new Error(name+' marked available without complete reconciled geography');}}if(d.bothSurfacesReady===true){if(d?.crossSurface?.ready!==true||d?.crossSurface?.salesMustNotExceedConsignation!==true||d?.crossSurface?.exactTerritoryCoverageRequired!==true)throw new Error('Nacional cross-surface gate missing');if(d.analysisReady===true&&d?.crossSurface?.qualityPass!==true)throw new Error('Nacional geography analysisReady without sales<=consignation');}if(d.analysisReady===true&&(!d.bothSurfacesReady||!d.qualityPass||d?.crossSurface?.qualityPass!==true))throw new Error('Nacional geography analysisReady drifted');"
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const path='loterias-ai/data/probes/nacional-sales-endpoint.json';
          let previous=null;
          try{previous=JSON.parse(execFileSync('git',['show',`HEAD:${path}`],{encoding:'utf8'}));}catch{}
          const current=JSON.parse(fs.readFileSync(path,'utf8'));
          const stable=x=>{const y=structuredClone(x);delete y.generatedAt;return y;};
          if(previous&&JSON.stringify(stable(previous))===JSON.stringify(stable(current))){
            fs.writeFileSync(path,JSON.stringify(previous,null,2)+'\n');
            console.log('No semantic change in Nacional geography probe; preserving prior timestamp.');
          }
          NODE
            git add loterias-ai/data/probes/nacional-sales-endpoint.json
            if git diff --cached --quiet; then
              echo 'No scientific change in Nacional geography probe.'
              exit 0
            fi
            git commit -m 'data(loterias-ai): persist exact-draw Nacional sales geography probe'
            if git push origin HEAD:main; then exit 0; fi
            echo "main moved during probe persistence; recomputing attempt ${attempt}/5"
            sleep $((attempt * 2))
          done
          echo 'Could not persist Nacional geography probe after recomputations' >&2
          exit 1
