name: Loterias AI MetaPleno v24 Compact Latent
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v24-bonoloto-compact-latent.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v24-compact-latent.yml'
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v24-bonoloto-compact-latent.mjs
      - name: Persist safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v24-bonoloto-compact-latent.json
          git diff --cached --quiet && exit 0
          git commit -m 'data(loterias-ai): persist MetaPleno v24 compact latent'
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*2)); done
          exit 1
