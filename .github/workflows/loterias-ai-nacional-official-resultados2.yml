# Cost control: Lotería Nacional normally adds results around Thursday/Saturday draws; refresh on the following UTC mornings.
name: Loterias AI Nacional Official Resultados2
on:
  workflow_dispatch:
  schedule:
    - cron: '25 8 * * 0,5'
  push:
    paths:
      - 'loterias-ai/scripts/enrich-nacional-official-resultados2.mjs'
      - 'loterias-ai/scripts/repair-nacional-normalization-evidence.mjs'
      - 'loterias-ai/scripts/certify-nacional-persisted-resultados2.mjs'
      - '.github/workflows/loterias-ai-nacional-official-resultados2.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-nacional-official-resultados2
  cancel-in-progress: true
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Recompute and persist official SELAE backfill safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            BATCH_LIMIT=400 node loterias-ai/scripts/enrich-nacional-official-resultados2.mjs
            BATCH_LIMIT=220 node loterias-ai/scripts/repair-nacional-normalization-evidence.mjs
            node loterias-ai/scripts/certify-nacional-persisted-resultados2.mjs
            node loterias-ai/scripts/build-national-archive-index.mjs
            node loterias-ai/scripts/build-completeness-index.mjs
            node loterias-ai/scripts/audit-national-archive.mjs
            git add loterias-ai/data/archive
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(loterias-ai): persist full official Nacional extractions and certifications'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1