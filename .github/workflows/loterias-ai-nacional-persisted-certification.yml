name: Loterias AI Nacional Persisted SELAE Certification
on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
  push:
    paths:
      - 'loterias-ai/scripts/certify-nacional-persisted-resultados2.mjs'
      - '.github/workflows/loterias-ai-nacional-persisted-certification.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-nacional-persisted-certification
  cancel-in-progress: true
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Certify already-persisted complete SELAE evidence on latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          report='loterias-ai/data/archive/_meta/nacional-persisted-resultados2-certification.json'
          manifest='loterias-ai/data/archive/manifest.json'
          completeness='loterias-ai/data/archive/completeness-index.json'
          audit='loterias-ai/data/archive/_meta/archive-audit.json'

          semantic_same() {
            node - "$1" "$2" <<'NODE'
          const fs = require('fs');
          const [beforePath, afterPath] = process.argv.slice(2);
          const stable = value => {
            if (Array.isArray(value)) return value.map(stable);
            if (value && typeof value === 'object') {
              return Object.fromEntries(Object.entries(value)
                .filter(([key]) => key !== 'generatedAt' && key !== 'auditGeneratedAt')
                .map(([key, child]) => [key, stable(child)]));
            }
            return value;
          };
          const before = stable(JSON.parse(fs.readFileSync(beforePath, 'utf8')));
          const after = stable(JSON.parse(fs.readFileSync(afterPath, 'utf8')));
          process.exit(JSON.stringify(before) === JSON.stringify(after) ? 0 : 1);
          NODE
          }

          snapshot_if_present() {
            local path="$1"
            local out="$2"
            if git cat-file -e "HEAD:${path}" 2>/dev/null; then
              git show "HEAD:${path}" > "$out"
              return 0
            fi
            return 1
          }

          restore_if_semantic_same() {
            local before="$1"
            local current="$2"
            if [[ -f "$before" && -f "$current" ]] && semantic_same "$before" "$current"; then
              git checkout HEAD -- "$current"
            fi
          }

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            old_report="$(mktemp)"
            old_manifest="$(mktemp)"
            old_completeness="$(mktemp)"
            old_audit="$(mktemp)"
            snapshot_if_present "$report" "$old_report" || :
            snapshot_if_present "$manifest" "$old_manifest" || :
            snapshot_if_present "$completeness" "$old_completeness" || :
            snapshot_if_present "$audit" "$old_audit" || :

            node loterias-ai/scripts/certify-nacional-persisted-resultados2.mjs
            restore_if_semantic_same "$old_report" "$report"

            node loterias-ai/scripts/build-national-archive-index.mjs
            node loterias-ai/scripts/build-completeness-index.mjs
            node loterias-ai/scripts/audit-national-archive.mjs

            # Derived indexes must not move main when only volatile timestamps change.
            # Any scientific change (counts, blockers, gates, dates, provenance) remains staged.
            restore_if_semantic_same "$old_manifest" "$manifest"
            restore_if_semantic_same "$old_completeness" "$completeness"
            restore_if_semantic_same "$old_audit" "$audit"
            rm -f "$old_report" "$old_manifest" "$old_completeness" "$old_audit"

            git add loterias-ai/data/archive
            if git diff --cached --quiet; then
              echo 'NO_SEMANTIC_CHANGE'
              exit 0
            fi

            git commit -m 'data(nacional): certify persisted complete SELAE resultados2 evidence'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
