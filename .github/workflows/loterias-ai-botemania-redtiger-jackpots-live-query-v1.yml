name: Loterias AI Botemania Red Tiger Jackpots Live Query V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'loterias-ai/casino/jackpots/botemania-redtiger-jackpots-live-query-v1.mjs'
      - '.github/workflows/loterias-ai-botemania-redtiger-jackpots-live-query-v1.yml'
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/botemania-redtiger-jackpots-live-query-v1.mjs'
      - '.github/workflows/loterias-ai-botemania-redtiger-jackpots-live-query-v1.yml'

permissions:
  contents: write

concurrency:
  group: loterias-ai-botemania-redtiger-jackpots-live-query-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: node --check loterias-ai/casino/jackpots/botemania-redtiger-jackpots-live-query-v1.mjs
      - name: Run exact public loadJackpots query
        run: node loterias-ai/casino/jackpots/botemania-redtiger-jackpots-live-query-v1.mjs
      - name: Persist evidence on main only
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE=loterias-ai/casino/jackpots/evidence/botemania-redtiger-jackpots-live-query-v1.json
          mkdir -p /tmp/redtiger-live
          cp "$EVIDENCE" /tmp/redtiger-live/evidence.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p "$(dirname "$EVIDENCE")"
          cp /tmp/redtiger-live/evidence.json "$EVIDENCE"
          git add "$EVIDENCE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(casino): refresh Botemania Red Tiger jackpots live query'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
