name: Loterias AI Quiniela System Mass Search
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/quiniela-system-mass-search.mjs'
      - '.github/workflows/loterias-ai-quiniela-system-mass-search.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-quiniela-system-mass-search
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Search 250,000 Quiniela system strategies
        env:
          CANDIDATES: 250000
        run: node loterias-ai/scripts/quiniela-system-mass-search.mjs
      - name: Persist evidence safely
        run: |
          cp loterias-ai/data/research/quiniela-system-mass-search.json /tmp/quiniela-system-mass-search.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p loterias-ai/data/research
          cp /tmp/quiniela-system-mass-search.json loterias-ai/data/research/quiniela-system-mass-search.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/research/quiniela-system-mass-search.json
          git commit -m 'data(loterias-ai): persist Quiniela doubles-triples mass search' || exit 0
          git push origin HEAD:main
