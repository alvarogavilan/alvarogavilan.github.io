name: Loterias AI MetaPleno v189 Primitiva Bayesian Change Point
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v189-primitiva-bayes-changepoint]
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node loterias-ai/scripts/meta-pleno-v189-primitiva-bayes-changepoint.mjs
      - name: Persist v189
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v189-primitiva-bayes-changepoint.json
          git diff --cached --quiet || git commit -m "research(loterias-ai): persist v189 Primitiva Bayesian change-point"
          git push
