name: Loterias AI Bonoloto Financial
on:
  push:
    paths:
      - 'loterias-ai/scripts/bonoloto-recent-financial-backtest.mjs'
      - '.github/workflows/loterias-ai-bonoloto-financial.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  financial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run corrected financial walk-forward v3
        run: node loterias-ai/scripts/bonoloto-recent-financial-backtest.mjs
      - name: Persist result safely
        run: |
          cp loterias-ai/data/backtests/bonoloto-recent-financial.json /tmp/bonoloto-recent-financial.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/bonoloto-recent-financial.json loterias-ai/data/backtests/bonoloto-recent-financial.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/backtests/bonoloto-recent-financial.json
          git commit -m 'data(loterias-ai): refresh Bonoloto recent financial backtest' || exit 0
          git push origin HEAD:main