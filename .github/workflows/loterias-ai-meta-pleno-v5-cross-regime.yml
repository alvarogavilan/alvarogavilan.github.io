name: Loterias AI MetaPleno v5 Cross Regime
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v5-cross-regime-details.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v5-cross-regime.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v5-cross-regime-details.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/research/meta-pleno-v5-cross-regime-details.json /tmp/cross.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/cross.json loterias-ai/data/research/meta-pleno-v5-cross-regime-details.json
          git add loterias-ai/data/research/meta-pleno-v5-cross-regime-details.json
          git commit -m 'data(loterias-ai): persist cross-regime repeatability audit' || exit 0
          git push origin HEAD:main
