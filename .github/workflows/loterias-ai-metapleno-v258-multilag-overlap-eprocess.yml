name: Loterias AI MetaPleno v258 Multi-Lag Overlap E-Process
on:
  push:
    branches:
      - research/metapleno-v258-multilag-overlap-eprocess
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run v258
        run: node loterias-ai/research/metapleno-v258-multilag-overlap-eprocess.mjs
      - name: Validate fail-closed
        run: node -e "const r=require('./loterias-ai/data/research/metapleno-v258-multilag-overlap-eprocess.json'); if(r.realMoneyPass!==false||r.realStakeEUR!==0) process.exit(1)"
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/metapleno-v258-multilag-overlap-eprocess.json
          git diff --cached --quiet || git commit -m 'research(loterias-ai): persist v258 multi-lag overlap result'
          git push
