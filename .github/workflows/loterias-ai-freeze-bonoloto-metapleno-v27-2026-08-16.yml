name: Loterias AI Freeze Bonoloto MetaPleno v27 2026-08-16
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/freeze-bonoloto-metapleno-v27-2026-08-16.mjs'
      - '.github/workflows/loterias-ai-freeze-bonoloto-metapleno-v27-2026-08-16.yml'
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/freeze-bonoloto-metapleno-v27-2026-08-16.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/shadow/bonoloto-2026-08-16-metapleno-v27.json /tmp/v27.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v27.json loterias-ai/data/shadow/bonoloto-2026-08-16-metapleno-v27.json
            git add loterias-ai/data/shadow/bonoloto-2026-08-16-metapleno-v27.json
            git commit -m 'data(loterias-ai): freeze Bonoloto MetaPleno v27 2026-08-16' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
