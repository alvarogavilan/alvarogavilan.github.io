name: Loterias AI MetaPleno v76 Bonoloto Hazard Matched Null
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v76-bonoloto-hazard-matched-null.mjs'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v76-bonoloto-hazard-matched-null.mjs
      - name: Persist result safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v76-bonoloto-hazard-matched-null.json
          git commit -m "data(loterias-ai): persist v76 hazard matched-null audit" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*3)); done
          exit 1