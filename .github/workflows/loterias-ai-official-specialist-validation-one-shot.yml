name: Loterias AI Official Specialist Validation One Shot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/specialists/official-catalog-specialist-factory-v1.mjs'
      - '.github/workflows/loterias-ai-official-specialist-validation-one-shot.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node loterias-ai/casino/specialists/official-catalog-specialist-factory-v1.mjs
      - run: node loterias-ai/casino/specialists/build-economic-priority-queue-v1.mjs
      - run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/casino/specialists/official-game-specialists-v1.json loterias-ai/casino/specialists/economic-priority-queue-v1.json
          git diff --cached --quiet && exit 0
          git commit -m 'research(casino): persist validated official game specialists'
          git pull --rebase origin main
          git push origin HEAD:main
