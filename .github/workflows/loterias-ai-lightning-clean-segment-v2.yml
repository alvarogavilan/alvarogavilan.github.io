# Operational trigger after the frozen 2026-08-18T10:50:00Z barrier; scientific protocol unchanged.
# Cost guard: 10-minute capture preserves a wide safety margin inside the 30-round source window.
# Derived readiness summaries belong in the application/local runtime, not this continuity-critical loop.
name: Loterias AI Lightning Clean Segment V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/lightning/collect-authoritative-segment-v2.mjs'
      - 'loterias-ai/casino/lightning/research/timing-replication-v3.mjs'
      - 'loterias-ai/casino/lightning/research/physical-rng-prospective-v2.mjs'
      - 'loterias-ai/casino/lightning/research/economic-number-selection-prospective-v2.mjs'
      - 'loterias-ai/casino/lightning/research/lightning-prospective-frozen-lag8-clean-v2.mjs'
      - 'loterias-ai/casino/lightning/research/lightning-prospective-lag-family-clean-v2.mjs'
      - 'loterias-ai/casino/lightning/research/lightning-prospective-past-lucky-family-clean-v2.mjs'
      - 'loterias-ai/casino/lightning/evidence/authoritative-segment-v2-freeze.json'
      - 'loterias-ai/casino/lightning/evidence/economic-number-selection-prospective-freeze-v2.json'
      - 'loterias-ai/casino/lightning/evidence/prospective-lag8-clean-v2-freeze-v1.json'
      - 'loterias-ai/casino/lightning/evidence/prospective-lag-family-clean-v2-freeze-v1.json'
      - 'loterias-ai/casino/lightning/evidence/prospective-past-lucky-family-clean-v2-freeze-v1.json'
      - '.github/workflows/loterias-ai-lightning-clean-segment-v2.yml'
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

concurrency:
  group: loterias-ai-lightning-clean-segment-v2
  cancel-in-progress: false

jobs:
  clean-segment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture clean segment and advance only frozen prospectives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            set +e
            node loterias-ai/casino/lightning/collect-authoritative-segment-v2.mjs
            COLLECT_CODE=$?
            set -e

            if [ "$COLLECT_CODE" -ne 0 ]; then
              echo 'Clean segment continuity failed closed; persist only segment status.'
              git add loterias-ai/casino/lightning/evidence/authoritative-segment-v2-status.json 2>/dev/null || true
              if git diff --cached --quiet; then exit 0; fi
              git commit -m 'ops(lightning): quarantine clean segment v2 continuity failure'
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt*2))
              continue
            fi

            node loterias-ai/casino/lightning/research/timing-replication-v3.mjs
            node loterias-ai/casino/lightning/research/physical-rng-prospective-v2.mjs
            node loterias-ai/casino/lightning/research/economic-number-selection-prospective-v2.mjs
            node loterias-ai/casino/lightning/research/lightning-prospective-frozen-lag8-clean-v2.mjs
            node loterias-ai/casino/lightning/research/lightning-prospective-lag-family-clean-v2.mjs
            node loterias-ai/casino/lightning/research/lightning-prospective-past-lucky-family-clean-v2.mjs

            node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('loterias-ai/casino/lightning/evidence/authoritative-segment-v2-status.json','utf8'));if(s.freezeVersion!=='authoritative-segment-v2-freeze'||s.guards?.strictlyPostBarrier!==true||s.guards?.oldAmbiguousGapImported!==false||s.guards?.realMoneyAllowed!==false||s.continuity?.bridgeSafe!==true)throw Error('clean segment safety drift');const t=JSON.parse(fs.readFileSync('loterias-ai/casino/lightning/evidence/timing-replication-v3-status.json','utf8'));if(t.progress?.closedEpisodes<200&&(t.final!==null||t.disclosure?.performanceHidden!==true||t.disclosure?.pValueHidden!==true))throw Error('timing v3 interim blindness regression');if(t.guards?.realMoneyAllowed!==false)throw Error('timing v3 real-money regression');const p=JSON.parse(fs.readFileSync('loterias-ai/casino/lightning/evidence/physical-rng-prospective-v2-status.json','utf8'));if(p.progress?.roundsUsedForV2<5000&&(p.final!==null||p.disclosure?.observedStatisticsHidden!==true||p.disclosure?.pValuesHidden!==true))throw Error('physical v2 blindness regression');if(p.guards?.realMoneyAllowed!==false)throw Error('physical v2 real-money regression');const n=JSON.parse(fs.readFileSync('loterias-ai/casino/lightning/evidence/economic-number-selection-prospective-status-v2.json','utf8'));if(n.algorithmCustody?.sourceEngineGitBlobSha!=='1e9431d663b6f5ced9dcb24a9d6074bb6bea3874'||n.guards?.v1SelectorAlgorithmUnchanged!==true||n.guards?.cleanWarmupNotScored!==true||n.guards?.realMoneyAllowed!==false)throw Error('number v2 custody regression');if(n.progress?.eligibleFutureRounds<5000&&n.disclosure?.candidatePerformanceHidden!==true)throw Error('number v2 interim ranking disclosure regression');const l=JSON.parse(fs.readFileSync('loterias-ai/casino/lightning/evidence/prospective-lag8-clean-v2-status-v1.json','utf8'));if(l.freezeVersion!=='lightning-prospective-lag8-clean-v2-freeze-v1'||l.guards?.first1000Only!==true||l.guards?.noOptionalStopping!==true||l.guards?.realMoneyAllowed!==false)throw Error('lag8 clean v2 protocol drift');if(l.progress?.comparisonsUsed<1000&&(l.final!==null||l.disclosure?.performanceHidden!==true||l.disclosure?.pValueHidden!==true||l.disclosure?.directionHidden!==true))throw Error('lag8 clean v2 interim blindness regression');const f=JSON.parse(fs.readFileSync('loterias-ai/casino/lightning/evidence/prospective-lag-family-clean-v2-status-v1.json','utf8'));if(f.freezeVersion!=='lightning-prospective-lag-family-clean-v2-freeze-v1'||f.guards?.first5000Only!==true||f.guards?.noOptionalStopping!==true||f.guards?.realMoneyAllowed!==false||f.guards?.perCandidateAlpha!==0.0005)throw Error('lag family protocol drift');if(f.progress?.comparisonsUsed<5000&&(f.final!==null||f.disclosure?.candidatePerformanceHidden!==true||f.disclosure?.candidateRankingHidden!==true||f.disclosure?.pValuesHidden!==true))throw Error('lag family interim blindness regression');const q=JSON.parse(fs.readFileSync('loterias-ai/casino/lightning/evidence/prospective-past-lucky-family-clean-v2-status-v1.json','utf8'));if(q.freezeVersion!=='lightning-prospective-past-lucky-family-clean-v2-freeze-v1'||q.guards?.pastInformationOnly!==true||q.guards?.currentRoundLuckySelectionForbidden!==true||q.guards?.first5000Only!==true||q.guards?.perCandidateAlpha!==0.0025||q.guards?.realMoneyAllowed!==false)throw Error('past-lucky protocol drift');if(q.progress?.roundsUsed<5000&&(q.final!==null||q.disclosure?.candidatePerformanceHidden!==true||q.disclosure?.candidateRankingHidden!==true||q.disclosure?.roiHidden!==true||q.disclosure?.pValuesHidden!==true))throw Error('past-lucky interim blindness regression')"

            git add \
              loterias-ai/casino/lightning/data/casinoorg-lightningroulette-segment-v2.jsonl \
              loterias-ai/casino/lightning/evidence/authoritative-segment-v2-status.json \
              loterias-ai/casino/lightning/evidence/timing-replication-v3-status.json \
              loterias-ai/casino/lightning/evidence/physical-rng-prospective-v2-status.json \
              loterias-ai/casino/lightning/evidence/economic-number-selection-prospective-status-v2.json \
              loterias-ai/casino/lightning/evidence/prospective-lag8-clean-v2-status-v1.json \
              loterias-ai/casino/lightning/evidence/prospective-lag-family-clean-v2-status-v1.json \
              loterias-ai/casino/lightning/evidence/prospective-past-lucky-family-clean-v2-status-v1.json 2>/dev/null || true
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'research(casino): advance clean authoritative segment v2'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
