name: Loterias AI Botemania Winner History V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/botemania-jpk-public-winner-history-probe-v1.mjs'
      - '.github/workflows/loterias-ai-botemania-winner-history-v1.yml'
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: write

concurrency:
  group: loterias-ai-botemania-winner-history-v1
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recompute and persist bounded public winner-history evidence on latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          FILE=loterias-ai/casino/jackpots/evidence/botemania-jpk-public-winner-history-probe-v1.json

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            node loterias-ai/casino/jackpots/botemania-jpk-public-winner-history-probe-v1.mjs
            git add "$FILE"
            if git diff --cached --quiet; then
              exit 0
            fi

            git commit -m 'data(casino): refresh Botemania public winner-history probe'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt*2))
          done
          exit 1
