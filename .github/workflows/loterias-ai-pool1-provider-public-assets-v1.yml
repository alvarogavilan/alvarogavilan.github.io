name: Loterias AI Pool1 Provider Public Assets V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/botemania-pool1-provider-public-assets-v1.mjs'
      - '.github/workflows/loterias-ai-pool1-provider-public-assets-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check loterias-ai/casino/jackpots/botemania-pool1-provider-public-assets-v1.mjs
      - name: Map bounded public provider rule/help assets
        run: node loterias-ai/casino/jackpots/botemania-pool1-provider-public-assets-v1.mjs
      - name: Enforce fail-closed provider asset semantics
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const x=JSON.parse(fs.readFileSync('loterias-ai/casino/jackpots/evidence/botemania-pool1-provider-public-assets-v1.json','utf8'));
          if(x.guards?.publicNoAuthOnly!==true || x.guards?.noClosedJackpotCmsFieldsRepeated!==true || x.guards?.noLogin!==true || x.guards?.noCookies!==true || x.guards?.noGameLaunch!==true || x.guards?.noSessionCreation!==true || x.guards?.noBetting!==true) throw new Error('public/no-launch/no-betting guard missing');
          if(x.guards?.providerIdIsMetadataNotIdentity!==true || x.guards?.ruleKeywordNeverVerifiesIdentity!==true || x.guards?.pool1LiteralAloneNeverVerifiesIdentity!==true || x.guards?.pool1PlusGameAssetRequiresIndependentReplication!==true) throw new Error('identity anti-promotion guard missing');
          if(x.decision?.exactGameIdentityRecovered!==false || x.decision?.providerAssetIdentityVerified!==false || x.decision?.economicPromotionAllowed!==false || x.decision?.realMoneyAllowed!==false) throw new Error('asset discovery auto-promoted identity/economics');
          if(x.coverage?.targetCount!==10 || x.coverage?.pageMetadataHttp200Count!==10) throw new Error(`incomplete page metadata coverage ${x.coverage?.pageMetadataHttp200Count}/10`);
          if(x.coverage?.providerResolvedCount!==10) throw new Error(`provider metadata unresolved ${x.coverage?.providerResolvedCount}/10`);
          console.log(JSON.stringify({coverage:x.coverage,providerSummary:x.providerSummary,discovery:x.discovery,decision:x.decision},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: pool1-provider-public-assets-v1
          path: loterias-ai/casino/jackpots/evidence/botemania-pool1-provider-public-assets-v1.json
          retention-days: 7
