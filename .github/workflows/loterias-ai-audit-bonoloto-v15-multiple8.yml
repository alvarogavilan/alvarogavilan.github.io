name: Loterias AI Audit Bonoloto v15 Multiple8
on:
  push:
    paths:
      - 'loterias-ai/scripts/audit-bonoloto-v15-multiple8-economics.mjs'
      - '.github/workflows/loterias-ai-audit-bonoloto-v15-multiple8.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node loterias-ai/scripts/audit-bonoloto-v15-multiple8-economics.mjs
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/research/bonoloto-v15-multiple8-official-economics.json
          git commit -m 'data(loterias-ai): persist v15 multiple8 economics' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
