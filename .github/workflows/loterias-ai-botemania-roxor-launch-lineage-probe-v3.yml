name: Loterias AI Botemania Roxor Launch Lineage Probe V3

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'loterias-ai/casino/jackpots/botemania-roxor-launch-lineage-probe-v3.mjs'
      - '.github/workflows/loterias-ai-botemania-roxor-launch-lineage-probe-v3.yml'
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/botemania-roxor-launch-lineage-probe-v3.mjs'
      - '.github/workflows/loterias-ai-botemania-roxor-launch-lineage-probe-v3.yml'
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

concurrency:
  group: loterias-ai-botemania-roxor-launch-lineage-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: node --check loterias-ai/casino/jackpots/botemania-roxor-launch-lineage-probe-v3.mjs
      - name: Directed launch-lineage probe
        run: node loterias-ai/casino/jackpots/botemania-roxor-launch-lineage-probe-v3.mjs
      - name: Persist evidence on main only
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE=loterias-ai/casino/jackpots/evidence/botemania-roxor-launch-lineage-probe-v3.json
          mkdir -p /tmp/roxor-launch-v3
          cp "$EVIDENCE" /tmp/roxor-launch-v3/evidence.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p "$(dirname "$EVIDENCE")"
          cp /tmp/roxor-launch-v3/evidence.json "$EVIDENCE"
          git add "$EVIDENCE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(casino): refresh Roxor launch-lineage probe v3'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
