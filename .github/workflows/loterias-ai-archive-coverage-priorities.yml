name: Loterias AI - Archive coverage priorities

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/scripts/build-archive-coverage-priorities.mjs'
      - '.github/workflows/loterias-ai-archive-coverage-priorities.yml'
  schedule:
    - cron: '13 5 * * *'

permissions:
  contents: write

concurrency:
  group: loterias-ai-archive-coverage-priorities
  cancel-in-progress: false

jobs:
  build-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild source-of-truth manifest
        run: node loterias-ai/scripts/build-national-archive-index.mjs
      - name: Rebuild quality audit
        run: node loterias-ai/scripts/audit-national-archive.mjs
      - name: Build coverage priorities
        run: node loterias-ai/scripts/build-archive-coverage-priorities.mjs
      - name: Assert priority evidence
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const j=JSON.parse(fs.readFileSync('loterias-ai/data/archive/_meta/archive-coverage-priorities.json','utf8'));
          if(j?.schemaVersion!==1) throw new Error('bad coverage schema');
          if(!Array.isArray(j?.priorities)||j.priorities.length<1) throw new Error('no priorities');
          if(j?.totals?.records<1) throw new Error('empty archive');
          if(j?.totals?.validationGap<0) throw new Error('negative validation gap');
          if(j.priorities.some(x=>x.validationGap<0||x.economicsGap<0||x.officialEconomicsGap<0)) throw new Error('negative game gap');
          console.log(JSON.stringify({totals:j.totals,topPriority:j.topPriority},null,2));
          NODE
      - name: Persist priority evidence safely
        run: |
          git config user.name 'loterias-ai-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add loterias-ai/data/archive/_meta/archive-coverage-priorities.json
          git diff --cached --quiet && exit 0
          git commit -m 'data(loterias-ai): refresh archive coverage priorities'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt*3))
          done
          exit 1
