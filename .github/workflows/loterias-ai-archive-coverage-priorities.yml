name: Loterias AI - Archive coverage priorities

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/data/archive/**'
      - 'loterias-ai/scripts/build-archive-coverage-priorities.mjs'
      - '.github/workflows/loterias-ai-archive-coverage-priorities.yml'

permissions:
  contents: write

concurrency:
  group: loterias-ai-archive-coverage-priorities
  cancel-in-progress: true

jobs:
  build-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/build-national-archive-index.mjs
      - run: node loterias-ai/scripts/audit-national-archive.mjs
      - run: node loterias-ai/scripts/build-archive-coverage-priorities.mjs
      - name: Assert priority evidence
        run: node --input-type=module -e "import fs from 'node:fs';const j=JSON.parse(fs.readFileSync('loterias-ai/data/archive/_meta/archive-coverage-priorities.json','utf8'));if(j?.schemaVersion!==1||!Array.isArray(j?.priorities)||j.priorities.length<1||j?.totals?.records<1||j?.totals?.validationGap<0||j.priorities.some(x=>x.validationGap<0||x.economicsGap<0||x.officialEconomicsGap<0))throw Error('coverage priority evidence failed')"
      - name: Persist only priority evidence safely
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE='loterias-ai/data/archive/_meta/archive-coverage-priorities.json'
          cp "$EVIDENCE" /tmp/archive-coverage-priorities.json
          git config user.name 'loterias-ai-bot';git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main;git reset --hard origin/main;cp /tmp/archive-coverage-priorities.json "$EVIDENCE";git add "$EVIDENCE"
            git diff --cached --quiet && exit 0
            git commit -m 'data(loterias-ai): refresh archive coverage priorities'
            git push origin HEAD:main && exit 0
            sleep $((attempt*3))
          done
          exit 1
