name: Loterias AI MetaPleno v68 CP-SAT Coverage
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta_pleno_v68_cpsat_coverage.py'
      - '.github/workflows/loterias-ai-meta-pleno-v68-cpsat-coverage.yml'
permissions:
  contents: write
jobs:
  cpsat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: [bonoloto, primitiva, euromillones]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check ortools==9.14.6206
      - name: Solve exact coverage portfolio
        env:
          GAME: ${{ matrix.game }}
          MAX_BUDGET_EUR: '15'
        run: python loterias-ai/scripts/meta_pleno_v68_cpsat_coverage.py
      - name: Persist result safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add loterias-ai/data/research/meta-pleno-v68-${{ matrix.game }}-cpsat-coverage.json
          git diff --cached --quiet && exit 0
          git commit -m "data(loterias-ai): persist v68 ${{ matrix.game }} CP-SAT coverage"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
