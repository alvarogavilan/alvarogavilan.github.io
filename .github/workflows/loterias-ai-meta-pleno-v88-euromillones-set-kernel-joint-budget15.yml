name: Loterias AI MetaPleno v88 Euromillones Joint Set Kernel Budget15
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v88-euromillones-set-kernel-joint-budget15.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v88-euromillones-set-kernel-joint-budget15.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v88-euromillones-set-kernel-joint-budget15.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v88-euromillones-result
          path: loterias-ai/data/research/meta-pleno-v88-euromillones-set-kernel-joint-budget15.json
