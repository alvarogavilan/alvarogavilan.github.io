name: Loterias AI EuroDreams Economics Probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/probe-eurodreams-economics-source.mjs'
      - '.github/workflows/loterias-ai-probe-eurodreams-economics.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node loterias-ai/scripts/probe-eurodreams-economics-source.mjs
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/probes/eurodreams-economics-source.json
          git commit -m 'data(loterias-ai): persist EuroDreams economics probe' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
