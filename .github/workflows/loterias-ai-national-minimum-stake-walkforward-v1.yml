name: Loterias AI National Minimum Stake Walkforward V1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/scripts/national-minimum-stake-walkforward-v1.mjs'
      - '.github/workflows/loterias-ai-national-minimum-stake-walkforward-v1.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-national-minimum-stake-walkforward-v1
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run causal minimum-stake walk-forward across active national games
        run: node loterias-ai/scripts/national-minimum-stake-walkforward-v1.mjs
      - name: Persist result safely
        shell: bash
        run: |
          set -euo pipefail
          cp loterias-ai/data/research/national-minimum-stake-walkforward-v1.json /tmp/national-minimum-stake-walkforward-v1.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/national-minimum-stake-walkforward-v1.json loterias-ai/data/research/national-minimum-stake-walkforward-v1.json
            git add loterias-ai/data/research/national-minimum-stake-walkforward-v1.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(national): persist minimum-stake causal walk-forward v1'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
