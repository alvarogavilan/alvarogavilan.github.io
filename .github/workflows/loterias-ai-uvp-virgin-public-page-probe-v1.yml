name: Loterias AI UVP Virgin Public Page Probe V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/ultimate-video-poker-virgin-public-page-probe-v1.mjs'
      - '.github/workflows/loterias-ai-uvp-virgin-public-page-probe-v1.yml'
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/ultimate-video-poker-virgin-public-page-probe-v1.mjs'
      - '.github/workflows/loterias-ai-uvp-virgin-public-page-probe-v1.yml'
  workflow_dispatch:

concurrency:
  group: loterias-ai-uvp-virgin-public-page-probe-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: node --check loterias-ai/casino/jackpots/ultimate-video-poker-virgin-public-page-probe-v1.mjs
      - name: Probe exact public West Pier-linked Virgin Ultimate Video Poker page
        run: node loterias-ai/casino/jackpots/ultimate-video-poker-virgin-public-page-probe-v1.mjs
      - name: Assert fail-closed semantics and print compact evidence
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const p='loterias-ai/edge-live/evidence/ultimate-video-poker-virgin-public-page-probe-v1.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          if(x.interpretation.economicPromotionAllowed!==false) throw new Error('external public-page probe promoted economics');
          if(x.interpretation.realMoneyAllowed!==false) throw new Error('external public-page probe enabled real money');
          if(x.coverage.globalRuntimeChunkScanPerformed!==false) throw new Error('probe repeated exhausted global scan');
          console.log(JSON.stringify({page:x.page,coverage:x.coverage,technicalTerms:x.technicalTerms,interpretation:x.interpretation},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: uvp-virgin-public-page-probe-v1
          path: loterias-ai/edge-live/evidence/ultimate-video-poker-virgin-public-page-probe-v1.json
          retention-days: 7
      - name: Persist evidence
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cp loterias-ai/edge-live/evidence/ultimate-video-poker-virgin-public-page-probe-v1.json /tmp/uvp-virgin-public-page-probe-v1.json
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p loterias-ai/edge-live/evidence
            cp /tmp/uvp-virgin-public-page-probe-v1.json loterias-ai/edge-live/evidence/ultimate-video-poker-virgin-public-page-probe-v1.json
            git add loterias-ai/edge-live/evidence/ultimate-video-poker-virgin-public-page-probe-v1.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(edge): refresh Virgin UVP public-page probe'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
