name: Loterias AI MetaPleno v35 Quiniela Selection-Aware Null

on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v35-quiniela-selection-aware-null.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v35-quiniela-selection-aware-null.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run selection-aware null audit
        run: RUNS=1000000 node loterias-ai/scripts/meta-pleno-v35-quiniela-selection-aware-null.mjs
      - name: Persist safely
        shell: bash
        run: |
          cp loterias-ai/data/research/meta-pleno-v35-quiniela-selection-aware-null.json /tmp/v35.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v35.json loterias-ai/data/research/meta-pleno-v35-quiniela-selection-aware-null.json
            git add loterias-ai/data/research/meta-pleno-v35-quiniela-selection-aware-null.json
            git commit -m 'data(loterias-ai): persist MetaPleno v35 Quiniela null audit' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
