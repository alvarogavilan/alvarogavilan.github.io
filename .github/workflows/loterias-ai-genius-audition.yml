name: Loterias AI Genius Audition Registry
on:
  workflow_dispatch:
  push:
    branches:
      - feature/loterias-ai-genius-audition
    paths:
      - '.github/workflows/loterias-ai-genius-audition.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-genius-audition-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audition:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build evidence-driven audition registry
        run: node loterias-ai/universidad/audicion-genios/engine.mjs
      - name: Enforce zero-money and discovery gates
        run: node -e "const x=require('./loterias-ai/data/research/genius-audition-registry.json');if(x.gates.realMoneyPass||x.gates.realStakeEUR!==0||!x.gates.independentReplicationRequired||!x.gates.futureUntouchedDataRequired||!x.gates.multipleTestingCorrectionRequired)process.exit(1)"
      - name: Persist audition registry
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/genius-audition-registry.json
          git commit -m 'data(loterias-ai): refresh Genius Audition registry' || exit 0
          git pull --rebase origin feature/loterias-ai-genius-audition
          git push
