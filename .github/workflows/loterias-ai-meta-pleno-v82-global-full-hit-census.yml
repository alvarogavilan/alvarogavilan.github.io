name: Loterias AI MetaPleno v82 Global Full Hit Census
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v82-global-full-hit-census.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v82-global-full-hit-census.yml'
permissions:
  contents: write
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v82-global-full-hit-census.mjs
      - name: Persist result safely
        run: |
          cp loterias-ai/data/research/meta-pleno-v82-global-full-hit-census.json /tmp/v82.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p loterias-ai/data/research
            cp /tmp/v82.json loterias-ai/data/research/meta-pleno-v82-global-full-hit-census.json
            git add loterias-ai/data/research/meta-pleno-v82-global-full-hit-census.json
            git diff --cached --quiet && exit 0
            git commit -m 'data(loterias-ai): persist MetaPleno v82 full-hit census'
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
