name: Loterias AI MetaPleno v55 Bonoloto Graph Budget8
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v55-bonoloto-graph-budget8.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v55-bonoloto-graph-budget8.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-meta-pleno-v55-bonoloto-graph-budget8
  cancel-in-progress: false
jobs:
  shards:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Search graph Budget8 models
        env:
          SHARD_ID: ${{ matrix.shard }}
          PER_SHARD: 10000
        run: node loterias-ai/scripts/meta-pleno-v55-bonoloto-graph-budget8.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v55-shard-${{ matrix.shard }}
          path: v55-out/*.json
          retention-days: 2
  aggregate:
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/download-artifact@v4
        with:
          pattern: v55-shard-*
          path: v55-shards-raw
      - name: Flatten shards
        run: |
          mkdir -p v55-shards
          find v55-shards-raw -name '*.json' -exec cp {} v55-shards/ \;
      - name: Aggregate and open later eras
        env:
          AGGREGATE: 1
          SHARD_DIR: v55-shards
        run: node loterias-ai/scripts/meta-pleno-v55-bonoloto-graph-budget8.mjs
      - name: Persist result safely
        run: |
          cp loterias-ai/data/research/meta-pleno-v55-bonoloto-graph-budget8.json /tmp/v55.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v55.json loterias-ai/data/research/meta-pleno-v55-bonoloto-graph-budget8.json
            git add loterias-ai/data/research/meta-pleno-v55-bonoloto-graph-budget8.json
            git commit -m 'data(loterias-ai): persist MetaPleno v55 graph Budget8 result' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
