name: Loterias AI MetaPleno v50 Bonoloto Repeat5 Prospective Freeze
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v50-bonoloto-repeat5-prospective-freeze.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v50-bonoloto-repeat5-prospective-freeze.yml'
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Freeze repeat-5 panel before result
        run: node loterias-ai/scripts/meta-pleno-v50-bonoloto-repeat5-prospective-freeze.mjs
      - name: Persist immutable panel safely
        run: |
          cp loterias-ai/data/shadow/bonoloto-2026-08-16-metapleno-v50-repeat5.json /tmp/v50.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v50.json loterias-ai/data/shadow/bonoloto-2026-08-16-metapleno-v50-repeat5.json
            git add loterias-ai/data/shadow/bonoloto-2026-08-16-metapleno-v50-repeat5.json
            git commit -m 'data(loterias-ai): freeze Bonoloto v50 repeat-5 panel' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
