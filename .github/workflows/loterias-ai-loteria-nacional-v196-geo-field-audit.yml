name: Loterias AI Loteria Nacional v196 Geo Field Audit
on:
  push:
    branches:
      - research/loteria-nacional-v196-geo-field-audit
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run v196 archive geo-field audit
        run: node loterias-ai/scripts/loteria-nacional-v196-geo-field-audit.mjs
      - name: Persist v196
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/loteria-nacional-v196-geo-field-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "research(loterias-ai): persist Lotería Nacional v196 geo audit"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi