name: Loterias AI MetaPleno v167 Budget8 Compression
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v167-budget8-compression]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v167-budget8-compression.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v167-budget8-compression.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v167-budget8-compression.mjs
      - name: Persist v167
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v167-budget8-compression.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist v167 Budget8 compression'
          git push
