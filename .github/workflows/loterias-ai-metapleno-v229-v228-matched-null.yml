name: Loterias AI MetaPleno v229 v228 Matched Null
on:
  workflow_dispatch:
  push:
    branches:
      - research/metapleno-v229-v228-matched-null
    paths:
      - 'loterias-ai/scripts/meta-pleno-v229-v228-matched-null.mjs'
      - '.github/workflows/loterias-ai-metapleno-v229-v228-matched-null.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/metapleno-v229-v228-matched-null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run v229
        run: node loterias-ai/scripts/meta-pleno-v229-v228-matched-null.mjs
      - name: Validate fail-closed
        run: node -e "const x=require('./loterias-ai/data/research/meta-pleno-v229-v228-matched-null.json'); if(x.realMoneyPass!==false||x.realStakeEUR!==0) process.exit(1); console.log(x.decision,x.pValues)"
      - name: Persist result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/research/meta-pleno-v229-v228-matched-null.json
          git diff --cached --quiet && exit 0
          git commit -m 'research(loterias-ai): persist v229 matched-cost null result'
          git push origin HEAD:research/metapleno-v229-v228-matched-null