name: Loterias AI Loteria Nacional v205 Geo Number Permutation
on:
  workflow_dispatch:
  push:
    branches: [research/loteria-nacional-v204-official-sales-geo-2024]
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node loterias-ai/scripts/loteria-nacional-v205-geo-number-permutation.mjs
      - name: Validate audit gates
        run: |
          node - <<'NODE'
          const fs=require('fs');const p='loterias-ai/data/research/loteria-nacional-v205-geo-number-permutation.json';const d=JSON.parse(fs.readFileSync(p));
          if(d.realMoneyPass!==false||d.realStakeEUR!==0) throw new Error('Real-money gate regression');
          if(d.tests.last1.permutations<5000||d.tests.last2.permutations<5000) throw new Error('Permutation count too small');
          console.log(JSON.stringify(d.tests));
          NODE
      - name: Persist v205
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/loteria-nacional-v205-geo-number-permutation.json
          if ! git diff --cached --quiet; then git commit -m 'research(loterias-ai): persist v205 geo-number permutation'; git pull --rebase origin "$GITHUB_REF_NAME"; git push origin HEAD:"$GITHUB_REF_NAME"; fi
