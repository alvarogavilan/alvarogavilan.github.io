name: Loterias AI Botemania Universe Current V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/botemania-universe/botemania-universe-current-crawler-v1.mjs'
      - '.github/workflows/loterias-ai-botemania-universe-current-v1.yml'
  schedule:
    - cron: '13 */4 * * *'

permissions:
  contents: write

concurrency:
  group: loterias-ai-botemania-universe-current-v1
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Crawl complete public Botemania game universe
        run: node loterias-ai/casino/botemania-universe/botemania-universe-current-crawler-v1.mjs
      - name: Persist current universe and change ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/casino/botemania-universe/evidence/botemania-universe-current-v1.json loterias-ai/casino/botemania-universe/evidence/botemania-universe-change-ledger-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(casino): refresh complete Botemania game universe'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
