name: Loterias AI Botemania All Games Archive V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/archive/botemania-all-games-census-v1.mjs'
      - 'loterias-ai/casino/archive/botemania-all-games-priority-v1.mjs'
      - 'loterias-ai/casino/archive/botemania-state-dependent-priority-ranker-v1.mjs'
      - '.github/workflows/loterias-ai-botemania-all-games-archive-v1.yml'
  schedule:
    - cron: '7 5 * * 2'

permissions:
  contents: write

concurrency:
  group: loterias-ai-botemania-all-games-archive-v1
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recompute complete Botemania archive and research priorities on latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            node loterias-ai/casino/archive/botemania-all-games-census-v1.mjs
            node loterias-ai/casino/archive/botemania-all-games-priority-v1.mjs
            node loterias-ai/casino/archive/botemania-state-dependent-priority-ranker-v1.mjs

            git add loterias-ai/casino/archive/evidence/botemania-all-games-census-v1.json loterias-ai/casino/archive/evidence/botemania-all-games-priority-v1.json loterias-ai/casino/archive/evidence/botemania-state-dependent-priority-ranker-v1.json
            [ ! -f loterias-ai/casino/archive/evidence/botemania-all-games-history-v1.ndjson ] || git add loterias-ai/casino/archive/evidence/botemania-all-games-history-v1.ndjson

            if git diff --cached --quiet; then
              exit 0
            fi

            git commit -m 'data(casino): archive complete Botemania census and state-dependent priority'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt*2))
          done
          exit 1
