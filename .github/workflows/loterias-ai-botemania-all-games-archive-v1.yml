name: Loterias AI Botemania All Games Archive V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/archive/botemania-all-games-census-v1.mjs'
      - '.github/workflows/loterias-ai-botemania-all-games-archive-v1.yml'
  schedule:
    - cron: '7 */6 * * *'

permissions:
  contents: write

concurrency:
  group: loterias-ai-botemania-all-games-archive-v1
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Census every public Botemania slot and append changes
        run: node loterias-ai/casino/archive/botemania-all-games-census-v1.mjs
      - name: Persist census and history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/casino/archive/evidence/botemania-all-games-census-v1.json
          [ ! -f loterias-ai/casino/archive/evidence/botemania-all-games-history-v1.ndjson ] || git add loterias-ai/casino/archive/evidence/botemania-all-games-history-v1.ndjson
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(casino): archive complete Botemania game census'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
