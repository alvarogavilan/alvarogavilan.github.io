name: Loterias AI Nacional Historic HTML Recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/research/nacional/nacional-historic-official-html-recovery.mjs'
      - '.github/workflows/loterias-ai-nacional-historic-html-recovery.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-nacional-historic-html-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node loterias-ai/research/nacional/nacional-historic-official-html-recovery.mjs
      - name: Persist recovery evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/nacional-historic-official-html-recovery.json
          git commit -m "data(loterias-ai): persist Nacional historical HTML recovery" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
