name: Loterias AI Nacional Historic HTML Recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/research/nacional/nacional-historic-official-html-recovery.mjs'
      - '.github/workflows/loterias-ai-nacional-historic-html-recovery.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-nacional-historic-html-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Recover and persist official historical evidence safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node loterias-ai/research/nacional/nacional-historic-official-html-recovery.mjs
            git add loterias-ai/data/research/nacional-historic-official-html-recovery.json
            if git diff --cached --quiet; then
              echo 'No Nacional recovery evidence changed.'
              exit 0
            fi
            git commit -m 'data(loterias-ai): persist Nacional historical HTML recovery'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt*2))
          done
          echo 'Failed to persist Nacional recovery after retries.' >&2
          exit 1
