name: Loterias AI MetaPleno v217 Research Registry
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - research/metapleno-v217-research-registry-clean
      - fix/metapleno-registry-modern-artifacts
    paths:
      - 'loterias-ai/data/research/meta-pleno-v*.json'
      - 'loterias-ai/data/research/metapleno-v*.json'
      - 'loterias-ai/scripts/build-metapleno-research-registry.mjs'
      - '.github/workflows/loterias-ai-metapleno-v217-research-registry.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-metapleno-research-registry-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node loterias-ai/scripts/build-metapleno-research-registry.mjs
      - name: Validate registry
        run: node -e "const x=require('./loterias-ai/data/research/metapleno-research-registry.json');if(x.summary.realMoneyPasses!==0)process.exit(1);if(x.summary.artifacts<20)process.exit(1)"
      - name: Persist latest registry safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            node loterias-ai/scripts/build-metapleno-research-registry.mjs
            node -e "const x=require('./loterias-ai/data/research/metapleno-research-registry.json');if(x.summary.realMoneyPasses!==0)process.exit(1);if(x.summary.artifacts<20)process.exit(1)"
            git add loterias-ai/data/research/metapleno-research-registry.json
            if git diff --cached --quiet; then
              echo 'MetaPleno registry has no semantic change.'
              exit 0
            fi
            git commit -m 'research(loterias-ai): refresh MetaPleno registry'
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Concurrent main update detected; recomputing registry from latest main (attempt ${attempt}/5)."
          done
          echo 'Failed to persist MetaPleno registry after 5 race-safe recomputations.' >&2
          exit 1