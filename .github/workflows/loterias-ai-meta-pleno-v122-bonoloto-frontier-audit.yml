name: Loterias AI MetaPleno v122 Bonoloto Frontier Audit
on:
  push:
    branches:
      - research/metapleno-v122-bonoloto-frontier-audit
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run v122 frontier audit
        run: node loterias-ai/scripts/meta-pleno-v122-bonoloto-frontier-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v122-bonoloto-frontier-audit
          path: loterias-ai/data/research/meta-pleno-v122-bonoloto-frontier-audit.json
