name: Loterias AI Botemania Irish Wayback Priority V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/botemania-universe/botemania-irish-wayback-priority-v1.mjs'
      - '.github/workflows/loterias-ai-botemania-irish-wayback-priority-v1.yml'
  schedule:
    - cron: '43 3 * * *'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node loterias-ai/casino/botemania-universe/botemania-irish-wayback-priority-v1.mjs
      - name: Persist evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/casino/botemania-universe/evidence/botemania-irish-wayback-priority-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(casino): persist Irish Riches Botemania historical semantics'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
