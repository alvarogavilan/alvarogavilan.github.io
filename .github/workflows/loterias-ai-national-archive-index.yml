name: Loterias AI National Archive Index
on:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/data/archive/**'
      - 'loterias-ai/scripts/build-national-archive-index.mjs'
      - '.github/workflows/loterias-ai-national-archive-index.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node loterias-ai/scripts/build-national-archive-index.mjs
      - name: Persist manifest safely
        run: |
          cp loterias-ai/data/archive/manifest.json /tmp/archive-manifest.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/archive-manifest.json loterias-ai/data/archive/manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/archive/manifest.json
          git commit -m 'data(loterias-ai): refresh national archive manifest' || exit 0
          git push origin HEAD:main
