name: Loterias AI National Archive Index
on:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/data/archive/**'
      - 'loterias-ai/scripts/build-national-archive-index.mjs'
      - '.github/workflows/loterias-ai-national-archive-index.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: loterias-ai-national-archive-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recompute and persist manifest safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node loterias-ai/scripts/build-national-archive-index.mjs
            git add loterias-ai/data/archive/manifest.json
            if git diff --cached --quiet; then
              echo 'NO_SEMANTIC_CHANGE'
              exit 0
            fi
            git commit -m 'data(loterias-ai): refresh national archive manifest'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved during manifest persistence; recomputing attempt ${attempt}/5"
          done
          echo 'Unable to persist archive manifest after 5 recomputations' >&2
          exit 1
