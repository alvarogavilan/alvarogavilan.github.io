name: Loterias AI Audit Bonoloto v10 Compact Economics
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/audit-bonoloto-v10-compact-official-economics.mjs'
      - '.github/workflows/loterias-ai-audit-bonoloto-v10-compact-economics.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/audit-bonoloto-v10-compact-official-economics.mjs
      - name: Persist safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/research/bonoloto-v10-compact-official-economics.json
          git diff --cached --quiet && exit 0
          git commit -m 'data(loterias-ai): persist compact Bonoloto economics audit'
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*3)); done
          exit 1
