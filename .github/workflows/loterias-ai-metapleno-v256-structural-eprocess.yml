name: Loterias AI MetaPleno v256 Structural E-Process
on:
  push:
    branches:
      - research/metapleno-v256-structural-eprocess
    paths:
      - 'loterias-ai/research/metapleno-v256-structural-eprocess.mjs'
      - '.github/workflows/loterias-ai-metapleno-v256-structural-eprocess.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run v256
        run: node loterias-ai/research/metapleno-v256-structural-eprocess.mjs
      - name: Validate fail-closed
        run: node -e "const r=require('./loterias-ai/data/research/metapleno-v256-structural-eprocess.json'); if(r.realMoneyPass!==false||r.realStakeEUR!==0) process.exit(1)"
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/metapleno-v256-structural-eprocess.json
          git diff --cached --quiet || git commit -m 'research(loterias-ai): persist v256 structural e-process result'
          git push