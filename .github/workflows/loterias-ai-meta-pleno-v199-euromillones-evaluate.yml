name: Loterias AI MetaPleno v199 Euromillones Evaluate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/data/archive/euromillones/**'
      - 'loterias-ai/scripts/meta-pleno-v199-euromillones-complete-5plus2-evaluate.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v199-euromillones-evaluate.yml'
permissions: {contents: write}
concurrency: {group: loterias-ai-v199-euromillones-evaluate, cancel-in-progress: false}
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Recompute and persist blind evaluation against latest main
        shell: bash
        run: |
          set -euo pipefail
          f=loterias-ai/data/research/euromillones-v199-complete-5plus2-evaluation.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node loterias-ai/scripts/meta-pleno-v199-euromillones-complete-5plus2-evaluate.mjs
            node -e "const x=require('./loterias-ai/data/research/euromillones-v199-complete-5plus2-evaluation.json');if(x.retuningPerformed||x.selectionUsedTargetResult||x.realMoneyPass||x.realStakeEUR!==0||x.bettingRecommendation)process.exit(1)"
            git add "$f"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'research(loterias-ai): persist blind Euromillones v199 evaluation'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i*2))
          done
          exit 1
