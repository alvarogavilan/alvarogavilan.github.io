name: Loterias AI MetaPleno v320 Validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/data/research/metapleno-v320-validation-freeze.json'
      - 'loterias-ai/research/megalab/v320-stage3-validation.mjs'
      - '.github/workflows/loterias-ai-metapleno-v320-validation.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-metapleno-v320-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Run frozen 2019-2022 validation
        run: node loterias-ai/research/megalab/v320-stage3-validation.mjs
      - name: Verify temporal and safety gates
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('loterias-ai/data/research/metapleno-v320-stage3-validation.json','utf8'));
          if(j.temporalIsolation?.blindOosTouched!==false||j.temporalIsolation?.postFreezeTouched!==false) throw new Error('OOS isolation failed');
          for(const files of Object.values(j.temporalIsolation?.openedFiles||{})) for(const f of files) if(Number(String(f).slice(0,4))>2022) throw new Error('2023+ file opened');
          if(j.guards?.parametersChangedAfterFreeze!==false||j.guards?.retuningPerformed!==false) throw new Error('freeze drift');
          if(j.guards?.realMoneyPass!==false||Number(j.guards?.realStakeEUR)!==0||Number(j.guards?.maximumTheoreticalCostEURPerGameDraw)>14) throw new Error('money gate failed');
          if(!['VALIDATION_SURVIVORS_READY_FOR_BLIND_OOS_FREEZE','CLOSED_VALIDATION_FAILED'].includes(j.status)) throw new Error('unexpected validation status');
          NODE
      - name: Persist validation race-safe
        shell: bash
        run: |
          set -euo pipefail
          TARGET='loterias-ai/data/research/metapleno-v320-stage3-validation.json'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$TARGET"
          git diff --cached --quiet && exit 0
          git commit -m 'data(loterias-ai): persist v320 frozen validation'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; sleep $((attempt*2)); continue; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
