name: Loterias AI MetaPleno v176 Era Transfer
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v175-next-draw-2eur-freeze]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v176-v172-era-transfer-audit.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v176-era-transfer.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v176-v172-era-transfer-audit.mjs
      - name: Persist v176
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v176-v172-era-transfer-audit.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist v176 era-transfer audit'
          git push
