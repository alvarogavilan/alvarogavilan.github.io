name: Loterias AI MetaPleno v99 Bonoloto State Ngram Budget8
on:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v99-bonoloto-state-ngram-budget8.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v99-bonoloto-state-ngram-budget8.yml'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node loterias-ai/scripts/meta-pleno-v99-bonoloto-state-ngram-budget8.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v99-bonoloto-state-ngram-budget8
          path: loterias-ai/data/research/meta-pleno-v99-bonoloto-state-ngram-budget8.json
