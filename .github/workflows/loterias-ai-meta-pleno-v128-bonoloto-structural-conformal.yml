name: Loterias AI MetaPleno v128 Bonoloto Structural Conformal
on:
  workflow_dispatch:
  push:
    branches: [research/multilane-v128-bonoloto-pattern-atlas]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v128-bonoloto-structural-conformal.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v128-bonoloto-structural-conformal.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node loterias-ai/scripts/meta-pleno-v128-bonoloto-structural-conformal.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v128-bonoloto-structural-conformal.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist v128 Bonoloto structural conformal'
          git push
