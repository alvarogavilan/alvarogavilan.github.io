name: Loterias AI MetaPleno v31 Prospective Settlement
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/data/archive/bonoloto/**'
      - 'loterias-ai/data/archive/primitiva/**'
      - 'loterias-ai/data/archive/euromillones/**'
      - 'loterias-ai/data/archive/eurodreams/**'
      - 'loterias-ai/scripts/meta-pleno-v31-settle-prospective-controls.mjs'
      - 'loterias-ai/data/shadow/meta-pleno-v30-presealed-random-controls.json'
      - '.github/workflows/loterias-ai-meta-pleno-v31-prospective-settlement.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-meta-pleno-v31-settlement
  cancel-in-progress: true
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v31-settle-prospective-controls.mjs
      - name: Persist safely
        run: |
          test -f loterias-ai/data/shadow/meta-pleno-v31-prospective-settlements.json || exit 0
          cp loterias-ai/data/shadow/meta-pleno-v31-prospective-settlements.json /tmp/v31.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v31.json loterias-ai/data/shadow/meta-pleno-v31-prospective-settlements.json
            git add loterias-ai/data/shadow/meta-pleno-v31-prospective-settlements.json
            git diff --cached --quiet && exit 0
            git commit -m 'data(loterias-ai): update MetaPleno prospective settlements'
            git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
