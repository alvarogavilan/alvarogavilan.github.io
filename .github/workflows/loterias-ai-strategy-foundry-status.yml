name: Loterias AI Strategy Foundry Status
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/build-strategy-foundry-status.mjs'
      - 'loterias-ai/data/research/**'
      - 'loterias-ai/data/backtests/**'
      - '.github/workflows/loterias-ai-strategy-foundry-status.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-strategy-foundry-status
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build persistent strategy research registry
        run: node loterias-ai/scripts/build-strategy-foundry-status.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/research/strategy-foundry-status.json /tmp/strategy-foundry-status.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p loterias-ai/data/research
          cp /tmp/strategy-foundry-status.json loterias-ai/data/research/strategy-foundry-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/research/strategy-foundry-status.json
          git commit -m 'data(loterias-ai): persist strategy foundry status' || exit 0
          git push origin HEAD:main
