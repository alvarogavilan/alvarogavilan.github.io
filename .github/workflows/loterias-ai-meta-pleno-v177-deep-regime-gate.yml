name: Loterias AI MetaPleno v177 Deep Regime Gate
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v177-deep-regime-gate]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v177-deep-regime-failure-gate.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v177-deep-regime-gate.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v177-deep-regime-failure-gate.mjs
      - name: Persist v177
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v177-deep-regime-failure-gate.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist v177 deep-regime gate'
          git push
