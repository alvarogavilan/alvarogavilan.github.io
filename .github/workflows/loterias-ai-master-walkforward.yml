name: Loterias AI Master Walk-Forward
on:
  push:
    paths:
      - 'loterias-ai/data/archive/**/*.json'
      - 'loterias-ai/scripts/run-master-walkforward.mjs'
      - 'loterias-ai/js/mega-numeric-engine.js'
      - 'loterias-ai/js/walk-forward-tournament.js'
      - '.github/workflows/loterias-ai-master-walkforward.yml'
  workflow_dispatch:
jobs:
  master:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run master chronological tournament
        run: node loterias-ai/scripts/run-master-walkforward.mjs
      - name: Persist master result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/backtests/master-walkforward.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(loterias-ai): refresh master walk-forward'
          git pull --rebase origin main
          git push origin HEAD:main
