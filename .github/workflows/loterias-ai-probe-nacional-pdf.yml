name: Loterias AI Nacional PDF Probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/loterias-ai-probe-nacional-pdf.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract official SELAE PDF text
        shell: bash
        run: |
          python -m pip install -q pypdf
          mkdir -p loterias-ai/data/probes
          python - <<'PY'
          import urllib.request
          from pypdf import PdfReader
          url='https://www.loteriasyapuestas.es/f/loterias/documentos/Loter%C3%ADa%20Nacional/listas%20de%20premios/SM_LISTAOFICIAL.A2024.S103.pdf'
          req=urllib.request.Request(url,headers={'User-Agent':'LoteriasAI/1.0 research archive'})
          with urllib.request.urlopen(req,timeout=40) as r: data=r.read()
          open('/tmp/nacional.pdf','wb').write(data)
          reader=PdfReader('/tmp/nacional.pdf')
          text='\n'.join((p.extract_text() or '') for p in reader.pages)
          out='SOURCE='+url+'\nPAGES='+str(len(reader.pages))+'\n\n'+text[:30000]
          open('loterias-ai/data/probes/nacional-official-pdf-sample.txt','w',encoding='utf-8').write(out)
          if len(text.strip())<100: raise SystemExit('PDF text extraction too short')
          print({'pages':len(reader.pages),'chars':len(text)})
          PY
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/probes/nacional-official-pdf-sample.txt
          git commit -m 'data(loterias-ai): persist official Nacional PDF sample' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
