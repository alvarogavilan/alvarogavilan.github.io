name: Loterias AI Nacional PDF Probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/loterias-ai-probe-nacional-pdf.yml'
      - 'loterias-ai/scripts/probe-nacional-pdf-key.mjs'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/probe-nacional-pdf-key.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract official current SELAE PDF text
        shell: bash
        run: |
          python -m pip install -q pypdf
          mkdir -p loterias-ai/data/probes
          python - <<'PY'
          import urllib.request
          from pypdf import PdfReader
          url='https://www.loteriasyapuestas.es/f/loterias/documentos/Loter%C3%ADa%20Nacional/listas%20de%20premios/SM_LISTAOFICIAL.A2026.S065.pdf'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 LoteriasAI research archive'})
          with urllib.request.urlopen(req,timeout=40) as r: data=r.read()
          open('/tmp/nacional.pdf','wb').write(data)
          reader=PdfReader('/tmp/nacional.pdf')
          text='\n'.join((p.extract_text() or '') for p in reader.pages)
          out='SOURCE='+url+'\nPAGES='+str(len(reader.pages))+'\n\n'+text
          open('loterias-ai/data/probes/nacional-official-pdf-sample.txt','w',encoding='utf-8').write(out)
          required=['38221','71161','0755','1597','1630','4793','003','138','575','680','900','936','939']
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('Missing expected official values: '+','.join(missing))
          print({'pages':len(reader.pages),'chars':len(text),'validated':len(required)})
          PY
      - name: Persist safely
        run: |
          cp loterias-ai/data/probes/nacional-official-pdf-sample.txt /tmp/nacional-sample.txt
          cp loterias-ai/data/probes/nacional-pdf-key.json /tmp/nacional-key.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p loterias-ai/data/probes
          cp /tmp/nacional-sample.txt loterias-ai/data/probes/nacional-official-pdf-sample.txt
          cp /tmp/nacional-key.json loterias-ai/data/probes/nacional-pdf-key.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/probes/nacional-official-pdf-sample.txt loterias-ai/data/probes/nacional-pdf-key.json
          git commit -m 'data(loterias-ai): persist current Nacional PDF validation' || exit 0
          git push origin HEAD:main
