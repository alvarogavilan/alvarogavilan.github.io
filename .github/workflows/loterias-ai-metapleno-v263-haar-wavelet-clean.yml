name: Loterias AI MetaPleno v263 Haar Wavelet Clean
on:
  workflow_dispatch:
  push:
    branches:
      - research/metapleno-v263-haar-wavelet-clean-20260816
    paths:
      - 'loterias-ai/research/metapleno-v263-haar-wavelet-temporal-ranker.mjs'
      - '.github/workflows/loterias-ai-metapleno-v263-haar-wavelet-clean.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run v263
        run: node loterias-ai/research/metapleno-v263-haar-wavelet-temporal-ranker.mjs
      - name: Verify fail-closed and budget
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='loterias-ai/data/research/metapleno-v263-haar-wavelet-temporal-ranker.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          if(j.realMoneyPass!==false||j.realStakeEUR!==0) throw new Error('real money must remain blocked');
          if(j.candidatePool?.theoreticalCostEUR>15) throw new Error('budget exceeded');
          if(j.antiDuplicateGuard?.matched!==false) throw new Error('anti-duplicate guard failed');
          if(j.signal?.requiresAudit && !j.hardAudit?.triggered) throw new Error('audit trigger not honored');
          console.log(JSON.stringify({decision:j.decision,signal:j.signal,audit:j.hardAudit,cost:j.candidatePool.theoreticalCostEUR}));
          NODE
      - name: Persist result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/research/metapleno-v263-haar-wavelet-temporal-ranker.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(loterias-ai): persist clean v263 Haar result'
          git push
