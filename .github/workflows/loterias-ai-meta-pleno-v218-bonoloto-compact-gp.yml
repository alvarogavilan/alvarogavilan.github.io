name: loterias-ai meta-pleno v218 compact temporal GP
on:
  push:
    branches:
      - research/metapleno-v218-bonoloto-compact-gp
    paths:
      - 'loterias-ai/scripts/meta-pleno-v218-bonoloto-compact-gp.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v218-bonoloto-compact-gp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/metapleno-v218-bonoloto-compact-gp
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run v218
        run: node loterias-ai/scripts/meta-pleno-v218-bonoloto-compact-gp.mjs
      - name: Persist result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/research/meta-pleno-v218-bonoloto-compact-gp.json
          git diff --cached --quiet || git commit -m 'research(loterias-ai): persist v218 compact GP result'
          git push
