name: Loterias AI MetaPleno v187 Primitiva Conformal Deep Candidate
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v187-primitiva-conformal-deep-candidate]
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node loterias-ai/scripts/meta-pleno-v187-primitiva-conformal-deep-candidate.mjs
      - name: Persist v187
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v187-primitiva-conformal-deep-candidate.json
          git diff --cached --quiet || git commit -m "research(loterias-ai): persist v187 Primitiva conformal audit"
          git push
