# Cost control: diagnostic public observation only; no scheduled run while authoritative v2 is healthy.
name: Loterias AI Lightning CasinoScore Public

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/lightning/collect-casinoscore-public.mjs'
      - '.github/workflows/loterias-ai-lightning-casinoscore-public.yml'

permissions:
  contents: write

concurrency:
  group: lightning-casinoscore-public
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node loterias-ai/casino/lightning/collect-casinoscore-public.mjs
      - name: Scientific gate
        run: node -e "const x=require('./loterias-ai/casino/lightning/evidence/casinoscore-public.json');if(x.trainingEligible||!x.free)process.exit(1)"
      - name: Persist public observation only on semantic change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/casino/lightning/data/public-observation loterias-ai/casino/lightning/evidence/casinoscore-public.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(casino): persist free Lightning public observation'
          git pull --rebase origin main
          git push origin HEAD:main
