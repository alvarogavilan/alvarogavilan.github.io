name: Loterias AI Casino Dashboard Refresh
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/build-casino-dashboard-v1.mjs'
      - 'loterias-ai/casino/playuzu/evidence/validated-game-catalog-v1.json'
      - 'loterias-ai/casino/playuzu/evidence/validated-game-specialists-v1.json'
      - 'loterias-ai/casino/playuzu/evidence/conditional-break-even-audit-v1.json'
      - '.github/workflows/loterias-ai-casino-dashboard-refresh.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-casino-dashboard-refresh
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Build compact Casino UI feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node loterias-ai/casino/build-casino-dashboard-v1.mjs
            git add loterias-ai/casino/evidence/casino-dashboard-v1.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(casino): refresh categorized dashboard feed'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
