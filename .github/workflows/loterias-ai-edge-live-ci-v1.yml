name: Loterias AI Edge Live CI V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'loterias-ai/edge-live/**'
      - 'loterias-ai/casino/jackpots/generic-jackpot-identity-v2.mjs'
      - 'loterias-ai/casino/jackpots/confirmed-reset-evidence-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-generic-fast-reset-ledger-v1.mjs'
      - 'loterias-ai/casino/jackpots/diamond-bonanza-reset-core-v1.mjs'
      - 'loterias-ai/casino/jackpots/diamond-bonanza-prospective-reset-ledger-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-jpk-reset-reconstructor-v1.mjs'
      - 'loterias-ai/casino/jackpots/jackpot-king-mbwb-inference-v1.mjs'
      - 'loterias-ai/casino/botemania-global-economic-gate-v1.mjs'
      - '.github/workflows/loterias-ai-edge-live-alert-v1.yml'
      - '.github/workflows/loterias-ai-edge-live-fast-watch-v1.yml'
      - '.github/workflows/loterias-ai-edge-live-ci-v1.yml'

permissions:
  contents: read

jobs:
  syntax-and-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate EDGE Live JavaScript syntax
        run: |
          node --check loterias-ai/edge-live/app.js
          node --check loterias-ai/edge-live/botemania-all-network-fast-meter-sample-v1.mjs
          node --check loterias-ai/edge-live/meter-stasis-core-v1.mjs
          node --check loterias-ai/edge-live/meter-stasis-tracker-v1.mjs
          node --check loterias-ai/edge-live/progressive-score-research-v1.mjs
          node --check loterias-ai/edge-live/edge-live-multi-execution-plan-v1.mjs
          node --check loterias-ai/edge-live/edge-live-execution-plan-v1.mjs
          node --check loterias-ai/edge-live/telegram-edge-alert-v1.mjs
          node --check loterias-ai/casino/jackpots/generic-jackpot-identity-v2.mjs
          node --check loterias-ai/casino/jackpots/confirmed-reset-evidence-v1.mjs
          node --check loterias-ai/casino/jackpots/botemania-generic-fast-reset-ledger-v1.mjs
          node --check loterias-ai/casino/jackpots/diamond-bonanza-reset-core-v1.mjs
          node --check loterias-ai/casino/jackpots/diamond-bonanza-prospective-reset-ledger-v1.mjs
          node --check loterias-ai/casino/jackpots/botemania-jpk-reset-reconstructor-v1.mjs
          node --check loterias-ai/casino/jackpots/jackpot-king-mbwb-inference-v1.mjs
          node --check loterias-ai/casino/botemania-global-economic-gate-v1.mjs
      - name: Jackpot King live-source inference deterministic test
        run: node loterias-ai/tests/jackpot-king-mbwb-live-source-v1.test.mjs
      - name: Diamond Bonanza reset transition deterministic test
        run: node loterias-ai/tests/diamond-bonanza-reset-core-v1.test.mjs
      - name: Validate structural opportunity registry
        run: node -e "JSON.parse(require('node:fs').readFileSync('loterias-ai/edge-live/opportunity-registry-v1.json','utf8')); console.log('registry ok')"
      - name: Telegram alert selects multi-lane plan fail-closed
        env:
          EDGE_LIVE_TELEGRAM_BOT_TOKEN: ''
          EDGE_LIVE_TELEGRAM_CHAT_ID: ''
        shell: bash
        run: |
          set -euo pipefail
          node loterias-ai/edge-live/telegram-edge-alert-v1.mjs >/tmp/edge-telegram-smoke.json
          node - <<'NODE'
          const fs=require('node:fs');
          const diag=JSON.parse(fs.readFileSync('loterias-ai/edge-live/telegram-alert-diagnostic.json','utf8'));
          const multi=JSON.parse(fs.readFileSync('loterias-ai/edge-live/evidence/edge-live-multi-execution-plan-v1.json','utf8'));
          if(diag.planSource!=='MULTI_EXECUTION_PLAN') throw new Error(`Telegram did not select multi plan: ${diag.planSource}`);
          if(diag.selectedLaneId!==multi.selectedLaneId) throw new Error('Telegram selected lane diverges from multi plan');
          if(diag.trackedLanes!==(multi.lanes||[]).length) throw new Error('Telegram diagnostic lane count mismatch');
          if(diag.sendAttempted!==false) throw new Error('Missing-token smoke must never send');
          console.log(JSON.stringify({planSource:diag.planSource,selectedLaneId:diag.selectedLaneId,trackedLanes:diag.trackedLanes,reason:diag.reason},null,2));
          NODE
      - name: Live public fail-closed smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -f loterias-ai/edge-live/evidence/meter-stasis-ledger-v1.json
          rm -f loterias-ai/casino/jackpots/evidence/diamond-bonanza-prospective-reset-ledger-v1.json
          node loterias-ai/edge-live/botemania-all-network-fast-meter-sample-v1.mjs
          node loterias-ai/casino/jackpots/botemania-generic-fast-reset-ledger-v1.mjs
          node loterias-ai/edge-live/meter-stasis-tracker-v1.mjs
          node loterias-ai/casino/jackpots/diamond-bonanza-prospective-reset-ledger-v1.mjs
          node loterias-ai/casino/jackpots/jackpot-king-mbwb-inference-v1.mjs
          node loterias-ai/edge-live/progressive-score-research-v1.mjs
          node loterias-ai/edge-live/edge-live-multi-execution-plan-v1.mjs
          node - <<'NODE'
          const fs=require('node:fs');
          const ledger=JSON.parse(fs.readFileSync('loterias-ai/casino/jackpots/evidence/botemania-generic-fast-reset-ledger-v1.json','utf8'));
          if(ledger.version!=='botemania-generic-fast-reset-ledger-v2.1-independent-reset-confirmation') throw new Error(`unexpected stable ledger version: ${ledger.version}`);
          if((ledger.lastTracks||[]).some(x=>String(x.trackKey||'').includes('::'))) throw new Error('rank-based active identity survived');
          if((ledger.events||[]).some(x=>String(x.trackKey||'').includes('::'))) throw new Error('rank-based active event survived');
          if(Number(ledger.summary?.independentConfirmedMeterResetCount||0)<1) throw new Error('persisted independent reset confirmation missing');
          const poolConfirmation=(ledger.independentlyConfirmedMeterResets||[]).find(x=>x?.trackKey==='generic:pool1');
          if(!poolConfirmation) throw new Error('pool1 independent reset confirmation missing');
          if(poolConfirmation.jackpotWinConfirmed!==false || poolConfirmation.triggeringGameKnown!==false || poolConfirmation.triggeringTierKnown!==false || poolConfirmation.seedPointEstimateEUR!==null || poolConfirmation.economicPromotionAllowed!==false || poolConfirmation.realMoneyAllowed!==false) throw new Error('pool1 confirmation violated fail-closed inference guards');
          for(const event of (ledger.events||[]).filter(x=>x?.classification==='CONFIRMED_METER_RESET')){
            if(event.economicPromotionAllowed!==false || event.jackpotWinConfirmed!==false || event.triggeringGameKnown!==false || event.triggeringTierKnown!==false || event.seedPointEstimateEUR!==null || event.realMoneyAllowed!==false) throw new Error(`confirmed meter reset ${event.eventKey} violated fail-closed guards`);
          }
          const stasis=JSON.parse(fs.readFileSync('loterias-ai/edge-live/evidence/meter-stasis-ledger-v1.json','utf8'));
          const wager=stasis.meters?.['generic:WAGER_BET'];
          if(!wager) throw new Error('WAGER_BET missing from stasis ledger');
          if(wager.dynamicMovementObserved!==false) throw new Error('first observation must not fabricate movement');
          const diamond=JSON.parse(fs.readFileSync('loterias-ai/casino/jackpots/evidence/diamond-bonanza-prospective-reset-ledger-v1.json','utf8'));
          if(diamond.lastObservation?.transitionFromPrior?.classification!=='BASELINE') throw new Error('Diamond first observation must be baseline');
          if(diamond.movement?.positiveGrowthObserved!==false) throw new Error('Diamond baseline fabricated positive growth');
          if(diamond.resetResearch?.usableResetCandidateCount!==0) throw new Error('Diamond baseline fabricated reset evidence');
          if(diamond.resetResearch?.seedVerified!==false || diamond.decision?.breakEvenJackpotEURVerified!==false || diamond.decision?.realMoneyAllowed!==false) throw new Error('Diamond baseline promoted economics');
          const network=JSON.parse(fs.readFileSync('loterias-ai/edge-live/evidence/botemania-all-network-live-state-v1.json','utf8'));
          const jpk=JSON.parse(fs.readFileSync('loterias-ai/casino/jackpots/evidence/jackpot-king-mbwb-inference-v1.json','utf8'));
          if(jpk.exactSpainMbwb?.verified!==true) throw new Error('exact Spain Royal/Regal MBWB not recovered from operator-UI reconstructor');
          if(jpk.exactSpainMbwb.capEUR.ROYAL!==4078.97 || jpk.exactSpainMbwb.capEUR.REGAL!==40789.77) throw new Error('Spain MBWB caps drifted');
          if(jpk.potReadability?.potsEUR?.ROYAL!==Number(network.currentByKey?.['blueprint:JACKPOTKING_ROYAL']?.amountEUR)) throw new Error('Royal pot not sourced from current EDGE feed');
          if(jpk.potReadability?.potsEUR?.REGAL!==Number(network.currentByKey?.['blueprint:JACKPOTKING_REGAL']?.amountEUR)) throw new Error('Regal pot not sourced from current EDGE feed');
          if(jpk.decision?.positiveEVKnown!==false || jpk.decision?.realMoneyAllowed!==false) throw new Error('JPK inference must remain fail-closed');
          const score=JSON.parse(fs.readFileSync('loterias-ai/edge-live/evidence/progressive-score-research-v1.json','utf8'));
          const uvp=score.rows.find(x=>x.monitor?.key==='generic:WAGER_BET');
          if(!uvp) throw new Error('UVP row missing');
          if(uvp.current.dynamicFreshnessVerified!==false) throw new Error('UVP dynamic freshness fabricated');
          const plan=JSON.parse(fs.readFileSync('loterias-ai/edge-live/evidence/edge-live-multi-execution-plan-v1.json','utf8'));
          const lane=plan.lanes.find(x=>x.monitor?.key==='generic:WAGER_BET');
          if(!lane) throw new Error('UVP lane missing');
          if(lane.executionReady!==false || lane.order?.action!=='DO_NOT_PLAY') throw new Error('UVP must fail closed');
          if(!lane.blockers.includes('DYNAMIC_METER_FRESHNESS_NOT_VERIFIED')) throw new Error('dynamic freshness blocker missing');
          console.log(JSON.stringify({ledgerVersion:ledger.version,confirmedMeterResetEventCount:ledger.summary?.confirmedMeterResetEventCount,independentConfirmedMeterResetCount:ledger.summary?.independentConfirmedMeterResetCount,poolConfirmation,diamond:{monitor:diamond.monitor,movement:diamond.movement,resetResearch:diamond.resetResearch,decision:diamond.decision},jpk:{caps:jpk.exactSpainMbwb,pots:jpk.potReadability.potsEUR,decision:jpk.decision},stableTracks:ledger.lastTracks.length,wagerBet:wager,uvpCurrent:uvp.current,uvpBlockers:lane.blockers},null,2));
          NODE
