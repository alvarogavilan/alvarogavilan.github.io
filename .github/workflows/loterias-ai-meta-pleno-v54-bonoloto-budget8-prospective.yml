name: Loterias AI MetaPleno v54 Bonoloto Budget8 Prospective
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v54-bonoloto-budget8-prospective-freeze.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v54-bonoloto-budget8-prospective.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-meta-pleno-v54-bonoloto-budget8-prospective
  cancel-in-progress: false
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Freeze only when previous draw is present
        run: node loterias-ai/scripts/meta-pleno-v54-bonoloto-budget8-prospective-freeze.mjs
      - name: Persist status and immutable freeze safely
        run: |
          mkdir -p /tmp/v54
          cp loterias-ai/data/shadow/bonoloto-v54-budget8-freeze-status.json /tmp/v54/status.json
          if [ -f loterias-ai/data/shadow/bonoloto-2026-08-16-metapleno-v54-budget8.json ]; then cp loterias-ai/data/shadow/bonoloto-2026-08-16-metapleno-v54-budget8.json /tmp/v54/frozen.json; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v54/status.json loterias-ai/data/shadow/bonoloto-v54-budget8-freeze-status.json
            git add loterias-ai/data/shadow/bonoloto-v54-budget8-freeze-status.json
            if [ -f /tmp/v54/frozen.json ] && [ ! -f loterias-ai/data/shadow/bonoloto-2026-08-16-metapleno-v54-budget8.json ]; then
              cp /tmp/v54/frozen.json loterias-ai/data/shadow/bonoloto-2026-08-16-metapleno-v54-budget8.json
              git add loterias-ai/data/shadow/bonoloto-2026-08-16-metapleno-v54-budget8.json
            fi
            git diff --cached --quiet && exit 0
            git commit -m 'data(loterias-ai): update v54 Budget8 prospective freeze state'
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
