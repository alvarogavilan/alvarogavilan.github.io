name: Loterias AI CI

on:
  push:
    paths:
      - 'loterias-ai/**'
      - '.github/workflows/loterias-ai-ci.yml'
  pull_request:
    paths:
      - 'loterias-ai/**'
      - '.github/workflows/loterias-ai-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core deterministic tests
        run: node loterias-ai/tests/core.test.mjs
      - name: Draw schedule tests
        run: node loterias-ai/tests/schedule.test.mjs
      - name: Evidence gate tests
        run: node loterias-ai/tests/evidence.test.mjs
      - name: Financial backtest tests
        run: node loterias-ai/tests/financial-backtest.test.mjs
      - name: Mega engine walk-forward tournament tests
        run: node loterias-ai/tests/mega-engine.test.mjs
      - name: Must-drop EV engine tests
        run: node loterias-ai/tests/must-drop-ev-engine-v1.test.mjs
      - name: Mechanism-specific MHB model tests
        run: node loterias-ai/tests/mhb-mechanism-model-v1.test.mjs
      - name: Lottery rolldown EV engine tests
        run: node loterias-ai/tests/lottery-rolldown-ev-engine-v1.test.mjs
      - name: Progressive video poker EV engine tests
        run: node loterias-ai/tests/progressive-video-poker-ev-v1.test.mjs
      - name: Stable generic jackpot identity tests
        run: node loterias-ai/tests/generic-jackpot-identity-v2.test.mjs
      - name: Confirmed reset evidence promotion tests
        run: node loterias-ai/tests/confirmed-reset-evidence-v1.test.mjs
      - name: EDGE number and UVP evidence tests
        run: node loterias-ai/tests/edge-number-and-uvp-evidence-v1.test.mjs
      - name: Dynamic meter freshness tests
        run: node loterias-ai/tests/meter-stasis-core-v1.test.mjs
      - name: EDGE multi-lane radar tests
        run: node loterias-ai/tests/edge-radar-lanes-v1.test.mjs
      - name: Tiki Templo closure tests
        run: node loterias-ai/tests/tiki-templo-closure-v1.test.mjs
      - name: Tiki/Alice exact-alias divergence guard
        run: node loterias-ai/tests/tiki-alias-divergence-v1.test.mjs
      - name: EDGE multi-plan lifecycle tests
        run: node loterias-ai/tests/edge-live-multi-execution-plan-lifecycle-v1.test.mjs
      - name: Jackpot King live-source inference tests
        run: node loterias-ai/tests/jackpot-king-mbwb-live-source-v1.test.mjs
      - name: Ultimate Video Poker Gamesys lineage contamination guard
        run: node loterias-ai/tests/ultimate-video-poker-gamesys-lineage-v1.test.mjs
      - name: Diamond Bonanza cross-currency evidence guard
        run: node loterias-ai/tests/diamond-bonanza-evidence-guards-v1.test.mjs
      - name: Diamond Bonanza comparator arithmetic integrity
        run: node loterias-ai/tests/diamond-comparator-integrity-v1.test.mjs
      - name: Diamond Bonanza Spain RTP semantics
        run: node loterias-ai/tests/diamond-spanish-rtp-semantics-v1.test.mjs
      - name: Diamond Bonanza prospective reset protocol
        run: node loterias-ai/tests/diamond-bonanza-reset-core-v1.test.mjs
      - name: Operational research-threshold zone guard
        run: node loterias-ai/tests/research-threshold-gate-v1.test.mjs
      - name: Winfall Wishes identity binding probe unit tests
        run: node loterias-ai/tests/winfall-wishes-identity-binding-v1.test.mjs
      - name: Winfall Wishes economics synthesis tests
        run: node loterias-ai/tests/winfall-economics-synthesis-v1.test.mjs
      - name: EDGE Mobile watcher core logic tests
        run: node loterias-ai/tests/edge-mobile-watch-core-v1.test.mjs
      - name: Video poker hand evaluator tests
        run: node loterias-ai/tests/video-poker-hand-evaluator-v1.test.mjs
      - name: Video poker strategy cross-validation tests
        run: node loterias-ai/tests/video-poker-strategy-v1.test.mjs
      - name: Video poker Monte Carlo RTP regression guard
        run: node loterias-ai/tests/video-poker-monte-carlo-v1.test.mjs
      - name: Video poker exact optimal-hold engine tests
        run: node loterias-ai/tests/video-poker-optimal-hold-engine-v1.test.mjs
      - name: EDGE live dashboard never loads a promo-stacking panel
        run: node loterias-ai/tests/edge-live-ux-no-promo-panel-v1.test.mjs
      - name: EDGE Sentinel backend rejects all promotional-research paths
        run: node loterias-ai/tests/edge-non-promo-only-v30.test.mjs
      - name: Validate JSON data files
        run: |
          node - <<'NODE'
          const fs=require('fs'), path=require('path');
          function walk(d){for(const f of fs.readdirSync(d)){const p=path.join(d,f),s=fs.statSync(p);if(s.isDirectory())walk(p);else if(p.endsWith('.json'))JSON.parse(fs.readFileSync(p,'utf8'));}}
          walk('loterias-ai/data');
          console.log('JSON validation: PASS');
          NODE
      - name: Enforce no fake readiness
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='loterias-ai/data/system-status.json';
          if(!fs.existsSync(p)) process.exit(0);
          const s=JSON.parse(fs.readFileSync(p,'utf8'));
          if(s.overallStatus==='READY_FOR_REAL_DAILY_USE' && (!s.gates || s.gates.some(g=>g.status!=='PASS'))) throw new Error('readiness gate violation');
          if(s.realMoneyRecommendationEnabled===true && s.gates.some(g=>g.status!=='PASS')) throw new Error('real money enabled before evidence gates');
          console.log('Readiness gate: PASS');
          NODE
