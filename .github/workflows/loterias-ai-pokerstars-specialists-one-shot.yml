name: Loterias AI PokerStars Specialists One Shot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/specialists/validate-seeded-pokerstars-specialists-v1.mjs'
      - '.github/workflows/loterias-ai-pokerstars-specialists-one-shot.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node loterias-ai/casino/specialists/validate-seeded-pokerstars-specialists-v1.mjs
      - run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add loterias-ai/casino/specialists/pokerstars-validated-specialists-v1.json
          git diff --cached --quiet && exit 0
          git commit -m 'research(casino): persist validated PokerStars specialists'
          git pull --rebase origin main
          git push origin HEAD:main
