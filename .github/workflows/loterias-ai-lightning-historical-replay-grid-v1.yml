name: Loterias AI Lightning Historical Replay Grid v1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/lightning/research/historical-replay-grid-v1.mjs'
      - '.github/workflows/loterias-ai-lightning-historical-replay-grid-v1.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-lightning-historical-replay-grid-v1
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node loterias-ai/casino/lightning/research/historical-replay-grid-v1.mjs
      - name: Persist replay evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/casino/lightning/evidence/historical-replay-grid-v1.json
          git commit -m "research(casino): persist Lightning historical replay grid" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
