name: Loterias AI Lightning Economic Study

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/lightning/economic-objectives.json'
      - 'loterias-ai/casino/lightning/research/economic-coverage-window-v1.mjs'
      - 'loterias-ai/casino/lightning/data/casinoorg-lightningroulette.jsonl'
      - '.github/workflows/loterias-ai-lightning-economic-study.yml'

permissions:
  contents: write

jobs:
  economic-study:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run 15 EUR coverage and multiplier-window study
        run: node loterias-ai/casino/lightning/research/economic-coverage-window-v1.mjs
      - name: Upload scientific evidence
        uses: actions/upload-artifact@v4
        with:
          name: lightning-economic-coverage-window-v1
          path: loterias-ai/casino/lightning/evidence/economic-coverage-window-v1.json
          if-no-files-found: error
      - name: Persist evidence on main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loterias-ai/casino/lightning/evidence/economic-coverage-window-v1.json
          if git diff --cached --quiet; then
            echo "No evidence change to persist"
            exit 0
          fi
          git commit -m "research(lightning): refresh 15 euro economic evidence"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update; retrying"
            sleep 2
          done
          echo "Unable to persist evidence after retries" >&2
          exit 1
