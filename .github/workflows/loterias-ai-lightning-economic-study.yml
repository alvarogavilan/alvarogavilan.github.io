name: Loterias AI Lightning Economic Study

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/lightning/economic-objectives.json'
      - 'loterias-ai/casino/lightning/research/economic-coverage-window-v1.mjs'
      - 'loterias-ai/casino/lightning/research/economic-multiplier-window-oos-v1.mjs'
      - 'loterias-ai/casino/lightning/research/economic-multiplier-prospective-v1.mjs'
      - 'loterias-ai/casino/lightning/research/economic-timing-number-combo-oos-v1.mjs'
      - 'loterias-ai/casino/lightning/research/economic-timing-number-nested-oos-v1.mjs'
      - 'loterias-ai/casino/lightning/research/economic-number-selection-prospective-v1.mjs'
      - 'loterias-ai/casino/lightning/research/economic-multiplier-window-dependence-robustness-v1.mjs'
      - 'loterias-ai/casino/lightning/research/verify-economic-prospective-freeze-v1.mjs'
      - 'loterias-ai/casino/lightning/evidence/economic-multiplier-window-prospective-freeze-v1.json'
      - 'loterias-ai/casino/lightning/evidence/economic-multiplier-prospective-decision-protocol-v1.json'
      - 'loterias-ai/casino/lightning/evidence/economic-number-selection-prospective-freeze-v1.json'
      - 'loterias-ai/casino/lightning/evidence/economic-multiplier-window-freeze-provenance-v1.json'
      - 'loterias-ai/casino/lightning/data/casinoorg-lightningroulette.jsonl'
      - '.github/workflows/loterias-ai-lightning-economic-study.yml'

permissions:
  contents: write

jobs:
  economic-study:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify immutable prospective freeze v1
        run: node loterias-ai/casino/lightning/research/verify-economic-prospective-freeze-v1.mjs
      - name: Run 15 EUR coverage and multiplier-window study
        run: node loterias-ai/casino/lightning/research/economic-coverage-window-v1.mjs
      - name: Select timing rule on discovery and validate OOS
        run: node loterias-ai/casino/lightning/research/economic-multiplier-window-oos-v1.mjs
      - name: Test timing against dependence-preserving nulls
        run: node loterias-ai/casino/lightning/research/economic-multiplier-window-dependence-robustness-v1.mjs
      - name: Preserve frozen robustness evidence when only generatedAt changed
        shell: bash
        run: |
          set -euo pipefail
          FILE='loterias-ai/casino/lightning/evidence/economic-multiplier-window-dependence-robustness-v1.json'
          if ! git cat-file -e "HEAD:${FILE}" 2>/dev/null; then
            echo "No prior robustness evidence; keeping newly generated file"
            exit 0
          fi
          git show "HEAD:${FILE}" > /tmp/robustness-prev.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='loterias-ai/casino/lightning/evidence/economic-multiplier-window-dependence-robustness-v1.json';
          const previous=JSON.parse(fs.readFileSync('/tmp/robustness-prev.json','utf8'));
          const current=JSON.parse(fs.readFileSync(file,'utf8'));
          const stable=x=>{const y=structuredClone(x);delete y.generatedAt;return y;};
          if(JSON.stringify(stable(previous))===JSON.stringify(stable(current))){
            fs.copyFileSync('/tmp/robustness-prev.json',file);
            console.log('NO_SEMANTIC_CHANGE: restored prior frozen-corpus robustness evidence');
          } else {
            console.log('SEMANTIC_CHANGE: keeping regenerated robustness evidence');
          }
          NODE
      - name: Test timing gate plus 3-4 number selectors OOS
        run: node loterias-ai/casino/lightning/research/economic-timing-number-combo-oos-v1.mjs
      - name: Run nested temporal 3-4 number tournament
        run: node loterias-ai/casino/lightning/research/economic-timing-number-nested-oos-v1.mjs
      - name: Evaluate immutable prospective timing rule
        run: node loterias-ai/casino/lightning/research/economic-multiplier-prospective-v1.mjs
      - name: Evaluate blinded future-only number tournament
        run: node loterias-ai/casino/lightning/research/economic-number-selection-prospective-v1.mjs
      - name: Upload scientific evidence
        uses: actions/upload-artifact@v4
        with:
          name: lightning-economic-evidence
          path: |
            loterias-ai/casino/lightning/evidence/economic-coverage-window-v1.json
            loterias-ai/casino/lightning/evidence/economic-multiplier-window-oos-v1.json
            loterias-ai/casino/lightning/evidence/economic-multiplier-window-dependence-robustness-v1.json
            loterias-ai/casino/lightning/evidence/economic-timing-number-combo-oos-v1.json
            loterias-ai/casino/lightning/evidence/economic-timing-number-nested-oos-v1.json
            loterias-ai/casino/lightning/evidence/economic-multiplier-window-prospective-freeze-v1.json
            loterias-ai/casino/lightning/evidence/economic-multiplier-prospective-decision-protocol-v1.json
            loterias-ai/casino/lightning/evidence/economic-multiplier-window-prospective-status-v1.json
            loterias-ai/casino/lightning/evidence/economic-number-selection-prospective-freeze-v1.json
            loterias-ai/casino/lightning/evidence/economic-number-selection-prospective-status-v1.json
            loterias-ai/casino/lightning/evidence/economic-multiplier-window-freeze-provenance-v1.json
          if-no-files-found: error
      - name: Persist evidence on main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loterias-ai/casino/lightning/evidence/economic-coverage-window-v1.json loterias-ai/casino/lightning/evidence/economic-multiplier-window-oos-v1.json loterias-ai/casino/lightning/evidence/economic-multiplier-window-dependence-robustness-v1.json loterias-ai/casino/lightning/evidence/economic-timing-number-combo-oos-v1.json loterias-ai/casino/lightning/evidence/economic-timing-number-nested-oos-v1.json loterias-ai/casino/lightning/evidence/economic-multiplier-window-prospective-status-v1.json loterias-ai/casino/lightning/evidence/economic-number-selection-prospective-status-v1.json
          if git diff --cached --quiet; then
            echo "No generated evidence change to persist"
            exit 0
          fi
          git commit -m "research(lightning): refresh blinded prospective economic evidence"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main || { git rebase --abort || true; sleep $((attempt*2)); continue; }
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update; retrying"
            sleep $((attempt*2))
          done
          echo "Unable to persist evidence after retries" >&2
          exit 1