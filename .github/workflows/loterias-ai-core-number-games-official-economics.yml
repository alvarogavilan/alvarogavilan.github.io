name: Loterias AI Core Number Games Official Economics
on:
  push:
    paths:
      - 'loterias-ai/scripts/enrich-core-number-game-official-economics.mjs'
      - '.github/workflows/loterias-ai-core-number-games-official-economics.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: loterias-ai-core-number-games-official-economics
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enrich all remaining non-quarantined Bonoloto economics
        run: |
          for i in $(seq 1 24); do
            GAME=bonoloto BATCH_LIMIT=120 node loterias-ai/scripts/enrich-core-number-game-official-economics.mjs || exit 1
            remaining=$(node -e "const j=require('./loterias-ai/data/archive/_meta/bonoloto-official-economics.json'); console.log(j.remaining||0)")
            echo "Bonoloto remaining: $remaining"
            if [ "$remaining" -le 1 ]; then break; fi
          done
      - name: Verify El Gordo remains complete
        run: GAME=gordo BATCH_LIMIT=120 node loterias-ai/scripts/enrich-core-number-game-official-economics.mjs
      - name: Persist safely under concurrent commits
        run: |
          mkdir -p /tmp/loterias-ai
          cp -R loterias-ai/data/archive/bonoloto /tmp/loterias-ai/bonoloto
          cp -R loterias-ai/data/archive/gordo-primitiva /tmp/loterias-ai/gordo-primitiva
          cp loterias-ai/data/archive/_meta/bonoloto-official-economics.json /tmp/loterias-ai/bonoloto-official-economics.json
          cp loterias-ai/data/archive/_meta/gordo-primitiva-official-economics.json /tmp/loterias-ai/gordo-primitiva-official-economics.json
          cp loterias-ai/data/archive/_meta/bonoloto-official-conflicts.json /tmp/loterias-ai/bonoloto-official-conflicts.json 2>/dev/null || true
          cp loterias-ai/data/archive/_meta/gordo-primitiva-official-conflicts.json /tmp/loterias-ai/gordo-primitiva-official-conflicts.json 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf loterias-ai/data/archive/bonoloto loterias-ai/data/archive/gordo-primitiva
            cp -R /tmp/loterias-ai/bonoloto loterias-ai/data/archive/bonoloto
            cp -R /tmp/loterias-ai/gordo-primitiva loterias-ai/data/archive/gordo-primitiva
            cp /tmp/loterias-ai/bonoloto-official-economics.json loterias-ai/data/archive/_meta/bonoloto-official-economics.json
            cp /tmp/loterias-ai/gordo-primitiva-official-economics.json loterias-ai/data/archive/_meta/gordo-primitiva-official-economics.json
            test ! -f /tmp/loterias-ai/bonoloto-official-conflicts.json || cp /tmp/loterias-ai/bonoloto-official-conflicts.json loterias-ai/data/archive/_meta/bonoloto-official-conflicts.json
            test ! -f /tmp/loterias-ai/gordo-primitiva-official-conflicts.json || cp /tmp/loterias-ai/gordo-primitiva-official-conflicts.json loterias-ai/data/archive/_meta/gordo-primitiva-official-conflicts.json
            git add loterias-ai/data/archive/bonoloto loterias-ai/data/archive/gordo-primitiva loterias-ai/data/archive/_meta/bonoloto-official-economics.json loterias-ai/data/archive/_meta/gordo-primitiva-official-economics.json loterias-ai/data/archive/_meta/*-official-conflicts.json
            git commit -m 'data(loterias-ai): finish Bonoloto official economics' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((attempt*3))
          done
          exit 1
