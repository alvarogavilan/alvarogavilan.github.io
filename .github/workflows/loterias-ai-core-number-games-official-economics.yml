name: Loterias AI Core Number Games Official Economics
on:
  push:
    paths:
      - 'loterias-ai/scripts/enrich-core-number-game-official-economics.mjs'
      - '.github/workflows/loterias-ai-core-number-games-official-economics.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: loterias-ai-core-number-games-official-economics
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enrich Bonoloto aggressively but rate-bounded
        run: |
          for i in $(seq 1 16); do GAME=bonoloto BATCH_LIMIT=120 node loterias-ai/scripts/enrich-core-number-game-official-economics.mjs || exit 1; done
      - name: Verify El Gordo remains complete
        run: GAME=gordo BATCH_LIMIT=120 node loterias-ai/scripts/enrich-core-number-game-official-economics.mjs
      - name: Persist safely
        run: |
          mkdir -p /tmp/loterias-ai
          cp -R loterias-ai/data/archive/bonoloto /tmp/loterias-ai/bonoloto
          cp -R loterias-ai/data/archive/gordo-primitiva /tmp/loterias-ai/gordo-primitiva
          cp loterias-ai/data/archive/_meta/bonoloto-official-economics.json /tmp/loterias-ai/bonoloto-official-economics.json
          cp loterias-ai/data/archive/_meta/gordo-primitiva-official-economics.json /tmp/loterias-ai/gordo-primitiva-official-economics.json
          git fetch origin main
          git reset --hard origin/main
          rm -rf loterias-ai/data/archive/bonoloto loterias-ai/data/archive/gordo-primitiva
          cp -R /tmp/loterias-ai/bonoloto loterias-ai/data/archive/bonoloto
          cp -R /tmp/loterias-ai/gordo-primitiva loterias-ai/data/archive/gordo-primitiva
          cp /tmp/loterias-ai/bonoloto-official-economics.json loterias-ai/data/archive/_meta/bonoloto-official-economics.json
          cp /tmp/loterias-ai/gordo-primitiva-official-economics.json loterias-ai/data/archive/_meta/gordo-primitiva-official-economics.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/archive/bonoloto loterias-ai/data/archive/gordo-primitiva loterias-ai/data/archive/_meta/bonoloto-official-economics.json loterias-ai/data/archive/_meta/gordo-primitiva-official-economics.json
          git commit -m 'data(loterias-ai): expand Bonoloto official economics' || exit 0
          git push origin HEAD:main
