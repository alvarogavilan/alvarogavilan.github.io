name: Loterias AI Probe Nacional Distribution
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/probe-nacional-distribution-official.mjs'
      - '.github/workflows/loterias-ai-probe-nacional-distribution.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node loterias-ai/scripts/probe-nacional-distribution-official.mjs
      - name: Persist
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/probes/nacional-distribution-official.json
          git commit -m 'data(loterias-ai): store Nacional distribution probe' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
