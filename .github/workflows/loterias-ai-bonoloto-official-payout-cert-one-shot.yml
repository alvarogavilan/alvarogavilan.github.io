name: Loterias AI Bonoloto Official Payout Certification One Shot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/scripts/certify-bonoloto-official-payouts-v1.mjs'
      - '.github/workflows/loterias-ai-bonoloto-official-payout-cert-one-shot.yml'
permissions:
  contents: write
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node loterias-ai/scripts/certify-bonoloto-official-payouts-v1.mjs
      - run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add loterias-ai/data/archive/_meta/bonoloto-official-payouts-recent-v1.json
          git diff --cached --quiet && exit 0
          git commit -m 'research(bonoloto): persist SELAE payout certification'
          git pull --rebase origin main
          git push origin HEAD:main
