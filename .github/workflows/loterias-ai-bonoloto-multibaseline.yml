name: Loterias AI Bonoloto Multi-Baseline
on:
  push:
    paths:
      - 'loterias-ai/scripts/bonoloto-multibaseline.mjs'
      - '.github/workflows/loterias-ai-bonoloto-multibaseline.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node loterias-ai/scripts/bonoloto-multibaseline.mjs
      - name: Persist stress test
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/backtests/bonoloto-multibaseline.json
          git commit -m 'data(loterias-ai): add Bonoloto 100-baseline stress test' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
