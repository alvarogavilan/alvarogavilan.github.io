name: Loterias AI MetaPleno v162 Inverted Route Gate
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v162-inverted-route-gate]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v162-inverted-route-gate.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v162-inverted-route-gate.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v162-inverted-route-gate.mjs
      - name: Persist v162
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v162-inverted-route-gate.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist v162 inverted route gate'
          git push
