name: Loterias AI Lightning Page Backfill
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/lightning/backfill-casinoorg-pages.mjs'
      - '.github/workflows/loterias-ai-lightning-page-backfill.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-lightning-authoritative-data
  cancel-in-progress: false
jobs:
  backfill:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node loterias-ai/casino/lightning/backfill-casinoorg-pages.mjs
      - run: node loterias-ai/casino/lightning/audit-corpus.mjs
      - run: node loterias-ai/casino/lightning/corpus-readiness.mjs
      - name: Persist authoritative backfill and audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/casino/lightning/data/casinoorg-lightningroulette.jsonl loterias-ai/casino/lightning/evidence/casinoorg-page-backfill.json loterias-ai/casino/lightning/evidence/corpus-audit.json loterias-ai/casino/lightning/evidence/corpus-readiness.json
          git commit -m "data(casino): backfill public Lightning rounds and audit corpus" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
