name: Loterias AI Lightning Free Public Capture
on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: lightning-free-public-capture
  cancel-in-progress: false
jobs:
  capture:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture free public Lightning evidence
        run: node loterias-ai/casino/lightning/collect-casinoscore-public.mjs
      - name: Certify corpus readiness
        run: node loterias-ai/casino/lightning/corpus-readiness.mjs
      - name: Persist from latest main without rebase conflicts
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            node loterias-ai/casino/lightning/collect-casinoscore-public.mjs
            node loterias-ai/casino/lightning/corpus-readiness.mjs
            git add loterias-ai/casino/lightning
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "research(casino): accumulate free Lightning observations"
            if git push origin HEAD:"$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((i*2))
          done
          exit 1
