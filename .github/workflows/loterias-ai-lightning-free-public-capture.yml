# Cost control: authoritative segment v2 is the only scheduled Lightning round-level source.
# This free aggregate/public capture remains available manually or when its collector changes.
name: Loterias AI Lightning Free Public Capture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/lightning/collect-casinoscore-public.mjs'
      - '.github/workflows/loterias-ai-lightning-free-public-capture.yml'

permissions:
  contents: write

concurrency:
  group: lightning-free-public-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture free public Lightning evidence
        run: node loterias-ai/casino/lightning/collect-casinoscore-public.mjs
      - name: Enforce non-training isolation
        run: node -e "const x=require('./loterias-ai/casino/lightning/evidence/casinoscore-public.json');if(x.trainingEligible||!x.free)process.exit(1)"
      - name: Persist semantic changes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/casino/lightning/data/public-observation loterias-ai/casino/lightning/evidence/casinoscore-public.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(casino): accumulate free Lightning observations'
          git pull --rebase origin main
          git push origin HEAD:main
