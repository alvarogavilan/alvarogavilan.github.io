name: Loterias AI Bonoloto Prize HTML
on:
  push:
    paths:
      - 'loterias-ai/scripts/probe-bonoloto-prize-html.mjs'
      - '.github/workflows/loterias-ai-bonoloto-prize-html.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node loterias-ai/scripts/probe-bonoloto-prize-html.mjs
      - name: Persist probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/probes/bonoloto-prize-html.json
          git commit -m 'data(loterias-ai): refresh Bonoloto prize HTML probe' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main