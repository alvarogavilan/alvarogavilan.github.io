name: Loterias AI MetaPleno v43 Quiniela Robust Neighbor Shadow
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v43-quiniela-robust-neighbor-shadow.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v43-quiniela-robust-neighbor-shadow.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-meta-pleno-v43-quiniela-robust-neighbor-shadow
  cancel-in-progress: false
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v43-quiniela-robust-neighbor-shadow.mjs
      - name: Persist frozen panel safely
        run: |
          cp loterias-ai/data/shadow/quiniela-v43-robust-neighbor-panel.json /tmp/v43.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v43.json loterias-ai/data/shadow/quiniela-v43-robust-neighbor-panel.json
            git add loterias-ai/data/shadow/quiniela-v43-robust-neighbor-panel.json
            git commit -m 'data(loterias-ai): freeze Quiniela v43 robust-neighbor panel' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
