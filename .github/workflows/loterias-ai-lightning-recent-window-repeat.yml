name: Loterias AI Lightning Recent Window Repeat
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/lightning/research/recent-window-repeat-audit.mjs'
      - '.github/workflows/loterias-ai-lightning-recent-window-repeat.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node loterias-ai/casino/lightning/research/recent-window-repeat-audit.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/casino/lightning/evidence/recent-window-repeat-audit.json
          git commit -m 'research(casino): persist Lightning recent-window repeat audit' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
