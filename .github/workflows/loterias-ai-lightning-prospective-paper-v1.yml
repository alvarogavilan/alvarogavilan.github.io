# Cost control: v1 PAPER evidence is legacy after the authoritative source discontinuity.
# Keep it reproducible, but do not spend scheduled Actions on it.
name: Loterias AI Lightning Prospective PAPER v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/lightning/prospective-paper-v1.mjs'
      - '.github/workflows/loterias-ai-lightning-prospective-paper-v1.yml'

permissions:
  contents: write

concurrency:
  group: lightning-prospective-paper-v1
  cancel-in-progress: true

jobs:
  prospective:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recompute legacy prospective status
        run: node loterias-ai/casino/lightning/prospective-paper-v1.mjs
      - name: Enforce no-real-money and no-retuning gates
        run: node -e "const x=require('./loterias-ai/casino/lightning/evidence/prospective-paper-v1-status.json');if(x.summary.realMoneyPass||x.summary.realStakeEUR!==0||x.summary.retuningPerformed||x.safety.realMoney||x.safety.bettingRecommendation)process.exit(1)"
      - name: Persist semantic evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/casino/lightning/evidence/prospective-paper-v1-freeze.json loterias-ai/casino/lightning/evidence/prospective-paper-v1-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(casino): persist Lightning prospective PAPER v1'
          git pull --rebase origin main
          git push origin HEAD:main
