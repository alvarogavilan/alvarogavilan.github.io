name: Loterias AI Botemania Jackpot King Observer V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/botemania-jackpot-king-observer-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-jackpot-client-map-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-blueprint-cap-field-probe-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-fishin-metadata-probe-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-jpk-flow-model-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-blueprint-ui-cap-scan-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-jpk-near-cap-ev-scenarios-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-canalbingo-crosscheck-v1.mjs'
      - 'loterias-ai/casino/jackpots/blueprint-spain-fileservice-probe-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-headless-jackpot-params-probe-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-jpk-live-gate-v1.mjs'
      - 'loterias-ai/casino/jackpots/botemania-jpk-dashboard-overlay-v1.mjs'
      - 'loterias-ai/casino/build-casino-dashboard-v1.mjs'
      - '.github/workflows/loterias-ai-botemania-jackpot-king-observer-v1.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: loterias-ai-botemania-jackpot-king-observer-v1
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture Botemania Jackpot King state and calculate strict live gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node loterias-ai/casino/jackpots/botemania-jackpot-client-map-v1.mjs
            node loterias-ai/casino/jackpots/botemania-jackpot-king-observer-v1.mjs
            node loterias-ai/casino/jackpots/botemania-blueprint-cap-field-probe-v1.mjs
            node loterias-ai/casino/jackpots/botemania-fishin-metadata-probe-v1.mjs
            node loterias-ai/casino/jackpots/botemania-blueprint-ui-cap-scan-v1.mjs
            node loterias-ai/casino/jackpots/botemania-jpk-flow-model-v1.mjs
            node loterias-ai/casino/jackpots/botemania-jpk-near-cap-ev-scenarios-v1.mjs
            node loterias-ai/casino/jackpots/botemania-canalbingo-crosscheck-v1.mjs
            node loterias-ai/casino/jackpots/blueprint-spain-fileservice-probe-v1.mjs
            node loterias-ai/casino/jackpots/botemania-headless-jackpot-params-probe-v1.mjs
            node loterias-ai/casino/jackpots/botemania-jpk-live-gate-v1.mjs
            node loterias-ai/casino/build-casino-dashboard-v1.mjs
            node loterias-ai/casino/jackpots/botemania-jpk-dashboard-overlay-v1.mjs
            git add \
              loterias-ai/casino/jackpots/evidence/botemania-jackpot-client-map-v1.json \
              loterias-ai/casino/jackpots/evidence/botemania-jackpot-king-observer-v1.json \
              loterias-ai/casino/jackpots/evidence/botemania-blueprint-cap-field-probe-v1.json \
              loterias-ai/casino/jackpots/evidence/botemania-fishin-metadata-probe-v1.json \
              loterias-ai/casino/jackpots/evidence/botemania-blueprint-ui-cap-scan-v1.json \
              loterias-ai/casino/jackpots/evidence/botemania-jpk-flow-model-v1.json \
              loterias-ai/casino/jackpots/evidence/botemania-jpk-near-cap-ev-scenarios-v1.json \
              loterias-ai/casino/jackpots/evidence/botemania-canalbingo-crosscheck-v1.json \
              loterias-ai/casino/jackpots/evidence/blueprint-spain-fileservice-probe-v1.json \
              loterias-ai/casino/jackpots/evidence/botemania-headless-jackpot-params-probe-v1.json \
              loterias-ai/casino/jackpots/evidence/botemania-jpk-live-gate-v1.json \
              loterias-ai/casino/evidence/casino-dashboard-v1.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(casino): capture Botemania Jackpot King state and strict live gate'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
