name: Loterias AI MetaPleno v42 Quiniela P15 Permutation

on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v42-quiniela-p15-permutation.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v42-quiniela-p15-permutation.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: RUNS=50000 node loterias-ai/scripts/meta-pleno-v42-quiniela-p15-permutation.mjs
      - name: Persist safely
        shell: bash
        run: |
          cp loterias-ai/data/research/meta-pleno-v42-quiniela-p15-permutation.json /tmp/v42.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v42.json loterias-ai/data/research/meta-pleno-v42-quiniela-p15-permutation.json
            git add loterias-ai/data/research/meta-pleno-v42-quiniela-p15-permutation.json
            git commit -m 'data(loterias-ai): persist MetaPleno v42 P15 permutation' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
