name: Loterias AI MetaPleno v292 Stage4 Full Selection Freeze
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v292-million-scientist-funnel]
    paths:
      - loterias-ai/research/megalab/v292-stage4-full-selection-freeze.mjs
permissions:
  contents: write
concurrency:
  group: loterias-ai-v292-stage4
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Run full selection and freeze
        run: node loterias-ai/research/megalab/v292-stage4-full-selection-freeze.mjs
      - name: Verify freeze before OOS and economics fail closed
        run: node -e "const x=require('./loterias-ai/data/research/metapleno-v292-stage4-full-selection-freeze.json');const m=require('./loterias-ai/data/research/metapleno-v292-frozen-candidate-manifest.json');if(x.validationTouched||x.postFreezeTouched||x.frozenCandidates>128||!m.frozenBeforeOOS||!m.hyperparametersFrozen||m.oosRead||x.realMoneyPass||x.realStakeEUR!==0||x.manifestHash!==m.manifestHash)process.exit(1)"
      - name: Persist stage4 evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/metapleno-v292-stage4-full-selection-freeze.json loterias-ai/data/research/metapleno-v292-frozen-candidate-manifest.json
          git commit -m 'data(loterias-ai): persist v292 stage4 freeze evidence' || exit 0
          git pull --rebase origin research/metapleno-v292-million-scientist-funnel
          git push