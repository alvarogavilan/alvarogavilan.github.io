name: Loterias AI MetaPleno v325 Validation Archived

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse retroactive v325 revalidation
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='loterias-ai/data/research/metapleno-v325-chain-of-custody-audit.json';
          if(!fs.existsSync(p)) throw new Error('v325 custody audit missing');
          const a=JSON.parse(fs.readFileSync(p,'utf8'));
          if(a.status!=='VALIDATION_NEGATIVE_BUT_PUBLIC_FREEZE_PROOF_INVALIDATED') throw new Error('unexpected v325 custody status');
          console.log('v325 is archived. 2019-2022 cannot be rerun as fresh validation and 2023-2024 cannot be opened to rescue it.');
          NODE
