name: Loterias AI MetaPleno v286 Consolidated JS Pair Drift
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node loterias-ai/research/metapleno-v286-consolidated-js-pair-drift.mjs
      - name: Verify fail-closed
        run: node -e "const x=require('./loterias-ai/data/research/metapleno-v286-consolidated-js-pair-drift.json');if(x.realMoneyPass||x.realStakeEUR!==0||x.games.some(g=>g.budget.theoreticalEUR>4))process.exit(1)"
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/metapleno-v286-consolidated-js-pair-drift.json
          git commit -m 'data(loterias-ai): persist v286 JS pair-drift result' || exit 0
          git push