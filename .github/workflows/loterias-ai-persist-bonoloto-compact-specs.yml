name: Loterias AI Persist Bonoloto Compact Specs
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/persist-bonoloto-compact-specs.mjs'
      - '.github/workflows/loterias-ai-persist-bonoloto-compact-specs.yml'
permissions:
  actions: read
  contents: write
jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 31878379467
          pattern: meta-pleno-v5-bonoloto-*
          path: loterias-ai/data/research/meta-pleno-v5-shards
          merge-multiple: true
      - run: node loterias-ai/scripts/persist-bonoloto-compact-specs.mjs
      - name: Persist safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/shadow/bonoloto-metapleno-v10-compact-specs.json
          git diff --cached --quiet && exit 0
          git commit -m 'data(loterias-ai): freeze compact Bonoloto formula definitions'
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*3)); done
          exit 1
