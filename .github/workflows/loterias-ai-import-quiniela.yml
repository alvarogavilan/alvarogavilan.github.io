name: Loterias AI Import Quiniela
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/import-quiniela-history.mjs'
      - 'loterias-ai/scripts/preserve-archive-evidence.mjs'
      - '.github/workflows/loterias-ai-import-quiniela.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-import-quiniela
  cancel-in-progress: true
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recompute secondary history from latest main without degrading official evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf /tmp/quiniela-before
            mkdir -p /tmp/quiniela-before
            cp -a loterias-ai/data/archive/quiniela /tmp/quiniela-before/quiniela

            node loterias-ai/scripts/import-quiniela-history.mjs
            ARCHIVE_BEFORE=/tmp/quiniela-before ARCHIVE_AFTER=loterias-ai/data/archive node loterias-ai/scripts/preserve-archive-evidence.mjs
            node loterias-ai/scripts/quarantine-quiniela-structural-anomalies.mjs
            node loterias-ai/scripts/build-national-archive-index.mjs
            node loterias-ai/scripts/build-completeness-index.mjs
            node loterias-ai/scripts/audit-national-archive.mjs
            node loterias-ai/scripts/build-archive-coverage-priorities.mjs

            node --input-type=module <<'NODE'
            import fs from 'node:fs';
            import { execFileSync } from 'node:child_process';

            const files = [
              'loterias-ai/data/archive/_meta/archive-audit.json',
              'loterias-ai/data/archive/_meta/archive-coverage-priorities.json',
              'loterias-ai/data/archive/_meta/archive-preservation.json',
              'loterias-ai/data/archive/_meta/quiniela-import-quarantine.json',
              'loterias-ai/data/archive/_meta/quiniela-import.json',
              'loterias-ai/data/archive/_meta/quiniela-structural-quarantine.json',
              'loterias-ai/data/archive/completeness-index.json',
              'loterias-ai/data/archive/manifest.json'
            ];
            const volatile = new Set(['generatedAt','manifestGeneratedAt','auditGeneratedAt']);
            const stable = value => {
              if (Array.isArray(value)) return value.map(stable);
              if (value && typeof value === 'object') {
                return Object.fromEntries(Object.entries(value)
                  .filter(([k]) => !volatile.has(k))
                  .map(([k,v]) => [k, stable(v)]));
              }
              return value;
            };
            for (const file of files) {
              if (!fs.existsSync(file)) continue;
              let previous;
              try { previous = execFileSync('git',['show',`HEAD:${file}`],{encoding:'utf8'}); }
              catch { continue; }
              let a,b;
              try { a=JSON.parse(previous); b=JSON.parse(fs.readFileSync(file,'utf8')); }
              catch { continue; }
              if (JSON.stringify(stable(a)) === JSON.stringify(stable(b))) {
                fs.writeFileSync(file, previous);
                console.log(`restored timestamp-only derived artifact: ${file}`);
              }
            }
            NODE

            git add loterias-ai/data/archive
            if git diff --cached --quiet; then
              echo 'No semantic Quiniela history change.'
              exit 0
            fi
            git commit -m 'data(loterias-ai): persist Quiniela history safely'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved during Quiniela import attempt ${attempt}; recomputing from latest main"
            sleep $((attempt * 2))
          done
          echo 'Unable to persist Quiniela history safely after five recomputations.' >&2
          exit 1
