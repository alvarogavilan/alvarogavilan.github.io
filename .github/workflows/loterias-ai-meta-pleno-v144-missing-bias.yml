name: Loterias AI MetaPleno v144 Missing Winner Bias
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v144-missing-bias]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v144-missing-winner-bias.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v144-missing-bias.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v142-global-nearpleno-atlas.mjs
      - run: node loterias-ai/scripts/meta-pleno-v144-missing-winner-bias.mjs
      - name: Persist v142 v144
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v142-global-nearpleno-atlas.json loterias-ai/data/research/meta-pleno-v144-missing-winner-bias.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist v144 missing-winner bias'
          git push
