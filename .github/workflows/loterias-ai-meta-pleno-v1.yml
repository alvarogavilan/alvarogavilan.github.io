name: Loterias AI MetaPleno v1
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/loterias-ai-meta-pleno-v1.yml'
permissions:
  contents: read
concurrency:
  group: loterias-ai-meta-pleno-v1
  cancel-in-progress: true
jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'MetaPleno v1 retired in favor of optimized v2'
