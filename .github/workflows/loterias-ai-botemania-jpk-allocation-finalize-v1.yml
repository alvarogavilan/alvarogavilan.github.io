name: Loterias AI Botemania JPK Allocation Finalize V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/casino/jackpots/botemania-jpk-allocation-validation-finalizer-v1.mjs'
      - '.github/workflows/loterias-ai-botemania-jpk-allocation-finalize-v1.yml'

permissions:
  contents: write

concurrency:
  group: loterias-ai-botemania-jpk-allocation-finalize-v1
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Freeze first preregistered completion boundary
        run: node loterias-ai/casino/jackpots/botemania-jpk-allocation-validation-finalizer-v1.mjs
      - name: Persist frozen result if created
        shell: bash
        run: |
          set -euo pipefail
          FILE=loterias-ai/casino/jackpots/evidence/botemania-jpk-allocation-validation-result-v1.json
          [ -f "$FILE" ] || exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$FILE"
          git diff --cached --quiet && exit 0
          git commit -m 'research(casino): freeze passed Botemania network allocation boundary'
          git pull --rebase origin main
          git push origin HEAD:main
