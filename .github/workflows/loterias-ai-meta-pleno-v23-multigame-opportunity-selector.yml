name: Loterias AI MetaPleno v23 Multi-game Opportunity Selector
on:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v23-multigame-opportunity-selector.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v23-multigame-opportunity-selector.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: loterias-ai-meta-pleno-v23
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node loterias-ai/scripts/meta-pleno-v23-multigame-opportunity-selector.mjs
      - name: Persist safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v23-multigame-opportunity-selector.json
          git diff --cached --quiet && exit 0
          git commit -m "data(loterias-ai): persist v23 multi-game opportunity ranking"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
