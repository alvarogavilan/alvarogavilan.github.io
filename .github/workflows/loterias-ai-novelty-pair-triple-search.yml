name: Loterias AI Pair Triple Novelty Search
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/novelty-pair-triple-search.mjs'
      - '.github/workflows/loterias-ai-novelty-pair-triple-search.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-novelty-pair-triple
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Run pair-triple novelty search
        run: node loterias-ai/scripts/novelty-pair-triple-search.mjs
      - name: Persist evidence safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/novelty-pair-triple-search.json
          git diff --cached --quiet && exit 0
          git commit -m 'data(loterias-ai): persist pair-triple novelty search'
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*3)); done
          exit 1
