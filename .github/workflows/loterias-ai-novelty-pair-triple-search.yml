name: Loterias AI Pair Triple Novelty Search
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/novelty-pair-triple-search.mjs'
      - 'loterias-ai/scripts/aggregate-novelty-pair-triple-search.mjs'
      - '.github/workflows/loterias-ai-novelty-pair-triple-search.yml'
permissions:
  contents: write
jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        game: [primitiva, bonoloto, euromillones, eurodreams, gordo-primitiva]
        shard: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Discovery and validation only
        env:
          GAME: ${{ matrix.game }}
          SHARD: ${{ matrix.shard }}
          CANDIDATES: 800
        run: node loterias-ai/scripts/novelty-pair-triple-search.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: novelty-${{ matrix.game }}-${{ matrix.shard }}
          path: /tmp/loterias-ai-novelty/${{ matrix.game }}-${{ matrix.shard }}.json
          retention-days: 2
  aggregate:
    needs: search
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/download-artifact@v4
        with:
          pattern: novelty-*
          path: /tmp/novelty
          merge-multiple: true
      - run: node loterias-ai/scripts/aggregate-novelty-pair-triple-search.mjs
      - name: Persist evidence safely
        run: |
          cp loterias-ai/data/research/novelty-pair-triple-search.json /tmp/novelty-result.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p loterias-ai/data/research
          cp /tmp/novelty-result.json loterias-ai/data/research/novelty-pair-triple-search.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/novelty-pair-triple-search.json
          git commit -m 'data(loterias-ai): persist sharded pair-triple novelty search' || exit 0
          git push origin HEAD:main
