name: Loterias AI MetaPleno v72 Frozen Latent State
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v72-latent-state-frozen.mjs'
jobs:
  latent:
    strategy:
      fail-fast: false
      matrix:
        game: [bonoloto, primitiva, euromillones]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v72-latent-state-frozen.mjs ${{ matrix.game }}
      - name: Persist result safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v72-${{ matrix.game }}-latent-state-frozen.json
          git commit -m "data(loterias-ai): persist v72 ${{ matrix.game }} latent state" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*3)); done
          exit 1