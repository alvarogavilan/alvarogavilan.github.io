name: Loterias AI MetaPleno v47 Bonoloto Exhaustive Fixed Ticket
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v47-bonoloto-exhaustive-fixed-ticket.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v47-bonoloto-exhaustive-fixed-ticket.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-meta-pleno-v47-bonoloto-exhaustive-fixed-ticket
  cancel-in-progress: false
jobs:
  exhaustive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Enumerate all 13,983,816 fixed Bonoloto tickets
        run: node loterias-ai/scripts/meta-pleno-v47-bonoloto-exhaustive-fixed-ticket.mjs
      - name: Persist evidence safely
        run: |
          cp loterias-ai/data/research/meta-pleno-v47-bonoloto-exhaustive-fixed-ticket.json /tmp/v47.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v47.json loterias-ai/data/research/meta-pleno-v47-bonoloto-exhaustive-fixed-ticket.json
            git add loterias-ai/data/research/meta-pleno-v47-bonoloto-exhaustive-fixed-ticket.json
            git commit -m 'data(loterias-ai): persist MetaPleno v47 exhaustive fixed-ticket result' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
