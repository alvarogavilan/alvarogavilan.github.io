name: Loterias AI MetaPleno v34 Euromillones Full Temporal Audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v34-euromillones-full-temporal-audit.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v34-euromillones-full-temporal-audit.yml'

permissions:
  contents: write

concurrency:
  group: loterias-ai-metapleno-v34
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Euromillones temporal full audit
        run: N=15000 node loterias-ai/scripts/meta-pleno-v34-euromillones-full-temporal-audit.mjs
      - name: Persist safely
        shell: bash
        run: |
          cp loterias-ai/data/research/meta-pleno-v34-euromillones-full-temporal-audit.json /tmp/v34.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v34.json loterias-ai/data/research/meta-pleno-v34-euromillones-full-temporal-audit.json
            git add loterias-ai/data/research/meta-pleno-v34-euromillones-full-temporal-audit.json
            git commit -m 'data(loterias-ai): persist MetaPleno v34 Euromillones temporal full audit' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
