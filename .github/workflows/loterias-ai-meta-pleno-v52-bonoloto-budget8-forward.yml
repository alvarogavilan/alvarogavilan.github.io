name: Loterias AI MetaPleno v52 Bonoloto Budget8 Forward
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v52-bonoloto-budget8-forward.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v52-bonoloto-budget8-forward.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-meta-pleno-v52-bonoloto-budget8-forward
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Run budget-aware 8-number forward audit
        run: node loterias-ai/scripts/meta-pleno-v52-bonoloto-budget8-forward.mjs
      - name: Persist result safely
        run: |
          cp loterias-ai/data/research/meta-pleno-v52-bonoloto-budget8-forward.json /tmp/v52.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v52.json loterias-ai/data/research/meta-pleno-v52-bonoloto-budget8-forward.json
            git add loterias-ai/data/research/meta-pleno-v52-bonoloto-budget8-forward.json
            git commit -m 'data(loterias-ai): persist MetaPleno v52 budget8 result' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
