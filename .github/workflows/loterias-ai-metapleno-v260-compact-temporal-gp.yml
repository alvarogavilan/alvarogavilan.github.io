name: Loterias AI MetaPleno v260 Compact Temporal GP
on:
  workflow_dispatch:
  push:
    branches:
      - research/metapleno-v260-compact-temporal-gp
    paths:
      - 'loterias-ai/research/metapleno-v260-compact-temporal-gp.mjs'
      - '.github/workflows/loterias-ai-metapleno-v260-compact-temporal-gp.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run v260
        run: node loterias-ai/research/metapleno-v260-compact-temporal-gp.mjs
      - name: Verify fail-closed
        run: >-
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('loterias-ai/data/research/metapleno-v260-compact-temporal-gp.json','utf8')); if(j.realMoneyPass!==false||j.realStakeEUR!==0) throw new Error('real money must remain blocked'); if(j.candidatePool?.theoreticalCostEUR>15) throw new Error('budget exceeded'); console.log(j.decision,j.signal);"
      - name: Persist result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/research/metapleno-v260-compact-temporal-gp.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(loterias-ai): persist v260 compact temporal GP result'
          git push
