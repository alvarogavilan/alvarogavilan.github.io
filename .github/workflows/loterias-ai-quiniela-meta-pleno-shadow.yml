name: Loterias AI Quiniela MetaPleno Shadow
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/data/archive/quiniela/**'
      - 'loterias-ai/scripts/quiniela-meta-pleno-shadow.mjs'
      - '.github/workflows/loterias-ai-quiniela-meta-pleno-shadow.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-quiniela-meta-pleno-shadow
  cancel-in-progress: false
jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/quiniela-meta-pleno-shadow.mjs
      - name: Persist immutable shadow ledger safely
        run: |
          cp loterias-ai/data/shadow/quiniela-meta-pleno-ledger.json /tmp/quiniela-meta-pleno-ledger.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p loterias-ai/data/shadow
            cp /tmp/quiniela-meta-pleno-ledger.json loterias-ai/data/shadow/quiniela-meta-pleno-ledger.json
            git add loterias-ai/data/shadow/quiniela-meta-pleno-ledger.json
            git commit -m 'data(loterias-ai): update Quiniela MetaPleno shadow ledger' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
