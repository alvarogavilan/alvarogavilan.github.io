name: Loterias AI Gordo v14 Year-slice Robustness
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/gordo-v14-year-slice-robustness.mjs'
      - '.github/workflows/loterias-ai-gordo-v14-year-slice-robustness.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node loterias-ai/scripts/gordo-v14-year-slice-robustness.mjs
      - name: Persist safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/gordo-v14-year-slice-robustness.json
          git diff --cached --quiet && exit 0
          git commit -m 'data(loterias-ai): persist Gordo v14 year-slice robustness'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
