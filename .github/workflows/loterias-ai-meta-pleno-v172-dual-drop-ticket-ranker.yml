name: Loterias AI MetaPleno v172 Dual Drop Ticket Ranker
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v172-clean-import]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v157-pre2023-hybrid-selector.mjs'
      - 'loterias-ai/scripts/meta-pleno-v172-dual-drop-ticket-ranker.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v172-dual-drop-ticket-ranker.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v172-dual-drop-ticket-ranker.mjs
      - name: Persist v172
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v172-dual-drop-ticket-ranker.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist v172 dual-drop ticket ranker'
          git push
