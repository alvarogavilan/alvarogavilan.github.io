name: Loterias AI MetaPleno v178 Diversified 2EUR Freeze
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v178-diversified-2eur-freeze]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v178-diversified-2eur-freeze.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v178-diversified-2eur-freeze.yml'
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v178-diversified-2eur-freeze.mjs
      - run: node loterias-ai/scripts/validate-prospective-freeze-timing.mjs
      - name: Persist v178
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/prospective/bonoloto-v178-diversified-2eur-2026-08-16.json loterias-ai/data/research/prospective-freeze-timing-validation.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): freeze v178 diversified Bonoloto 2 EUR shadow'
          git push
