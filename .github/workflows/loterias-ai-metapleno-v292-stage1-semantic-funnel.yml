name: Loterias AI MetaPleno v292 Semantic Funnel
on:
  workflow_dispatch:
  push:
    branches:
      - research/metapleno-v292-million-scientist-funnel
    paths:
      - loterias-ai/research/megalab/v292-stage1-semantic-funnel.mjs
permissions:
  contents: write
concurrency:
  group: loterias-ai-v292-stage1
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Build 131072 semantic representatives
        run: node loterias-ai/research/megalab/v292-stage1-semantic-funnel.mjs
      - name: Verify no historical outcome access and fail-closed economics
        run: node -e "const x=require('./loterias-ai/data/research/metapleno-v292-stage1-semantic-funnel.json');if(x.historicalDataRead||x.realMoneyPass||x.realStakeEUR!==0||x.selectedRepresentatives>131072||!x.nextStage.oosUntouched)process.exit(1)"
      - name: Persist v292 stage1 evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/metapleno-v292-stage1-semantic-funnel.json
          git commit -m 'data(loterias-ai): persist v292 semantic funnel evidence' || exit 0
          git push
