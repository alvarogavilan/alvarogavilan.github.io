name: Loterias AI Bonoloto Prize Probe
on:
  push:
    paths:
      - 'loterias-ai/scripts/probe-bonoloto-prize-history.mjs'
      - '.github/workflows/loterias-ai-prize-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node loterias-ai/scripts/probe-bonoloto-prize-history.mjs
      - name: Persist probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/probes/bonoloto-prize-history.json
          git commit -m 'data(loterias-ai): refresh Bonoloto prize history probe' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
