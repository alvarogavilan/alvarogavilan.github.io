name: Loterias AI Bonoloto Official Financial Tournament
# refreshed after official SELAE economics backfill
on:
  push:
    paths:
      - 'loterias-ai/scripts/official-number-game-financial-tournament.mjs'
      - 'loterias-ai/data/archive/bonoloto/**'
      - '.github/workflows/loterias-ai-bonoloto-official-financial-tournament.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tournament:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: GAME=bonoloto node loterias-ai/scripts/official-number-game-financial-tournament.mjs
      - name: Persist result safely
        run: |
          cp loterias-ai/data/backtests/bonoloto-official-financial-tournament.json /tmp/result.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/result.json loterias-ai/data/backtests/bonoloto-official-financial-tournament.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/backtests/bonoloto-official-financial-tournament.json
          git commit -m 'data(loterias-ai): persist Bonoloto official financial tournament' || exit 0
          git push origin HEAD:main
