name: Loterias AI Elige8 Progressive
on:
  workflow_dispatch:
  schedule:
    - cron: '40 7 * * *'
  push:
    paths:
      - 'loterias-ai/scripts/import-elige8-official-progressive.mjs'
      - 'loterias-ai/scripts/elige8-official-financial-tournament.mjs'
      - '.github/workflows/loterias-ai-elige8-progressive.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-elige8-progressive
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Scan official sports dates
        run: |
          BATCH_LIMIT=500 node loterias-ai/scripts/import-elige8-official-progressive.mjs
          BATCH_LIMIT=500 node loterias-ai/scripts/import-elige8-official-progressive.mjs
      - name: Evaluate and persist safely
        run: |
          mkdir -p /tmp/e8
          cp -r loterias-ai/data/archive/elige8 /tmp/e8/
          cp loterias-ai/data/archive/_meta/elige8-official-ingestion.json /tmp/e8/ingestion.json
          cp loterias-ai/data/archive/_meta/elige8-scan-state.json /tmp/e8/state.json
          git fetch origin main
          git reset --hard origin/main
          rm -rf loterias-ai/data/archive/elige8
          cp -r /tmp/e8/elige8 loterias-ai/data/archive/
          cp /tmp/e8/ingestion.json loterias-ai/data/archive/_meta/elige8-official-ingestion.json
          cp /tmp/e8/state.json loterias-ai/data/archive/_meta/elige8-scan-state.json
          node loterias-ai/scripts/elige8-official-financial-tournament.mjs
          node loterias-ai/scripts/build-national-archive-index.mjs
          node loterias-ai/scripts/build-completeness-index.mjs
          node loterias-ai/scripts/audit-national-archive.mjs
          node loterias-ai/scripts/build-real-money-status.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loterias-ai/data/archive/elige8 loterias-ai/data/archive/_meta/elige8-official-ingestion.json loterias-ai/data/archive/_meta/elige8-scan-state.json loterias-ai/data/backtests/elige8-official-financial-tournament.json loterias-ai/data/gates
          git commit -m 'data(loterias-ai): persist and evaluate official Elige8 archive' || exit 0
          git push origin HEAD:main
