name: Loterias AI MetaPleno v154 Specialist ADD DROP
on:
  workflow_dispatch:
  push:
    branches: [research/metapleno-v154-specialist-add-drop]
    paths:
      - 'loterias-ai/scripts/meta-pleno-v154-specialist-add-drop.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v154-specialist-add-drop.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v154-specialist-add-drop.mjs
      - name: Persist v154
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/meta-pleno-v154-specialist-add-drop.json
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist v154 specialist add drop'
          git push
