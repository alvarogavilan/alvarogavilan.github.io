name: Loterias AI Bonoloto Fechav3 Live Probe
on:
  push:
    branches: [fix/loterias-ai-dynamic-backfill-end-date]
    paths:
      - '.github/workflows/loterias-ai-bonoloto-fechav3-live-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Probe historical Bonoloto dates with pacing
        run: |
          node - <<'NODE'
          const dates=['20260101','20260102','20260103','20260104','20260720','20260815'];
          for(const date of dates){
            const url=`https://www.loteriasyapuestas.es/servicios/fechav3?game_id=BONO&fecha_sorteo=${date}`;
            const r=await fetch(url,{headers:{'user-agent':'LoteriasAI-LiveProbe/1.1','accept':'application/json,text/plain,*/*'}});
            const text=await r.text();let p=null;try{p=JSON.parse(text)}catch{}
            console.log(JSON.stringify({date,status:r.status,bytes:text.length,length:Array.isArray(p)?p.length:null,gameIds:Array.isArray(p)?[...new Set(p.map(x=>x?.game_id).filter(Boolean))]:[],sample:Array.isArray(p)&&p[0]?{fecha_sorteo:p[0].fecha_sorteo,combinacion:p[0].combinacion}:text.slice(0,120)}));
            await new Promise(r=>setTimeout(r,1500));
          }
          NODE
