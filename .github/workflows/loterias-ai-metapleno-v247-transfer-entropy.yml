name: Loterias AI MetaPleno v247 Transfer Entropy

on:
  push:
    branches:
      - research/metapleno-v247-transfer-entropy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run v247
        run: node loterias-ai/research/metapleno-v247-transfer-entropy.mjs
      - name: Validate fail-closed
        run: node -e "const r=require('./loterias-ai/data/research/metapleno-v247-transfer-entropy.json'); if(r.realMoneyPass!==false||r.realStakeEUR!==0||r.candidatePool.theoreticalCostEUR>15) process.exit(1)"
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/metapleno-v247-transfer-entropy.json
          git diff --cached --quiet || git commit -m 'research(loterias-ai): persist v247 transfer entropy result'
          git push
