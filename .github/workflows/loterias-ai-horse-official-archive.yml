# Cost control: Lototurf/Quintuple historical archive maintenance is weekly; manual runs remain available.
name: Loterias AI Horse Official Archive
on:
  workflow_dispatch:
  schedule:
    - cron: '55 6 * * 1'
  push:
    paths:
      - 'loterias-ai/scripts/enrich-lototurf-official-fechav3.mjs'
      - 'loterias-ai/scripts/import-quintuple-from-lototurf-dates.mjs'
      - '.github/workflows/loterias-ai-horse-official-archive.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-horse-official-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recompute official horse archive on latest main and persist owned evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            set +e
            BATCH_LIMIT=500 node loterias-ai/scripts/enrich-lototurf-official-fechav3.mjs
            lototurf_rc=$?
            BATCH_LIMIT=500 node loterias-ai/scripts/import-quintuple-from-lototurf-dates.mjs
            quintuple_rc=$?
            set -e

            node loterias-ai/scripts/build-national-archive-index.mjs
            node loterias-ai/scripts/build-completeness-index.mjs

            set +e
            node loterias-ai/scripts/audit-national-archive.mjs
            audit_rc=$?
            set -e
            node loterias-ai/scripts/build-archive-coverage-priorities.mjs

            git add \
              loterias-ai/data/archive/lototurf \
              loterias-ai/data/archive/quintuple-plus \
              loterias-ai/data/archive/_meta/lototurf-official-enrichment.json \
              loterias-ai/data/archive/_meta/lototurf-official-mismatch-quarantine.json \
              loterias-ai/data/archive/_meta/quintuple-ingestion.json \
              loterias-ai/data/archive/_meta/quintuple-scan-state.json \
              loterias-ai/data/archive/manifest.json \
              loterias-ai/data/archive/completeness-index.json \
              loterias-ai/data/archive/_meta/archive-audit.json \
              loterias-ai/data/archive/_meta/archive-coverage-priorities.json

            if git diff --cached --quiet; then
              echo 'Horse archive has no scientific change to persist.'
              if [ "$lototurf_rc" -ne 0 ]; then exit "$lototurf_rc"; fi
              if [ "$quintuple_rc" -ne 0 ]; then exit "$quintuple_rc"; fi
              if [ "$audit_rc" -ne 0 ]; then exit "$audit_rc"; fi
              exit 0
            fi

            git commit -m 'data(loterias-ai): update official horse-game archive'
            if git push origin HEAD:main; then
              if [ "$lototurf_rc" -ne 0 ]; then
                echo 'Persisted Lototurf diagnostics; failing closed because enrichment reported an error.' >&2
                exit "$lototurf_rc"
              fi
              if [ "$quintuple_rc" -ne 0 ]; then
                echo 'Persisted Quíntuple diagnostics; failing closed because ingestion reported an error.' >&2
                exit "$quintuple_rc"
              fi
              if [ "$audit_rc" -ne 0 ]; then
                echo 'Persisted archive QA diagnostics; failing closed because audit quality gate is red.' >&2
                exit "$audit_rc"
              fi
              exit 0
            fi

            echo "main moved during horse archive persistence; recomputing attempt $attempt/5"
            sleep $((attempt * 2))
          done

          echo 'Unable to persist horse archive after five full recomputations on latest main.' >&2
          exit 1
