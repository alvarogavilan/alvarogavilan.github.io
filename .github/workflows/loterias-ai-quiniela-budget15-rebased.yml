name: Loterias AI Quiniela Budget15 Rebased
on:
  workflow_dispatch:
  push:
    branches: [main, feat/quiniela-budget15-rebased, 'fix/loterias-hoy-*']
    paths:
      - 'loterias-ai/scripts/quiniela-budget15-reducer.mjs'
      - 'loterias-ai/scripts/patch-hoy-budget15-ui.mjs'
      - 'loterias-ai/hoy/budget15-ui.js'
      - '.github/workflows/loterias-ai-quiniela-budget15-rebased.yml'
      - 'loterias-ai/data/shadow/quiniela-current-combination.json'
jobs:
  reduce:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/quiniela-budget15-reducer.mjs
      - run: node loterias-ai/scripts/patch-hoy-budget15-ui.mjs
      - name: Assert legacy Today renderer is absent
        run: |
          if grep -q 'budget15-ui.js?v=1' loterias-ai/hoy/index.html; then
            echo 'Legacy Today renderer reintroduced' >&2
            exit 1
          fi
          grep -q 'budget15-ui.js?v=2' loterias-ai/hoy/index.html
      - name: Persist reduced system and UI compatibility
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/shadow/quiniela-current-budget15.json loterias-ai/hoy/index.html
          git diff --cached --quiet || git commit -m 'data(loterias-ai): persist rebased Quiniela and strict Today compatibility'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
