name: Loterias AI Elige8 Minimum Stake Holdout Audit V1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loterias-ai/scripts/elige8-minimum-stake-holdout-audit-v1.mjs'
      - '.github/workflows/loterias-ai-elige8-minimum-stake-holdout-audit-v1.yml'
permissions:
  contents: write
concurrency:
  group: loterias-ai-elige8-minimum-stake-holdout-audit-v1
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Audit exact Elige8 minimum-stake holdout
        run: node loterias-ai/scripts/elige8-minimum-stake-holdout-audit-v1.mjs
      - name: Persist audit safely
        shell: bash
        run: |
          set -euo pipefail
          cp loterias-ai/data/research/elige8-minimum-stake-holdout-audit-v1.json /tmp/audit.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/audit.json loterias-ai/data/research/elige8-minimum-stake-holdout-audit-v1.json
            git add loterias-ai/data/research/elige8-minimum-stake-holdout-audit-v1.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(elige8): persist minimum-stake holdout audit v1'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
