name: Loterias AI v296 Stage1-2 RQA Screen
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: loterias-ai-v296-stage1-2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run v296 RQA selection screen
        run: node loterias-ai/research/megalab/v296-stage1-2-rqa-screen.mjs
      - name: Verify OOS isolation and money gates
        run: node -e "const x=require('./loterias-ai/data/research/metapleno-v296-stage1-2-selection.json');if(x.validationTouched||x.postFreezeTouched||x.retuningPerformed||x.realMoneyPass||x.realStakeEUR!==0||x.theoreticalBudgetMaxEUR>15)process.exit(1)"
      - name: Persist v296 selection evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add loterias-ai/data/research/metapleno-v296-stage1-2-selection.json
          git commit -m 'data(loterias-ai): persist v296 RQA stage1-2' || exit 0
          git pull --rebase origin research/metapleno-v296-recurrence-quantification
          git push