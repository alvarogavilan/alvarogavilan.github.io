name: Loterias AI MetaPleno v30 Freeze Random Controls
on:
  workflow_dispatch:
  push:
    paths:
      - 'loterias-ai/scripts/meta-pleno-v30-freeze-random-controls.mjs'
      - '.github/workflows/loterias-ai-meta-pleno-v30-freeze-random-controls.yml'
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node loterias-ai/scripts/meta-pleno-v30-freeze-random-controls.mjs
      - name: Persist safely
        run: |
          cp loterias-ai/data/shadow/meta-pleno-v30-presealed-random-controls.json /tmp/v30.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/v30.json loterias-ai/data/shadow/meta-pleno-v30-presealed-random-controls.json
            git add loterias-ai/data/shadow/meta-pleno-v30-presealed-random-controls.json
            git commit -m 'data(loterias-ai): freeze MetaPleno v30 random controls' || exit 0
            git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
